<script>
'use strict';
const INK = '#14254d', ROSE = '#c23b6e', BLUE = '#3d8ff0', GREEN = '#2fae5a', ORANGE = '#f08a24', YELLOW = '#ffd84a', RED = '#e8453a', PURPLE = '#7b4bd6';
const SKINS = ['#f1c7a0', '#c98d5f', '#8a5a3c', '#e0ac7e', '#5a3a28', '#f5d6b8'], SHIRTS = ['#3d8ff0', '#e8457a', '#2fae5a', '#f08a24', '#7b4bd6', '#ffb400'];

// ---------- Drawing helpers ----------
function scroll(d, x, y, w, h) {
  d.rect(x, y, w, h, { r: 8, fill: '#fbf1d8', stroke: '#a8874a', lw: 3 });
  d.rect(x - 12, y - 10, w + 24, 22, { r: 11, fill: '#e9d3a0', stroke: '#a8874a', lw: 3 });
  d.rect(x - 12, y + h - 12, w + 24, 22, { r: 11, fill: '#e9d3a0', stroke: '#a8874a', lw: 3 });
}
function crowd(d, n, x0, x1, y, s = 1, o = {}) {
  for (let i = 0; i < n; i++) d.person(x0 + (n === 1 ? 0 : i * (x1 - x0) / (n - 1)), y + (o.bob ? Math.sin(o.t * 4 + i) * 4 : 0), s, { skin: SKINS[i % 6], shirt: SHIRTS[(i + (o.shift || 0)) % 6], hat: o.hats && i % 2 ? '#d8b25a' : null, hair: o.hats && i % 2 ? null : '#2a1a10' });
}
function heart(d, x, y, r, col = RED) {
  d.ctx.beginPath(); d.ctx.moveTo(x, y + r * 0.9);
  d.ctx.bezierCurveTo(x - r * 1.4, y - r * 0.2, x - r * 0.6, y - r * 1.2, x, y - r * 0.4);
  d.ctx.bezierCurveTo(x + r * 0.6, y - r * 1.2, x + r * 1.4, y - r * 0.2, x, y + r * 0.9);
  d.paint({ fill: col, stroke: INK, lw: 2 });
}
function bubble(d, s, x, y, o = {}) {
  const w = d.pill(s, x, y, { size: o.size || 24, bg: o.bg || '#fff', r: 14, alpha: o.alpha });
  d.alpha(o.alpha == null ? 1 : o.alpha, () => d.poly([[x - 10, y + 18], [x + (o.tail || -20), y + 40], [x + 10, y + 18]], { close: true, fill: o.bg || '#fff', stroke: INK, lw: 3 }));
  return w;
}
function field(d, t) {
  d.bg('#ffd98a', '#fff3d0');
  d.rect(0, 300, d.W, 240, { r: 0, fill: '#c8a060' });
  for (let i = 0; i < 6; i++) { d.line(0, 320 + i * 40, d.W, 300 + i * 46, { stroke: '#4f9a45', lw: 14 }); }
  d.circle(860, 80, 50, { fill: '#ffcf33', stroke: '#f2a900', lw: 4 });
  void t;
}

// ---------- The pictures ----------
const DIAGRAMS = {
  // ----- Esperanza Rising -----
  'er-book'(d, t) {
    d.bg('#fff0f5', '#ffdce8');
    // an open book
    d.poly([[300, 150], [480, 180], [480, 470], [300, 440]], { close: true, fill: '#fff', stroke: INK, lw: 4 });
    d.poly([[660, 150], [480, 180], [480, 470], [660, 440]], { close: true, fill: '#fff', stroke: INK, lw: 4 });
    d.text('Esperanza', 390, 250, { size: 32, weight: 700, color: ROSE }); d.text('Rising', 390, 290, { size: 32, weight: 700, color: ROSE });
    d.text('Pam Muñoz Ryan', 390, 340, { size: 18 }); d.text('2000', 390, 370, { size: 18 });
    d.emoji('🌹', 570, 300, 90);
    const k = d.in(t, 0.5, 1.2);
    d.alpha(k, () => {
      d.pill('📅 real history (1930s)', 170, 90, { size: 22, bg: '#cfe0ff' });
      d.pill('✍️ invented characters', 790, 90, { size: 22, bg: '#ffe3b8' });
      d.arrow(200, 120, 330, 190, { color: BLUE }); d.arrow(760, 120, 630, 190, { color: ORANGE });
    });
    d.alpha(d.in(t, 2), () => d.pill('= HISTORICAL FICTION', 480, 505, { size: 30, bg: YELLOW }));
  },
  'er-why'(d, t) {
    d.bg('#ffcf9a', '#fff1dc');
    const r = 120 + Math.sin(t) * 6;
    for (let i = 0; i < 14; i++) { const a = Math.PI + i / 13 * Math.PI; d.line(480 + Math.cos(a) * (r + 15), 420 + Math.sin(a) * (r + 15), 480 + Math.cos(a) * (r + 60), 420 + Math.sin(a) * (r + 60), { stroke: '#ffb400', lw: 7 }); }
    d.circle(480, 420, r, { fill: '#ffd84a', stroke: '#f2a900', lw: 5 });
    d.rect(0, 420, d.W, 120, { r: 0, fill: '#c8a060' });
    const word = 'ESPERANZA', n = Math.floor(d.in(t, 0, 2) * word.length);
    d.text(word.slice(0, n), 480, 110, { size: 72, color: ROSE, font: "'Bungee', sans-serif" });
    d.alpha(d.in(t, 2.2), () => d.text('= HOPE', 480, 200, { size: 56, weight: 700 }));
    d.alpha(d.in(t, 3), () => d.pill('losing everything… and starting over', 480, 480, { size: 26, bg: '#fff' }));
  },
  'er-map'(d, t) {
    d.bg('#7cc6ff');
    // a simple map: land to the right of the Pacific coast, the border dashed across the middle
    d.poly([[260, 0], [960, 0], [960, 540], [560, 540], [520, 470], [450, 380], [380, 300], [300, 250], [250, 170], [240, 90]], { close: true, fill: '#a8d888', stroke: '#5a8a3a', lw: 3 });
    d.poly([[300, 250], [330, 330], [380, 420], [400, 470], [380, 480], [330, 400], [290, 320], [280, 260]], { close: true, fill: '#c8e0a0', stroke: '#5a8a3a', lw: 3 });
    d.line(300, 245, 960, 265, { stroke: '#8a5a34', lw: 4, dash: [14, 10] });
    d.text('UNITED STATES', 700, 140, { size: 30, weight: 700, color: '#3a6a2a' });
    d.text('MEXICO', 760, 360, { size: 34, weight: 700, color: '#3a6a2a' });
    d.text('Pacific Ocean', 120, 380, { size: 24, weight: 700, color: '#1d5a8a' });
    const A = [640, 440], B = [330, 120], C = [560, 160];
    d.circle(...A, 12, { fill: ROSE, stroke: INK, lw: 3 }); d.pill('Aguascalientes, Mexico', A[0] + 30, A[1] + 48, { size: 22, bg: '#fff' });
    d.circle(...B, 12, { fill: BLUE, stroke: INK, lw: 3 }); d.pill('Arvin, California (San Joaquin Valley)', B[0] + 170, B[1] - 50, { size: 20, bg: '#fff' });
    d.curve(A[0], A[1], C[0], C[1] + 120, B[0], B[1], { color: '#5a3a1c', lw: 5, dash: [12, 10] });
    const k = d.loop(t, 6), [x, y] = d.onCurve(A[0], A[1], C[0], C[1] + 120, B[0], B[1], Math.min(1, k * 1.2));
    d.emoji('🚂', x, y - 24, 48, { flip: true });
    d.pill('1930: by train, in secret', 640, 300, { size: 22, bg: YELLOW });
  },
  'er-people'(d, t) {
    d.bg('#fff0f5', '#ffe4ee');
    const P = [['👧', 'Esperanza', 'learns to work'], ['👩', 'Mama', 'brave & strong'], ['👵', 'Abuelita', 'wise grandmother'], ['👦', 'Miguel', 'loyal friend'],
      ['👩‍🍳', 'Hortensia', 'Miguel\'s mother'], ['👨‍🌾', 'Alfonso', 'Miguel\'s father'], ['👧🏽', 'Isabel', 'Miguel\'s young cousin'], ['✊', 'Marta', 'fights for fair pay']];
    P.forEach(([e, n, s], i) => {
      const x = 125 + (i % 4) * 237, y = 140 + Math.floor(i / 4) * 250;
      d.alpha(d.in(t, i * 0.25), () => {
        d.rect(x - 105, y - 110, 210, 220, { r: 18, fill: i === 0 ? '#ffe0ec' : '#fff', stroke: INK, lw: i === 0 ? 5 : 3 });
        d.emoji(e, x, y - 40, 76); d.text(n, x, y + 40, { size: 26, weight: 700, color: ROSE }); d.text(s, x, y + 76, { size: 18 });
      });
    });
  },
  'er-blanket'(d, t) {
    d.bg('#fffaf0');
    // Abuelita's zigzag blanket
    const cols = ['#e8457a', '#ffb400', '#3d8ff0', '#2fae5a', '#7b4bd6'];
    for (let r = 0; r < 5; r++) { const pts = []; for (let i = 0; i <= 24; i++) pts.push([i * 40, 30 + r * 16 + (i % 2 ? 0 : 22)]); d.poly(pts, { stroke: cols[r], lw: 12 }); }
    const E = [['Ranch life', 1], ['Papa dies; house burns', 0], ['Escape to California', 0.75], ['Hard work; Mama gets sick', 0.05], ['Esperanza saves money', 0.7], ['Money orders gone!', 0.2], ['Abuelita arrives!', 1]];
    const X = i => 90 + i * 130, Y = v => 460 - v * 260;
    d.poly(E.map(([, v], i) => [X(i), Y(v)]), { stroke: ROSE, lw: 6 });
    E.forEach(([s, v], i) => { d.circle(X(i), Y(v), 10, { fill: '#fff', stroke: ROSE, lw: 4 }); d.wrap(s, X(i), Y(v) + (v > 0.5 ? -62 : 22), 130, { size: 18, weight: 700 }); });
    const k = d.loop(t, 7) * (E.length - 1), i = Math.floor(k), f = k - i;
    d.emoji('👧', X(i) + (X(i + 1) - X(i)) * f, Y(E[i][1]) + (Y(E[i + 1][1]) - Y(E[i][1])) * f - 30, 44);
    d.text('mountains and valleys', 820, 520, { size: 20, weight: 700, color: '#5a6f99' });
  },
  'er-camp'(d, t) {
    field(d, t);
    crowd(d, 5, 80, 420, 300, 1, { hats: true });
    d.person(650, 300, 1.3, { skin: '#c98d5f', shirt: '#e8457a', hair: '#2a1a10' });
    d.line(690, 290, 690, 140, { stroke: '#8a5a34', lw: 6 });
    d.rect(610, 80, 170, 80, { r: 8, fill: '#fff', stroke: INK, lw: 3 }); d.text('¡HUELGA!', 695, 108, { size: 26, weight: 700, color: RED }); d.text('MORE PAY', 695, 140, { size: 20, weight: 700 });
    crowd(d, 3, 780, 900, 320, 0.9, { bob: true, t, shift: 2 });
    d.pill('Marta', 650, 420, { size: 22, bg: '#ffd0e0' });
    d.pill('long days, low pay', 240, 440, { size: 22, bg: '#fff' });
    d.pill('huelga = strike', 860, 210, { size: 20, bg: YELLOW });
    void t;
  },
  'er-phoenix'(d, t) {
    d.bg('#2a1030', '#5a2040');
    d.ellipse(480, 470, 200, 36, { fill: '#555', stroke: '#333', lw: 3 });
    for (let i = 0; i < 9; i++) {
      const x = 330 + i * 38, h = 80 + Math.sin(t * 8 + i * 1.7) * 25 + (i % 3) * 20;
      d.poly([[x - 26, 470], [x, 470 - h], [x + 26, 470]], { close: true, fill: i % 2 ? '#ff8a1f' : '#ffcf33' });
    }
    const y = 360 - d.in(t % 6, 0.5, 3) * 220, flap = Math.sin(t * 8) * 30;
    d.poly([[480, y], [380, y - 40 - flap], [420, y + 10]], { close: true, fill: '#ff5a1f', stroke: '#ffcf33', lw: 3 });
    d.poly([[480, y], [580, y - 40 - flap], [540, y + 10]], { close: true, fill: '#ff5a1f', stroke: '#ffcf33', lw: 3 });
    d.ellipse(480, y + 6, 30, 22, { fill: '#ff8a1f', stroke: '#ffcf33', lw: 3 });
    d.circle(480, y - 22, 14, { fill: '#ff8a1f', stroke: '#ffcf33', lw: 3 });
    d.poly([[470, y + 24], [480, y + 70], [490, y + 24]], { close: true, fill: '#ffcf33' });
    d.text('"Wait a little bit, and the fruit will fall into your hand."', 480, 40, { size: 24, weight: 700, color: '#fff' });
    d.text('— Papa', 480, 75, { size: 20, color: '#ffd0e0' });
    d.pill('RISING from the ashes', 790, 300, { size: 24, bg: YELLOW });
  },
  // ----- Human rights -----
  'hr-what'(d, t) {
    d.bg('#eaf3ff', '#d6e8ff');
    scroll(d, 300, 50, 560, 440);
    d.text('Universal Declaration', 580, 100, { size: 30, weight: 700 }); d.text('of Human Rights · 1948', 580, 140, { size: 26, weight: 700, color: BLUE });
    const n = Math.floor(d.in(t, 0.3, 3) * 30);
    for (let i = 0; i < 30; i++) {
      const x = 380 + (i % 6) * 80, y = 200 + Math.floor(i / 6) * 58;
      d.circle(x, y, 22, { fill: i < n ? BLUE : '#fff', stroke: '#a8874a', lw: 2 });
      d.text(String(i + 1), x, y + 1, { size: 18, weight: 700, color: i < n ? '#fff' : '#a8874a' });
    }
    d.emoji('🌍', 150, 220, 150 + Math.sin(t * 2) * 6);
    d.text('30 rights', 150, 360, { size: 34, weight: 700, color: BLUE }); d.text('for every person', 150, 400, { size: 24, weight: 700 });
  },
  'hr-why'(d, t) {
    d.bg('#3a3f58');
    d.poly([[480, 0], [960, 0], [960, 540], [480, 540]], { close: true, fill: '#cfe9ff' });
    for (let i = 0; i < 5; i++) d.ellipse(80 + i * 90, 90 + (i % 2) * 30, 70, 34, { fill: '#555a70' });
    for (let i = 0; i < 6; i++) { const k = d.loop(t * 1.5 + i / 6, 1); d.line(60 + i * 70, 140 + k * 200, 50 + i * 70, 160 + k * 200, { stroke: '#8aa0c0', lw: 3 }); }
    d.text('1939–1945', 240, 390, { size: 36, weight: 700, color: '#fff' }); d.text('World War II', 240, 435, { size: 28, color: '#d0d6e8' });
    d.circle(820, 100, 50, { fill: YELLOW, stroke: '#f2a900', lw: 4 });
    crowd(d, 6, 560, 900, 300, 1.1, { bob: true, t });
    for (let i = 0; i < 5; i++) d.line(578 + i * 68, 300, 610 + i * 68, 300, { stroke: '#c98d5f', lw: 6 });
    d.text('1948', 720, 400, { size: 40, weight: 700, color: BLUE }); d.text('the world agrees: never again', 720, 445, { size: 24, weight: 700 });
    d.arrow(420, 270, 530, 270, { color: '#fff', lw: 8 });
  },
  'hr-eleanor'(d, t) {
    d.bg('#f6f0ff', '#e8ddff');
    d.ellipse(480, 300, 300, 100, { fill: '#c89660', stroke: '#6a4a24', lw: 4 });
    for (let i = 0; i < 9; i++) {
      const a = Math.PI + 0.25 + i / 8 * (Math.PI - 0.5), x = 480 + Math.cos(a) * 330, y = 270 + Math.sin(a) * 140;
      d.person(x, y, 0.9, { skin: SKINS[i % 6], shirt: SHIRTS[i % 6], hair: '#2a1a10' });
    }
    d.person(480, 420, 1.1, { skin: '#f1c7a0', shirt: '#7b4bd6', hair: '#8a8a8a' });
    d.emoji('📜', 480, 300, 70, { rot: Math.sin(t) * 0.1 });
    d.pill('Eleanor Roosevelt, chair', 480, 512, { size: 22, bg: YELLOW });
    d.text('people from many countries wrote it together', 480, 50, { size: 26, weight: 700 });
  },
  'hr-art1'(d, t) {
    d.bg('#fff7e6', '#ffe9c4');
    d.text('Article 1', 480, 60, { size: 30, weight: 700, color: BLUE });
    d.text('"All human beings are born free and', 480, 110, { size: 30, weight: 700 }); d.text('equal in dignity and rights."', 480, 150, { size: 30, weight: 700 });
    for (let i = 0; i < 7; i++) { const x = 140 + i * 113; d.person(x, 380, 1.4, { skin: SKINS[i % 6], shirt: SHIRTS[i % 6], hair: '#2a1a10' }); heart(d, x, 270 + Math.sin(t * 3 + i) * 5, 18); }
    d.line(80, 490, 880, 490, { lw: 5 });
    d.pill('no one is worth more than anyone else', 480, 510, { size: 22, bg: '#fff' });
  },
  'hr-list'(d, t) {
    d.bg('#eaf3ff', '#d6e8ff');
    const R = [['❤️', 3, 'life & safety'], ['⛓️', 4, 'no slavery'], ['⚖️', 10, 'fair trials'], ['🙏', 18, 'religion'], ['🗣️', 19, 'free speech'], ['🛠️', 23, 'fair work'], ['🏠', 25, 'food, home, health'], ['🎓', 26, 'education']];
    R.forEach(([e, n, s], i) => {
      const x = 125 + (i % 4) * 237, y = 140 + Math.floor(i / 4) * 250;
      d.alpha(d.in(t, i * 0.3), () => {
        d.rect(x - 105, y - 105, 210, 210, { r: 18, fill: '#fff', stroke: INK });
        d.pill('Art. ' + n, x, y - 78, { size: 20, bg: '#cfe0ff' });
        d.emoji(e, x, y - 4, 70); d.text(s, x, y + 72, { size: 22, weight: 700 });
      });
    });
  },
  'hr-duty'(d, t) {
    d.bg('#f0fff4', '#d8f5e0');
    d.person(250, 330, 1.6, { skin: SKINS[1], shirt: SHIRTS[0], hair: '#2a1a10' });
    d.person(710, 330, 1.6, { skin: SKINS[3], shirt: SHIRTS[1], hair: '#2a1a10' });
    const a = Math.floor(t / 2) % 2;
    bubble(d, 'My turn to talk!', 250, 160, { alpha: a ? 0.35 : 1 });
    bubble(d, 'Now I\'ll listen to you.', 710, 160, { alpha: a ? 1 : 0.35, tail: 20 });
    d.text('⇄', 480, 320, { size: 90, color: GREEN });
    d.pill('my rights + your rights = respect', 480, 470, { size: 26, bg: YELLOW });
    d.text('Article 29: we all have duties to our community', 480, 520, { size: 22, weight: 700, color: '#2d7a3a' });
  },
  // ----- Work rights -----
  'wr-what'(d, t) {
    d.bg('#fff7ef', '#ffe9d1');
    scroll(d, 40, 50, 480, 440); scroll(d, 580, 50, 340, 440);
    d.text('Article 23', 280, 100, { size: 32, weight: 700, color: ORANGE }); d.text('Article 24', 750, 100, { size: 32, weight: 700, color: ORANGE });
    [['💼', 'choose your job'], ['🦺', 'safe, fair conditions'], ['💵', 'fair pay, equal pay'], ['🤝', 'join a union']].forEach(([e, s], i) => d.alpha(d.in(t, 0.3 + i * 0.4), () => { d.emoji(e, 100, 180 + i * 80, 50); d.text(s, 145, 180 + i * 80, { size: 26, weight: 700, align: 'left' }); }));
    [['🛌', 'rest'], ['⏰', 'reasonable hours'], ['🏖️', 'paid holidays']].forEach(([e, s], i) => d.alpha(d.in(t, 2 + i * 0.4), () => { d.emoji(e, 640, 180 + i * 90, 50); d.text(s, 685, 180 + i * 90, { size: 26, weight: 700, align: 'left' }); }));
  },
  'wr-why'(d, t) {
    d.bg('#f2f7ff', '#e0ecff');
    const cx = 320, cy = 280, R = 190, parts = [['😴 sleep', 8, '#7fb4ff'], ['🛠️ work', 8, '#ffb86b'], ['🏡 everything else', 8, '#8fe0a8']];
    let a = -Math.PI / 2;
    const k = d.in(t, 0, 2);
    parts.forEach(([s, h, c]) => {
      const b = a + h / 24 * Math.PI * 2 * k;
      d.ctx.beginPath(); d.ctx.moveTo(cx, cy); d.ctx.arc(cx, cy, R, a, b); d.ctx.closePath(); d.paint({ fill: c, stroke: INK });
      const m = (a + b) / 2; d.text(s, cx + Math.cos(m) * R * 0.58, cy + Math.sin(m) * R * 0.58, { size: 22, weight: 700, alpha: k });
      a = b;

// ---------- Game: Rights Defender ----------
function rightsGame(api) {
  const { root, sfx, shuffle } = api;
  const CASES = [
    ['👷', 'Ana and Ben do the same job, but Ben is paid more just because he is a boy.', false, 'Article 23: equal pay for equal work.'],
    ['⛱️', 'On hot days, a farm gives its workers shade, cool water and a break every hour.', true, 'Article 23: just and favorable (safe, healthy) working conditions.'],
    ['🚫', 'Workers are fired for joining a union.', false, 'Article 23: everyone may form and join trade unions.'],
    ['🎒', 'A girl is not allowed to go to school because she is a girl.', false, 'Article 26: everyone has the right to education.'],
    ['⏰', 'A boss makes workers work 14 hours a day with no days off.', false, 'Article 24: rest, leisure and reasonable working hours.'],
    ['🏖️', 'Every worker gets paid vacation days each year.', true, 'Article 24: periodic holidays with pay.'],
    ['📰', 'A newspaper prints different opinions about the mayor.', true, 'Article 19: freedom of opinion and expression.'],
    ['⛓️', 'A man is locked in jail without ever getting a trial.', false, 'Articles 9 and 10: no arbitrary arrest, and a fair trial for everyone.'],
    ['🍽️', 'A family is told to leave a restaurant because of the language they speak.', false, 'Article 2: rights belong to everyone, whatever their language, race or religion.'],
    ['🩺', 'A clinic treats sick people even if they can\'t pay much.', true, 'Article 25: medical care is part of a decent standard of living.'],
    ['💵', 'Workers are paid so little they can\'t buy enough food for their kids.', false, 'Article 23: pay should allow an existence worthy of human dignity.'],
    ['🔄', 'A worker decides to quit her job and take a different one.', true, 'Article 23: free choice of employment.'],
    ['🙏', 'People may follow any religion they choose, or none at all.', true, 'Article 18: freedom of thought, conscience and religion.'],
    ['🚌', 'Workers who went on strike are rounded up and sent to another country.', false, 'Article 9: no one shall be arbitrarily arrested, detained or exiled.'],
    ['🗳️', 'Students vote for class president, and every vote counts the same.', true, 'Article 21: equal voting in fair elections.'],
    ['🏭', 'A factory blows toxic smoke where its workers breathe it all day.', false, 'Article 23: safe and healthy working conditions.'],
  ];
  const N = 10, TIME = 12, deck = shuffle(CASES).slice(0, N);
  let i = 0, score = 0, right = 0, streak = 0, left = TIME, answered = false, wait = 0, done = false;
  root.innerHTML = `<div class="hud"><span id="rd-n"></span><span>🔥 Streak <b id="rd-k">0</b></span><span>🏆 <b id="rd-s">0</b></span></div>
    <div class="timer"><i id="rd-t"></i></div>
    <div class="case" id="rd-case"></div>
    <div class="verdict"><button id="rd-fair">✅ RESPECTS RIGHTS</button><button id="rd-unfair">❌ BREAKS A RIGHT</button></div>
    <div id="rd-fb" style="min-height:90px;margin-top:12px"></div>`;
  api.$('rd-fair').addEventListener('click', () => judge(true));
  api.$('rd-unfair').addEventListener('click', () => judge(false));
  function show() {
    const [e, s] = deck[i];
    api.$('rd-n').textContent = `Case ${i + 1} of ${N}`;
    api.$('rd-case').innerHTML = `<span class="e">${e}</span>${api.esc(s)}`;
    api.$('rd-fb').innerHTML = '';
    api.$('rd-fair').disabled = api.$('rd-unfair').disabled = false;
    left = TIME; answered = false;
  }
  function judge(fair) {
    if (answered || done) return;
    answered = true; RB.audio();
    const [, , ok, why] = deck[i], good = fair === ok;
    if (good) { right++; streak++; const pts = 100 + Math.round(left / TIME * 50) + Math.min(streak - 1, 5) * 10; score += pts; sfx.right(); }
    else { streak = 0; sfx.wrong(); }
    api.$('rd-s').textContent = score; api.$('rd-k').textContent = streak;
    api.$('rd-fair').disabled = api.$('rd-unfair').disabled = true;
    api.$('rd-fb').innerHTML = `<div class="why"><b>${fair === null ? '⏰ Time\'s up!' : good ? '✅ Right!' : '❌ Not quite.'}</b> This ${ok ? 'respects' : 'breaks'} a human right. ${api.esc(why)}</div>
      <button class="btn" id="rd-next">${i === N - 1 ? 'See my score ▶' : 'Next case ▶'}</button>`;
    api.$('rd-next').addEventListener('click', next);
    wait = 6;
  }
  function next() {
    if (done || !answered) return;
    i++; wait = 0;
    if (i === N) {
      done = true;
      api.done({ score, stars: right >= 9 ? 3 : right >= 7 ? 2 : 1, rows: [['🛡️ Cases judged right', `${right} of ${N}`]], hint: 'Judge 9 or more cases right for ★★★' });
      return;
    }
    show();
  }
  show();
  return {
    tick(dt) {
      if (done) return;
      if (!answered) { left = Math.max(0, left - dt); api.$('rd-t').style.width = (left / TIME * 100) + '%'; if (!left) judge(null); }
      else if (wait > 0) { wait -= dt; if (wait <= 0) next(); }
    },
    key(k) { if (k === 'f' || k === 'arrowleft') judge(true); else if (k === 'u' || k === 'arrowright') judge(false); else if (k === 'enter') next(); },
    bot() { if (answered) next(); else judge(deck[i][2]); },
  };
}
