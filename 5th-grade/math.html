<script>
'use strict';
const INK = '#14254d', PURPLE = '#7b4bd6', BLUE = '#3d8ff0', GREEN = '#2fae5a', ORANGE = '#f08a24', PINK = '#e8457a', YELLOW = '#ffd84a';
const BOX_COLORS = ['#cfe0ff', '#ffe3b8', '#d4f5d0', '#ffd0e0', '#e6dcff', '#fff3b0'];
const fmt = n => n.toLocaleString('en-US');

// ---------- Drawing helpers ----------
// Isometric unit cubes. Cube (i, j, k): i runs along the length, j along the width, k up.
function iso(ox, oy, s) {
  const cx = s * 0.866, cy = s * 0.5;
  return (x, y, z) => [ox + (x - y) * cx, oy + (x + y) * cy - z * s];
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(f > 1 ? v + (255 - v) * (f - 1) : v * f));
  return `rgb(${c.join(',')})`;
}
function cube(d, P, i, j, k, col, o = {}) {
  const lw = o.lw || 2, st = o.line || INK;
  d.poly([P(i, j, k + 1), P(i + 1, j, k + 1), P(i + 1, j + 1, k + 1), P(i, j + 1, k + 1)], { close: true, fill: shade(col, 1.25), stroke: st, lw });
  d.poly([P(i + 1, j, k), P(i + 1, j + 1, k), P(i + 1, j + 1, k + 1), P(i + 1, j, k + 1)], { close: true, fill: shade(col, 0.78), stroke: st, lw });
  d.poly([P(i, j + 1, k), P(i + 1, j + 1, k), P(i + 1, j + 1, k + 1), P(i, j + 1, k + 1)], { close: true, fill: col, stroke: st, lw });
}
// draws a list of [i, j, k, colour] cubes in the right order (back first)
function cubes(d, P, list, o) {
  list.slice().sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2])).forEach(([i, j, k, col]) => cube(d, P, i, j, k, col, o));
}
function boxList(l, w, h, col, n = Infinity, off = [0, 0, 0]) {
  const out = [];
  for (let k = 0; k < h; k++) for (let j = 0; j < w; j++) for (let i = 0; i < l; i++) if (out.length < n) out.push([i + off[0], j + off[1], k + off[2], typeof col === 'function' ? col(i, j, k) : col]);
  return out;
}
// dashed outline of a whole box
function wire(d, P, l, w, h, o = {}) {
  const e = [[[0, 0, 0], [l, 0, 0]], [[l, 0, 0], [l, w, 0]], [[l, w, 0], [0, w, 0]], [[0, w, 0], [0, 0, 0]],
    [[0, 0, h], [l, 0, h]], [[l, 0, h], [l, w, h]], [[l, w, h], [0, w, h]], [[0, w, h], [0, 0, h]],
    [[0, 0, 0], [0, 0, h]], [[l, 0, 0], [l, 0, h]], [[l, w, 0], [l, w, h]], [[0, w, 0], [0, w, h]]];
  e.forEach(([a, b]) => d.line(...P(...a), ...P(...b), { stroke: o.color || '#8a97b8', lw: 2, dash: [8, 6] }));
}
// puts a box of size l×w×h in the middle of the rect (x, y, bw, bh); returns its projector
function fitBox(l, w, h, x, y, bw, bh, maxS = 70) {
  const s = Math.min(maxS, bw / ((l + w) * 0.866), bh / ((l + w) * 0.5 + h));
  const cx = s * 0.866, cy = s * 0.5;
  const ox = x + bw / 2 - (l - w) * cx / 2, oy = y + (bh - ((l + w) * cy + h * s)) / 2 + h * s;
  return iso(ox, oy, s);
}
// a stacked multiplication: rows of digits lined up by place value, right edge at x
function digits(d, s, x, y, o = {}) {
  const gap = o.gap || 50;
  [...String(s)].reverse().forEach((ch, i) => d.text(ch, x - i * gap, y, { size: o.size || 54, color: (o.colors && o.colors[i]) || o.color || INK, weight: 700, alpha: o.alpha }));
}
// an area model: columns split one number, rows split the other
function areaModel(d, x, y, cols, rows, widths, heights, fill, t0 = -9, t = 99) {
  let yy = y;
  rows.forEach((r, ri) => {
    let xx = x;
    cols.forEach((c, ci) => {
      const k = d.in(t, t0 + (ri * cols.length + ci) * 0.5, 0.5);
      d.rect(xx, yy, widths[ci], heights[ri], { r: 0, fill: BOX_COLORS[(ri * cols.length + ci) % BOX_COLORS.length], stroke: INK, lw: 3 });
      if (fill) d.text(fmt(c * r), xx + widths[ci] / 2, yy + heights[ri] / 2, { size: Math.min(34, widths[ci] / 2.1), weight: 700, alpha: k });
      xx += widths[ci];
    });
    yy += heights[ri];
  });
  let xx = x;
  cols.forEach((c, ci) => { d.text(fmt(c), xx + widths[ci] / 2, y - 24, { size: 28, color: BLUE, weight: 700 }); xx += widths[ci]; });
  yy = y;
  rows.forEach((r, ri) => { d.text(fmt(r), x - 14, yy + heights[ri] / 2, { size: 28, color: PINK, weight: 700, align: 'right' }); yy += heights[ri]; });
}

// ---------- The pictures ----------
const DIAGRAMS = {
  // 34 × 27 as an array of dots, then split by place value
  'mx-what'(d, t) {
    d.bg('#f4f0ff', '#e4dcff');
    d.text('34 × 27 = ?', 230, 70, { size: 56, weight: 700, color: PURPLE });
    d.wrap('34 groups of 27 dots… that\'s a LOT to count!', 40, 120, 380, { size: 28, align: 'left' });
    const x0 = 470, y0 = 50, g = 12.5, shown = Math.floor(d.in(t, 0, 2.5) * 27 * 34);
    d.ctx.fillStyle = PURPLE;
    for (let n = 0; n < shown; n++) { const r = Math.floor(n / 34), c = n % 34; d.ctx.fillRect(x0 + c * g, y0 + r * g, 7, 7); }
    const s = d.in(t, 3, 0.8);
    if (s > 0) d.alpha(s, () => {
      d.line(x0 + 30 * g - 3, y0 - 14, x0 + 30 * g - 3, y0 + 27 * g + 6, { stroke: PINK, lw: 5 });
      d.line(x0 - 10, y0 + 20 * g - 3, x0 + 34 * g + 6, y0 + 20 * g - 3, { stroke: PINK, lw: 5 });
      d.text('30', x0 + 15 * g, y0 + 27 * g + 30, { size: 26, color: BLUE, weight: 700 });
      d.text('4', x0 + 32 * g, y0 + 27 * g + 30, { size: 26, color: BLUE, weight: 700 });
      d.text('20', x0 - 22, y0 + 10 * g, { size: 26, color: PINK, weight: 700 });
      d.text('7', x0 - 22, y0 + 23.5 * g, { size: 26, color: PINK, weight: 700 });
    });
    const s2 = d.in(t, 4.2, 0.8);
    if (s2 > 0) d.alpha(s2, () => {
      d.text('Split by place value:', 230, 260, { size: 28 });
      d.text('34 = 30 + 4', 230, 320, { size: 40, weight: 700, color: BLUE });
      d.text('27 = 20 + 7', 230, 380, { size: 40, weight: 700, color: PINK });
      d.pill('4 easy problems instead of 1 hard one!', 230, 460, { size: 22, bg: YELLOW });
    });
  },
  'mx-why'(d, t) {
    d.bg('#fff7e0', '#ffe8b0');
    const S = [['📦', '✏️', '24 boxes × 36 pencils', '864 pencils'], ['📅', '⏰', '365 days × 24 hours', '8,760 hours in a year'], ['🏟️', '💺', '48 rows × 125 seats', '6,000 seats']];
    const i = Math.floor(t / 3.5) % 3, k = (t % 3.5) / 3.5, [a, b, q, ans] = S[i];
    d.emoji(a, 300, 200, 150 + Math.sin(t * 3) * 6);
    d.emoji(b, 640, 200, 130, { rot: Math.sin(t * 2) * 0.1 });
    d.text('×', 470, 200, { size: 90, weight: 700, color: PURPLE });
    d.text(q, 480, 370, { size: 44, weight: 700 });
    d.alpha(d.in(k, 0.35, 0.15), () => d.pill('= ' + ans, 480, 450, { size: 36, bg: '#b8f0b0' }));
    S.forEach((_, n) => d.circle(450 + n * 30, 515, 8, { fill: n === i ? PURPLE : '#d8cdea' }));
  },
  // base-ten blocks
  'mx-place'(d, t) {
    d.bg('#eef7ff', '#d9ecff');
    const rod = (x, y, col) => { for (let n = 0; n < 10; n++) d.rect(x, y + n * 22, 22, 22, { r: 2, fill: col, stroke: INK, lw: 2 }); };
    const unit = (x, y, col) => d.rect(x, y, 22, 22, { r: 2, fill: col, stroke: INK, lw: 2 });
    const show = (num, tens, ones, x, col, at) => {
      d.text(String(num), x + 150, 50, { size: 54, weight: 700, color: col });
      for (let r = 0; r < tens; r++) d.alpha(d.in(t, at + r * 0.35), () => rod(x + 20 + r * 40, 110, col));
      for (let u = 0; u < ones; u++) d.alpha(d.in(t, at + tens * 0.35 + u * 0.15), () => unit(x + 40 + tens * 40 + (u % 4) * 30, 308 - Math.floor(u / 4) * 30, col));
      d.alpha(d.in(t, at + 2.4), () => {
        d.text(`${tens} tens + ${ones} ones`, x + 150, 380, { size: 30 });
        d.text(`${tens * 10} + ${ones}`, x + 150, 440, { size: 48, weight: 700, color: col });
      });
    };
    show(34, 3, 4, 70, BLUE, 0.2);
    show(27, 2, 7, 520, PINK, 1.6);
    d.line(480, 40, 480, 480, { stroke: '#b9c6e0', lw: 3, dash: [10, 8] });
    d.alpha(d.in(t, 4.5), () => d.text('This is called expanded form', 480, 505, { size: 26, color: PURPLE, weight: 700 }));
  },
  'mx-area'(d, t) {
    d.bg('#ffffff', '#f2f0ff');
    const x = 150, y = 70, u = 12.2, W1 = 30 * u, W2 = 4 * u, H1 = 20 * u, H2 = 7 * u;
    const draw = d.in(t, 0, 0.8);
    d.alpha(draw, () => areaModel(d, x, y, [30, 4], [20, 7], [W1, W2], [H1, H2], false));
    const parts = [['30 × 20', 600, x + W1 / 2, y + H1 / 2], ['4 × 20', 80, x + W1 + W2 / 2, y + H1 / 2], ['30 × 7', 210, x + W1 / 2, y + H1 + H2 / 2], ['4 × 7', 28, x + W1 + W2 / 2, y + H1 + H2 / 2]];
    parts.forEach(([e, v, px, py], n) => {
      const k = d.in(t, 1.2 + n * 1.1, 0.6);
      if (k <= 0) return;
      d.alpha(k, () => {
        d.text(fmt(v), px, py, { size: n % 2 ? 22 : 40, weight: 700, color: INK });
        d.text(`${e} = ${v}`, 790, 140 + n * 80, { size: 34, weight: 700, color: [BLUE, ORANGE, GREEN, PINK][n] });
      });
    });
    d.alpha(d.in(t, 6), () => d.pill('4 small rectangles!', 790, 470, { size: 26, bg: YELLOW }));
  },
  'mx-partial'(d, t) {
    d.bg('#ffffff', '#f2f0ff');
    const x = 70, y = 90, u = 9, W1 = 30 * u, W2 = 4 * u + 14, H1 = 20 * u, H2 = 7 * u + 10;
    areaModel(d, x, y, [30, 4], [20, 7], [W1, W2], [H1, H2], false);
    const src = [[x + W1 / 2, y + H1 / 2], [x + W1 + W2 / 2, y + H1 / 2], [x + W1 / 2, y + H1 + H2 / 2], [x + W1 + W2 / 2, y + H1 + H2 / 2]];
    const vals = [600, 80, 210, 28], cols = [BLUE, ORANGE, GREEN, PINK], R = 720;
    vals.forEach((v, n) => {
      const k = d.in(t, 0.6 + n * 0.9, 0.8), tx = lerpX(src[n][0], R, k), ty = lerpX(src[n][1], 90 + n * 70, k);
      d.text(String(v), src[n][0], src[n][1], { size: 24, weight: 700, alpha: 1 - k * 0.6 });
      if (k > 0) digits(d, v, tx, ty, { color: cols[n], size: 50, gap: 34 });
    });
    d.alpha(d.in(t, 4.2), () => {
      d.text('+', R - 150, 300, { size: 50, weight: 700 });
      d.line(R - 160, 340, R + 30, 340, { lw: 5 });
    });
    d.alpha(d.in(t, 5), () => digits(d, 918, R, 390, { size: 58, gap: 36, color: PURPLE }));
    d.alpha(d.in(t, 5.8), () => d.pill('34 × 27 = 918', 640, 480, { size: 32, bg: '#b8f0b0' }));
    function lerpX(a, b, k) { return a + (b - a) * k; }
  },
  'mx-big'(d, t) {
    d.bg('#ffffff', '#f2f0ff');
    const cols = [200, 40, 3], rows = [10, 6], W = [300, 130, 70], H = [170, 120];
    areaModel(d, 110, 80, cols, rows, W, H, true, 0.3, t);
    d.text('(not to scale)', 360, 400, { size: 20, color: '#8a97b8' });
    d.text('243 × 16', 790, 90, { size: 48, weight: 700, color: PURPLE });
    const sums = ['2,000 + 400 + 30', '+ 1,200 + 240 + 18', '= 3,888'];
    sums.forEach((s, n) => d.alpha(d.in(t, 3.4 + n * 0.8), () => d.text(s, 790, 190 + n * 60, { size: n === 2 ? 52 : 30, weight: 700, color: n === 2 ? GREEN : INK })));
    d.alpha(d.in(t, 6), () => d.pill('3 × 2 = 6 boxes', 790, 450, { size: 26, bg: YELLOW }));
  },
  // the standard algorithm, start to finish
  'sa-what'(d, t) {
    d.bg('#f4f0ff', '#e4dcff');
    const R = 560;
    digits(d, 34, R, 90); digits(d, 27, R, 160); d.text('×', R - 160, 160, { size: 54, weight: 700 });
    d.line(R - 190, 200, R + 30, 200, { lw: 5 });
    d.alpha(d.in(t, 0.8), () => { digits(d, 238, R, 250, { color: GREEN }); d.text('← 34 × 7', R + 70, 250, { size: 28, align: 'left', color: GREEN }); });
    d.alpha(d.in(t, 2), () => { digits(d, 680, R, 320, { color: BLUE }); d.text('+', R - 160, 320, { size: 54, weight: 700 }); d.text('← 34 × 20', R + 70, 320, { size: 28, align: 'left', color: BLUE }); });
    d.alpha(d.in(t, 3.2), () => { d.line(R - 190, 360, R + 30, 360, { lw: 5 }); digits(d, 918, R, 410, { color: PURPLE }); d.text('← add!', R + 70, 410, { size: 28, align: 'left', color: PURPLE }); });
    d.alpha(d.in(t, 4.4), () => d.text('ones  →  tens  →  add', 480, 500, { size: 28, weight: 700, color: '#8a97b8' }));
  },
  'sa-why'(d, t) {
    d.bg('#ffffff', '#f2f0ff');
    const x = 70, y = 110, u = 8;
    const W = [30 * u, 4 * u + 20], H = [20 * u, 7 * u + 16];
    d.rect(x, y, W[0], H[0], { r: 0, fill: '#cfe0ff', stroke: INK }); d.rect(x + W[0], y, W[1], H[0], { r: 0, fill: '#cfe0ff', stroke: INK });
    d.rect(x, y + H[0], W[0], H[1], { r: 0, fill: '#d4f5d0', stroke: INK }); d.rect(x + W[0], y + H[0], W[1], H[1], { r: 0, fill: '#d4f5d0', stroke: INK });
    d.text('600', x + W[0] / 2, y + H[0] / 2, { size: 34, weight: 700 }); d.text('80', x + W[0] + W[1] / 2, y + H[0] / 2, { size: 22, weight: 700 });
    d.text('210', x + W[0] / 2, y + H[0] + H[1] / 2, { size: 30, weight: 700 }); d.text('28', x + W[0] + W[1] / 2, y + H[0] + H[1] / 2, { size: 22, weight: 700 });
    d.text('Area model', x + 150, 60, { size: 30, weight: 700, color: PURPLE });
    d.text('Standard algorithm', 700, 60, { size: 30, weight: 700, color: PURPLE });
    const R = 760;
    digits(d, 34, R, 130, { size: 46, gap: 40 }); digits(d, 27, R, 190, { size: 46, gap: 40 }); d.text('×', R - 130, 190, { size: 46 });
    d.line(R - 150, 225, R + 20, 225, { lw: 4 });
    digits(d, 238, R, 270, { size: 46, gap: 40, color: GREEN }); digits(d, 680, R, 330, { size: 46, gap: 40, color: BLUE });
    d.line(R - 150, 365, R + 20, 365, { lw: 4 }); digits(d, 918, R, 405, { size: 46, gap: 40, color: PURPLE });
    const p = d.loop(t, 4) < 0.5;
    d.curve(x + 330, p ? y + H[0] + H[1] / 2 : y + H[0] / 2, 560, p ? 360 : 200, R - 120, p ? 270 : 330, { color: p ? GREEN : BLUE, lw: 5, dash: [10, 8] });
    d.pill(p ? '210 + 28 = 238' : '600 + 80 = 680', 300, 470, { size: 28, bg: p ? '#d4f5d0' : '#cfe0ff' });
    d.text('Same pieces, fewer steps!', 700, 480, { size: 28, weight: 700 });
  },
  'sa-step1'(d, t) {
    d.bg('#f4f0ff', '#e4dcff');
    const R = 420, T = t % 9;
    digits(d, 34, R, 130, { colors: [T < 4 ? PINK : INK, T >= 4 && T < 8 ? PINK : INK] });
    digits(d, 27, R, 210, { colors: [GREEN, INK] }); d.text('×', R - 140, 210, { size: 54, weight: 700 });
    d.line(R - 170, 250, R + 30, 250, { lw: 5 });
    if (T > 1.2) { d.text('8', R, 300, { size: 54, weight: 700, color: GREEN }); }
    if (T > 2.2 && T < 6.5) d.text('2', R - 50, 78, { size: 34, weight: 700, color: ORANGE });
    if (T > 6.2) { d.text('3', R - 50, 300, { size: 54, weight: 700, color: GREEN }); d.text('2', R - 100, 300, { size: 54, weight: 700, color: GREEN }); }
    const say = T < 1.2 ? ['7 × 4 = 28', ''] : T < 4 ? ['7 × 4 = 28', 'Write the 8, carry the 2'] : T < 6.2 ? ['7 × 3 = 21', '21 + the carried 2 = 23'] : ['34 × 7 = 238', 'First row done!'];
    d.rect(560, 120, 360, 200, { r: 20, fill: '#fff', stroke: INK });
    d.text(say[0], 740, 185, { size: 44, weight: 700, color: PURPLE });
    d.text(say[1], 740, 255, { size: 26 });
    d.text('Step 1: multiply by the ONES digit', 480, 470, { size: 30, weight: 700, color: GREEN });
  },
  'sa-step2'(d, t) {
    d.bg('#f4f0ff', '#e4dcff');
    const R = 420, T = t % 8;
    digits(d, 34, R, 110, { colors: [T > 2 && T < 4 ? PINK : INK, T >= 4 && T < 6 ? PINK : INK] });
    digits(d, 27, R, 180, { colors: [INK, BLUE] }); d.text('×', R - 140, 180, { size: 54, weight: 700 });
    d.line(R - 170, 220, R + 30, 220, { lw: 5 });
    digits(d, 238, R, 270, { color: GREEN, alpha: 0.6 });
    if (T > 0.8) d.text('0', R, 340, { size: 54, weight: 700, color: ORANGE });
    if (T > 2.6) d.text('8', R - 50, 340, { size: 54, weight: 700, color: BLUE });
    if (T > 4.6) d.text('6', R - 100, 340, { size: 54, weight: 700, color: BLUE });
    const say = T < 2 ? ['The 2 means 20!', 'Write a 0 placeholder first'] : T < 4 ? ['2 × 4 = 8', 'Write it in the tens place'] : T < 6 ? ['2 × 3 = 6', 'Write it in the hundreds place'] : ['34 × 20 = 680', 'Second row done!'];
    d.rect(560, 120, 360, 200, { r: 20, fill: '#fff', stroke: INK });
    d.text(say[0], 740, 185, { size: 42, weight: 700, color: PURPLE });
    d.text(say[1], 740, 255, { size: 26 });
    d.text('Step 2: multiply by the TENS digit', 480, 470, { size: 30, weight: 700, color: BLUE });
  },
  'sa-step3'(d, t) {
    d.bg('#f4f0ff', '#e4dcff');
    const R = 420, T = t % 8;

    d.text('+', R - 140, 200, { size: 54, weight: 700 }); d.line(R - 170, 240, R + 30, 240, { lw: 5 });

// ---------- Game 1: Area Model Builder ----------
function areaGame(api) {
  const { root, board, sfx, shuffle, d } = api;
  const N = 5, problems = [];
  const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const ranges = [[11, 19, 11, 19], [21, 39, 12, 29], [23, 49, 21, 39], [31, 69, 24, 49], [52, 98, 34, 89]];
  for (let n = 0; n < N; n++) {
    const [a0, a1, b0, b1] = ranges[n];
    let a, b;
    do { a = r(a0, a1); b = r(b0, b1); } while (a % 10 === 0 || b % 10 === 0);
    problems.push([a, b]);
  }
  let pi = 0, step = 0, score = 0, miss = 0, firstTry = 0, flash = 0, opts = [], done = false;
  root.innerHTML = `<div class="hud"><span id="ag-p"></span><span>🏆 <b id="ag-s">0</b></span></div>
    <canvas class="board" id="ag-cv"></canvas><p id="ag-q" style="font-weight:700"></p><div class="choices" id="ag-c"></div>`;
  const draw = board(api.$('ag-cv'));
  const parts = () => { const [a, b] = problems[pi], at = a - a % 10, ao = a % 10, bt = b - b % 10, bo = b % 10; return { a, b, cols: [at, ao], rows: [bt, bo] }; };
  const answerOf = s => { const { a, b, cols, rows } = parts(); return s < 4 ? cols[s % 2] * rows[Math.floor(s / 2)] : a * b; };
  function wrongs(v, s) {
    const { cols, rows } = parts();
    const c = cols[s % 2], rw = rows[Math.floor(s / 2)];
    const cand = s < 4 ? [v * 10, v / 10, (c + (c >= 10 ? 10 : 1)) * rw, c * (rw + (rw >= 10 ? 10 : 1)), v + 10, v - (c >= 10 && rw >= 10 ? 100 : 2)]
      : [v + 10, v - 10, v + 100, v - 100, v + 1000];
    return shuffle(cand.filter(x => Number.isInteger(x) && x > 0 && x !== v)).filter((x, i, arr) => arr.indexOf(x) === i).slice(0, 2);
  }
  function ask() {
    const v = answerOf(step);
    opts = shuffle([v, ...wrongs(v, step)]);
    const { cols, rows } = parts();
    api.$('ag-p').textContent = `Problem ${pi + 1} of ${N}`;
    api.$('ag-q').textContent = step < 4 ? `What is ${cols[step % 2]} × ${rows[Math.floor(step / 2)]}?` : 'Add the partial products! What is the total?';
    api.$('ag-c').innerHTML = opts.map((o, k) => `<button class="ans" data-k="${k}">${fmt(o)}</button>`).join('');
    api.$('ag-c').querySelectorAll('.ans').forEach(b => b.addEventListener('click', () => pick(+b.dataset.k)));
    miss = 0;
  }
  function pick(k) {
    if (done) return;
    RB.audio();
    const btn = api.$('ag-c').children[k];
    if (opts[k] !== answerOf(step)) { sfx.wrong(); miss++; btn.disabled = true; btn.classList.add('wrong', 'shake'); return; }
    sfx.right();
    if (!miss) { score += 100; firstTry++; }
    api.$('ag-s').textContent = score;
    flash = 1; step++;
    if (step === 5) {
      step = 0; pi++;
      if (pi === N) { done = true; finish(); return; }
    }
    ask();
  }
  function finish() {
    const max = N * 500;
    api.done({ score, stars: score >= max * 0.88 ? 3 : score >= max * 0.6 ? 2 : 1,
      rows: [['✅ First-try answers', `${firstTry} of ${N * 5}`], ['🧮 Problems solved', N]], hint: 'Get 22 or more right on the first try for ★★★' });
  }
  function render() {
    if (done) return;
    draw(() => {
      d.bg('#ffffff', '#f2f0ff');
      const { a, b, cols, rows } = parts();
      d.text(`${a} × ${b}`, 760, 70, { size: 50, weight: 700, color: PURPLE });
      const W = [Math.max(150, cols[0] * 5.2), Math.max(90, cols[1] * 14)], H = [Math.max(120, rows[0] * 3.6), Math.max(80, rows[1] * 11)];
      const sc = Math.min(540 / (W[0] + W[1]), 400 / (H[0] + H[1]));
      const w = W.map(v => v * sc), h = H.map(v => v * sc), x = 80, y = 80;
      areaModel(d, x, y, cols, rows, w, h, false);
      for (let s = 0; s < 4; s++) {
        const ci = s % 2, ri = Math.floor(s / 2), bx = x + (ci ? w[0] : 0), by = y + (ri ? h[0] : 0);
        if (s < step) d.text(fmt(cols[ci] * rows[ri]), bx + w[ci] / 2, by + h[ri] / 2, { size: Math.min(34, w[ci] / 2.6), weight: 700 });
        if (s === step) { d.rect(bx + 4, by + 4, w[ci] - 8, h[ri] - 8, { r: 6, stroke: PINK, lw: 5, dash: [10, 6] }); d.text('?', bx + w[ci] / 2, by + h[ri] / 2, { size: 40, weight: 700, color: PINK }); }
      }
      const done4 = Math.min(step, 4);
      for (let s = 0; s < done4; s++) d.text(fmt(answerOf(s)), 860, 150 + s * 56, { size: 34, weight: 700, color: [BLUE, ORANGE, GREEN, PINK][s], align: 'right' });
      if (step >= 4) { d.line(700, 370, 880, 370, { lw: 4 }); d.text('+', 690, 320, { size: 40 }); d.text('?', 860, 410, { size: 42, weight: 700, color: PINK, align: 'right' }); }
      if (flash > 0) d.alpha(flash, () => d.text('✅', 480, 270, { size: 120 }));
    });
  }
  ask(); render();
  return {
    tick(dt) { flash = Math.max(0, flash - dt * 2); render(); },
    key(k) { const n = '123'.indexOf(k); if (n >= 0 && n < opts.length) pick(n); },
    bot() { pick(opts.indexOf(answerOf(step))); },
  };
}

// ---------- Game 2: Box Builder ----------
function boxGame(api) {
  const { root, board, sfx, d } = api;
  const GOALS = [
    { s: 'Build a box with a volume of **12** cubic units.', ok: (l, w, h) => l * w * h === 12 },
    { s: 'Build a box with a volume of **24** that is exactly **2** cubes tall.', ok: (l, w, h) => h === 2 && l * w * h === 24 },
    { s: 'Build a box with a volume of **30** and a length of **5**.', ok: (l, w, h) => l === 5 && l * w * h === 30 },
    { s: 'Build a **cube** (length, width and height all the same) with a volume of **27**.', ok: (l, w, h) => l === w && w === h && l * w * h === 27 },
    { s: 'Build a box with a volume of **48** and a base area (l × w) of **16**.', ok: (l, w, h) => l * w === 16 && l * w * h === 48 },
    { s: 'Build a box with a volume of **60** that is **3** wide.', ok: (l, w, h) => w === 3 && l * w * h === 60 },
  ];
  let gi = 0, dim = { l: 1, w: 1, h: 1 }, tries = 0, score = 0, perfect = 0, done = false, cheer = 0, t = 0;
  root.innerHTML = `<div class="hud"><span id="bb-r"></span><span>🏆 <b id="bb-s">0</b></span></div>
    <p id="bb-g" style="font-weight:600;margin:4px auto"></p>
    <canvas class="board" id="bb-cv" style="width:min(100%, calc((100vh - 420px) * 16 / 9))"></canvas>
    <div class="dims">${[['l', 'Length'], ['w', 'Width'], ['h', 'Height']].map(([k, n]) => `<div class="dim">${n} <button data-k="${k}" data-v="-1">−</button><b id="bb-${k}">1</b><button data-k="${k}" data-v="1">+</button></div>`).join('')}</div>
    <button class="btn" id="bb-go">✅ Check my box</button>`;
  const draw = board(api.$('bb-cv'));
  root.querySelectorAll('.dim button').forEach(b => b.addEventListener('click', () => { RB.audio(); set(b.dataset.k, dim[b.dataset.k] + +b.dataset.v); }));
  api.$('bb-go').addEventListener('click', check);
  function set(k, v) { dim[k] = Math.max(1, Math.min(6, v)); api.$('bb-' + k).textContent = dim[k]; sfx.pop(); }
  function goal() {
    api.$('bb-r').textContent = `Box ${gi + 1} of ${GOALS.length}`;
    api.$('bb-g').innerHTML = '🎯 ' + api.rich(GOALS[gi].s);
    tries = 0;
  }
  function check() {
    if (done) return;
    RB.audio();
    const { l, w, h } = dim;
    if (!GOALS[gi].ok(l, w, h)) { tries++; sfx.wrong(); api.$('bb-cv').classList.remove('shake'); void api.$('bb-cv').offsetWidth; api.$('bb-cv').classList.add('shake'); return; }
    sfx.right(); cheer = 1.2;
    const pts = [200, 100, 50][Math.min(tries, 2)];
    score += pts; if (!tries) perfect++;
    api.$('bb-s').textContent = score;
    gi++;
    if (gi === GOALS.length) {
      done = true;
      api.done({ score, stars: score >= 1100 ? 3 : score >= 800 ? 2 : 1, rows: [['📦 Boxes built', GOALS.length], ['🎯 Right on the first try', `${perfect} of ${GOALS.length}`]],
        hint: 'Build at least 5 boxes right on the first try for ★★★' });
      return;
    }
    goal();
  }
  function render() {
    if (done) return;
    const { l, w, h } = dim;
    draw(() => {
      d.bg('#eefaf3', '#d6f2e2');
      const P = fitBox(l, w, h, 30, 20, 520, 500, 90);
      const cols = ['#7fc4ff', '#8fe0a8', '#ffcf7a', '#ff9fbf', '#c3a6ff', '#ffe066'];
      cubes(d, P, boxList(l, w, h, (i, j, k) => cols[k]), { lw: 1.5 });
      d.text(`${l} × ${w} × ${h}`, 760, 160, { size: 52, weight: 700, color: PURPLE });
      d.text(`= ${l * w * h}`, 760, 240, { size: 60, weight: 700 });
      d.text('cubic units', 760, 300, { size: 28, color: '#5a6f99' });
      d.text(`Base: ${l} × ${w} = ${l * w}`, 760, 370, { size: 28, color: PINK, weight: 700 });
      if (cheer > 0) d.alpha(Math.min(1, cheer), () => { d.emoji('🎉', 760, 450 - (1.2 - cheer) * 40, 80); });
    });
  }
  goal(); render();
  return {
    tick(dt) { t += dt; cheer = Math.max(0, cheer - dt); render(); },
    bot() {
      for (let l = 1; l <= 6; l++) for (let w = 1; w <= 6; w++) for (let h = 1; h <= 6; h++) if (GOALS[gi].ok(l, w, h)) { set('l', l); set('w', w); set('h', h); check(); return; }
    },
  };
}
