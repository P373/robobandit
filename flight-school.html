<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #3d8ff0;

  }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .touch-only { display: none; }
  @media (pointer: coarse) { .touch-only { display: inline; } .key-only { display: none; } }
  .hidden { display: none !important; }

  #actBtn { position: fixed; z-index: 3; right: max(18px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom));
    min-width: 104px; height: 104px; padding: 0 12px; border-radius: 52px; border: 4px solid #fff; cursor: pointer;
    font: 700 17px 'Fredoka', system-ui, sans-serif; color: #fff; background: linear-gradient(#ff9a3d, #e8453a);
    box-shadow: 0 6px 0 #a8281f; line-height: 1.1; touch-action: none; }
  #actBtn.on, #actBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a8281f; }
  #actBtn .ico { display: block; font-size: 30px; }

  .screen { position: fixed; inset: 0; z-index: 5; display: flex; overflow-y: auto; padding: 14px;
    padding-top: max(64px, calc(env(safe-area-inset-top) + 58px)); box-sizing: border-box;
    background: rgba(10,30,70,.35); touch-action: pan-y; }
  .card { margin: auto; width: 100%; max-width: 680px; box-sizing: border-box; text-align: center; color: #0b2a5c;

  .card h1 { margin: 0; font: 38px/1.05 'Bungee', system-ui, sans-serif; letter-spacing: 1px; color: #e8453a;
    text-shadow: 0 3px 0 #ffd84a; }
  .card h2 { margin: 4px 0 8px; font-size: 26px; font-weight: 700; line-height: 1.15; }
  .card p { margin: 8px 0; font-size: 19px; line-height: 1.4; }
  .chip { display: inline-block; padding: 3px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; color: #fff; background: #3d8ff0; }
  .btn { display: inline-block; margin: 8px 5px 0; padding: 12px 22px; border: 3px solid #0b2a5c; border-radius: 14px; cursor: pointer;
    font: 700 20px 'Fredoka', system-ui, sans-serif; color: #0b2a5c; background: #ffd84a; box-shadow: 0 5px 0 #0b2a5c; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0b2a5c; }
  .btn.alt { background: #fff; font-size: 17px; }
  .btn:disabled { opacity: .45; cursor: default; }
  #dia { display: block; position: static; margin: 6px auto; width: min(100%, calc(40vh * 16 / 9)); aspect-ratio: 16 / 9;
    border-radius: 14px; border: 3px solid #0b2a5c; background: #cfe9ff; }
  .dots { margin: 6px 0 2px; font-size: 14px; letter-spacing: 4px; color: #9fb3d6; }
  .dots b { color: #e8453a; }
  .levels { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin: 12px 0 6px; }
  .lvl { position: relative; padding: 10px 8px; border: 3px solid #0b2a5c; border-radius: 16px; cursor: pointer; background: #fff;
    font: inherit; color: inherit; box-shadow: 0 4px 0 #0b2a5c; }
  .lvl .ic { font-size: 36px; display: block; }
  .lvl b { display: block; font-size: 17px; }
  .lvl small { display: block; font-size: 14px; color: #5a6f99; }

  .lvl.next { background: #fff3b0; animation: glow 1.2s ease-in-out infinite alternate; }
  .lvl.locked { cursor: default; opacity: .5; box-shadow: none; }
  @keyframes glow { to { box-shadow: 0 4px 0 #0b2a5c, 0 0 18px #ffd84a; } }
  .how { text-align: left; margin: 10px auto; max-width: 520px; padding: 0; list-style: none; font-size: 18px; }

  .rows div { display: flex; justify-content: space-between; padding: 4px 2px; border-bottom: 2px dashed #d5def0; }

<body>
<canvas id="game"></canvas>
<div id="topbar"></div>
<button id="actBtn" class="hidden" type="button"><span class="ico" id="actIco">🔥</span><span id="actLbl">THRUST</span></button>
<div id="screen" class="screen"><div class="card" id="card"></div></div>

<script src="common.js"></script>
<script src="touch-stick.js"></script>
<script>
'use strict';

// ---------- Canvas ----------
const H = 540, MIN_W = 420, TAU = Math.PI * 2;
const canvas = document.getElementById('game');
const gameCtx = canvas.getContext('2d');
let ctx = gameCtx;   // drawing helpers draw on ctx, which the lesson diagrams briefly swap out
let W = 800, VH = H, OFFY = 0, scale = 1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  scale = Math.min(canvas.height / H, canvas.width / MIN_W);
  W = canvas.width / scale;
  VH = canvas.height / scale;
  OFFY = (VH - H) / 2;
}
addEventListener('resize', resize);
resize();

// ---------- Small helpers ----------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const rnd = (i, k = 0) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };
const mod = (a, n) => ((a % n) + n) % n;
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (c1, c2, t) => { const a = hexRGB(c1), b = hexRGB(c2); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`; };
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function txt(s, x, y, size, color, align = 'center', weight = 700, font = 'Fredoka') {
  ctx.font = `${weight} ${size}px '${font}', system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function outlined(s, x, y, size, color, align = 'center', font = 'Fredoka') {
  ctx.font = `700 ${size}px '${font}', system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = '#0b2a5c';
  ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function arrow(x1, y1, x2, y2, color, w = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1), hl = w * 2.6;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * hl * 0.6, y2 - Math.sin(a) * hl * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(a - 0.45) * hl, y2 - Math.sin(a - 0.45) * hl);
  ctx.lineTo(x2 - Math.cos(a + 0.45) * hl, y2 - Math.sin(a + 0.45) * hl); ctx.fill();
}
function star(x, y, r, fill = '#ffd84a', rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = 'rgba(160,100,0,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
}
function heart(x, y, s, full) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.3, y, x - s * 0.7, y - s * 0.9, x, y - s * 0.3);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 0.9, x + s * 1.3, y, x, y + s * 0.9);
  ctx.fillStyle = full ? '#ff4d6d' : 'rgba(255,255,255,.35)'; ctx.fill();
}
function cloud(x, y, s, color = 'rgba(255,255,255,.9)') {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, 60 * s, 18 * s, 0, 0, TAU);
  ctx.ellipse(x + 26 * s, y - 14 * s, 34 * s, 22 * s, 0, 0, TAU);
  ctx.ellipse(x - 24 * s, y - 8 * s, 26 * s, 16 * s, 0, 0, TAU);
  ctx.fill();
}
function bird(x, y, s, t, color = '#2b2b3a') {
  const f = Math.sin(t * 10) * 7 * s;
  ctx.strokeStyle = color; ctx.lineWidth = 3 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 13 * s, y - f); ctx.quadraticCurveTo(x - 6 * s, y - 6 * s, x, y);
  ctx.quadraticCurveTo(x + 6 * s, y - 6 * s, x + 13 * s, y - f); ctx.stroke();
}
function sky(top, bottom) {
  const g = ctx.createLinearGradient(0, -OFFY, 0, H + OFFY);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(-2, -OFFY - 2, W + 4, VH + 4);
}

// ---------- Flying machines (all face right; ang > 0 is nose up) ----------
function balloonShape(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x - r * 0.32, y + r * 1.15);
  ctx.bezierCurveTo(x - r * 1.3, y + r * 0.35, x - r * 1.1, y - r * 1.08, x, y - r * 1.08);
  ctx.bezierCurveTo(x + r * 1.1, y - r * 1.08, x + r * 1.3, y + r * 0.35, x + r * 0.32, y + r * 1.15);
  ctx.closePath();
}
function drawBalloon(x, y, r, flame = 0, c1 = '#ff6b3d', c2 = '#ffd84a', t = 0) {
  ctx.strokeStyle = '#5a3b1e'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.3, y + r * 1.13); ctx.lineTo(x - r * 0.3, y + r * 1.5);
  ctx.moveTo(x + r * 0.3, y + r * 1.13); ctx.lineTo(x + r * 0.3, y + r * 1.5); ctx.stroke();
  if (flame > 0) {
    const fh = r * (0.35 + 0.15 * Math.sin(t * 40)) * flame;
    ctx.fillStyle = 'rgba(255,190,40,.9)';
    ctx.beginPath(); ctx.moveTo(x - r * 0.12, y + r * 1.48); ctx.quadraticCurveTo(x, y + r * 1.48 - fh * 2, x + r * 0.12, y + r * 1.48); ctx.fill();
    ctx.fillStyle = 'rgba(80,160,255,.9)';
    ctx.beginPath(); ctx.moveTo(x - r * 0.06, y + r * 1.48); ctx.quadraticCurveTo(x, y + r * 1.48 - fh, x + r * 0.06, y + r * 1.48); ctx.fill();
  }
  ctx.fillStyle = '#a8692e'; rrect(x - r * 0.36, y + r * 1.5, r * 0.72, r * 0.45, 3); ctx.fill();
  ctx.fillStyle = '#7a4a1e'; ctx.fillRect(x - r * 0.38, y + r * 1.5, r * 0.76, r * 0.09);
  balloonShape(x, y, r); ctx.fillStyle = c1; ctx.fill();
  ctx.save(); balloonShape(x, y, r); ctx.clip();
  ctx.fillStyle = c2;
  for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.ellipse(x + k * r * 0.62, y, r * 0.14, r * 1.3, 0, 0, TAU); ctx.fill(); }
  ctx.fillRect(x - r * 1.5, y + r * 0.25, r * 3, r * 0.16);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(x - r * 0.42, y - r * 0.45, r * 0.22, r * 0.42, 0.4, 0, TAU); ctx.fill();
  ctx.restore();
  balloonShape(x, y, r); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.stroke();
}
function drawGlider(x, y, s, ang) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-ang); ctx.scale(s, s);
  ctx.fillStyle = '#f4f6fb';
  ctx.beginPath(); ctx.moveTo(30, 0); ctx.quadraticCurveTo(24, -7, 6, -6); ctx.lineTo(-30, -2); ctx.lineTo(-30, 2); ctx.lineTo(6, 5); ctx.quadraticCurveTo(24, 6, 30, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-24, -2); ctx.lineTo(-34, -16); ctx.lineTo(-28, -16); ctx.lineTo(-18, -2); ctx.fill();   // tail fin
  ctx.fillStyle = '#e8453a'; ctx.fillRect(-33, -16, 6, 4); ctx.fillRect(-6, -1, 20, 2);
  ctx.fillStyle = '#7fc8ff'; ctx.beginPath(); ctx.ellipse(16, -5, 8, 4, -0.1, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c9d3e6'; ctx.beginPath(); ctx.ellipse(2, -3, 26, 3, 0, 0, TAU); ctx.fill();   // long wing, edge on
  ctx.restore();
}
function drawFlyer(x, y, s, ang, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-ang); ctx.scale(s, s);
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (const sx of [-16, -2, 12]) { ctx.moveTo(sx, -12); ctx.lineTo(sx, 7); }
  ctx.moveTo(14, -10); ctx.lineTo(40, -4); ctx.moveTo(14, 6); ctx.lineTo(40, -1);   // booms to the front elevator
  ctx.moveTo(-18, -10); ctx.lineTo(-40, -4); ctx.moveTo(-18, 6); ctx.lineTo(-40, 0); // booms to the rudder
  ctx.stroke();
  ctx.fillStyle = '#efe2c0';
  ctx.fillRect(-20, -14, 38, 3); ctx.fillRect(-20, 6, 38, 3);   // two wings
  ctx.fillRect(34, -7, 14, 2); ctx.fillRect(34, -2, 14, 2);     // elevator out front
  ctx.fillRect(-44, -12, 3, 16); ctx.fillRect(-39, -12, 3, 16); // rudder behind
  ctx.fillStyle = 'rgba(90,90,90,.75)';
  const blade = Math.abs(Math.cos(t * 30)) * 10 + 2;
  ctx.beginPath(); ctx.ellipse(-25, -6, 2.5, blade, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5a4630'; ctx.fillRect(-6, 1, 14, 4);   // pilot lying on the lower wing
  ctx.fillStyle = '#e8b98a'; circle(10, 2, 3.2);
  ctx.fillStyle = '#333'; ctx.fillRect(-4, -6, 6, 6);     // engine
  ctx.restore();
}
function drawProp(x, y, s, ang, t, color = '#c9d1dc') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-ang); ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(30, -4); ctx.quadraticCurveTo(32, 4, 26, 7); ctx.lineTo(-30, 2); ctx.lineTo(-32, -4); ctx.quadraticCurveTo(0, -10, 30, -4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-22, -4); ctx.lineTo(-34, -18); ctx.lineTo(-27, -18); ctx.lineTo(-14, -4); ctx.fill();   // fin
  ctx.fillStyle = '#9aa6b8'; ctx.fillRect(-12, -11, 30, 4);   // high wing
  ctx.fillStyle = '#2b4a7a'; ctx.fillRect(-26, -2, 22, 2); ctx.fillRect(4, -2, 22, 2);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(8, 5); ctx.lineTo(4, 13); ctx.moveTo(8, 5); ctx.lineTo(14, 13); ctx.stroke();
  ctx.fillStyle = '#222'; circle(4, 13, 3); circle(14, 13, 3);
  ctx.fillStyle = '#7a8597'; circle(31, 1, 3.5);
  ctx.fillStyle = 'rgba(60,60,60,.55)';
  ctx.beginPath(); ctx.ellipse(33, 1, 2, Math.abs(Math.cos(t * 35)) * 12 + 3, 0, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawJet(x, y, s, ang, flame = 0, t = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-ang); ctx.scale(s, s);
  if (flame > 0) {
    const fl = (14 + Math.sin(t * 50) * 4) * flame;
    ctx.fillStyle = 'rgba(255,150,40,.85)';
    ctx.beginPath(); ctx.moveTo(-30, -4); ctx.lineTo(-30 - fl, 0); ctx.lineTo(-30, 4); ctx.fill();
    ctx.fillStyle = 'rgba(120,190,255,.9)';
    ctx.beginPath(); ctx.moveTo(-30, -2); ctx.lineTo(-30 - fl * 0.5, 0); ctx.lineTo(-30, 2); ctx.fill();
  }
  ctx.fillStyle = '#8fa3bf';
  ctx.beginPath(); ctx.moveTo(42, 0); ctx.quadraticCurveTo(30, -7, 8, -7); ctx.lineTo(-30, -5); ctx.lineTo(-30, 5); ctx.lineTo(8, 6); ctx.quadraticCurveTo(30, 6, 42, 0); ctx.fill();
  ctx.fillStyle = '#6f84a3';
  ctx.beginPath(); ctx.moveTo(-14, -5); ctx.lineTo(-30, -24); ctx.lineTo(-22, -24); ctx.lineTo(-2, -5); ctx.fill();   // swept fin
  ctx.beginPath(); ctx.moveTo(10, 2); ctx.lineTo(-12, 14); ctx.lineTo(-20, 14); ctx.lineTo(-6, 2); ctx.fill();         // swept wing
  ctx.fillStyle = '#e8453a'; ctx.fillRect(-10, -1, 34, 2);
  ctx.fillStyle = '#2c3e5c'; ctx.beginPath(); ctx.ellipse(20, -6, 9, 4, -0.08, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(22, -7, 4, 1.6, -0.08, 0, TAU); ctx.fill();
  ctx.restore();
}
// A three-stage rocket standing up; x,y is the bottom of the lowest stage still attached.
function drawRocket(x, y, s, stagesLeft, flame = 0, t = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (flame > 0) {
    const fl = (26 + Math.sin(t * 45) * 6) * flame;
    ctx.fillStyle = 'rgba(255,140,30,.9)';
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.quadraticCurveTo(0, fl * 1.6, 8, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,150,.95)';
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.quadraticCurveTo(0, fl * 0.8, 4, 0); ctx.fill();
  }
  let yy = 0;
  const stageCol = ['#f4f6fb', '#e8ecf4', '#f4f6fb'];
  for (let k = 3 - stagesLeft; k < 3; k++) {   // k = 0 is the first (bottom) stage
    const w = 12 - k * 1.5, h = 26 - k * 3;
    if (k === 3 - stagesLeft) {   // fins on the lowest stage still attached
      ctx.fillStyle = '#e8453a';

function drawLander(x, y, s, flame = 0, side = 0, t = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

  ctx.moveTo(-21, 18); ctx.lineTo(-13, 18); ctx.moveTo(13, 18); ctx.lineTo(21, 18); ctx.stroke();

  ctx.fillStyle = '#555'; ctx.beginPath(); ctx.moveTo(-4, 8); ctx.lineTo(-6, 12); ctx.lineTo(6, 12); ctx.lineTo(4, 8); ctx.fill();

function drawEarth(x, y, r, t = 0) {
  ctx.fillStyle = '#2f7de0'; circle(x, y, r);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  ctx.fillStyle = '#4fbf6a';
  for (let i = 0; i < 7; i++) {
    const a = rnd(i, 1) * TAU + t * 0.15, px = x + Math.cos(a) * r * 0.55, py = y + (rnd(i, 2) - 0.5) * r * 1.4;
    if (Math.cos(a) > -0.3) { ctx.beginPath(); ctx.ellipse(px, py, r * (0.18 + rnd(i, 3) * 0.2) * (0.5 + 0.5 * Math.cos(a)), r * 0.16, 0, 0, TAU); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(x + (rnd(i, 5) - 0.5) * r * 1.6, y + (rnd(i, 6) - 0.5) * r * 1.6, r * 0.22, r * 0.05, 0.2, 0, TAU); ctx.fill(); }

  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.restore();
  ctx.strokeStyle = 'rgba(140,200,255,.6)'; ctx.lineWidth = Math.max(2, r * 0.04); ctx.beginPath(); ctx.arc(x, y, r + ctx.lineWidth / 2, 0, TAU); ctx.stroke();
}
function spaceStars(n, seed, w, h, t = 0) {
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + i))})`;
    ctx.fillRect(rnd(i, seed) * w, rnd(i, seed + 1) * h, 1.6, 1.6);
  }
}

    best: Array.isArray(s.best) ? s.best.slice(0, 7) : [],

    name: typeof s.name === 'string' ? s.name.slice(0, 24) : '',
  };

  RB.store.set('fs_save', JSON.stringify(save));
  RB.store.set('fs_best', String(totalScore()));
}

  right: () => { [523, 659, 784].forEach((f, i) => RB.beep(f, f, 0.14, 'triangle', 0.13, i * 0.09)); },
  wrong: () => { RB.beep(330, 220, 0.25, 'square', 0.07); RB.beep(247, 165, 0.3, 'square', 0.07, 0.15); },
  win: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => RB.beep(f, f, 0.16, 'triangle', 0.12, i * 0.11)); },
  boom: () => { RB.noise(0.9, 0.7); RB.beep(120, 30, 0.8, 'sine', 0.35); },
  stage: () => { RB.noise(0.35, 0.4); RB.beep(300, 900, 0.25, 'sawtooth', 0.08); },
  fuel: () => { RB.beep(500, 1000, 0.15, 'sine', 0.12); },
  ring: () => { RB.beep(700, 1400, 0.1, 'sine', 0.11); },
  milestone: () => { [784, 988, 1175].forEach((f, i) => RB.beep(f, f, 0.12, 'square', 0.06, i * 0.08)); },

let wind = null;   // a soft rushing-air bed during rounds
function setWind(v) { if (wind) wind.gain.value = v; }

// ---------- Input ----------
const keys = {};
let ptrHeld = false, btnHeld = false;
let mouse = null;   // { x } in logical coords while a mouse button is down on the canvas
const stickLevel = () => mode === 'play' && !paused && LEVELS[cur].stick;
const stick = createTouchStick(canvas, { enabled: stickLevel });
const holding = () => !!(keys.Space || keys.ArrowUp || keys.KeyW || ptrHeld || btnHeld);
const steerX = () => {
  const k = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  return k || (stick.active ? stick.x : 0);
};
const steerY = () => {
  const k = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  return k || (stick.active ? stick.y : 0);
};
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (paused) { if (['Space', 'Enter', 'KeyP', 'Escape'].includes(e.code)) resume(); return; }
  if (e.code === 'KeyM') RB.toggleMute();
  if (mode === 'play') {
    if (e.code === 'KeyP' || e.code === 'Escape') pause();
    else if (e.code === 'Space' || e.code === 'Enter') round.tap && round.tap();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
const toLogical = e => (e.clientX * (canvas.width / innerWidth)) / scale;
canvas.addEventListener('pointerdown', e => {
  RB.audio();
  if (mode !== 'play' || paused) return;
  if (e.pointerType === 'mouse') { mouse = { x: toLogical(e) }; canvas.setPointerCapture(e.pointerId); }
  if (!LEVELS[cur].stick) ptrHeld = true;
  else if (e.pointerType === 'mouse') round.tap && round.tap();
});
canvas.addEventListener('pointermove', e => { if (mouse && e.pointerType === 'mouse') mouse.x = toLogical(e); });
const release = e => { ptrHeld = false; if (e.pointerType === 'mouse') mouse = null; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
const act = $('actBtn');
act.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); RB.audio();
  btnHeld = true; act.classList.add('on');
  if (mode === 'play' && !paused && round.tap) round.tap();
});
const actUp = () => { btnHeld = false; act.classList.remove('on'); };
act.addEventListener('pointerup', actUp);
act.addEventListener('pointercancel', actUp);
act.addEventListener('pointerleave', actUp);
function clearInput() { for (const k in keys) keys[k] = false; ptrHeld = false; mouse = null; actUp(); stick.reset(); }
addEventListener('blur', clearInput);

let paused = false;
function pause() {
  if (paused || mode !== 'play') return;
  paused = true; clearInput(); setWind(0);
  RB.showPause(resume);
}
function resume() { paused = false; RB.hidePause(); last = performance.now(); }
RB.topbar({
  onPause: () => (paused ? resume() : pause()),
  shareInfo: { title: 'Flight School | RoboBandit', text: 'Learn how flying works, from hot air balloons to the Moon! ✈️🚀' },
});
RB.onHide(pause);

// ---------- Shared round bits ----------
let pops = [], parts = [];
function pop(x, y, s, color = '#ffd84a', size = 26) { pops.push({ x, y, s, color, size, t: 0 }); }
function puff(x, y, n, colors, spd = 140, up = 0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rand(spd * 0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, life: rand(0.5, 1.1), max: 1.1, c: colors[i % colors.length], r: rand(2, 5) });
  }
}
function stepFx(dt) {
  for (const p of pops) { p.t += dt; p.y -= 40 * dt; }
  pops = pops.filter(p => p.t < 1.2);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
}
function drawFx() {
  for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.c; circle(p.x, p.y, p.r); }
  ctx.globalAlpha = 1;
  for (const p of pops) { ctx.globalAlpha = clamp(1.6 - p.t * 1.4, 0, 1); outlined(p.s, p.x, p.y, p.size, p.color); }
  ctx.globalAlpha = 1;
}
let banner = null;
function showBanner(big, small = '', time = 2.2, color = '#ffd84a') { banner = { big, small, t: 0, time, color }; }
function drawBanner(dt) {
  if (!banner) return;
  banner.t += dt;
  if (banner.t > banner.time) { banner = null; return; }
  const a = clamp(Math.min(banner.t * 5, (banner.time - banner.t) * 3), 0, 1);
  ctx.globalAlpha = a;
  outlined(banner.big, W / 2, H * 0.3, Math.min(46, W / 11), banner.color, 'center', 'Bungee');
  if (banner.small) outlined(banner.small, W / 2, H * 0.3 + 42, Math.min(22, W / 20), '#fff');
  ctx.globalAlpha = 1;
}
// Top-left HUD: score, hearts and any extra lines.
function hud(score, lives, extra = []) {
  const top = -OFFY + Math.max(12, (VH - H) > 0 ? 12 : 12);
  ctx.fillStyle = 'rgba(11,42,92,.55)';
  rrect(10, top, 170, 44 + extra.length * 24 + (lives != null ? 26 : 0), 14); ctx.fill();
  txt(`⭐ ${score}`, 22, top + 22, 24, '#fff', 'left');
  let y = top + 48;
  if (lives != null) { for (let i = 0; i < 3; i++) heart(30 + i * 26, y - 2, 9, i < lives); y += 26; }
  for (const e of extra) { txt(e, 22, y, 17, '#e6f1ff', 'left', 600); y += 24; }
}
// Where a centered gauge of width w goes: top middle, or under the corner buttons on narrow screens.
function gaugeAt(w) { return W < 700 ? [W - w - 10, -OFFY + 64] : [W / 2 - w / 2, -OFFY + 14]; }
// Progress bar along the bottom of the play area.
function progressBar(f, left, right, color = '#ffd84a') {
  const x = 20, w = W - 40, y = H + OFFY - 28 - Math.min(OFFY, 0);
  ctx.fillStyle = 'rgba(11,42,92,.5)'; rrect(x, y - 9, w, 18, 9); ctx.fill();
  ctx.fillStyle = color; rrect(x + 3, y - 6, Math.max(12, (w - 6) * clamp(f, 0, 1)), 12, 6); ctx.fill();
  txt(left, x + 10, y - 22, 15, '#fff', 'left'); txt(right, x + w - 10, y - 22, 15, '#fff', 'right');
}
// Objects in side-scrolling rounds sit at world x; the player sits at screen x = PX.
const PX = () => Math.min(W * 0.3, 260);
function hit(ax, ay, ar, bx, by, br) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy < (ar + br) * (ar + br); }

// ---------- Round 1: hot air balloon ----------
function balloonRound() {
  const GOAL = 4400, SPEED = 110, GROUND = H - 56;
  const r = { score: 0, lives: 3, stars: 0, dist: 0, y: 220, vy: 0, heat: 0.45, inv: 0, objs: [], next: 300, t: 0, over: false, win: false };
  const groundY = x => GROUND - 18 - Math.sin(x * 0.004) * 16 - Math.sin(x * 0.011 + 1) * 8;
  r.update = dt => {
    r.t += dt;
    const hold = holding();
    r.heat = clamp(r.heat + (hold ? 0.7 : -0.42) * dt, 0, 1);
    r.vy += -(r.heat - 0.45) * 300 * dt;
    r.vy *= 1 - 1.3 * dt;
    r.vy = clamp(r.vy, -150, 150);
    r.y += r.vy * dt;
    if (r.y < 50) { r.y = 50; r.vy = Math.max(0, r.vy); }
    r.dist += SPEED * dt;
    r.inv -= dt;
    const px = PX(), gx = groundY(r.dist + px);
    if (r.y + 58 > gx) {   // basket bottom touches the ground
      r.y = gx - 58; r.vy = -120; r.heat = Math.max(r.heat, 0.8);
      if (r.inv <= 0) { r.lives--; r.inv = 1.5; sfx.bump(); pop(px, r.y - 50, 'Bump!', '#ff8a7a'); }
    }
    while (r.next < r.dist + W + 100) {
      const x = r.next;
      if (rnd(x, 1) < 0.7) r.objs.push({ k: 'star', x, y: 70 + rnd(x, 2) * (H - 230) });
      else r.objs.push({ k: 'bird', x, y: 80 + rnd(x, 3) * (H - 240), vx: -20 - rnd(x, 4) * 35, ph: rnd(x, 5) * 6 });
      r.next += 190 + rnd(x, 6) * 120;
    }
    for (const o of r.objs) {
      if (o.k === 'bird') { o.x += o.vx * dt; o.y += Math.sin(r.t * 2 + o.ph) * 20 * dt; }
      const sx = o.x - r.dist;
      if (o.dead || sx < px - 80 || sx > px + 80) continue;
      const envHit = hit(sx, o.y, o.k === 'star' ? 14 : 12, px, r.y - 4, 34), basketHit = hit(sx, o.y, 12, px, r.y + 48, 12);
      if (!envHit && !basketHit) continue;
      if (o.k === 'star') { o.dead = true; r.stars++; r.score += 50; sfx.star(); pop(sx, o.y - 20, '+50'); puff(sx, o.y, 10, ['#ffd84a', '#fff']); }
      else if (r.inv <= 0) { o.dead = true; r.lives--; r.inv = 1.5; sfx.bump(); pop(px, r.y - 50, 'Ouch! A bird!', '#ff8a7a', 22); puff(sx, o.y, 12, ['#444', '#888']); }
    }
    r.objs = r.objs.filter(o => !o.dead && o.x - r.dist > -100);
    if (r.lives <= 0) { r.over = true; r.end = 'The balloon came down.'; }
    if (r.dist >= GOAL) { r.over = true; r.win = true; r.end = 'You floated all the way to town!'; }
    setWind(0.04 + r.heat * 0.03);
  };
  r.draw = () => {
    sky('#69b7ff', '#fff1d6');
    ctx.fillStyle = '#fff6c9'; circle(W * 0.8, 90, 40);
    for (let i = 0; i < 6; i++) cloud(mod(rnd(i, 1) * 1600 - r.dist * 0.2, 1600) - 150, 50 + rnd(i, 2) * 160, 0.7 + rnd(i, 3) * 0.6);
    // far hills, then fields
    ctx.fillStyle = '#8fc98a';
    ctx.beginPath(); ctx.moveTo(0, H + OFFY);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, GROUND - 70 - Math.sin((x + r.dist * 0.3) * 0.006) * 30);
    ctx.lineTo(W, H + OFFY); ctx.fill();
    // the town at the finish
    const tx = GOAL + PX() - r.dist + 120;
    if (tx < W + 300) {
      for (let i = 0; i < 6; i++) {
        const hx = tx - 120 + i * 50, hh = 40 + rnd(i, 9) * 50;
        ctx.fillStyle = ['#f2d7b0', '#e8c49a', '#f5e1c4'][i % 3]; ctx.fillRect(hx, GROUND - 30 - hh, 42, hh + 30);
        ctx.fillStyle = '#c4553a'; ctx.beginPath(); ctx.moveTo(hx - 4, GROUND - 30 - hh); ctx.lineTo(hx + 21, GROUND - 56 - hh); ctx.lineTo(hx + 46, GROUND - 30 - hh); ctx.fill();
      }
      ctx.fillStyle = '#7d8aa3'; ctx.fillRect(tx + 190, GROUND - 170, 14, 140);
      ctx.beginPath(); ctx.moveTo(tx + 186, GROUND - 170); ctx.lineTo(tx + 197, GROUND - 210); ctx.lineTo(tx + 208, GROUND - 170); ctx.fill();
      outlined('🏁', tx, GROUND - 150, 40, '#fff');
    }
    ctx.fillStyle = '#5fae4f';
    ctx.beginPath(); ctx.moveTo(0, H + OFFY);
    for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, groundY(r.dist + x));
    ctx.lineTo(W, H + OFFY); ctx.fill();
    ctx.fillStyle = 'rgba(255,230,120,.35)';
    for (let i = 0; i < 12; i++) { const fx = mod(i * 160 - r.dist, 1920) - 100; ctx.fillRect(fx, groundY(r.dist + fx) + 14, 90, 6); }
    for (const o of r.objs) {
      const sx = o.x - r.dist;
      if (o.k === 'star') star(sx, o.y + Math.sin(r.t * 3 + o.x) * 4, 14, '#ffd84a', r.t);
      else bird(sx, o.y, 1.2, r.t + o.ph);
    }
    const px = PX();
    if (r.inv > 0 && Math.floor(r.inv * 10) % 2) ctx.globalAlpha = 0.5;
    drawBalloon(px, r.y, 34, holding() ? 1 : 0, '#3d6fe0', '#ffd84a', r.t);
    ctx.globalAlpha = 1;
    // heat gauge
    const gx = px + 52, gy = r.y - 30;
    ctx.fillStyle = 'rgba(11,42,92,.5)'; rrect(gx, gy, 12, 60, 6); ctx.fill();
    ctx.fillStyle = mix('#7fc8ff', '#ff5a2a', r.heat); rrect(gx + 2, gy + 58 - 56 * r.heat, 8, 56 * r.heat, 4); ctx.fill();
    txt('🔥', gx + 6, gy - 10, 14, '#fff');
    drawFx();
    hud(r.score, r.lives);
    progressBar(r.dist / GOAL, '🎈 Start', '🏁 Town');
  };
  r.results = () => {
    const rows = [[`⭐ Stars × ${r.stars}`, r.stars * 50]];
    if (r.win) rows.push(['🏁 Made it to town', 300], [`❤️ Hearts left × ${r.lives}`, r.lives * 100]);
    else rows.push(['📏 Distance', Math.round(r.dist / 20)]);
    return rows;
  };
  return r;
}

// ---------- Round 2: glider ----------
function gliderRound() {
  const GOAL = 6200, GROUND = H - 40, STALL = 95;
  const r = { score: 0, stars: 0, dist: 0, y: 160, v: 175, pitch: 0, stall: false, objs: [], next: 260, therm: [], nextT: 380, t: 0, over: false, win: false };
  const hillY = x => GROUND - 30 - Math.max(0, Math.sin(x * 0.0021) * 60 + Math.sin(x * 0.0057 + 2) * 30);
  r.update = dt => {
    r.t += dt;
    r.pitch += (holding() ? 1.5 : -1.15) * dt;
    if (r.v < STALL) { r.stall = true; }
    if (r.stall) { r.pitch -= 2.6 * dt; if (r.v > STALL + 30) r.stall = false; }
    r.pitch = clamp(r.pitch, -0.6, 0.48);
    r.v += (-230 * Math.sin(r.pitch) - 0.0008 * r.v * r.v + 18) * dt;
    r.v = clamp(r.v, 40, 320);
    const px = PX();
    let lift = 0;
    for (const th of r.therm) if (Math.abs(th.x - (r.dist + px)) < th.w / 2) lift = th.p;
    const vy = -r.v * Math.sin(r.pitch) + 36 + (r.stall ? 70 : 0) - lift;
    r.y += vy * dt;
    if (r.y < 40) { r.y = 40; r.pitch = Math.min(r.pitch, 0); }
    r.dist += r.v * Math.cos(r.pitch) * dt;
    while (r.nextT < r.dist + W + 200) {
      r.therm.push({ x: r.nextT, w: 150 + rnd(r.nextT, 1) * 40, p: 140 + rnd(r.nextT, 2) * 30 });
      r.nextT += 470 + rnd(r.nextT, 3) * 200;
    }
    while (r.next < r.dist + W + 100) {
      r.objs.push({ k: 'star', x: r.next, y: 70 + rnd(r.next, 4) * (H - 240) });
      r.next += 220 + rnd(r.next, 5) * 160;
    }
    for (const o of r.objs) {
      const sx = o.x - r.dist;
      if (!o.dead && Math.abs(sx - px) < 40 && hit(sx, o.y, 14, px, r.y, 22)) {
        o.dead = true; r.stars++; r.score += 50; sfx.star(); pop(sx, o.y - 20, '+50'); puff(sx, o.y, 10, ['#ffd84a', '#fff']);
      }
    }
    r.objs = r.objs.filter(o => !o.dead && o.x - r.dist > -60);
    r.therm = r.therm.filter(th => th.x - r.dist > -200);
    if (r.y + 6 > hillY(r.dist + px)) {
      r.y = hillY(r.dist + px) - 6; r.over = true;
      r.end = r.dist > 2500 ? 'Nice glide! You touched down safely.' : 'You touched down. Gliders always come down in the end!';
      sfx.bump();
    }
    if (r.dist >= GOAL) { r.over = true; r.win = true; r.end = 'You glided all the way to the landing field!'; }
    setWind(0.03 + r.v / 320 * 0.06);
  };
  r.draw = () => {
    sky('#4aa6ff', '#d8f0ff');
    for (let i = 0; i < 7; i++) cloud(mod(rnd(i, 1) * 1800 - r.dist * 0.25, 1800) - 150, 40 + rnd(i, 2) * 150, 0.6 + rnd(i, 3) * 0.6);
    ctx.fillStyle = '#9ccf9a';
    ctx.beginPath(); ctx.moveTo(0, H + OFFY);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, GROUND - 90 - Math.sin((x + r.dist * 0.35) * 0.005) * 40);
    ctx.lineTo(W, H + OFFY); ctx.fill();
    for (const th of r.therm) {   // shimmering columns of rising warm air
      const sx = th.x - r.dist;
      const g = ctx.createLinearGradient(sx - th.w / 2, 0, sx + th.w / 2, 0);
      g.addColorStop(0, 'rgba(255,180,90,0)'); g.addColorStop(0.5, 'rgba(255,180,90,.28)'); g.addColorStop(1, 'rgba(255,180,90,0)');
      ctx.fillStyle = g; ctx.fillRect(sx - th.w / 2, -OFFY, th.w, H + OFFY);
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3;
      for (let k = 0; k < 5; k++) {
        const ay = mod(H - (r.t * 90 + k * 110), H + 40) - 20, ax = sx + Math.sin(k * 2 + r.t * 3) * th.w * 0.25;
        ctx.beginPath(); ctx.moveTo(ax - 8, ay + 8); ctx.lineTo(ax, ay); ctx.lineTo(ax + 8, ay + 8); ctx.stroke();
      }
    }
    // landing field flag
    const fx = GOAL + PX() - r.dist;
    if (fx < W + 100) { outlined('🏁', fx, hillY(GOAL + PX()) - 30, 40, '#fff'); }
    ctx.fillStyle = '#5fae4f';
    ctx.beginPath(); ctx.moveTo(0, H + OFFY);
    for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, hillY(r.dist + x));
    ctx.lineTo(W, H + OFFY); ctx.fill();
    ctx.fillStyle = '#3f8a3a';
    for (let i = 0; i < 14; i++) { const tx = mod(i * 137 - r.dist, 1918) - 60, ty = hillY(r.dist + tx); circle(tx, ty - 10, 12); ctx.fillRect(tx - 2, ty - 6, 4, 8); }
    for (const o of r.objs) star(o.x - r.dist, o.y + Math.sin(r.t * 3 + o.x) * 4, 14, '#ffd84a', r.t);
    const px = PX();
    drawGlider(px, r.y, 1.3, r.pitch);
    if (r.stall) outlined('STALL! Let go to dive!', px, r.y - 40, 20, '#ff6b5a');
    drawFx();
    hud(r.score, null, [`💨 Speed ${Math.round(r.v)}`, `📏 ${Math.round(r.dist / 10)} m`]);
    progressBar(r.dist / GOAL, '⛰️ Hill', '🏁 Field');
  };
  r.results = () => {
    const rows = [['📏 Distance', Math.round(r.dist / 10)], [`⭐ Stars × ${r.stars}`, r.stars * 50]];
    if (r.win) rows.push(['🏁 Reached the field', 300]);
    return rows;
  };
  return r;
}

// ---------- Rounds 3 & 4 share a "hold to climb" engine ----------
function climberRound(opts) {
  const r = { score: 0, lives: 3, stars: 0, dist: 0, y: opts.startY, vy: 0, ang: 0, inv: 0, objs: [], next: 400, t: 0, over: false, win: false, fuel: 100, cans: 0, gusts: 0, bonus: 0 };
  r.update = dt => {
    r.t += dt;
    const engine = !opts.fuel || r.fuel > 0;
    let a = engine ? (holding() ? -opts.climb : opts.fall) : opts.fall * 0.7;
    const px = PX();
    for (const o of r.objs) if (o.k === 'gust' && Math.abs(o.x - r.dist - px) < o.w / 2) a += o.p;
    r.vy = clamp(r.vy + a * dt, -opts.maxV, opts.maxV);
    r.vy *= 1 - 0.6 * dt;
    r.y += r.vy * dt;
    if (r.y < opts.ceiling) { r.y = opts.ceiling; r.vy = Math.max(0, r.vy); }
    r.ang = lerp(r.ang, clamp(-r.vy / 300, -0.45, 0.45), 8 * dt);
    const speed = engine ? opts.speed : opts.speed * 0.7;
    r.dist += speed * dt;
    r.inv -= dt;
    if (opts.fuel && engine) r.fuel = Math.max(0, r.fuel - opts.burn * dt);
    if (opts.fuel && r.fuel <= 0 && !r.dry) { r.dry = true; showBanner('OUT OF FUEL!', 'Gliding down…', 2, '#ff8a7a'); }
    const gy = opts.ground(r.dist + px);
    if (r.y + 10 > gy) {
      if (r.dry) { r.over = true; r.end = opts.dryEnd; sfx.bump(); puff(px, gy, 20, ['#fff', '#9fd4ff']); return; }
      r.y = gy - 12; r.vy = -opts.climb * 0.45;
      if (r.inv <= 0) { r.lives--; r.inv = 1.5; sfx.bump(); pop(px, r.y - 40, opts.groundSay, '#ff8a7a', 22); puff(px, gy, 12, opts.groundPuff); }
    }
    while (r.next < r.dist + W + 150) opts.spawn(r, r.next);
    for (const o of r.objs) {
      if (o.vx) o.x += o.vx * dt;
      const sx = o.x - r.dist;
      if (o.dead || o.k === 'gust' || Math.abs(sx - px) > (o.r || 20) + 40) continue;
      if (!hit(sx, o.y, o.r || 14, px, r.y, 16)) continue;
      if (o.k === 'star') { o.dead = true; r.stars++; r.score += 50; sfx.star(); pop(sx, o.y - 20, '+50'); puff(sx, o.y, 10, ['#ffd84a', '#fff']); }
      else if (o.k === 'fuel') { o.dead = true; r.cans++; r.score += 30; r.fuel = Math.min(100, r.fuel + 38); r.dry = false; sfx.fuel(); pop(sx, o.y - 20, '⛽ +fuel', '#9fffa8', 22); }
      else if (r.inv <= 0) { r.lives--; r.inv = 1.5; sfx.bump(); pop(px, r.y - 40, o.say, '#ff8a7a', 22); puff(px, r.y, 12, o.puff || ['#666', '#aaa']); }
    }
    r.objs = r.objs.filter(o => !o.dead && o.x - r.dist > -300);
    opts.extra && opts.extra(r, dt);
    if (r.lives <= 0) { r.over = true; r.end = opts.crashEnd; }
    if (opts.goal && r.dist >= opts.goal) { r.over = true; r.win = true; r.end = opts.winEnd; }
    setWind(engine ? 0.06 : 0.03);
  };
  r.draw = () => {
    opts.drawBack(r);
    for (const o of r.objs) {
      const sx = o.x - r.dist;
      if (sx < -200 || sx > W + 200) continue;
      opts.drawObj(o, sx, r);
    }
    const px = PX();
    if (r.inv > 0 && Math.floor(r.inv * 10) % 2) ctx.globalAlpha = 0.5;
    opts.drawPlane(px, r.y, r.ang, r.t, r);
    ctx.globalAlpha = 1;
    drawFx();
    opts.drawHud(r);
  };
  return r;
}

function wrightRound() {
  const GROUND = H - 40, DUR = 45;
  const dune = x => GROUND - 30 - Math.max(0, Math.sin(x * 0.006) * 40 + Math.sin(x * 0.017 + 1) * 22) - (rnd(Math.floor(x / 700), 7) < 0.5 ? 0 : Math.max(0, Math.sin(x * Math.PI / 700) * 60));
  const r = climberRound({
    startY: 330, climb: 430, fall: 300, maxV: 160, ceiling: 120, speed: 125,
    ground: dune, groundSay: 'Crunch! Sand!', groundPuff: ['#f2d79a', '#e0c07a'],
    crashEnd: 'The Flyer bumped down into the sand.',
    spawn: (r, x) => {

      if (!r.m30 && r.t >= 30) { r.m30 = true; r.bonus += 200; sfx.milestone(); showBanner('30 SECONDS!', 'Wilbur flew 59 seconds that day. Keep going! +200'); }
      if (r.t >= DUR) { r.over = true; r.win = true; r.end = 'What a flight! You\'re a true aviator.'; }
    },
    drawBack: r => {

      ctx.fillStyle = '#ead09a';
      ctx.beginPath(); ctx.moveTo(0, H + OFFY);

      for (let i = 0; i < 18; i++) { const gx = mod(i * 111 - r.dist, 1998) - 40, gy = dune(r.dist + gx); ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx - 4, gy - 10); ctx.moveTo(gx, gy); ctx.lineTo(gx + 5, gy - 9); ctx.stroke(); }
      if (r.t < 4) {   // the launch rail

      else if (o.k === 'gull') bird(sx, o.y, 1.3, r.t + o.ph, '#f4f4f4');
      else if (o.k === 'gust') {

        for (let k = 0; k < 4; k++) {

  });
  r.results = () => {

    if (r.bonus) rows.push(['🏆 Milestones', r.bonus]);
    if (r.win) rows.push([`❤️ Hearts left × ${r.lives}`, r.lives * 100]);

  };
  return r;
}

      }

      ctx.fillStyle = sea; ctx.fillRect(0, SEA, W, H + OFFY - SEA + 4);

    },
    drawObj: (o, sx, r) => {

    if (r.win) rows.push(['🗼 Reached Paris', 400], [`❤️ Hearts left × ${r.lives}`, r.lives * 100]);
    return rows;
  };
  return r;
}

// ---------- Round 5: jet ----------
function jetRound() {
  const DUR = 45, MACH = 1235, GROUND = H - 30;
  const r = { score: 0, pops: 0, kmh: 640, top: 640, rings: 0, boom: false, y: 260, vy: 0, ang: 0, dist: 0, t: 0, inv: 0, objs: [], next: 500, ringY: 260, over: false, win: false, flash: 0 };
  r.update = dt => {
    r.t += dt;
    let sy = steerY();
    if (!sy && mouse) sy = -1;   // mouse held: climb
    r.vy = lerp(r.vy, sy * 270, 6 * dt);
    r.y = clamp(r.y + r.vy * dt, 60, GROUND - 40);
    r.ang = lerp(r.ang, clamp(-r.vy / 600, -0.35, 0.35), 8 * dt);
    r.kmh = Math.max(560, r.kmh - 6 * dt);
    const speed = r.kmh * 0.3;
    r.dist += speed * dt;
    r.inv -= dt; r.flash -= dt;
    while (r.next < r.dist + W + 200) {
      const x = r.next;
      r.ringY = clamp(r.ringY + (rnd(x, 1) - 0.5) * 220, 110, GROUND - 110);
      r.objs.push({ k: 'ring', x, y: r.ringY });
      if (rnd(x, 2) < 0.55) r.objs.push({ k: 'wb', x: x + 170 + rnd(x, 3) * 60, y: clamp(r.ringY + (rnd(x, 4) < 0.5 ? -1 : 1) * (90 + rnd(x, 5) * 60), 80, GROUND - 70), ph: rnd(x, 6) * 6 });
      r.next += 340 + rnd(x, 7) * 60;
    }
    const px = PX();
    for (const o of r.objs) {
      const sx = o.x - r.dist;
      if (o.dead) continue;
      if (o.k === 'ring' && !o.passed && sx < px) {
        o.passed = true;
        if (Math.abs(o.y - r.y) < 42) {
          r.rings++; r.score += 20; r.kmh = Math.min(1900, r.kmh + 52); sfx.ring(); pop(px + 30, r.y - 40, '+52 km/h', '#9fe8ff', 20);
          puff(sx, o.y, 12, ['#7ff0ff', '#fff']);
        }
      }
      if (o.k === 'wb' && r.inv <= 0 && Math.abs(sx - px) < 40 && hit(sx, o.y, 20, px, r.y, 18)) {
        o.dead = true; r.pops++; r.inv = 1.2; r.kmh = Math.max(560, r.kmh - 140); sfx.bump();
        pop(px, r.y - 40, 'Pop! Slowed down!', '#ff8a7a', 20); puff(sx, o.y, 16, ['#fff', '#ddd']);
      }
    }
    r.objs = r.objs.filter(o => !o.dead && o.x - r.dist > -100);
    r.top = Math.max(r.top, r.kmh);
    if (!r.boom && r.kmh >= MACH) {
      r.boom = true; r.flash = 0.6; sfx.boom();
      showBanner('SONIC BOOM!', 'You broke the sound barrier! Mach 1! +500', 3);
      puff(px, r.y, 40, ['#fff', '#cfe9ff', '#ffd84a'], 260);
    }
    if (r.t >= DUR) { r.over = true; r.win = true; r.end = r.boom ? 'Supersonic! You\'re a real jet pilot!' : 'Good flying! Grab more rings next time to break Mach 1.'; }
    setWind(0.04 + clamp(r.kmh / 2000, 0, 0.08));
  };
  r.draw = () => {
    const m = clamp(r.kmh / MACH, 0, 1.3);
    sky(mix('#2f7fe0', '#163d9c', clamp(m - 0.5, 0, 1)), '#bfe3ff');
    // streaking cloud layers sell the speed
    for (let i = 0; i < 9; i++) cloud(mod(rnd(i, 1) * 2400 - r.dist * (0.3 + rnd(i, 4) * 0.4), 2400) - 200, 40 + rnd(i, 2) * (H - 180), 0.5 + rnd(i, 3) * 0.6, 'rgba(255,255,255,.75)');
    ctx.fillStyle = '#e8f6ff';
    ctx.beginPath(); ctx.moveTo(0, H + OFFY);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, GROUND - 6 - Math.sin((x + r.dist * 0.9) * 0.01) * 6 - Math.sin((x + r.dist * 0.9) * 0.023) * 4);
    ctx.lineTo(W, H + OFFY); ctx.fill();   // a sea of cloud below
    const px = PX();
    for (const o of r.objs) {
      const sx = o.x - r.dist;
      if (sx < -80 || sx > W + 80) continue;
      if (o.k === 'ring') {
        ctx.lineWidth = 7; ctx.strokeStyle = o.passed ? 'rgba(160,255,190,.5)' : '#4ae0ff';
        ctx.beginPath(); ctx.ellipse(sx, o.y, 14, 46, 0, 0, TAU); ctx.stroke();
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(sx, o.y, 14, 46, 0, -1.5, 1.5); ctx.stroke();
      } else {
        const y = o.y + Math.sin(r.t * 2 + o.ph) * 6;
        ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx, y + 20); ctx.lineTo(sx, y + 46); ctx.stroke();
        ctx.fillStyle = '#ff5a4a'; ctx.fillRect(sx - 6, y + 46, 12, 8);
        ctx.fillStyle = '#fbfbff'; circle(sx, y, 20);
        ctx.fillStyle = 'rgba(0,0,0,.08)'; circle(sx + 6, y + 4, 14);
      }
    }
    if (r.kmh > MACH * 0.85) {   // a vapor cone forms near the speed of sound
      ctx.fillStyle = `rgba(255,255,255,${clamp((r.kmh / MACH - 0.85) * 3, 0, 0.55)})`;
      ctx.beginPath(); ctx.moveTo(px + 20, r.y - 2); ctx.quadraticCurveTo(px - 10, r.y - 34, px - 34, r.y - 30); ctx.lineTo(px - 34, r.y + 30); ctx.quadraticCurveTo(px - 10, r.y + 34, px + 20, r.y + 2); ctx.fill();
    }
    if (r.inv > 0 && Math.floor(r.inv * 10) % 2) ctx.globalAlpha = 0.5;
    drawJet(px, r.y, 1.4, r.ang, 0.7 + clamp(r.kmh / MACH - 0.5, 0, 1) * 0.6, r.t);
    ctx.globalAlpha = 1;
    if (r.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${r.flash})`; ctx.fillRect(0, -OFFY, W, VH); }
    drawFx();
    hud(r.score + (r.boom ? 500 : 0), null, [`⏱️ ${Math.max(0, DUR - r.t).toFixed(0)} s left`]);
    // speedometer with the Mach 1 line
    const w = 220, [x, y] = gaugeAt(w);
    ctx.fillStyle = 'rgba(11,42,92,.6)'; rrect(x, y, w, 48, 12); ctx.fill();
    txt(`${Math.round(r.kmh)} km/h`, x + w / 2, y + 14, 17, '#fff');
    ctx.fillStyle = 'rgba(255,255,255,.25)'; rrect(x + 10, y + 27, w - 20, 12, 6); ctx.fill();
    ctx.fillStyle = r.boom ? '#ffd84a' : '#4ae0ff'; rrect(x + 10, y + 27, Math.max(6, (w - 20) * clamp(r.kmh / 2000, 0, 1)), 12, 6); ctx.fill();
    const mx = x + 10 + (w - 20) * MACH / 2000;
    ctx.fillStyle = '#ff5a4a'; ctx.fillRect(mx - 1.5, y + 23, 3, 20);
    txt('MACH 1', mx, y + 54, 12, '#ff5a4a');
  };
  r.results = () => {
    const rows = [[`⭕ Rings × ${r.rings}`, r.rings * 20], [`💨 Top speed ${Math.round(r.top)} km/h`, Math.round(r.top / 10)]];
    if (r.boom) rows.push(['💥 Sonic boom!', 500]);
    if (!r.pops) rows.push(['🎈 No balloons hit!', 200]);
    return rows;
  };
  return r;
}

// ---------- Round 6: rocket ----------
function rocketRound() {
  const BURN = 7, ACC = [0.3, 0.35, 0.45], GOAL = 100;
  const r = { score: 0, lives: 3, stars: 0, x: W / 2, vx: 0, alt: 0, vel: 0, stage: 0, fuel: BURN, emptyT: 0, perfect: 0, quick: 0, t: 0, inv: 0, objs: [], scroll: 0, nextY: 300, drops: [], over: false, win: false, launch: 1.2 };
  const RY = () => H * 0.68;
  const bands = [[0, 10, 'bird'], [8, 16, 'plane'], [16, 48, 'wb'], [48, 101, 'rock']];
  r.tap = () => {
    if (r.over || r.launch > 0) return;
    if (r.fuel > 0) { pop(r.x, RY() - 90, 'Still has fuel!', '#fff', 18); return; }
    if (r.stage >= 2) return;
    r.drops.push({ x: r.x, y: RY(), vy: 0, vx: rand(-30, 30), rot: 0, k: r.stage });
    r.stage++; r.fuel = BURN; sfx.stage();
    if (r.emptyT < 0.8) { r.perfect++; r.score += 200; pop(r.x, RY() - 100, 'PERFECT STAGING! +200', '#ffd84a', 22); }
    else if (r.emptyT < 2) { r.quick++; r.score += 100; pop(r.x, RY() - 100, 'Nice staging! +100', '#9fffa8', 22); }
    else pop(r.x, RY() - 100, 'Stage ' + (r.stage + 1) + ' fired!', '#fff', 22);
    puff(r.x, RY() + 10, 24, ['#fff', '#ddd', '#ffb347'], 160);
  };
  r.update = dt => {
    r.t += dt;
    if (r.launch > 0) { r.launch -= dt; if (r.launch <= 0) showBanner('LIFTOFF!', '', 1.4); return; }
    let sx = steerX();
    if (!sx && mouse) sx = clamp((mouse.x - r.x) / 60, -1, 1);
    r.vx = lerp(r.vx, sx * 240, 7 * dt);
    r.x = clamp(r.x + r.vx * dt, 30, W - 30);
    if (r.fuel > 0) {
      r.fuel -= dt; r.vel += ACC[r.stage] * dt;
      if (r.fuel <= 0) { r.fuel = 0; r.emptyT = 0; if (r.stage < 2) showBanner('FUEL EMPTY!', RB.touch ? 'Tap STAGE!' : 'Press SPACE to stage!', 1.6, '#ff8a7a'); }
    } else {
      r.emptyT += dt; r.vel = Math.max(0, r.vel - 0.5 * dt);
      if (r.stage < 2 && r.emptyT > 4) { r.tap(); pop(r.x, RY() - 130, 'Mission Control staged for you!', '#fff', 18); }
    }
    r.alt += r.vel * dt;
    const pxs = 140 + r.vel * 70;
    r.scroll += pxs * dt;
    r.inv -= dt;
    // spawn by altitude band
    while (r.nextY < r.scroll + VH) {
      const aAt = r.alt + (r.nextY - r.scroll) / Math.max(pxs, 1) * r.vel;
      const band = bands.find(b => aAt >= b[0] && aAt < b[1]) || bands[3];
      const x = 30 + Math.random() * (W - 60);
      if (Math.random() < 0.45) r.objs.push({ k: 'star', x, y: -r.nextY, r: 14 });
      else r.objs.push({ k: band[2], x, y: -r.nextY, r: band[2] === 'plane' ? 24 : 18, vx: band[2] === 'plane' || band[2] === 'bird' ? (Math.random() < 0.5 ? -1 : 1) * rand(40, 80) : rand(-20, 20), ph: Math.random() * 6 });

      else {

  };
  return r;
}

// ---------- Round 7: lunar lander ----------
function landerRound() {
  const G = 26, THRUST = 66, SIDE = 34, SAFE_VY = 42, SAFE_VX = 28;
  const r = { score: 0, tries: 3, fuel: 100, t: 0, over: false, win: false, boomT: 0, landedT: 0 };
  function newTerrain() {
    const n = 24, pts = [], padI = 6 + Math.floor(Math.random() * (n - 12));
    for (let i = 0; i <= n; i++) pts.push({ x: i / n * W, y: H - 60 - Math.random() * 130 });
    pts[padI + 1].y = pts[padI].y;   // a flat pad two points wide
    pts[padI + 2].y = pts[padI].y;
    r.pts = pts; r.pad = { x1: pts[padI].x, x2: pts[padI + 2].x, y: pts[padI].y };
  }
  function reset() { r.x = W * 0.18; r.y = 70; r.vx = 40; r.vy = 0; r.fuel = 100; r.state = 'fly'; r.flame = 0; r.side = 0; }
  newTerrain(); reset();
  const groundAt = x => {
    const p = r.pts;
    for (let i = 0; i < p.length - 1; i++) if (x >= p[i].x && x <= p[i + 1].x) return lerp(p[i].y, p[i + 1].y, (x - p[i].x) / (p[i + 1].x - p[i].x || 1));
    return H - 60;
  };
  r.update = dt => {
    r.t += dt;
    if (r.state === 'boom') {
      r.boomT -= dt;
      if (r.boomT <= 0) { if (r.tries > 0) { reset(); showBanner(`TRY ${4 - r.tries} OF 3`, 'Slow and steady!', 1.6); } else { r.over = true; r.end = 'The lander crashed. Landing on the Moon is tricky!'; } }
      return;
    }
    if (r.state === 'landed') { r.landedT += dt; if (r.landedT > 2.4) r.over = true; return; }
    let sx = steerX(), up = holding() || (stick.active && stick.y < -0.35);
    if (!sx && mouse) sx = clamp((mouse.x - r.x) / 60, -1, 1);
    if (mouse) up = true;
    r.flame = r.fuel > 0 && up ? 1 : 0;
    r.side = r.fuel > 0 && Math.abs(sx) > 0.2 ? Math.sign(sx) : 0;
    r.vy += (G - r.flame * THRUST) * dt;
    r.vx += r.side * SIDE * dt;
    r.fuel = Math.max(0, r.fuel - (r.flame * 7.5 + Math.abs(r.side) * 2.5) * dt);
    r.x += r.vx * dt; r.y += r.vy * dt;
    if (r.x < 20) { r.x = 20; r.vx = Math.abs(r.vx) * 0.3; }
    if (r.x > W - 20) { r.x = W - 20; r.vx = -Math.abs(r.vx) * 0.3; }
    if (r.y < 30) { r.y = 30; r.vy = Math.max(0, r.vy); }
    const feet = r.y + 18 * 1.3, gl = groundAt(r.x - 20), gr = groundAt(r.x + 20);
    if (feet >= Math.min(gl, gr) || feet >= groundAt(r.x)) {
      const onPad = r.x - 16 >= r.pad.x1 && r.x + 16 <= r.pad.x2;
      if (onPad && r.vy < SAFE_VY && Math.abs(r.vx) < SAFE_VX) {
        r.y = r.pad.y - 18 * 1.3; r.state = 'landed'; r.win = true; r.flame = 0;
        r.soft = r.vy < SAFE_VY / 2;
        r.end = 'The Eagle has landed! 🇺🇸 You landed on the Moon!';
        sfx.win(); showBanner('THE EAGLE HAS LANDED!', 'One small step…', 2.4);
        puff(r.x, r.pad.y, 20, ['#ccc', '#aaa'], 80);
      } else {
        r.tries--; r.state = 'boom'; r.boomT = 1.8; sfx.boom();
        puff(r.x, r.y, 40, ['#ffb347', '#ff5a4a', '#ddd', '#888'], 220, 60);
        pop(r.x, r.y - 50, !onPad ? 'Missed the pad!' : 'Too fast!', '#ff8a7a', 22);
      }
    }
    setWind(0);
  };
  r.draw = () => {
    sky('#02030c', '#0b1030');
    spaceStars(120, 5, W, VH, r.t);
    ctx.save(); ctx.translate(0, -OFFY); drawEarth(W * 0.78, (W < 700 ? 200 : 90) + OFFY * 0.3, 34, r.t); ctx.restore();
    ctx.fillStyle = '#9a9aa2';
    ctx.beginPath(); ctx.moveTo(0, H + OFFY);
    for (const p of r.pts) ctx.lineTo(p.x, p.y);
    ctx.lineTo(W, H + OFFY); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    for (let i = 0; i < 10; i++) { const cx = rnd(i, 3) * W; ctx.beginPath(); ctx.ellipse(cx, groundAt(cx) + 30 + rnd(i, 4) * 60, 18 + rnd(i, 5) * 20, 5, 0, 0, TAU); ctx.fill(); }
    const glow = 0.6 + 0.4 * Math.sin(r.t * 4);
    ctx.fillStyle = `rgba(80,255,160,${glow})`; ctx.fillRect(r.pad.x1, r.pad.y - 3, r.pad.x2 - r.pad.x1, 5);
    ctx.fillStyle = '#ffd84a'; ctx.fillRect(r.pad.x1, r.pad.y - 14, 3, 14); ctx.fillRect(r.pad.x2 - 3, r.pad.y - 14, 3, 14);
    if (r.state !== 'boom') drawLander(r.x, r.y, 1.3, r.flame, r.side, r.t);
    if (r.state === 'landed') {
      ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(r.x + 40, r.pad.y); ctx.lineTo(r.x + 40, r.pad.y - 40); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fillRect(r.x + 40, r.pad.y - 40, 22, 14);
      ctx.fillStyle = '#e8453a'; for (let k = 0; k < 3; k++) ctx.fillRect(r.x + 40, r.pad.y - 40 + k * 5, 22, 2);
      ctx.fillStyle = '#3d5ab8'; ctx.fillRect(r.x + 40, r.pad.y - 40, 9, 7);
    }
    drawFx();
    const okY = r.vy < SAFE_VY, okX = Math.abs(r.vx) < SAFE_VX;
    hud(r.score, null, [`🚀 Tries left: ${r.tries}`]);
    const [x, y] = gaugeAt(220);
    ctx.fillStyle = 'rgba(11,42,92,.65)'; rrect(x, y, 220, 76, 12); ctx.fill();
    txt(`⬇️ Fall speed ${Math.max(0, Math.round(r.vy))}`, x + 12, y + 16, 16, okY ? '#7dff9a' : '#ff8a7a', 'left');
    txt(`↔️ Side speed ${Math.round(Math.abs(r.vx))}`, x + 12, y + 38, 16, okX ? '#7dff9a' : '#ff8a7a', 'left');
    txt('⛽', x + 18, y + 60, 15, '#fff');
    ctx.fillStyle = 'rgba(255,255,255,.25)'; rrect(x + 34, y + 54, 174, 12, 6); ctx.fill();
    ctx.fillStyle = r.fuel > 25 ? '#6be06b' : '#ff5a4a'; rrect(x + 34, y + 54, Math.max(4, 174 * r.fuel / 100), 12, 6); ctx.fill();
  };
  r.results = () => {
    if (!r.win) return [['🚀 Brave try!', 100]];
    const rows = [['🌙 Landed on the Moon', 600], [`⛽ Fuel left ${Math.round(r.fuel)}%`, Math.round(r.fuel) * 4], [`🚀 Tries left × ${r.tries}`, r.tries * 150]];
    if (r.soft) rows.push(['🪶 Feather-soft landing', 200]);
    return rows;
  };
  return r;
}

const DW = 480, DH = 270;
function dLabel(s, x, y, size = 17, color = '#0b2a5c', align = 'center') { txt(s, x, y, size, color, align, 700); }
function dBubble(s, x, y, size = 16, bg = '#fff', fg = '#0b2a5c') {
  ctx.font = `700 ${size}px 'Fredoka', system-ui, sans-serif`;
  const w = ctx.measureText(s).width + 18;
  ctx.fillStyle = bg; rrect(x - w / 2, y - size * 0.85, w, size * 1.7, 10); ctx.fill();
  ctx.strokeStyle = '#0b2a5c'; ctx.lineWidth = 2; ctx.stroke();

}
function dSky(top = '#8fd0ff', bottom = '#e8f6ff') {
  const g = ctx.createLinearGradient(0, 0, 0, DH); g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, DW, DH);
}
function dGround(y, color = '#6cbf5a') { ctx.fillStyle = color; ctx.fillRect(0, y, DW, DH - y); }
function dSpace(t) { ctx.fillStyle = '#060a1e'; ctx.fillRect(0, 0, DW, DH); spaceStars(80, 2, DW, DH, t); }
// air "molecules": n dots bouncing inside a box, speed set by temperature
function molecules(seed, n, x, y, w, h, spd, color, t, r = 3) {
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const px = x + Math.abs(mod(rnd(i, seed) * 2 * w + t * spd * (0.6 + rnd(i, seed + 1)), 2 * w) - w);
    const py = y + Math.abs(mod(rnd(i, seed + 2) * 2 * h + t * spd * (0.6 + rnd(i, seed + 3)), 2 * h) - h);
    circle(px, py, r);
  }
}
function airfoil(cx, cy, len, ang) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(-len / 2, 0);
  ctx.bezierCurveTo(-len / 2, -len * 0.16, len * 0.05, -len * 0.2, len / 2, 0);
  ctx.bezierCurveTo(len * 0.05, -len * 0.04, -len / 2, len * 0.08, -len / 2, 0);
  ctx.fillStyle = '#e8453a'; ctx.fill(); ctx.strokeStyle = '#0b2a5c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

    ctx.fillStyle = '#d9d9d9'; circle(sx, sy, 6);

    if (Math.sin(a) < 0) drawEarth(130, 140, 70, t);   // Sputnik passes behind the Earth
    if (Math.sin(t * 6) > 0.3) dLabel('beep!', sx + 18, sy - 12, 13, '#9fffa8');
    const items = [['🛰️', '1957', 'Sputnik 1'], ['👨‍🚀', '1961', 'Yuri Gagarin'], ['👩‍🚀', '1963', 'Valentina Tereshkova']];
    items.forEach(([ic, yr, nm], i) => {
      const y = 50 + i * 72, on = Math.floor(t / 2) % 3 === i;
      ctx.fillStyle = on ? '#fff3b0' : 'rgba(255,255,255,.9)'; rrect(260, y - 28, 205, 56, 12); ctx.fill();
      txt(ic, 286, y, 26, '#000');
      dLabel(yr, 340, y - 10, 18, '#e8453a'); dLabel(nm, 380, y + 12, 14, '#0b2a5c');
    });
  },
  's-moon': t => {
    dSpace(t);
    drawEarth(390, 60, 30, t);
    ctx.fillStyle = '#a8a8b0'; ctx.beginPath(); ctx.moveTo(0, 270); ctx.lineTo(0, 200); for (let x = 0; x <= DW; x += 20) ctx.lineTo(x, 200 + Math.sin(x * 0.05) * 4); ctx.lineTo(DW, 270); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(rnd(i, 1) * DW, 225 + rnd(i, 2) * 35, 20, 4, 0, 0, TAU); ctx.fill(); }
    drawLander(150, 172, 1.6);
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(230, 204); ctx.lineTo(230, 150); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(230, 150, 32, 20); ctx.fillStyle = '#e8453a'; for (let k = 0; k < 4; k++) ctx.fillRect(230, 150 + k * 5, 32, 2.5);
    ctx.fillStyle = '#3d5ab8'; ctx.fillRect(230, 150, 13, 10);
    const hop = Math.abs(Math.sin(t * 1.6)) * 30, ax = 300 + mod(t * 18, 120);
    ctx.fillStyle = '#f4f6fb'; rrect(ax - 9, 172 - hop, 18, 26, 6); ctx.fill(); circle(ax, 166 - hop, 9);
    ctx.fillStyle = '#ffd84a'; circle(ax + 3, 166 - hop, 5);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; for (let i = 0; i < 5; i++) ctx.fillRect(300 + i * 24, 214, 8, 3);
    dBubble('Apollo 11 · July 20, 1969', 160, 30, 16, '#fff3b0');
    dBubble('Moon gravity: just 1/6 of Earth\'s', 300, 250, 13);
  },
  's-iss': t => {
    dSpace(t);
    drawEarth(240, 330, 220, t * 0.3);
    const a = -Math.PI / 2 + Math.sin(t * 0.3) * 0.5, x = 240 + Math.cos(a) * 250, y = 330 + Math.sin(a) * 250;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = '#d9d9d9'; ctx.fillRect(-60, -2, 120, 4);
    ctx.fillStyle = '#c9a63a'; for (const sx of [-58, -40, 28, 46]) ctx.fillRect(sx, -22, 14, 44);
    ctx.fillStyle = '#eee'; ctx.fillRect(-18, -7, 36, 14); ctx.fillRect(-6, -14, 12, 28);
    ctx.restore();
    dBubble('International Space Station', 240, 26, 16, '#fff3b0');
    dBubble('Around the Earth every 90 minutes!', 240, 196, 14);
  },
};

// ---------- Screens ----------
let mode = 'title', cur = 0, slide = 0, round = null, roundBest = 0, lastRows = [], quiz = [], qi = 0, qRight = 0, answered = false;
let diaCtx = null;
const card = $('card'), scr = $('screen');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function show(html) { scr.classList.remove('hidden'); card.innerHTML = html; scr.scrollTop = 0; diaCtx = null; }
function hideScreen() { scr.classList.add('hidden'); }
function on(id, fn) { const el = $(id); if (el) el.addEventListener('click', () => { RB.audio(); sfx.click(); fn(); }); }
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);

function titleScreen() {
  mode = 'title'; cur = Math.min(save.unlocked - 1, 6);
  show(`<h1>FLIGHT<br>SCHOOL</h1>
    <p style="font-size:21px">✈️ How do things fly? 🚀</p>
    <p>Travel through the whole story of flight, from the first hot air balloon all the way to the Moon!
    Each level: <b>learn</b> 📖, <b>fly</b> 🕹️, then ace the <b>quiz</b> 🧠.</p>
    <p style="font-size:30px;letter-spacing:6px">${LEVELS.map(l => l.icon).join(' ')}</p>
    ${totalScore() ? `<p>🏆 Your total score: <b>${totalScore()}</b></p>` : ''}
    <button class="btn" id="go">${totalScore() ? '▶ Keep going' : '▶ Start flying!'}</button>`);
  on('go', mapScreen);
}

function mapScreen() {
  mode = 'map'; hideAct();
  const next = LEVELS.findIndex((_, i) => !(save.stars[i] > 0));
  const tiles = LEVELS.map((l, i) => {
    const locked = i >= save.unlocked, st = save.stars[i] || 0;
    return `<button class="lvl${locked ? ' locked' : ''}${i === next && !locked ? ' next' : ''}" data-i="${i}" ${locked ? 'disabled' : ''}>
      <span class="ic">${locked ? '🔒' : l.icon}</span><b>${i + 1}. ${esc(l.name)}</b><small>${l.year}</small>
      <span class="st">${starStr(st)}</span>${save.best[i] ? `<small>Best ${save.best[i]}</small>` : ''}</button>`;
  }).join('');
  show(`<h2>🗺️ The Story of Flight</h2>
    <p style="margin:0">🏆 Total score: <b>${totalScore()}</b> · ${save.stars.filter(s => s > 0).length} of 7 levels done</p>
    <div class="levels">${tiles}</div>
    ${allDone() ? '<button class="btn" id="cert">🎓 My Flight Expert certificate</button>' : ''}
    ${next >= 0 ? `<button class="btn" id="next">▶ Level ${next + 1}: ${esc(LEVELS[next].name)}</button>` : ''}`);
  card.querySelectorAll('.lvl').forEach(b => b.addEventListener('click', () => { if (b.disabled) return; RB.audio(); sfx.click(); startLesson(+b.dataset.i); }));
  on('next', () => startLesson(next));
  on('cert', certScreen);
}

function startLesson(i) { cur = i; slide = 0; lessonScreen(); }
function lessonScreen() {
  mode = 'lesson';
  const L = LEVELS[cur], S = L.slides[slide], lastSlide = slide === L.slides.length - 1;
  show(`<span class="chip">Level ${cur + 1} · ${L.icon} ${esc(L.name)} · ${L.year}</span>
    <h2>${esc(S.t)}</h2>
    <canvas id="dia"></canvas>
    <p>${esc(S.p)}</p>
    <div class="dots">${L.slides.map((_, k) => k === slide ? '<b>●</b>' : '●').join('')}</div>
    <button class="btn alt" id="back">◀ ${slide ? 'Back' : 'Map'}</button>
    <button class="btn" id="fwd">${lastSlide ? 'Let\'s fly! ✈️' : 'Next ▶'}</button>`);
  const c = $('dia'), dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = DW * dpr; c.height = DH * dpr;
  diaCtx = c.getContext('2d'); diaCtx.scale(dpr, dpr);
  diaT = 0;
  on('back', () => { if (slide) { slide--; lessonScreen(); } else mapScreen(); });
  on('fwd', () => { if (lastSlide) readyScreen(); else { slide++; lessonScreen(); } });
}
let diaT = 0;
function drawDiagram(dt) {
  if (!diaCtx || !diaCtx.canvas.isConnected) return;
  diaT += dt;
  const key = LEVELS[cur].slides[slide].d;
  ctx = diaCtx;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, DW, DH); ctx.clip();
  try { DIAGRAMS[key](diaT); } finally { ctx.restore(); ctx = gameCtx; }
}

function readyScreen() {
  mode = 'ready';
  const L = LEVELS[cur], h = L.how;
  show(`<span class="chip">Level ${cur + 1} · Flight test</span>
    <h2>${L.icon} Time to fly!</h2>
    <ul class="how">
      <li><span class="e">🎯</span><span>${h.goal}</span></li>
      <li><span class="e">🕹️</span><span><span class="key-only">${h.keys}</span><span class="touch-only">${h.touch}</span></span></li>
      <li><span class="e">💡</span><span>${h.tip}</span></li>
    </ul>
    <button class="btn alt" id="back">◀ Lesson</button>
    <button class="btn" id="go">Start round ▶</button>`);
  on('back', () => { slide = L.slides.length - 1; lessonScreen(); });
  on('go', () => startRound(true));
}

function hideAct() { act.classList.add('hidden'); actUp(); }
function startRound(fresh) {
  if (fresh) roundBest = 0;
  clearInput(); pops = []; parts = []; banner = null;
  round = ROUNDS[cur]();
  mode = 'play'; paused = false;
  hideScreen();
  const B = LEVELS[cur].button;
  if (B && (RB.touch || cur === 5 || cur === 6)) { $('actIco').textContent = B.ico; $('actLbl').textContent = B.lbl; act.classList.remove('hidden'); }
  else hideAct();
  if (!wind) wind = RB.ambient(500);
  showBanner(`LEVEL ${cur + 1}`, LEVELS[cur].name, 1.8);
  last = performance.now();
}
function endRound() {
  mode = 'roundEnd'; hideAct(); setWind(0); clearInput();
  const rows = round.results(), total = rows.reduce((a, r) => a + r[1], 0);
  roundBest = Math.max(roundBest, total);
  lastRows = rows;
  if (round.win) sfx.win();
  show(`<span class="chip">Level ${cur + 1} · Flight test</span>
    <h2>${round.win ? '🎉 ' : ''}${esc(round.end || 'Round over!')}</h2>
    <div class="rows">${rows.map(([k, v]) => `<div><span>${esc(k)}</span><b>${v}</b></div>`).join('')}
      <div class="tot"><span>Round score</span><span>${total}</span></div></div>
    ${roundBest > total ? `<p>Your best try this time: <b>${roundBest}</b> (that's the one that counts!)</p>` : ''}
    <button class="btn alt" id="again">↺ Fly again</button>
    <button class="btn" id="quiz">Quiz time! 🧠</button>`);
  on('again', () => startRound(false));
  on('quiz', startQuiz);
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startQuiz() {
  quiz = shuffle(LEVELS[cur].quiz).slice(0, QUIZ_LEN).map(q => ({ ...q, opts: shuffle(q.a.map((s, k) => ({ s, right: k === 0 }))) }));
  qi = 0; qRight = 0; quizScreen();
}
function quizScreen() {
  mode = 'quiz'; answered = false;
  const q = quiz[qi];
  show(`<span class="chip">🧠 Quiz · Question ${qi + 1} of ${quiz.length}</span>
    <h2>${esc(q.q)}</h2>
    <div class="answers">${q.opts.map((o, k) => `<button class="ans" data-k="${k}">${'ABC'[k]}. ${esc(o.s)}</button>`).join('')}</div>
    <div id="fb"></div>`);
  card.querySelectorAll('.ans').forEach(b => b.addEventListener('click', () => answer(+b.dataset.k)));
}
function answer(k) {
  if (answered) return;
  answered = true; RB.audio();
  const q = quiz[qi], right = q.opts[k].right;
  if (right) { qRight++; sfx.right(); } else sfx.wrong();
  card.querySelectorAll('.ans').forEach((b, j) => {
    b.disabled = true;
    if (q.opts[j].right) b.classList.add('right');
    else if (j === k) b.classList.add('wrong');
  });
  const lastQ = qi === quiz.length - 1;
  $('fb').innerHTML = `<div class="why"><b>${right ? '✅ Right! +100' : '❌ Not quite.'}</b> ${esc(q.why)}</div>
    <button class="btn" id="nextQ">${lastQ ? 'See my score ▶' : 'Next question ▶'}</button>`;
  on('nextQ', () => { if (lastQ) levelEnd(); else { qi++; quizScreen(); } });
  $('nextQ').scrollIntoView({ block: 'nearest' });
}

function levelEnd() {
  mode = 'levelEnd';
  const quizPts = qRight * PER_RIGHT, total = roundBest + quizPts;
  const stars = 1 + (qRight >= 3 ? 1 : 0) + (qRight === quiz.length && roundBest >= 600 ? 1 : 0);
  const newBest = total > (save.best[cur] || 0);
  save.best[cur] = Math.max(save.best[cur] || 0, total);
  save.stars[cur] = Math.max(save.stars[cur] || 0, stars);
  save.unlocked = Math.max(save.unlocked, Math.min(7, cur + 2));
  persist();
  sfx.win();
  const L = LEVELS[cur], finished = cur === 6;
  show(`<span class="chip">Level ${cur + 1} complete!</span>
    <h2>${L.icon} You earned the <b>${esc(L.badge)}</b> badge!</h2>
    <div class="stars">${starStr(stars)}</div>
    <div class="rows"><div><span>🕹️ Flight test</span><b>${roundBest}</b></div>
      <div><span>🧠 Quiz: ${qRight} of ${quiz.length} right</span><b>${quizPts}</b></div>
      <div class="tot"><span>Level score</span><span>${total}</span></div></div>
    ${newBest ? '<p>🎉 New best for this level!</p>' : ''}
    <p>🏆 Total score: <b>${totalScore()}</b></p>
    ${stars < 3 ? '<p style="font-size:16px;color:#5a6f99">Get every quiz question right and a great flight score for ★★★</p>' : ''}
    <button class="btn alt" id="map">🗺️ Map</button>
    ${finished ? '<button class="btn" id="cert">🎓 Get my certificate!</button>' : `<button class="btn" id="next">Next: ${LEVELS[cur + 1].icon} ${esc(LEVELS[cur + 1].name)} ▶</button>`}`);
  on('map', mapScreen);
  on('next', () => startLesson(cur + 1));
  on('cert', certScreen);
}

function certScreen() {
  mode = 'cert'; hideAct();
  const done = allDone(), when = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  show(`<div class="cert">
      <div style="font-size:40px">🎓</div>
      <h1 style="font-size:26px">Certified<br>Flight Expert</h1>
      <p>This certifies that</p>
      <div class="nm" id="nm">${esc(save.name || 'Super Pilot')}</div>
      <p>${done ? 'flew through the whole story of flight, from hot air balloons to the Moon!' : 'is on the way to becoming a flight expert!'}</p>
      <div class="badges">${LEVELS.map((l, i) => save.stars[i] ? l.icon : '⬜').join('')}</div>
      <p>⭐ ${save.stars.reduce((a, b) => a + (b || 0), 0)} of 21 stars · 🏆 ${totalScore()} points</p>
      <p style="font-size:15px;color:#7a6a3a">${when} · RoboBandit Flight School</p>
    </div>
    <p><input type="text" id="name" maxlength="24" placeholder="Type your name" value="${esc(save.name)}"></p>
    <button class="btn alt" id="map">🗺️ Map</button>
    <button class="btn" id="share">🔗 Share</button>`);
  const inp = $('name');
  inp.addEventListener('input', () => { save.name = inp.value.slice(0, 24); $('nm').textContent = save.name || 'Super Pilot'; persist(); });
  on('map', mapScreen);
  on('share', () => RB.share({ title: 'Flight School | RoboBandit', text: `I'm a Certified Flight Expert with ${totalScore()} points! Can you beat me? ✈️🚀` }));
}

// ---------- Main loop ----------
let last = performance.now(), idleT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
function update(dt) {
  if (mode === 'play' && !paused) {
    round.update(dt);
    stepFx(dt);
    if (round.over && !round.endT) round.endT = 0.001;
    if (round.endT) { round.endT += dt; if (round.endT > 1.4) endRound(); }
  } else if (mode !== 'play') idleT += dt;
}
function draw(dt) {
  ctx = gameCtx;
  ctx.setTransform(scale, 0, 0, scale, 0, OFFY * scale);
  if (mode === 'play' && round) {
    round.draw();
    drawBanner(paused ? 0 : dt);
  } else {
    // behind the menus: the current level's flying machine drifting through the sky
    const L = cur;
    const top = ['#69b7ff', '#4aa6ff', '#7fc4ff', '#5aa8ff', '#2f7fe0', '#1a2a6a', '#02030c'][L], bot = ['#fff1d6', '#d8f0ff', '#fff4dc', '#cfeaff', '#bfe3ff', '#5a6fb0', '#0b1030'][L];
    sky(top, bot);
    if (L >= 5) spaceStars(80, 7, W, VH, idleT);
    for (let i = 0; i < 6; i++) cloud(mod(rnd(i, 1) * 1800 - idleT * 30, 1800) - 150, -OFFY + 60 + rnd(i, 2) * (VH - 120), 0.6 + rnd(i, 3) * 0.6, `rgba(255,255,255,${L >= 5 ? 0.15 : 0.8})`);
    const x = mod(idleT * 60, W + 300) - 150, y = H * 0.5 + Math.sin(idleT) * 30;
    [() => drawBalloon(x, y - 40, 40, 0.5, '#3d6fe0', '#ffd84a', idleT), () => drawGlider(x, y, 2, 0.05), () => drawFlyer(x, y, 2, 0.05, idleT),
      () => drawProp(x, y, 2, 0.05, idleT), () => drawJet(x, y, 2, 0.05, 1, idleT), () => drawRocket(W * 0.5, mod(-idleT * 90, VH + 200) + 100 - OFFY, 2, 3, 1, idleT),
      () => drawLander(x, y, 2, 0.5, 0, idleT)][L]();
    if (mode === 'lesson') drawDiagram(dt);
  }
}
titleScreen();
requestAnimationFrame(frame);
</script>
