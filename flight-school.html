<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #3d8ff0;
    font-family: 'Fredoka', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
    overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .touch-only { display: none; }
  @media (pointer: coarse) { .touch-only { display: inline; } .key-only { display: none; } }
  .hidden { display: none !important; }

  #actBtn { position: fixed; z-index: 3; right: max(18px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom));
    min-width: 104px; height: 104px; padding: 0 12px; border-radius: 52px; border: 4px solid #fff; cursor: pointer;
    font: 700 17px 'Fredoka', system-ui, sans-serif; color: #fff; background: linear-gradient(#ff9a3d, #e8453a);
    box-shadow: 0 6px 0 #a8281f; line-height: 1.1; touch-action: none; }
  #actBtn.on, #actBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a8281f; }
  #actBtn .ico { display: block; font-size: 30px; }

  .screen { position: fixed; inset: 0; z-index: 5; display: flex; overflow-y: auto; padding: 14px;
    padding-top: max(64px, calc(env(safe-area-inset-top) + 58px)); box-sizing: border-box;
    background: rgba(10,30,70,.35); touch-action: pan-y; }
  .card { margin: auto; width: 100%; max-width: 680px; box-sizing: border-box; text-align: center; color: #0b2a5c;
    background: #fffdf4; border: 4px solid #0b2a5c; border-radius: 22px; box-shadow: 0 8px 0 #0b2a5c; padding: 18px 20px 20px; }
  .card h1 { margin: 0; font: 38px/1.05 'Bungee', system-ui, sans-serif; letter-spacing: 1px; color: #e8453a;
    text-shadow: 0 3px 0 #ffd84a; }
  .card h2 { margin: 4px 0 8px; font-size: 26px; font-weight: 700; line-height: 1.15; }
  .card p { margin: 8px 0; font-size: 19px; line-height: 1.4; }
  .chip { display: inline-block; padding: 3px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; color: #fff; background: #3d8ff0; }
  .btn { display: inline-block; margin: 8px 5px 0; padding: 12px 22px; border: 3px solid #0b2a5c; border-radius: 14px; cursor: pointer;
    font: 700 20px 'Fredoka', system-ui, sans-serif; color: #0b2a5c; background: #ffd84a; box-shadow: 0 5px 0 #0b2a5c; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0b2a5c; }
  .btn.alt { background: #fff; font-size: 17px; }
  .btn:disabled { opacity: .45; cursor: default; }
  #dia { display: block; position: static; margin: 6px auto; width: min(100%, calc(40vh * 16 / 9)); aspect-ratio: 16 / 9;
    border-radius: 14px; border: 3px solid #0b2a5c; background: #cfe9ff; }
  .dots { margin: 6px 0 2px; font-size: 14px; letter-spacing: 4px; color: #9fb3d6; }
  .dots b { color: #e8453a; }
  .levels { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin: 12px 0 6px; }
  .lvl { position: relative; padding: 10px 8px; border: 3px solid #0b2a5c; border-radius: 16px; cursor: pointer; background: #fff;
    font: inherit; color: inherit; box-shadow: 0 4px 0 #0b2a5c; }
  .lvl .ic { font-size: 36px; display: block; }
  .lvl b { display: block; font-size: 17px; }
  .lvl small { display: block; font-size: 14px; color: #5a6f99; }
  .lvl .st { display: block; color: #f2a900; font-size: 16px; letter-spacing: 1px; }
  .lvl.next { background: #fff3b0; animation: glow 1.2s ease-in-out infinite alternate; }
  .lvl.locked { cursor: default; opacity: .5; box-shadow: none; }
  @keyframes glow { to { box-shadow: 0 4px 0 #0b2a5c, 0 0 18px #ffd84a; } }
  .how { text-align: left; margin: 10px auto; max-width: 520px; padding: 0; list-style: none; font-size: 18px; }
  .how li { margin: 8px 0; display: flex; gap: 10px; align-items: flex-start; }
  .how .e { font-size: 24px; line-height: 1; }
  .answers { display: grid; gap: 10px; margin: 12px 0; }
  .ans { padding: 12px 14px; border: 3px solid #0b2a5c; border-radius: 14px; cursor: pointer; text-align: left;
    font: 600 19px 'Fredoka', system-ui, sans-serif; color: #0b2a5c; background: #fff; box-shadow: 0 4px 0 #0b2a5c; }
  .ans.right { background: #b8f0b0; }
  .ans.wrong { background: #ffc4bd; }
  .ans:disabled { cursor: default; }
  .why { padding: 10px 14px; border-radius: 14px; background: #e8f3ff; font-size: 18px; line-height: 1.4; text-align: left; }
  .rows { margin: 10px auto; max-width: 420px; font-size: 18px; }
  .rows div { display: flex; justify-content: space-between; padding: 4px 2px; border-bottom: 2px dashed #d5def0; }
  .rows .tot { font-weight: 700; font-size: 22px; border: 0; }
  .big { font: 44px 'Bungee', system-ui, sans-serif; color: #e8453a; margin: 6px 0; }
  .stars { font-size: 38px; color: #f2a900; letter-spacing: 4px; }
  .cert { border: 6px double #c9971e; border-radius: 16px; padding: 14px; background: linear-gradient(#fffaf0, #fff1cf); }
  .cert .nm { font: 700 30px 'Fredoka', system-ui, sans-serif; color: #0b2a5c; border-bottom: 2px solid #c9971e; display: inline-block; min-width: 60%; padding: 0 10px; }
  .badges { font-size: 30px; letter-spacing: 6px; }
  input[type=text] { font: 600 20px 'Fredoka', system-ui, sans-serif; padding: 8px 12px; border: 3px solid #0b2a5c; border-radius: 12px; width: 220px; max-width: 70%; }
  @media (max-height: 500px) {
    .card h1 { font-size: 30px; } .card h2 { font-size: 21px; } .card p { font-size: 17px; }
    #dia { width: min(100%, calc(46vh * 16 / 9)); }
  }

  .card.wide { max-width: 860px; }
  .chip { border: 0; font-family: inherit; vertical-align: middle; }
  .chip.alt, .modechip { cursor: pointer; background: #fff; color: #0b2a5c; border: 2px solid #0b2a5c; margin: 8px 4px 0; padding: 5px 12px; font-size: 15px; }
  .chipimg { width: 28px; height: 21px; border-radius: 5px; vertical-align: middle; margin-right: 4px; }
  .lvl img.ico { display: block; width: 72px; height: 54px; margin: 0 auto 4px; border-radius: 10px; border: 2px solid #0b2a5c; }
  .strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 6px 0; }
  img.mini, span.mini { width: 40px; height: 30px; border-radius: 6px; border: 2px solid #0b2a5c; display: inline-block; vertical-align: middle; }
  span.mini.blank { background: #eee; border-style: dashed; }
  .big-p { font-size: 24px !important; font-weight: 600; }
  .modes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: 10px 0; }
  .mode { padding: 12px 10px; border: 3px solid #0b2a5c; border-radius: 16px; background: #fff; cursor: pointer; font: inherit; color: inherit; box-shadow: 0 4px 0 #0b2a5c; }
  .mode .ic { font-size: 34px; display: block; }
  .mode b { display: block; font-size: 19px; }
  .mode small { display: block; font-size: 14px; color: #5a6f99; }
  .mode.sel { background: #fff3b0; outline: 4px solid #ffd84a; }
  .tog { display: block; text-align: left; max-width: 460px; margin: 8px auto; font-size: 18px; cursor: pointer; }
  .tog input { width: 22px; height: 22px; vertical-align: middle; margin-right: 6px; }
  .sl { display: flex; align-items: center; gap: 10px; justify-content: center; font-weight: 700; font-size: 17px; margin: 4px auto; max-width: 520px; }
  .sl input { flex: 1; height: 34px; accent-color: #e8453a; touch-action: none; }
  .fcards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); margin: 10px 0; }
  .fcard { position: relative; padding: 8px; border: 3px solid #c9971e; border-radius: 14px; background: linear-gradient(#fffaf0, #fff1cf); font: inherit; color: #0b2a5c; cursor: pointer; min-height: 150px; }
  .fcard .face { height: 66px; display: grid; place-items: center; font-size: 44px; }
  .fcard .face img { width: 80px; height: 60px; border-radius: 8px; }
  .fcard b { display: block; font-size: 15px; line-height: 1.15; }
  .fcard small { display: block; color: #8a6a2a; }
  .fcard p { display: none; margin: 4px 0 0; font-size: 14px; line-height: 1.3; }
  .fcard.flip .face, .fcard.flip small { display: none; }
  .fcard.flip p { display: block; }
  .fcard.locked { border-style: dashed; border-color: #b8c2d8; background: #f2f4f8; cursor: default; color: #8a96b0; }
  .tl { text-align: left; max-width: 520px; margin: 8px auto; font-size: 17px; }
  .tl li { margin: 4px 0; }
  .ans.wrong { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .lvl.next, .ans.wrong { animation: none; } }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; }
    #game, #topbar, #actBtn, .noprint, .touch-stick { display: none !important; }
    .screen { position: static; background: none; padding: 0; overflow: visible; }
    .card { box-shadow: none; border: 0; max-width: none; }
  }
</style>
