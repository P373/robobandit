<script>
'use strict';
// ===================== ABC Train =====================
// A toy train runs round a looping track through a little 3D toy town. At each stop an animal waits
// with a letter: "B! B is for Bear!" It hops into a wagon, and full trains drop their animals at the
// Animal Park. Made for little ones: big buttons, the train stops itself, and everything is read aloud.

// ---------- The animals, A to Z ----------
// shape: how the body is built. ears / tail / extra: the bits that make each one look like itself.
const ANIMALS = [
  { L: 'A', name: 'Alligator', c: '#4caf50', shape: 'lizard', extra: ['ridges', 'snout'] },
  { L: 'B', name: 'Bear', c: '#9a6232', belly: '#d8a878', ears: 'round', tail: 'short' },
  { L: 'C', name: 'Cat', c: '#ff9d3c', belly: '#ffe0b8', ears: 'pointy', tail: 'long', extra: ['whiskers'] },
  { L: 'D', name: 'Dog', c: '#d8a868', belly: '#fff0d8', ears: 'floppy', tail: 'short', extra: ['nose'] },
  { L: 'E', name: 'Elephant', c: '#9aa4b8', ears: 'big', tail: 'short', extra: ['trunk'] },
  { L: 'F', name: 'Frog', c: '#6ad04a', belly: '#d8f8a8', shape: 'frog' },
  { L: 'G', name: 'Giraffe', c: '#ffd04a', pattern: 'spots', pc: '#b8742a', ears: 'small', tail: 'long', extra: ['longNeck', 'horns'] },
  { L: 'H', name: 'Hippo', c: '#a08ac0', belly: '#d8c8e8', ears: 'small', tail: 'short', extra: ['wideSnout'] },
  { L: 'I', name: 'Iguana', c: '#7ad84a', shape: 'lizard', extra: ['spikes'] },
  { L: 'J', name: 'Jaguar', c: '#ffc04a', pattern: 'spots', pc: '#5a3a1a', ears: 'round', tail: 'long' },
  { L: 'K', name: 'Kangaroo', c: '#c8844a', belly: '#f0c898', shape: 'upright', ears: 'long', tail: 'thick' },
  { L: 'L', name: 'Lion', c: '#ffb43a', ears: 'round', tail: 'long', extra: ['mane'] },
  { L: 'M', name: 'Monkey', c: '#8a5a3a', belly: '#f0c8a0', shape: 'upright', ears: 'side', tail: 'curl' },
  { L: 'N', name: 'Newt', c: '#ff7a3a', shape: 'lizard', extra: ['dots'] },
  { L: 'O', name: 'Owl', c: '#9a7048', belly: '#e8d0a8', shape: 'bird', extra: ['tufts', 'bigEyes'] },
  { L: 'P', name: 'Pig', c: '#ffa8c0', ears: 'pointy', tail: 'curl', extra: ['pigSnout'] },
  { L: 'Q', name: 'Quail', c: '#a8784a', belly: '#e8c8a0', shape: 'bird', extra: ['plume'] },
  { L: 'R', name: 'Rabbit', c: '#f2eee8', belly: '#ffffff', ears: 'long', tail: 'puff' },
  { L: 'S', name: 'Sheep', c: '#ffffff', ears: 'floppy', tail: 'puff', extra: ['wool', 'darkFace'] },
  { L: 'T', name: 'Tiger', c: '#ff8a2a', pattern: 'stripes', pc: '#2a1a10', belly: '#fff0d8', ears: 'round', tail: 'long' },
  { L: 'U', name: 'Unicorn', c: '#ffffff', ears: 'pointy', tail: 'rainbow', extra: ['horn', 'rainbowMane', 'longLegs'] },
  { L: 'V', name: 'Vulture', c: '#5a4a5a', belly: '#ffb8c8', shape: 'bird', extra: ['bald'] },
  { L: 'W', name: 'Walrus', c: '#a8785a', shape: 'walrus' },
  { L: 'X', name: 'X-ray fish', c: '#c8e8ff', shape: 'fish', say: 'X-ray fish' },
  { L: 'Y', name: 'Yak', c: '#7a5a3a', ears: 'small', tail: 'long', extra: ['shaggy', 'bigHorns'] },
  { L: 'Z', name: 'Zebra', c: '#ffffff', pattern: 'stripes', pc: '#1a1a1a', ears: 'pointy', tail: 'long', extra: ['stripeMane', 'longLegs'] },
];
const LETTER_COLORS = ['#e8453a', '#ff9d1c', '#f2c200', '#3cc456', '#1fb0c8', '#5a7aff', '#a05aff', '#ff5aa8'];
const colorOf = i => LETTER_COLORS[i % LETTER_COLORS.length];

// ---------- Three.js ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#cdeeff');
scene.fog = new THREE.Fog('#d4f0ff', 170, 620);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1400);
const baseFov = () => camera.aspect < 0.8 ? 66 : 50;
function resize() {
  // sharp, but not more pixels than a tablet can paint smoothly
  let dpr = Math.min(devicePixelRatio || 1, 2);
  if (innerWidth * innerHeight * dpr * dpr > 2.1e6) dpr = Math.max(1, Math.sqrt(2.1e6 / (innerWidth * innerHeight)));
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = baseFov();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
scene.add(new THREE.HemisphereLight('#ffffff', '#7ac86a', 0.8));
const sun = new THREE.DirectionalLight('#fff6e0', 0.85);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 160 });
scene.add(sun, sun.target);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0, ...o });
const MATS = {};
const M = c => MATS[c] || (MATS[c] = mat(c));
function mesh(geo, color, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, typeof color === 'string' ? M(color) : color);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
const SPH = new THREE.SphereGeometry(1, 20, 14), CYL = new THREE.CylinderGeometry(1, 1, 1, 16), BOX = new THREE.BoxGeometry(1, 1, 1), CONE = new THREE.ConeGeometry(1, 1, 16);
// a ball, stretched into an egg or a sausage
const ball = (parent, color, x, y, z, sx, sy = sx, sz = sx) => { const m = mesh(SPH, color, x, y, z, parent); m.scale.set(sx, sy, sz); return m; };
const rod = (parent, color, x, y, z, r, h, rx = 0, rz = 0) => { const m = mesh(CYL, color, x, y, z, parent); m.scale.set(r, h, r); m.rotation.set(rx, 0, rz); return m; };
const block = (parent, color, x, y, z, w, h, d) => { const m = mesh(BOX, color, x, y, z, parent); m.scale.set(w, h, d); return m; };
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function patternMat(base, kind, pc) {
  const tex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h); g.fillStyle = pc;
    if (kind === 'stripes') for (let i = 0; i < 8; i++) { g.beginPath(); g.moveTo(i * 16, 0); g.quadraticCurveTo(i * 16 + 10, 64, i * 16 - 2, 128); g.lineTo(i * 16 + 7, 128); g.quadraticCurveTo(i * 16 + 16, 64, i * 16 + 7, 0); g.fill(); }
    else for (let i = 0; i < 22; i++) { g.beginPath(); g.arc((i * 47) % 128, (i * 29) % 128, 6 + (i % 3) * 2, 0, Math.PI * 2); g.fill(); }
  });
  return mat('#ffffff', { map: tex });
}

// ---------- Building an animal ----------
// Every animal is about 1.2 m tall, standing at the origin and facing +x.
function makeAnimal(a) {
  const g = new THREE.Group(), body = new THREE.Group();
  g.add(body);
  const c = a.c, belly = a.belly || c, dark = '#23324a';
  const bodyMat = a.pattern ? patternMat(c, a.pattern, a.pc) : M(c);
  const eye = (x, y, z, r = 0.09) => { ball(body, '#ffffff', x, y, z, r * 1.3); ball(body, dark, x + r * 0.6, y, z, r * 0.75); ball(body, '#ffffff', x + r * 0.9, y + r * 0.35, z, r * 0.22); };
  const eyes = (x, y, w, r) => { eye(x, y, w, r); eye(x, y, -w, r); };
  const legs = (h, w = 0.12, spread = 0.28, along = 0.32) => { for (const sx of [-along, along]) for (const sz of [-spread, spread]) rod(body, c, sx, h / 2, sz, w, h); };
  const shape = a.shape || 'quad';
  if (shape === 'quad') {
    const legH = a.extra && a.extra.includes('longLegs') ? 0.55 : 0.36;
    legs(legH);
    const by = legH + 0.25;
    const b = ball(body, bodyMat, 0, by, 0, 0.55, 0.36, 0.38);
    ball(body, belly, 0.05, by - 0.12, 0, 0.42, 0.24, 0.3);
    let hx = 0.52, hy = by + 0.3;
    if (a.extra && a.extra.includes('longNeck')) { const n = rod(body, bodyMat, 0.42, by + 0.55, 0, 0.12, 0.9, 0, -0.35); void n; hx = 0.62; hy = by + 1.05; }
    if (a.extra && a.extra.includes('wool')) for (let i = 0; i < 9; i++) ball(body, '#ffffff', -0.35 + (i % 3) * 0.33, by + 0.12 + Math.floor(i / 3) * 0.06, -0.25 + Math.floor(i / 3) * 0.25, 0.25);
    if (a.extra && a.extra.includes('shaggy')) for (let i = 0; i < 8; i++) ball(body, '#5a3a22', -0.4 + i * 0.12, by - 0.28, (i % 2 ? 0.25 : -0.25), 0.14, 0.24, 0.14);
    const headC = a.extra && a.extra.includes('darkFace') ? '#3a3a44' : c;
    const head = ball(body, a.pattern ? bodyMat : headC, hx, hy, 0, 0.3, 0.28, 0.28);
    void head; void b;
    if (a.extra && a.extra.includes('mane')) for (let i = 0; i < 12; i++) { const an = i / 12 * Math.PI * 2; ball(body, '#c8641a', hx - 0.08, hy + Math.sin(an) * 0.3, Math.cos(an) * 0.3, 0.12); }
    if (a.extra && a.extra.includes('rainbowMane')) ['#ff5a5a', '#ffb23a', '#ffe14a', '#5ad06a', '#5ab0ff', '#b07aff'].forEach((cc, i) => ball(body, cc, hx - 0.18 - i * 0.06, hy + 0.2 - i * 0.08, 0, 0.09));
    if (a.extra && a.extra.includes('stripeMane')) for (let i = 0; i < 5; i++) block(body, i % 2 ? '#1a1a1a' : '#ffffff', hx - 0.16 - i * 0.07, hy + 0.2 - i * 0.07, 0, 0.07, 0.12, 0.05);
    // snouts and noses
    if (a.extra && a.extra.includes('trunk')) { rod(body, c, hx + 0.28, hy - 0.18, 0, 0.07, 0.42, 0, 0.5); }
    else if (a.extra && a.extra.includes('pigSnout')) { rod(body, '#ff8aa8', hx + 0.3, hy - 0.04, 0, 0.11, 0.1, 0, Math.PI / 2); ball(body, '#c84a6a', hx + 0.36, hy - 0.02, 0.04, 0.025); ball(body, '#c84a6a', hx + 0.36, hy - 0.02, -0.04, 0.025); }

// ---------- Update ----------
const CRUISE = 9, ACC = 2.6, BRAKE = 6;
function update(dt) {
  clock += dt;
  hold = Math.max(0, hold - dt);
  for (let i = laters.length - 1; i >= 0; i--) if (clock >= laters[i].at) laters.splice(i, 1)[0].fn();
  updateWorld(dt);
  if (state === 'farm') { updateWalker(dt); updateSmoke(dt); updateCamera(dt); return; }
  if (hold <= 0 && $('go').classList.contains('stop') !== train.running) updateGo();

  let want = train.running ? CRUISE : 0;
  const g = train.running ? goal() : null, dG = g ? distAhead(g) : Infinity;
  if (dG < 40) want = Math.min(want, Math.sqrt(2 * BRAKE * 0.6 * Math.max(0, dG - 0.05)) + 0.3);
  // an animal on the track: slow down and wait a safe way back (toot and it hurries off)
  const blk = blocker();
  if (blk) want = Math.min(want, Math.sqrt(2 * BRAKE * 0.6 * Math.max(0, blk.d - 10)));
  const wasMoving = train.v > 0.05;
  if (train.v < want) train.v = Math.min(want, train.v + ACC * dt);
  else train.v = Math.max(want, train.v - BRAKE * dt);
  let step = train.v * dt;
  const arrived = step >= dG - 0.01;
  if (arrived) step = dG;
  moveTrain(step);
  if (arrived) {
    train.running = false; train.v = 0; glide = null; updateGo();
    if (g === park) unloadAtPark(); else arrive(g);
  } else if (mode === 'find' && wasMoving && train.v <= 0.05 && !train.running && state === 'play') {
    // stopped by hand next to a station: in Find the letter, that's your answer
    const st = stations.find(x => x.p.distanceTo(engine.position) < 6);
    if (st) arrive(st);
  }
  // a fork coming up: show the arrows (and ask, the first few times)
  const fa = forkAhead();
  if (fa && train.running && !fa.told && forkTalk < 3 && hold <= 0) { fa.told = true; forkTalk++; say(LINE.whichWay); }
  for (const f of FORKS) if (f !== fa) f.told = false;
  drawFork();
  // stopped at the farm: you can get off and visit the animals
  const atFarm = state === 'play' && !train.running && train.v < 0.05 && hold <= 0 && farm.station.p.distanceTo(engine.position) < 7;
  $('walk').classList.toggle('hidden', !atFarm);
  if (atFarm && !farm.told) { farm.told = true; say(LINE.farmHere); }
  if (!atFarm && farm.station.p.distanceTo(engine.position) > 20) farm.told = false;
  // chuff-chuff, faster as the train speeds up
  if (train.v > 0.3 && clock - lastChuff > 2.2 / (train.v + 1.5)) { lastChuff = clock; sfx.chuff(train.v); puff(); }
  if (!train.running && train.v < 0.05 && state === 'play' && hold <= 0 && !atFarm) { idleT += dt; if (idleT > 12) { idleT = 0; say(LINE.pressGo); } } else idleT = 0;

  for (const w of engine.userData.wheels) w.rotation.x += spin;
  for (const wg of train.wagons) for (const w of wg.userData.wheels) w.rotation.x += spin * 0.55 / 0.48;
  // little animations
  for (const j of jobs) {
    if (j.delay > 0) { j.delay -= dt; continue; }
    j.t += dt;
    const k = Math.min(1, j.t / j.d);
    if (j.kind === 'jump') j.obj.position.y = j.y0 + Math.sin(k * Math.PI) * 0.9;
    else if (j.kind === 'board') { const to = new THREE.Vector3(); j.wagon.localToWorld(to.set(0, SEAT_Y, 0)); j.obj.position.lerpVectors(j.from, to, k); j.obj.position.y += Math.sin(k * Math.PI) * 2.5; j.obj.scale.setScalar(1 - 0.15 * k); }
    else if (j.kind === 'leap') { j.obj.position.lerpVectors(j.from, j.to, k); j.obj.position.y += Math.sin(k * Math.PI) * 3; }

  }
  jobs = jobs.filter(j => !j.fin);
  // park animals wander about happily
  for (const a of park.animals) {
    if (jobs.some(j => j.obj === a)) continue;
    const h = a.userData.home, ph = a.userData.ph + clock * 0.6;
    a.position.set(h.x + Math.sin(ph) * 1.5, Math.abs(Math.sin(ph * 4)) * 0.2, h.z + Math.cos(ph * 0.8) * 1.5);
    a.rotation.y = -ph + Math.PI / 2;
  }
  for (const st of stations) if (st.animal) { st.animal.rotation.z = Math.sin(clock * 3 + st.s) * 0.05; if (st.animal.userData.fish) st.animal.userData.fish.position.x = Math.sin(clock * 2) * 0.15; }

  for (const st of stations) if (st.sign.visible) st.sign.rotation.y += dt * 0.8;
  updateSmoke(dt);
  updateCamera(dt);
}
// puffs of smoke from the chimney
const smoke = [];
const smokeMat = new THREE.MeshStandardMaterial({ color: '#ffffff', transparent: true, opacity: 0.8, roughness: 1 });
function puff() {
  const m = new THREE.Mesh(SPH, smokeMat.clone()); const p = new THREE.Vector3(0, 3.8, 1.7); engine.localToWorld(p);
  m.position.copy(p); m.scale.setScalar(0.4); scene.add(m); smoke.push({ m, t: 0 });
  if (smoke.length > 24) { const o = smoke.shift(); scene.remove(o.m); }
}
function updateSmoke(dt) {
  for (const s of smoke) { s.t += dt; s.m.position.y += dt * 1.6; s.m.scale.setScalar(0.4 + s.t * 0.9); s.m.material.opacity = Math.max(0, 0.8 - s.t * 0.5); }
}
// the camera: swing it all the way round the train (drag, right stick or Q / E, like Witch Way Out);
// let go and it glides back behind. 🎥 picks close, far, high up, or inside the cab with the driver.
// Pinch (or the mouse wheel, or + and -) zooms in and out.
const ocam = createOrbitCam({ canvas, enabled: () => state === 'play' || state === 'farm', fingers: true, el0: 0.36, minEl: 0.06, maxEl: 1.3, idleBack: 2.5 });
const CAM_VIEWS = [{ d: 15, el: 0 }, { d: 25, el: 0.12 }, { d: 42, el: 0.6 }, { cab: true }];
let zoom = 1;
const setZoom = z => { zoom = Math.min(2.6, Math.max(0.4, z)); };
canvas.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * Math.exp(e.deltaY * 0.0015)); }, { passive: false });
const touches = new Map();
let pinch = null;
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) { const [a, b] = [...touches.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: zoom }; tapAt = null; }
});
canvas.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && touches.size >= 2) { const [a, b] = [...touches.values()]; setZoom(pinch.z * pinch.d / (Math.hypot(a.x - b.x, a.y - b.y) || 1)); ocam.drag = null; }
});
const lift = e => { touches.delete(e.pointerId); if (touches.size < 2) pinch = null; };
canvas.addEventListener('pointerup', lift); canvas.addEventListener('pointercancel', lift);
const camPos = new THREE.Vector3(0, 30, -30), camLook = new THREE.Vector3(), camRay = new THREE.Vector3();
function updateCamera(dt) {
  const p = state === 'farm' ? walker.position : engine.position;
  const view = CAM_VIEWS[camMode], cab = view.cab && state === 'play';
  engine.userData.driver.visible = !cab && state !== 'farm';
  let want, look;
  if (state === 'title') { const a = clock * 0.08; want = new THREE.Vector3(Math.cos(a) * 120, 70, 40 + Math.sin(a) * 120); look = new THREE.Vector3(0, 0, 45); }
  else if (cab) {
    // in the cab, looking out over the boiler; drag or the right stick to look around
    ocam.input(dt, 0);
    const t = tanAt(train.e, train.s);
    const eye = engine.localToWorld(new THREE.Vector3(0.55, 2.8, -1.25));   // the driver's seat, by the side window
    const dir = t.clone().applyAxisAngle(UP, ocam.yawS);
    dir.y += -0.12 - (ocam.elS - ocam.el0) * 0.9; dir.normalize();
    camPos.copy(eye); camLook.copy(eye).add(dir);
    camera.position.copy(camPos); camera.lookAt(camLook);
    const fov = baseFov() * Math.min(1.3, Math.max(0.6, zoom)) * 1.15;
    if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
    sun.position.copy(p).add(new THREE.Vector3(30, 60, 20)); sun.target.position.copy(p);
    return;
  } else {
    ocam.input(dt, 0);
    const t = state === 'farm' ? new THREE.Vector3(Math.sin(walker.rotation.y), 0, Math.cos(walker.rotation.y)) : tanAt(train.e, train.s);
    const v = state === 'farm' ? { d: 10, el: 0.05 } : view.cab ? CAM_VIEWS[0] : view;
    ocam.ray(state === 'farm' ? farm.camHeading : Math.atan2(-t.x, -t.z), -v.el * 4, camRay);
    want = p.clone().addScaledVector(camRay, v.d * zoom).add(new THREE.Vector3(0, 1.5, 0));
    look = p.clone().addScaledVector(t, (state === 'farm' ? 1 : 6) * ocam.ahead()).add(new THREE.Vector3(0, 1.2, 0));
  }
  if (Math.abs(camera.fov - baseFov()) > 0.01) { camera.fov = baseFov(); camera.updateProjectionMatrix(); }
  const k = Math.min(1, dt * (state === 'title' ? 1 : 5));
  camPos.lerp(want, k); camLook.lerp(look, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.copy(p).add(new THREE.Vector3(30, 60, 20)); sun.target.position.copy(p);
}

// ---------- Music: a bouncy little tune (it goes quiet while someone is talking) ----------
const music = (() => {
  let on = RB.store.get('abc_music') !== '0', started = false, nextT = 0, step = 0, out = null;
  const BPM = 104, S16 = 60 / BPM / 4;
  const mtof = m => 440 * 2 ** ((m - 69) / 12);
  // eight bars: C F G C Am F G C, a tune on top, an oom-pah bass and plinky chords
  const CH = [[48, [60, 64, 67]], [41, [60, 65, 69]], [43, [59, 62, 67]], [48, [60, 64, 67]], [45, [57, 60, 64]], [41, [60, 65, 69]], [43, [59, 62, 67]], [48, [60, 64, 67]]];
  const TUNE = [[[0, 72, 4], [4, 76, 2], [6, 79, 2], [8, 76, 4], [12, 72, 4]], [[0, 77, 4], [4, 81, 4], [8, 79, 2], [10, 77, 2], [12, 76, 4]],
    [[0, 74, 2], [2, 76, 2], [4, 77, 4], [8, 79, 4], [12, 74, 4]], [[0, 76, 4], [4, 72, 4], [8, 72, 6]],
    [[0, 76, 2], [2, 76, 2], [4, 81, 4], [8, 79, 4], [12, 76, 4]], [[0, 77, 2], [2, 77, 2], [4, 81, 4], [8, 79, 2], [10, 77, 2], [12, 76, 4]],
    [[0, 74, 4], [4, 79, 4], [8, 77, 2], [10, 76, 2], [12, 74, 4]], [[0, 72, 4], [4, 76, 2], [6, 74, 2], [8, 72, 6]]];
  const note = (ac, f, t, dur, vol, type = 'triangle', partial = 0) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.02);
    if (partial) { const o2 = ac.createOscillator(), g2 = ac.createGain(); o2.type = 'sine'; o2.frequency.value = f * partial;
      g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(vol * 0.3, t + 0.005); g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.35);
      o2.connect(g2).connect(out); o2.start(t); o2.stop(t + dur); }
  };
  function tick() {
    const ac = RB.audio();
    if (!ac || !out) return;
    const quiet = !on || RB.muted || document.hidden || document.querySelector('.rb-menu') || state === 'party';
    out.gain.setTargetAtTime(quiet ? 0 : RB.voice.speaking ? 0.35 : 1, ac.currentTime, 0.15);   // duck under the voice
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.25) {
      if (!quiet) {
        const bar = Math.floor(step / 16) % 8, st = step % 16, [root, tri] = CH[bar];
        for (const [s0, m, len] of TUNE[bar]) if (s0 === st) note(ac, mtof(m), nextT, len * S16 * 1.3, 0.05, 'sine', 2.76);   // glockenspiel
        if (st === 0 || st === 8) note(ac, mtof(root), nextT, S16 * 3, 0.09, 'triangle');                               // oom
        if (st === 4 || st === 12) tri.forEach(m => note(ac, mtof(m), nextT, S16 * 2, 0.022, 'triangle'));             // pah
        if (st % 2 === 0 && train.v > 0.5 && state === 'play') { const n = ac.createBufferSource(); n.buffer = shaker(ac); const g = ac.createGain(); g.gain.value = st % 4 ? 0.02 : 0.035; n.connect(g).connect(out); n.start(nextT); }   // chugga-chugga while we roll
      }
      nextT += S16; step = (step + 1) % 128;
    }
  }
  let shake = null;
  const shaker = ac => {
    if (shake) return shake;
    shake = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.05), ac.sampleRate);
    const d = shake.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
    return shake;
  };
  return {
    get on() { return on; },
    start() { const ac = RB.audio(); if (!ac || started) return; started = true; out = ac.createGain(); out.gain.value = 0; out.connect(ac.destination); setInterval(tick, 60); },
    toggle() { on = !on; RB.store.set('abc_music', on ? '1' : '0'); $('music').classList.toggle('off', !on); if (on) this.start(); },
  };
})();
$('music').classList.toggle('off', !music.on);

// ---------- Title and loop ----------
function titleStats() {
  const bits = [];
  if (save.next) bits.push(`🔤 Up to the letter <b>${ANIMALS[Math.min(save.next, 25)].L}</b>`);
  if (save.done) bits.push(`🏆 Whole alphabet ${save.done} time${save.done > 1 ? 's' : ''}!`);
  if ((save.found || []).length) bits.push(`🔍 Found ${(save.found || []).length} letters`);
  $('titleStats').innerHTML = bits.join(' · ');
}
titleStats();
placeTrain();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  try { update(dt); renderer.render(scene, camera); } catch (e) { if (!frame.warned) { frame.warned = true; setTimeout(() => { throw e; }); } }
}
requestAnimationFrame(frame);
</script>
