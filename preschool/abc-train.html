<script>
'use strict';
// ===================== ABC Train =====================
// A toy train runs round a looping track through a little 3D toy town. At each stop an animal waits
// with a letter: "B! B is for Bear!" It hops into a wagon, and full trains drop their animals at the
// Animal Park. Made for little ones: big buttons, the train stops itself, and everything is read aloud.

// ---------- The animals, A to Z ----------
// shape: how the body is built. ears / tail / extra: the bits that make each one look like itself.
const ANIMALS = [
  { L: 'A', name: 'Alligator', c: '#4caf50', shape: 'lizard', extra: ['ridges', 'snout'] },
  { L: 'B', name: 'Bear', c: '#9a6232', belly: '#d8a878', ears: 'round', tail: 'short' },
  { L: 'C', name: 'Cat', c: '#ff9d3c', belly: '#ffe0b8', ears: 'pointy', tail: 'long', extra: ['whiskers'] },
  { L: 'D', name: 'Dog', c: '#d8a868', belly: '#fff0d8', ears: 'floppy', tail: 'short', extra: ['nose'] },
  { L: 'E', name: 'Elephant', c: '#9aa4b8', ears: 'big', tail: 'short', extra: ['trunk'] },
  { L: 'F', name: 'Frog', c: '#6ad04a', belly: '#d8f8a8', shape: 'frog' },
  { L: 'G', name: 'Giraffe', c: '#ffd04a', pattern: 'spots', pc: '#b8742a', ears: 'small', tail: 'long', extra: ['longNeck', 'horns'] },
  { L: 'H', name: 'Hippo', c: '#a08ac0', belly: '#d8c8e8', ears: 'small', tail: 'short', extra: ['wideSnout'] },
  { L: 'I', name: 'Iguana', c: '#7ad84a', shape: 'lizard', extra: ['spikes'] },
  { L: 'J', name: 'Jaguar', c: '#ffc04a', pattern: 'spots', pc: '#5a3a1a', ears: 'round', tail: 'long' },
  { L: 'K', name: 'Kangaroo', c: '#c8844a', belly: '#f0c898', shape: 'upright', ears: 'long', tail: 'thick' },
  { L: 'L', name: 'Lion', c: '#ffb43a', ears: 'round', tail: 'long', extra: ['mane'] },
  { L: 'M', name: 'Monkey', c: '#8a5a3a', belly: '#f0c8a0', shape: 'upright', ears: 'side', tail: 'curl' },
  { L: 'N', name: 'Newt', c: '#ff7a3a', shape: 'lizard', extra: ['dots'] },
  { L: 'O', name: 'Owl', c: '#9a7048', belly: '#e8d0a8', shape: 'bird', extra: ['tufts', 'bigEyes'] },
  { L: 'P', name: 'Pig', c: '#ffa8c0', ears: 'pointy', tail: 'curl', extra: ['pigSnout'] },
  { L: 'Q', name: 'Quail', c: '#a8784a', belly: '#e8c8a0', shape: 'bird', extra: ['plume'] },
  { L: 'R', name: 'Rabbit', c: '#f2eee8', belly: '#ffffff', ears: 'long', tail: 'puff' },
  { L: 'S', name: 'Sheep', c: '#ffffff', ears: 'floppy', tail: 'puff', extra: ['wool', 'darkFace'] },
  { L: 'T', name: 'Tiger', c: '#ff8a2a', pattern: 'stripes', pc: '#2a1a10', belly: '#fff0d8', ears: 'round', tail: 'long' },
  { L: 'U', name: 'Unicorn', c: '#ffffff', ears: 'pointy', tail: 'rainbow', extra: ['horn', 'rainbowMane', 'longLegs'] },
  { L: 'V', name: 'Vulture', c: '#5a4a5a', belly: '#ffb8c8', shape: 'bird', extra: ['bald'] },
  { L: 'W', name: 'Walrus', c: '#a8785a', shape: 'walrus' },
  { L: 'X', name: 'X-ray fish', c: '#c8e8ff', shape: 'fish', say: 'X-ray fish' },
  { L: 'Y', name: 'Yak', c: '#7a5a3a', ears: 'small', tail: 'long', extra: ['shaggy', 'bigHorns'] },
  { L: 'Z', name: 'Zebra', c: '#ffffff', pattern: 'stripes', pc: '#1a1a1a', ears: 'pointy', tail: 'long', extra: ['stripeMane', 'longLegs'] },
];
const LETTER_COLORS = ['#e8453a', '#ff9d1c', '#f2c200', '#3cc456', '#1fb0c8', '#5a7aff', '#a05aff', '#ff5aa8'];
const colorOf = i => LETTER_COLORS[i % LETTER_COLORS.length];

// ---------- Three.js ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fdcff');
scene.fog = new THREE.Fog('#bfe8ff', 120, 340);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 800);
function resize() {
  // sharp, but not more pixels than a tablet can paint smoothly
  let dpr = Math.min(devicePixelRatio || 1, 2);
  if (innerWidth * innerHeight * dpr * dpr > 2.1e6) dpr = Math.max(1, Math.sqrt(2.1e6 / (innerWidth * innerHeight)));
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 0.8 ? 66 : 50;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
scene.add(new THREE.HemisphereLight('#ffffff', '#7ac86a', 0.8));
const sun = new THREE.DirectionalLight('#fff6e0', 0.85);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 160 });
scene.add(sun, sun.target);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0, ...o });
const MATS = {};
const M = c => MATS[c] || (MATS[c] = mat(c));
function mesh(geo, color, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, typeof color === 'string' ? M(color) : color);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
const SPH = new THREE.SphereGeometry(1, 20, 14), CYL = new THREE.CylinderGeometry(1, 1, 1, 16), BOX = new THREE.BoxGeometry(1, 1, 1), CONE = new THREE.ConeGeometry(1, 1, 16);
// a ball, stretched into an egg or a sausage
const ball = (parent, color, x, y, z, sx, sy = sx, sz = sx) => { const m = mesh(SPH, color, x, y, z, parent); m.scale.set(sx, sy, sz); return m; };
const rod = (parent, color, x, y, z, r, h, rx = 0, rz = 0) => { const m = mesh(CYL, color, x, y, z, parent); m.scale.set(r, h, r); m.rotation.set(rx, 0, rz); return m; };
const block = (parent, color, x, y, z, w, h, d) => { const m = mesh(BOX, color, x, y, z, parent); m.scale.set(w, h, d); return m; };
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function patternMat(base, kind, pc) {
  const tex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h); g.fillStyle = pc;
    if (kind === 'stripes') for (let i = 0; i < 8; i++) { g.beginPath(); g.moveTo(i * 16, 0); g.quadraticCurveTo(i * 16 + 10, 64, i * 16 - 2, 128); g.lineTo(i * 16 + 7, 128); g.quadraticCurveTo(i * 16 + 16, 64, i * 16 + 7, 0); g.fill(); }
    else for (let i = 0; i < 22; i++) { g.beginPath(); g.arc((i * 47) % 128, (i * 29) % 128, 6 + (i % 3) * 2, 0, Math.PI * 2); g.fill(); }
  });
  return mat('#ffffff', { map: tex });
}

// ---------- Building an animal ----------
// Every animal is about 1.2 m tall, standing at the origin and facing +x.
function makeAnimal(a) {
  const g = new THREE.Group(), body = new THREE.Group();
  g.add(body);
  const c = a.c, belly = a.belly || c, dark = '#23324a';
  const bodyMat = a.pattern ? patternMat(c, a.pattern, a.pc) : M(c);
  const eye = (x, y, z, r = 0.09) => { ball(body, '#ffffff', x, y, z, r * 1.3); ball(body, dark, x + r * 0.6, y, z, r * 0.75); ball(body, '#ffffff', x + r * 0.9, y + r * 0.35, z, r * 0.22); };
  const eyes = (x, y, w, r) => { eye(x, y, w, r); eye(x, y, -w, r); };
  const legs = (h, w = 0.12, spread = 0.28, along = 0.32) => { for (const sx of [-along, along]) for (const sz of [-spread, spread]) rod(body, c, sx, h / 2, sz, w, h); };
  const shape = a.shape || 'quad';
  if (shape === 'quad') {
    const legH = a.extra && a.extra.includes('longLegs') ? 0.55 : 0.36;
    legs(legH);
    const by = legH + 0.25;
    const b = ball(body, bodyMat, 0, by, 0, 0.55, 0.36, 0.38);
    ball(body, belly, 0.05, by - 0.12, 0, 0.42, 0.24, 0.3);
    let hx = 0.52, hy = by + 0.3;
    if (a.extra && a.extra.includes('longNeck')) { const n = rod(body, bodyMat, 0.42, by + 0.55, 0, 0.12, 0.9, 0, -0.35); void n; hx = 0.62; hy = by + 1.05; }
    if (a.extra && a.extra.includes('wool')) for (let i = 0; i < 9; i++) ball(body, '#ffffff', -0.35 + (i % 3) * 0.33, by + 0.12 + Math.floor(i / 3) * 0.06, -0.25 + Math.floor(i / 3) * 0.25, 0.25);
    if (a.extra && a.extra.includes('shaggy')) for (let i = 0; i < 8; i++) ball(body, '#5a3a22', -0.4 + i * 0.12, by - 0.28, (i % 2 ? 0.25 : -0.25), 0.14, 0.24, 0.14);
    const headC = a.extra && a.extra.includes('darkFace') ? '#3a3a44' : c;
    const head = ball(body, a.pattern ? bodyMat : headC, hx, hy, 0, 0.3, 0.28, 0.28);
    void head; void b;
    if (a.extra && a.extra.includes('mane')) for (let i = 0; i < 12; i++) { const an = i / 12 * Math.PI * 2; ball(body, '#c8641a', hx - 0.08, hy + Math.sin(an) * 0.3, Math.cos(an) * 0.3, 0.12); }
    if (a.extra && a.extra.includes('rainbowMane')) ['#ff5a5a', '#ffb23a', '#ffe14a', '#5ad06a', '#5ab0ff', '#b07aff'].forEach((cc, i) => ball(body, cc, hx - 0.18 - i * 0.06, hy + 0.2 - i * 0.08, 0, 0.09));
    if (a.extra && a.extra.includes('stripeMane')) for (let i = 0; i < 5; i++) block(body, i % 2 ? '#1a1a1a' : '#ffffff', hx - 0.16 - i * 0.07, hy + 0.2 - i * 0.07, 0, 0.07, 0.12, 0.05);
    // snouts and noses
    if (a.extra && a.extra.includes('trunk')) { rod(body, c, hx + 0.28, hy - 0.18, 0, 0.07, 0.42, 0, 0.5); }
    else if (a.extra && a.extra.includes('pigSnout')) { rod(body, '#ff8aa8', hx + 0.3, hy - 0.04, 0, 0.11, 0.1, 0, Math.PI / 2); ball(body, '#c84a6a', hx + 0.36, hy - 0.02, 0.04, 0.025); ball(body, '#c84a6a', hx + 0.36, hy - 0.02, -0.04, 0.025); }
    else if (a.extra && a.extra.includes('wideSnout')) { ball(body, belly, hx + 0.22, hy - 0.1, 0, 0.18, 0.15, 0.24); ball(body, dark, hx + 0.38, hy - 0.04, 0.08, 0.03); ball(body, dark, hx + 0.38, hy - 0.04, -0.08, 0.03); }
    else { ball(body, belly, hx + 0.24, hy - 0.08, 0, 0.13, 0.1, 0.13); ball(body, a.extra && a.extra.includes('nose') ? dark : '#ff8aa8', hx + 0.36, hy - 0.04, 0, 0.045); }
    eyes(hx + 0.2, hy + 0.08, 0.12, 0.06);
    // ears
    const ears = a.ears;
    for (const s of [-1, 1]) {
      if (ears === 'round') ball(body, c, hx - 0.05, hy + 0.24, s * 0.18, 0.09, 0.09, 0.05);
      if (ears === 'pointy') { const e = mesh(CONE, c, hx - 0.04, hy + 0.3, s * 0.15, body); e.scale.set(0.08, 0.18, 0.08); }
      if (ears === 'floppy') { const e = ball(body, a.extra && a.extra.includes('darkFace') ? '#3a3a44' : '#a8784a', hx - 0.05, hy + 0.05, s * 0.27, 0.06, 0.16, 0.08); e.rotation.x = s * 0.4; }
      if (ears === 'small') ball(body, c, hx - 0.08, hy + 0.22, s * 0.17, 0.06, 0.05, 0.04);
      if (ears === 'big') { const e = ball(body, c, hx - 0.12, hy, s * 0.3, 0.06, 0.26, 0.22); e.rotation.y = s * 0.3; }
      if (ears === 'long') { const e = ball(body, c, hx - 0.06, hy + 0.42, s * 0.1, 0.06, 0.25, 0.07); ball(body, '#ffb8c8', hx - 0.03, hy + 0.42, s * 0.1, 0.035, 0.18, 0.04); void e; }
    }
    if (a.extra && a.extra.includes('horns')) for (const s of [-1, 1]) { rod(body, '#b8742a', hx - 0.04, hy + 0.32, s * 0.08, 0.03, 0.14); ball(body, '#8a5a1a', hx - 0.04, hy + 0.4, s * 0.08, 0.045); }
    if (a.extra && a.extra.includes('bigHorns')) for (const s of [-1, 1]) { const h = mesh(CONE, '#f2e8d0', hx - 0.02, hy + 0.3, s * 0.26, body); h.scale.set(0.05, 0.22, 0.05); h.rotation.x = s * 0.9; }
    if (a.extra && a.extra.includes('horn')) { const h = mesh(CONE, '#ffd84a', hx + 0.12, hy + 0.36, 0, body); h.scale.set(0.05, 0.26, 0.05); h.rotation.z = -0.4; }
    if (a.extra && a.extra.includes('whiskers')) for (const s of [-1, 1]) for (const k of [-0.02, 0.03]) block(body, dark, hx + 0.32, hy - 0.06 + k, s * 0.14, 0.01, 0.01, 0.2);
    // tails
    if (a.tail === 'long') rod(body, c, -0.65, by + 0.1, 0, 0.04, 0.5, 0, 0.9);
    if (a.tail === 'short') ball(body, c, -0.55, by + 0.08, 0, 0.08);

  for (const s of [-1, 1]) { block(w, WAGON_COLORS[i], s * 0.95, 1.55, 0, 0.12, 0.5, 3.6); block(w, WAGON_COLORS[i], 0, 1.55, s * 1.75, 2, 0.5, 0.12); }
  w.userData.wheels = [];
  for (const z of [-1.1, 1.1]) for (const s of [-1, 1]) { const wh = rod(w, '#23324a', s * 0.98, 0.5, z, 0.48, 0.2, 0, Math.PI / 2); w.userData.wheels.push(wh); }
  scene.add(w); train.wagons.push(w); train.seats.push(null);
}
const GAP = [5.6, 4.6];   // engine to first wagon, wagon to wagon (along the track)
function placeTrain() {
  const place = (obj, s) => {
    const p = at(s, new THREE.Vector3()), t = tangentAt(s, new THREE.Vector3());
    obj.position.copy(p).add(new THREE.Vector3(0, 0.15, 0));
    obj.lookAt(obj.position.clone().add(t));
  };
  place(engine, train.s);
  train.wagons.forEach((w, i) => place(w, train.s - GAP[0] - i * GAP[1]));
}

// ---------- Sound ----------
const beep = RB.beep;
const sfx = {
  toot: () => { beep(392, 392, 0.35, 'square', 0.07); beep(494, 494, 0.35, 'square', 0.05); beep(392, 392, 0.5, 'square', 0.07, 0.42); beep(494, 494, 0.5, 'square', 0.05, 0.42); },
  ding: () => [784, 988, 1175, 1568].forEach((f, i) => beep(f, f, 0.18, 'sine', 0.09, i * 0.09)),
  hop: () => beep(300, 900, 0.22, 'sine', 0.08),
  oops: () => beep(400, 300, 0.3, 'triangle', 0.08),
  cheer: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => beep(f, f, 0.16, 'triangle', 0.08, i * 0.11)),
  chuff: v => RB.noise(0.08, Math.min(0.07, 0.02 + v * 0.006)),
  brake: () => RB.noise(0.4, 0.05),
};
// the alphabet song tune (a traditional melody), played when you get all the way to Z
const ABC_TUNE = [[60, 1], [60, 1], [67, 1], [67, 1], [69, 1], [69, 1], [67, 2], [65, 1], [65, 1], [64, 1], [64, 1], [62, 0.5], [62, 0.5], [62, 0.5], [62, 0.5], [60, 2],
  [67, 1], [67, 1], [65, 2], [64, 1], [64, 1], [62, 2], [67, 1], [67, 1], [65, 2], [64, 1], [64, 1], [62, 2],
  [60, 1], [60, 1], [67, 1], [67, 1], [69, 1], [69, 1], [67, 2], [65, 1], [65, 1], [64, 1], [64, 1], [62, 1], [62, 1], [60, 2]];
function playAbcSong() {
  let t = 0;
  for (const [n, d] of ABC_TUNE) { const f = 440 * 2 ** ((n - 69) / 12); beep(f, f, d * 0.36, 'triangle', 0.08, t); beep(f / 2, f / 2, d * 0.36, 'sine', 0.05, t); t += d * 0.38; }
  return t;
}
const say = (text, opts) => { if (!RB.muted) RB.speak(text, opts); };

// ---------- The game ----------
const save = (() => { try { return JSON.parse(RB.store.get('abc_train') || 'null') || {}; } catch (e) { return {}; } })();
const persist = () => RB.store.set('abc_train', JSON.stringify(save));
let state = 'title', mode = 'abc', next = 0, target = null, hold = 0, idleT = 0, lastChuff = 0, camMode = 0, clock = 0, autoStop = null;
let jobs = [];   // little animations: animals hopping on and off
const $ = id => document.getElementById(id);
const abcEl = $('abc');
abcEl.innerHTML = ANIMALS.map((a, i) => `<span style="--c:${colorOf(i)}">${a.L}</span>`).join('');
function drawAbc() {
  [...abcEl.children].forEach((el, i) => {
    el.classList.toggle('got', mode === 'abc' ? i < next : (save.found || []).includes(i));
    el.classList.toggle('next', mode === 'abc' ? i === next : i === target);
  });
}
function showCard(idx) {
  const a = ANIMALS[idx], col = colorOf(idx);
  $('cardLetter').textContent = a.L + a.L.toLowerCase(); $('cardLetter').style.color = col;
  const nm = a.name;
  $('cardWord').innerHTML = `<b style="color:${col}">${nm[0]}</b>${nm.slice(1)}`;
  $('card').classList.add('on');
  clearTimeout(showCard.t); showCard.t = setTimeout(() => $('card').classList.remove('on'), 3200);
}
function ask(html) { $('ask').innerHTML = html; $('ask').classList.toggle('hidden', !html); }
const SEAT_Y = 1.4;   // how high the animals sit in the wagons (so little eyes can see them)
const seatsFree = () => train.seats.filter(x => x === null).length;

function start(m) {
  RB.audio();
  mode = m; state = 'play';
  $('title').classList.add('hidden');
  for (const id of ['abc', 'go', 'toot', 'cam']) $(id).classList.remove('hidden');
  train.s = PARK_AT + 1; train.v = 0; train.running = false;
  for (let i = 0; i < train.seats.length; i++) if (train.seats[i]) { train.wagons[i].remove(train.seats[i]); train.seats[i] = null; }
  next = mode === 'abc' ? Math.min(save.next || 0, 25) : 0;
  setupStations();
  drawAbc(); updateGo();
  if (mode === 'abc') say(next ? `Welcome back! Let's find the letter ${ANIMALS[next].L}. Press GO!` : 'All aboard! Let\'s find the letter A. Press the green GO button!');
  else say(`Can you find the letter ${ANIMALS[target].L}? Stop the train at the ${ANIMALS[target].L}!`);
}
// which animals wait at which stations
function setupStations() {
  stations.forEach(st => setStation(st, null));
  if (mode === 'abc') {
    if (seatsFree() === 0) { autoStop = PARK_AT; ask('🏞️ Take the animals to the <b>Animal Park</b>!'); return; }
    // the next letter waits at the next station ahead of the train
    const st = stationAhead(train.s + 8);
    setStation(st, next); autoStop = st.s;
    ask(`Find the letter <b style="color:${colorOf(next)}">${ANIMALS[next].L}</b>`);
  } else {
    // find the letter: every station has a letter; one of them is the one to find
    const pool = ANIMALS.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, stations.length);
    target = pool[Math.floor(Math.random() * pool.length)];
    stations.forEach((st, i) => setStation(st, pool[i]));
    autoStop = null;
    ask(`Stop at the letter <b style="color:${colorOf(target)}">${ANIMALS[target].L}</b>`);
  }
  drawAbc();
}
function stationAhead(s) { let best = null, bd = Infinity; for (const st of stations) { const d = wrap(st.s - s); if (d < bd) { bd = d; best = st; } } return best; }
function updateGo() {
  const go = $('go');
  go.textContent = train.running ? 'STOP' : 'GO';
  go.classList.toggle('stop', train.running);
  go.classList.toggle('pulse', !train.running && state === 'play' && hold <= 0);
}
function toggleGo() {
  if (state !== 'play' || hold > 0) return;
  RB.audio();
  if (train.running && mode === 'find' && autoStop === null) {
    // stopping near a station (little hands are never exact): glide right up to it
    const st = stations.find(x => { const d = wrap(x.s - train.s); return d < 16 || d > LEN - 2; });
    if (st) { autoStop = st.s; sfx.brake(); return; }
  }
  train.running = !train.running;
  if (train.running) { sfx.toot(); idleT = 0; } else { sfx.brake(); if (mode === 'find') autoStop = null; }
  updateGo();
}
function toot() {
  RB.audio(); sfx.toot();
  // the waiting animals jump for joy
  for (const st of stations) if (st.animal) jobs.push({ t: 0, d: 0.6, obj: st.animal, kind: 'jump', y0: 0.75 });
  for (const a of park.animals) jobs.push({ t: 0, d: 0.6, obj: a, kind: 'jump', y0: 0 });
}
// the train has stopped beside a station: who gets on?
function arrive(st) {
  if (mode === 'abc' && st.letter === next) boardAnimal(st, next);
  else if (mode === 'find' && st.letter !== null) {
    const idx = st.letter, a = ANIMALS[idx];
    if (idx === target) {
      boardAnimal(st, idx);
      save.found = [...new Set([...(save.found || []), idx])]; persist();
    } else {
      sfx.oops(); showCard(idx);
      say(`That's ${a.L}. ${a.L} is for ${a.say || a.name}! Let's find ${ANIMALS[target].L}.`);
      jobs.push({ t: 0, d: 0.6, obj: st.animal, kind: 'jump', y0: 0.75 });
    }
  }
}
function boardAnimal(st, idx) {
  const a = ANIMALS[idx];
  hold = 3.4; train.running = false; updateGo();
  showCard(idx); sfx.ding();
  say(`${a.L}! ${a.L} is for ${a.say || a.name}!`);
  // hop from the platform into the first empty wagon
  const seat = train.seats.indexOf(null), animal = st.animal;
  st.animal = null; st.sign.visible = false;
  const from = new THREE.Vector3(); animal.getWorldPosition(from);
  st.g.remove(animal); scene.add(animal); animal.position.copy(from);
  train.seats[seat] = animal;
  jobs.push({ t: 0, d: 1.1, obj: animal, kind: 'board', from, wagon: train.wagons[seat], delay: 0.6, done: () => {
    scene.remove(animal); const w = train.wagons[seat]; w.add(animal); animal.position.set(0, SEAT_Y, 0); animal.rotation.set(0, Math.PI / 2, 0); animal.scale.setScalar(0.85);
    sfx.hop();
  } });
  if (mode === 'abc') {
    next++;
    save.next = next; persist();
    if (next >= 26) { setTimeout(finale, 2600); return; }
  }
  setTimeout(() => { if (state === 'play') { setupStations(); if (mode === 'abc' && seatsFree() === 0) say('The train is full! Let\'s take the animals to the Animal Park!'); else if (mode === 'abc') say(`Now let's find ${ANIMALS[next].L}!`); else say(`Can you find the letter ${ANIMALS[target].L}?`); } }, 3600);
  drawAbc();
}
function unloadAtPark() {
  hold = 3.6; train.running = false; updateGo();
  sfx.cheer(); say('Hooray! Everybody hop off and play in the Animal Park!');
  train.seats.forEach((animal, i) => {
    if (!animal) return;
    const from = new THREE.Vector3(); animal.getWorldPosition(from);
    train.wagons[i].remove(animal); scene.add(animal); animal.position.copy(from); animal.scale.setScalar(1);
    train.seats[i] = null;
    const spot = new THREE.Vector3((Math.random() - 0.5) * 12, 0, (Math.random() - 0.5) * 12);
    park.g.localToWorld(spot);
    jobs.push({ t: 0, d: 1.3, obj: animal, kind: 'leap', from, to: spot, delay: i * 0.35, done: () => { animal.userData.home = spot.clone(); animal.userData.ph = Math.random() * 6; park.animals.push(animal); } });
  });
  setTimeout(() => { if (state === 'play') { setupStations(); say(`Now let's find ${ANIMALS[next].L}!`); } }, 4200);
}
function finale() {
  state = 'party'; train.running = false; updateGo();
  ask('🎉 You did the whole alphabet! 🎉');
  say('You did it! You found every letter from A to Z! Let\'s sing!');
  setTimeout(() => {
    const len = playAbcSong();
    [...abcEl.children].forEach((el, i) => setTimeout(() => { el.classList.add('next'); setTimeout(() => el.classList.remove('next'), 400); }, i * len * 1000 / 30));
    setTimeout(() => { save.next = 0; save.done = (save.done || 0) + 1; persist(); next = 0; state = 'play'; setupStations(); drawAbc(); say('Let\'s go again from A!'); }, len * 1000 + 800);
  }, 3500);
}

// ---------- Controls ----------
$('go').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toggleGo(); });
$('toot').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toot(); });
$('cam').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); camMode = (camMode + 1) % 3; RB.audio(); beep(600, 900, 0.08, 'sine', 0.06); });
$('btnAbc').addEventListener('click', () => start('abc'));
$('btnFind').addEventListener('click', () => start('find'));
// tap an animal in the park (or at a station) and it jumps and says its name
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
canvas.addEventListener('pointerdown', e => {
  if (state === 'title') return;
  RB.audio();
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const pool = [...park.animals, ...stations.map(s => s.animal).filter(Boolean), ...train.seats.filter(Boolean)];
  const hit = ray.intersectObjects(pool, true)[0];
  if (!hit) return;
  let o = hit.object; while (o && !pool.includes(o)) o = o.parent;
  if (!o) return;
  const idx = ANIMALS.findIndex(a => o.userData.name === a.name);
  jobs.push({ t: 0, d: 0.6, obj: o, kind: 'jump', y0: o.position.y });
  if (idx >= 0) { say(`${ANIMALS[idx].say || ANIMALS[idx].name}!`); sfx.hop(); }
});
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (state === 'title') { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); start('abc'); } return; }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') { e.preventDefault(); toggleGo(); }
  if (e.code === 'KeyH' || e.code === 'KeyX' || e.code === 'KeyT') toot();
  if (e.code === 'KeyC') camMode = (camMode + 1) % 3;
  if (e.code === 'KeyM') RB.toggleMute();
});
// 🎮 Ⓐ go / stop, Ⓧ / Ⓨ / Ⓑ toot the horn, LB / RB change the camera
if (RB.pad && RB.pad.setButtons) RB.pad.setButtons({ 0: 'Space', 1: 'KeyH', 2: 'KeyH', 3: 'KeyH', 4: 'KeyC', 5: 'KeyC', 6: null, 7: 'Space' },
  '<b>ABC Train:</b> Ⓐ go and stop · Ⓧ / Ⓨ / Ⓑ toot the horn · <b>LB</b> / <b>RB</b> change the camera');
RB.topbar({ home: 'index.html', homeTitle: 'Back to Preschool', shareInfo: { title: 'ABC Train | RoboBandit', text: 'Drive the train, pick up the animals and learn the alphabet! 🚂🔤' } });

// the ☰ menu (or switching apps) stops the train, so nothing is missed
addEventListener('blur', () => { if (train.running) { train.running = false; if (mode === 'find') autoStop = null; updateGo(); } });

// ---------- Update ----------
const CRUISE = 9, ACC = 2.6, BRAKE = 6;
function update(dt) {
  clock += dt;
  hold = Math.max(0, hold - dt);
  if (hold <= 0 && $('go').classList.contains('stop') !== train.running) updateGo();
  // speed: gentle start, gentle stops; the train brakes by itself for the next animal
  let want = train.running ? CRUISE : 0;
  if (autoStop !== null && train.running && state === 'play') {
    const d = wrap(autoStop - train.s);
    if (d < 40) want = Math.min(want, Math.sqrt(2 * BRAKE * 0.6 * Math.max(0, d - 0.05)) + 0.3);
    if (d < 0.35 || d > LEN - 2) {
      train.running = false; train.v = 0; train.s = autoStop; updateGo();
      if (autoStop === PARK_AT) unloadAtPark(); else arrive(stationAhead(train.s - 1));
      if (mode === 'find') autoStop = null;
    }
  }
  if (train.v < want) train.v = Math.min(want, train.v + ACC * dt);
  else train.v = Math.max(want, train.v - BRAKE * dt);
  const wasMoving = train.v > 0.05;
  train.s = wrap(train.s + train.v * dt);
  // stopped by hand next to a station: in Find the letter, that's your answer
  if (mode === 'find' && wasMoving && train.v <= 0.05 && !train.running && state === 'play') {
    const st = stations.find(x => Math.abs(wrap(x.s - train.s + LEN / 2) - LEN / 2) < 6);
    if (st) arrive(st);
  }
  // chuff-chuff, faster as the train speeds up
  if (train.v > 0.3 && clock - lastChuff > 2.2 / (train.v + 1.5)) { lastChuff = clock; sfx.chuff(train.v); puff(); }
  if (!train.running && train.v < 0.05 && state === 'play' && hold <= 0) { idleT += dt; if (idleT > 9) { idleT = 0; say('Press the green GO button!'); } } else idleT = 0;
  placeTrain();
  const spin = train.v * dt / 0.55;
  for (const w of engine.userData.wheels) w.rotation.y += spin;
  for (const wg of train.wagons) for (const w of wg.userData.wheels) w.rotation.y += spin;
  // little animations
  for (const j of jobs) {
    if (j.delay > 0) { j.delay -= dt; continue; }
    j.t += dt;
    const k = Math.min(1, j.t / j.d);
    if (j.kind === 'jump') j.obj.position.y = j.y0 + Math.sin(k * Math.PI) * 0.9;
    else if (j.kind === 'board') { const to = new THREE.Vector3(); j.wagon.localToWorld(to.set(0, SEAT_Y, 0)); j.obj.position.lerpVectors(j.from, to, k); j.obj.position.y += Math.sin(k * Math.PI) * 2.5; j.obj.scale.setScalar(1 - 0.15 * k); }
    else if (j.kind === 'leap') { j.obj.position.lerpVectors(j.from, j.to, k); j.obj.position.y += Math.sin(k * Math.PI) * 3; }
    if (k >= 1 && !j.fin) { j.fin = true; if (j.done) j.done(); }
  }
  jobs = jobs.filter(j => !j.fin);
  // park animals wander about happily
  for (const a of park.animals) {
    if (jobs.some(j => j.obj === a)) continue;
    const h = a.userData.home, ph = a.userData.ph + clock * 0.6;
    a.position.set(h.x + Math.sin(ph) * 1.5, Math.abs(Math.sin(ph * 4)) * 0.2, h.z + Math.cos(ph * 0.8) * 1.5);
    a.rotation.y = -ph + Math.PI / 2;
  }
  for (const st of stations) if (st.animal) { st.animal.rotation.z = Math.sin(clock * 3 + st.s) * 0.05; if (st.animal.userData.fish) st.animal.userData.fish.position.x = Math.sin(clock * 2) * 0.15; }
  for (const s of train.seats) if (s) s.position.y = SEAT_Y + Math.abs(Math.sin(clock * 6)) * 0.05;
  scene.userData.blades.rotation.x += dt * 0.8;
  for (const cl of scene.userData.clouds) { cl.position.x += dt * 1.5; if (cl.position.x > 250) cl.position.x = -250; }
  for (const st of stations) if (st.sign.visible) st.sign.rotation.y += dt * 0.8;
  updateSmoke(dt);
  updateCamera(dt);
}
// puffs of smoke from the chimney
const smoke = [];
const smokeMat = new THREE.MeshStandardMaterial({ color: '#ffffff', transparent: true, opacity: 0.8, roughness: 1 });
function puff() {
  const m = new THREE.Mesh(SPH, smokeMat.clone()); const p = new THREE.Vector3(0, 3.8, 1.7); engine.localToWorld(p);
  m.position.copy(p); m.scale.setScalar(0.4); scene.add(m); smoke.push({ m, t: 0 });
  if (smoke.length > 24) { const o = smoke.shift(); scene.remove(o.m); }
}
function updateSmoke(dt) {
  for (const s of smoke) { s.t += dt; s.m.position.y += dt * 1.6; s.m.scale.setScalar(0.4 + s.t * 0.9); s.m.material.opacity = Math.max(0, 0.8 - s.t * 0.5); }
}
// the camera: behind the train, from the side, or high above (🎥 switches)
const camPos = new THREE.Vector3(0, 30, -30), camLook = new THREE.Vector3();
function updateCamera(dt) {
  const p = engine.position, t = tangentAt(train.s, new THREE.Vector3()), sd = sideAt(train.s);
  let want, look;
  if (state === 'title') { const a = clock * 0.08; want = new THREE.Vector3(Math.cos(a) * 120, 70, 40 + Math.sin(a) * 120); look = new THREE.Vector3(0, 0, 45); }
  else if (camMode === 0) { want = p.clone().addScaledVector(t, -13).addScaledVector(sd, 5).add(new THREE.Vector3(0, 8, 0)); look = p.clone().addScaledVector(t, 6).add(new THREE.Vector3(0, 1.5, 0)); }
  else if (camMode === 1) { want = p.clone().addScaledVector(sd, 16).addScaledVector(t, -3).add(new THREE.Vector3(0, 5, 0)); look = p.clone().addScaledVector(t, -4).add(new THREE.Vector3(0, 1.5, 0)); }
  else { want = p.clone().addScaledVector(t, -14).add(new THREE.Vector3(0, 40, 0)); look = p.clone().addScaledVector(t, 10); }
  const k = Math.min(1, dt * (state === 'title' ? 1 : 2.5));
  camPos.lerp(want, k); camLook.lerp(look, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.copy(p).add(new THREE.Vector3(30, 60, 20)); sun.target.position.copy(p);
}


// ---------- Title and loop ----------
function titleStats() {
  const bits = [];
  if (save.next) bits.push(`🔤 Up to the letter <b>${ANIMALS[Math.min(save.next, 25)].L}</b>`);
  if (save.done) bits.push(`🏆 Whole alphabet ${save.done} time${save.done > 1 ? 's' : ''}!`);
  if ((save.found || []).length) bits.push(`🔍 Found ${(save.found || []).length} letters`);
  $('titleStats').innerHTML = bits.join(' · ');
}
titleStats();
placeTrain();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  try { update(dt); renderer.render(scene, camera); } catch (e) { if (!frame.warned) { frame.warned = true; setTimeout(() => { throw e; }); } }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
