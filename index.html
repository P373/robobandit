<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Wars X-Wing Starfighter Run</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #overlay {
    position: fixed; inset: 0; display: flex;
    background: radial-gradient(ellipse at center, rgba(0,10,30,.55), rgba(0,0,0,.85));
    z-index: 5; overflow-y: auto;
  }
  #overlay.hidden, .hidden { display: none !important; }
  .panel {
    max-width: 600px; margin: auto; padding: 26px 30px; text-align: center;
    border: 1px solid rgba(255,220,120,.35); border-radius: 14px;
    background: rgba(5,10,25,.85); box-shadow: 0 0 40px rgba(255,190,60,.15);
  }
  .panel h1 {
    margin: 0 0 12px; font-size: clamp(24px, 5vw, 42px); letter-spacing: 3px; line-height: 1.15;
    color: #ffd84a; text-shadow: 0 0 18px rgba(255,200,40,.6);
  }
  .panel h1 small { display: block; font-size: .55em; letter-spacing: 8px; color: #fff3b0; }
  .panel p { margin: 8px 0; line-height: 1.5; color: #cfd8ea; }
  .panel .keys { font-size: 14px; color: #9fb0cc; }
  .panel .big { font-size: 20px; color: #fff; }
  .panel button {
    margin-top: 18px; padding: 12px 34px; font-size: 18px; font-weight: 700; letter-spacing: 2px;
    color: #111; background: #ffd84a; border: 0; border-radius: 8px; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,200,40,.45);
  }
  .panel button:hover { background: #ffe680; }
  .assist { margin: 16px 0 4px; padding: 12px; border: 1px solid rgba(255,255,255,.15); border-radius: 10px; }
  .assist .label { font-size: 13px; letter-spacing: 3px; color: #9fb0cc; margin-bottom: 8px; }
  .assist .opts { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .panel .assist button.opt {
    margin: 0; padding: 8px 14px; font-size: 14px; letter-spacing: 1px; box-shadow: none;
    color: #cfd8ea; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25);
  }
  .panel .assist button.opt.sel { color: #111; background: #7fd0ff; border-color: #7fd0ff; }
  .assist .hint { font-size: 13px; color: #9fb0cc; margin: 8px 0 0; min-height: 1.5em; }
  /* Science quiz */
  .quiz { text-align: left; }
  .quiz .qneed { text-align: center; color: #cfd8ea; }
  .quiz .qtop { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .quiz .topic {
    font-size: 12px; font-weight: 700; letter-spacing: 2px; padding: 4px 10px; border-radius: 20px;
    background: rgba(127,208,255,.15); color: #7fd0ff;
  }
  .quiz .stars { color: #ffd84a; font-size: 24px; letter-spacing: 4px; }
  .quiz .qtext { font-size: 20px; color: #fff; line-height: 1.45; }
  .quiz .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  @media (max-width: 520px) { .quiz .choices { grid-template-columns: 1fr; } }
  .panel button.choice {
    margin: 0; padding: 12px 14px; font-size: 16px; font-weight: 600; letter-spacing: 0; text-align: left;
    color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.3); box-shadow: none;
  }
  .panel button.choice { display: flex; align-items: center; gap: 12px; }
  .panel button.choice .letter {
    flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    font-size: 14px; font-weight: 800; color: #111; background: #ffd84a;
  }
  .panel button.choice:hover { background: rgba(127,208,255,.25); }
  .panel button.choice:disabled { cursor: default; opacity: .55; background: rgba(255,255,255,.08); }
  .panel button.choice.right { opacity: 1; background: #1f8a4c; border-color: #46e08a; }
  .panel button.choice.wrong { opacity: 1; background: #8a1f1f; border-color: #ff6a6a; }
  .panel button.hintbtn {
    margin-top: 12px; padding: 6px 14px; font-size: 14px; letter-spacing: 0; box-shadow: none;
    color: #ffd84a; background: transparent; border: 1px solid rgba(255,216,74,.5);
  }
  .panel button.hintbtn:hover { background: rgba(255,216,74,.12); }
  .quiz .hinttext { background: rgba(255,216,74,.1); border-left: 3px solid #ffd84a; padding: 8px 12px; border-radius: 6px; }
  .quiz .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; line-height: 1.5; color: #e6eefc; }
  .quiz .feedback.good { background: rgba(70,224,138,.12); border-left: 3px solid #46e08a; }
  .quiz .feedback.bad { background: rgba(255,154,106,.12); border-left: 3px solid #ff9a6a; }
  /* Bonus offer */
  .yesno { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .panel .yesno button.no { color: #cfd8ea; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3); box-shadow: none; }
  .panel .yesno button.no:hover { background: rgba(255,255,255,.2); }
  /* Book recommendation */
  .book {
    margin-top: 16px; padding: 14px 16px; text-align: left; border-radius: 10px;
    background: rgba(127,208,255,.08); border: 1px solid rgba(127,208,255,.35);
  }
  .book .bk-head { font-weight: 700; color: #7fd0ff; margin-bottom: 8px; }
  .book .bk-title { font-size: 19px; font-weight: 800; color: #fff; }
  .book .bk-author { color: #9fb0cc; font-style: italic; }
  .book p { margin: 8px 0; }
  .book a { color: #ffd84a; font-weight: 700; }
  #topbar { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 10; }
  #topbar button {
    width: 42px; height: 42px; font-size: 18px; color: #fff; cursor: pointer;
    background: rgba(20,30,50,.6); border: 1px solid rgba(255,255,255,.25); border-radius: 8px;
  }
  #topbar button:hover { background: rgba(60,80,120,.75); }
  #fireButtons { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 12px; z-index: 4; }
  #fireButtons button {
    width: 84px; height: 84px; border-radius: 50%; font-size: 12px; font-weight: 800; letter-spacing: 1px;
    color: #fff; border: 2px solid rgba(255,255,255,.6); touch-action: none;
  }
  #btnLaser { background: rgba(200,40,30,.55); }
  #btnTorp { background: rgba(40,120,220,.55); }
  #fireButtons button:active { filter: brightness(1.6); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topbar">
  <button id="btnPause" title="Pause (P)">❚❚</button>
  <button id="btnMute" title="Sound on/off (M)">🔊</button>
  <button id="btnFs" title="Fullscreen (F)">⛶</button>
</div>

<div id="fireButtons" class="hidden">
  <button id="btnLaser">LASER<br>CANNONS</button>
  <button id="btnTorp">PROTON<br>TORPEDO</button>
</div>

<div id="overlay">
  <div class="panel">
    <h1 id="ovTitle"></h1>
    <div id="ovBody"></div>
    <button id="ovBtn">START</button>
  </div>
</div>

<script>
'use strict';

// ---------- Constants ----------
const TW = 3;          // channel half-width
const TH = 5;          // channel depth (floor y=0, rim y=TH)
const VIEW = 230;      // draw distance
const SEG = 4;         // wall segment length
const NEAR = 0.4;      // near clip distance
const CAM_BACK = 5.5;  // camera distance behind ship
let SHIP_HW = 0.55, SHIP_HH = 0.28;   // vehicle hitbox half-size (set per world)
let FOG = [4, 6, 16];                 // distance haze colour (set per world)
const TOWER_HP = 3;    // 3 laser hits or 1 special weapon (torpedo / detonator / harpoon)
const TITLE_HTML = '<small>STAR WARS</small>X-WING STARFIGHTER RUN';

// Aim assist: radius = how far from your flight line an enemy can be and still get locked;
// turn = max sideways speed a shot can steer at (units/s).
const ASSIST = {
  off:  { label: 'OFF',    radius: 0,   turn: 0,        hint: 'No help — aim it yourself, pilot.' },
  low:  { label: 'LOW',    radius: 1.5, turn: 8,        hint: 'Shots bend slightly toward enemies near your crosshair.' },
  med:  { label: 'MEDIUM', radius: 3.2, turn: 22,       hint: 'Shots home in on the next enemy around you.' },
  full: { label: 'FULL',   radius: 99,  turn: Infinity, hint: 'Every shot seeks the next available enemy. Use the Force!' },
};

// Science quiz gate: correct answers needed before each level, and to get a new X-wing after a crash.
const QUIZ_NEED_LEVEL = 2;
const QUIZ_NEED_RETRY = 1;
// Optional bonus round before launch: each right answer earns a torpedo and extra shields.
const BONUS_QUESTIONS = 2;
const BONUS_TORP = 1;
const BONUS_SHIELD = 25;
const SHIELD_MAX = 150;   // bonus shields can go above the normal 100
const GRADES = {
  y: { label: 'YOUNGLING · AGES 7–8' },
  p: { label: 'PADAWAN · AGES 9–11' },
};

// Levels cycle through these worlds: 1 = Death Star, 2 = Endor, 3 = Hoth, 4 = Death Star (harder), …
// pool: obstacle types unlocked at difficulty tier 1, 2, 3 (tier goes up each time the cycle repeats).
const WORLDS = [
  {
    key: 'deathstar', name: 'THE DEATH STAR', vehicle: 'xwing', vehicleName: 'X-wing', hit: [0.55, 0.28],
    fog: [4, 6, 16], floor: [76, 80, 92], wallL: [112, 117, 130], wallR: [86, 90, 104], lights: true, clipEnd: true,
    obstacleRGB: [[118, 124, 136], [128, 116, 108], [104, 116, 130]],
    pool: [['low', 'high', 'left', 'right', 'center'], ['window', 'diag', 'window'], ['cross', 'window']],
    enemy: 'tower', guns: [[0.835, 0.204], [-0.835, -0.204], [-0.835, 0.204], [0.835, -0.204]],
    laserName: 'LASER CANNONS', secName: 'PROTON TORPEDOES', secOne: 'PROTON TORPEDO', secBtn: 'PROTON<br>TORPEDO', secVerb: 'FIRE TORPEDO',
    targetName: 'THERMAL EXHAUST PORT', targetShort: 'EXHAUST PORT',
    approachMsg: 'THERMAL EXHAUST PORT AHEAD — FIRE A TORPEDO!',
    laserMsg: 'LASERS WON\'T GET IN — USE A PROTON TORPEDO!',
    missMsg: 'NEGATIVE — IT JUST IMPACTED ON THE SURFACE',
    missedText: 'No proton torpedo went down the thermal exhaust port.',
    winTitle: 'GREAT SHOT!', winText: 'the thermal exhaust port is hit!',
    intro: 'Skim the Death Star\'s surface in an X-wing, dodge the bulkheads, blast the turbolaser towers as they pop up — and put a proton torpedo into the thermal exhaust port.',
  },
  {
    key: 'endor', name: 'THE FOREST MOON OF ENDOR', vehicle: 'bike', vehicleName: 'speeder bike', hit: [0.4, 0.3],
    fog: [34, 50, 38], floor: [58, 76, 42], path: [100, 84, 58], clipEnd: false,
    obstacleRGB: [[92, 64, 42], [82, 58, 40], [100, 70, 46]],
    pool: [['trunk', 'log', 'branch', 'twin'], ['twin', 'trunkLog', 'trunk'], ['twin', 'branchLow']],
    enemy: 'scout', guns: [[0, -0.15]],
    laserName: 'BLASTER CANNON', secName: 'THERMAL DETONATORS', secOne: 'THERMAL DETONATOR', secBtn: 'THERMAL<br>DETONATOR', secVerb: 'THROW DETONATOR',
    targetName: 'SHIELD GENERATOR BUNKER', targetShort: 'SHIELD BUNKER',
    approachMsg: 'SHIELD BUNKER AHEAD — HIT THE BLAST DOOR WITH A DETONATOR!',
    laserMsg: 'BLASTERS WON\'T OPEN IT — USE A THERMAL DETONATOR!',
    missMsg: 'MISSED THE BLAST DOOR!',
    missedText: 'No thermal detonator hit the bunker’s blast door.',
    winTitle: 'THE SHIELD IS DOWN!', winText: 'the shield generator bunker is destroyed!',
    intro: 'Race a speeder bike through the giant trees of Endor, dodge logs and branches, blast the Imperial scout troopers — and knock out the shield generator bunker with a thermal detonator.',
  },
  {
    key: 'hoth', name: 'THE ICE PLANET HOTH', vehicle: 'snowspeeder', vehicleName: 'snowspeeder', hit: [0.6, 0.22],
    fog: [206, 220, 232], floor: [228, 234, 242], wallL: [205, 218, 232], wallR: [172, 190, 210], lights: false, clipEnd: false,
    obstacleRGB: [[196, 218, 236], [182, 206, 228], [210, 226, 240]],
    pool: [['ridge', 'icicle', 'spire', 'legs'], ['arch', 'legs', 'iceL', 'iceR'], ['arch', 'legs']],
    enemy: 'probe', guns: [[0.6, 0], [-0.6, 0]],
    laserName: 'LASER CANNONS', secName: 'HARPOONS', secOne: 'HARPOON', secBtn: 'HARPOON<br>&amp; CABLE', secVerb: 'FIRE HARPOON',
    targetName: 'AT-AT WALKER — HARPOON ITS LEG', targetShort: 'AT-AT',
    approachMsg: 'AT-AT AHEAD — HARPOON ITS LEG!',
    laserMsg: 'LASERS CAN\'T PIERCE AT-AT ARMOR — USE YOUR HARPOON!',
    missMsg: 'THE HARPOON MISSED!',
    missedText: 'Your harpoon didn’t catch the AT-AT’s leg.',
    winTitle: 'THE AT-AT IS DOWN!', winText: 'your tow cable tripped the AT-AT walker!',
    intro: 'Fly a snowspeeder through the ice canyons of Hoth, dodge ice and walker legs, blast the probe droids — and trip the giant AT-AT with your harpoon and tow cable.',
  },
];
let world = WORLDS[0];
const worldFor = n => WORLDS[(n - 1) % WORLDS.length];
const tierFor = n => 1 + Math.floor((n - 1) / WORLDS.length);

// ---------- Canvas ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, F = 0, CX = 0, CY = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  F = Math.min(W * 0.9, H * 1.15);
  CX = W / 2; CY = H * 0.40;
}
window.addEventListener('resize', resize);
resize();

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

// ---------- Audio ----------
let muted = false;
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  function init() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  const ok = () => ac && !muted;
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (!ok()) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, f0, f1) {
    if (!ok()) return;
    const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const fl = ac.createBiquadFilter(); fl.type = 'lowpass';
    fl.frequency.setValueAtTime(f0, t);
    fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur);
  }
  return {
    init,
    laser()  { tone('square', 1400, 180, 0.13, 0.06); },
    torp()   { tone('sawtooth', 220, 900, 0.35, 0.08); noise(0.4, 0.25, 4000, 300); },
    empty()  { tone('square', 120, 100, 0.06, 0.05); },
    enemy()  { tone('sawtooth', 500, 120, 0.18, 0.025); },
    tick()   { tone('square', 900, 600, 0.05, 0.05); },
    rise()   { tone('triangle', 80, 220, 0.25, 0.05); },
    hit()    { noise(0.35, 0.5, 2000, 100); tone('sawtooth', 160, 40, 0.3, 0.12); },
    small()  { noise(0.4, 0.35, 2500, 150); },
    boom()   { noise(1.4, 0.9, 3000, 40); tone('sine', 90, 25, 1.2, 0.4); },
    pickup() { tone('sine', 600, 1200, 0.15, 0.15); tone('sine', 900, 1800, 0.15, 0.1, 0.08); },
    right()  { [660, 880, 1320].forEach((f, i) => tone('sine', f, f, 0.18, 0.12, i * 0.08)); },
    wrong()  { tone('triangle', 300, 200, 0.3, 0.1); },
    win()    { [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.35, 0.15, 0.4 + i * 0.13)); },
    lose()   { [392, 330, 262].forEach((f, i) => tone('triangle', f, f * 0.98, 0.4, 0.15, i * 0.18)); },
  };
})();

// ---------- Game state ----------
let state = 'menu';   // menu | quiz | playing | paused | pullup | victory | dead | overlay
let pausedFrom = null;
let level = 1, score = 0, levelStartScore = 0;
let bonus = { torp: 0, shield: 0 };   // earned in the bonus round, applied at launch
let grade = localStorage.getItem('xw_grade');
if (!GRADES[grade]) grade = 'y';
let hi = +(localStorage.getItem('xw_hi') || 0);
let assist = localStorage.getItem('xw_assist');
if (!ASSIST[assist]) assist = 'med';
let time = 0;

const player = { x: 0, y: 2, z: 0, vx: 0, vy: 0, bank: 0, shield: 100, inv: 0, fireCd: 0, torpCd: 0, gun: 0 };
const cam = { x: 0, y: 3, z: -CAM_BACK };
const target = { x: 0, y: 2 };
const input = { left: false, right: false, up: false, down: false, fire: false, torp: false, pointerFire: false, btnLaser: false, mouse: false };
const ammo = { laser: 0, torp: 0 };

let levelSpeed = 30, speed = 30, endZ = 1e9;
let port = { x: 0, y: 2, r: 1 };
let obstacles = [], towers = [], pickups = [], shots = [], bolts = [], particles = [];
let lockTarget = null;
let shake = 0, flash = 0, hitFlash = 0, stateTimer = 0;
let msg = '', msgT = 0, finalWarned = false;

function showMsg(text, t = 1.6) { msg = text; msgT = t; }

// ---------- Level generation ----------
function setWorld(w) {
  world = w;
  FOG = w.fog;
  [SHIP_HW, SHIP_HH] = w.hit;
  btnLaser.innerHTML = w.laserName.replace(' ', '<br>');
  btnTorp.innerHTML = w.secBtn;
}

// rects = collision boxes [x0, x1, y0, y1]; draw = what to render (e.g. tree trunks that rise above the
// play area); decor = extra scenery boxes that can't be hit (e.g. the body above AT-AT legs).
function makeObstacle(type, z, n) {
  let rects, draw = null, decor = null, depth = rand(0.8, 1.4);
  let rgb = pick(world.obstacleRGB);
  const tall = rs => rs.map(r => [r[0], r[1], r[2], r[3] >= TH ? TH + 14 : r[3]]);
  switch (type) {
    case 'low': case 'ridge':     rects = [[-TW, TW, 0, rand(1.9, 2.5)]]; break;
    case 'high': case 'icicle':   rects = [[-TW, TW, rand(2.4, 3.0), TH]]; break;
    case 'left': case 'iceL':     rects = [[-TW, rand(0, 0.8), 0, TH]]; break;
    case 'right': case 'iceR':    rects = [[rand(-0.8, 0), TW, 0, TH]]; break;
    case 'center': case 'spire': { const w = rand(0.7, 1.0); rects = [[-w, w, 0, TH]]; break; }
    case 'diag':
      rects = Math.random() < 0.5
        ? [[-TW, 0, 0, 2.5], [0, TW, 2.5, TH]]
        : [[0, TW, 0, 2.5], [-TW, 0, 2.5, TH]];
      break;
    case 'cross':  rects = [[-TW, TW, 0, 1.6], [-0.6, 0.6, 1.6, TH]]; break;
    case 'window': case 'arch': {
      const hw = clamp(1.3 - n * 0.05, 0.95, 1.3), hh = clamp(1.05 - n * 0.04, 0.8, 1.05);
      const hx = rand(-TW + hw + 0.2, TW - hw - 0.2), hy = rand(hh + 0.3, TH - hh - 0.3);
      rects = [[-TW, hx - hw, 0, TH], [hx + hw, TW, 0, TH],
               [hx - hw, hx + hw, 0, hy - hh], [hx - hw, hx + hw, hy + hh, TH]]
        .filter(r => r[1] - r[0] > 0.01 && r[3] - r[2] > 0.01);
      break;
    }
    // Endor
    case 'trunk': {
      const w = rand(0.9, 1.3), x = rand(-2, 2);
      rects = [[x - w / 2, x + w / 2, 0, TH]]; depth = w; draw = tall(rects);
      break;
    }
    case 'twin': rects = [[-2.05, -1.15, 0, TH], [1.15, 2.05, 0, TH]]; depth = 0.9; draw = tall(rects); break;
    case 'log': rects = [[-TW, TW, 0, rand(1.4, 2.0)]]; depth = 0.9; rgb = [106, 78, 52]; break;
    case 'branch': { const y = rand(2.5, 2.9); rects = [[-TW, TW, y, y + 0.6]]; depth = 0.5; rgb = [88, 64, 42]; break; }
    case 'branchLow': { const y = rand(1.5, 1.9); rects = [[-TW, TW, y, y + 0.55]]; depth = 0.5; rgb = [88, 64, 42]; break; }
    case 'trunkLog': {
      const x = rand(-1.5, 1.5);
      rects = [[-TW, TW, 0, 1.5], [x - 0.5, x + 0.5, 1.5, TH]]; depth = 1; draw = tall(rects);
      break;
    }
    // Hoth: a pair of AT-AT legs with the walker's body overhead
    case 'legs': {
      const c = rand(-0.5, 0.5);
      rects = [[c - 1.6, c - 1.0, 0, TH], [c + 1.0, c + 1.6, 0, TH]];
      draw = rects.map(r => [r[0], r[1], 0, 6.2]);
      depth = 0.6; rgb = [112, 115, 124];
      decor = { rects: [[c - 1.9, c + 1.9, 6.2, 8.4]], z0: z - 0.8, z1: z + 3.6, rgb: [120, 123, 132] };
      break;
    }
  }
  return { z, depth, rects, draw: draw || rects, decor, rgb, hit: false, passed: false };
}

// Enemies pop up as you approach: turbolaser towers rise from the Death Star surface,
// scout troopers swoop out from behind Endor's trees, probe droids rise out of Hoth's snow.
function makeEnemy(z) {
  const t = { kind: world.enemy, z, hp: TOWER_HP, pending: 0, rise: 0, alive: true, cd: rand(0.5, 2), flash: 0, hitFlash: 0, phase: rand(0, 6) };
  if (t.kind === 'tower') { t.side = pick(['L', 'R', 'F']); t.ax = rand(-2.2, 2.2); t.ay = rand(1, 4.2); }
  else if (t.kind === 'scout') { const s = pick([-1, 1]); t.fx = s * rand(1.2, 2.3); t.sx = s * 7; t.fy = rand(0.8, 2.2); }
  else { t.fx = rand(-2.2, 2.2); t.fy = rand(1.4, 3.6); t.sy = -0.8; }
  updateTowerPos(t);
  return t;
}

function towerBox(t) {
  if (t.kind === 'tower') {
    const h = 0.6 * t.rise;
    if (t.side === 'L') return [-TW, -TW + h, t.ay - 0.3, t.ay + 0.3];
    if (t.side === 'R') return [TW - h, TW, t.ay - 0.3, t.ay + 0.3];
    return [t.ax - 0.3, t.ax + 0.3, 0, h];
  }
  const hw = t.kind === 'scout' ? 0.45 : 0.35;
  return [t.x - hw, t.x + hw, t.y - 0.35, t.y + 0.35];
}
function updateTowerPos(t) {
  if (t.kind === 'tower') {
    const b = towerBox(t);
    t.x = (b[0] + b[1]) / 2; t.y = (b[2] + b[3]) / 2;
    return;
  }
  const e = 1 - (1 - t.rise) ** 2;
  const bob = Math.sin(time * 3 + t.phase) * 0.08 * t.rise;
  if (t.kind === 'scout') { t.x = t.sx + (t.fx - t.sx) * e; t.y = t.fy + bob; }
  else { t.x = t.fx + Math.sin(time * 1.3 + t.phase) * 0.15 * t.rise; t.y = t.sy + (t.fy - t.sy) * e + bob; }
}

let atatFall = 0;   // Hoth victory: how far the AT-AT has toppled (0..1)

function buildLevel(n) {
  setWorld(worldFor(n));
  const tier = tierFor(n);
  levelSpeed = Math.min(60, 30 + (n - 1) * 4);
  endZ = 900 + n * 300;
  obstacles = []; towers = []; pickups = [];
  atatFall = 0;

  const pool = world.pool.slice(0, tier).flat();
  const gapTime = Math.max(0.55, 1.1 - n * 0.08);
  const gap = gapTime * levelSpeed;
  let z = 70, prev = 30;
  while (z < endZ - 260) {
    obstacles.push(makeObstacle(pick(pool), z, n));
    const mid = (prev + z) / 2;
    const r = Math.random();
    if (r < Math.min(0.75, 0.3 + n * 0.1)) towers.push(makeEnemy(mid));
    else if (r > 0.88) {
      pickups.push({ kind: Math.random() < 0.5 ? 'shield' : 'ammo', x: rand(-2, 2), y: rand(1, 4), z: mid, taken: false });
    }
    prev = z;
    z += gap * rand(0.85, 1.35);
  }
  const r = Math.max(0.6, 1.15 - n * 0.1);
  if (world.key === 'deathstar') port = { x: rand(-1.8, 1.8), y: rand(1.2, 3.8), r };
  else if (world.key === 'endor') port = { x: rand(-1.6, 1.6), y: rand(1.2, 2.0), r };
  else port = { x: pick([-1, 1]), y: 2.7, r: Math.max(0.55, r * 0.9) };   // AT-AT front leg's knee
  ammo.laser = 100 + n * 20;
  ammo.torp = 5 + Math.floor(n / 2);
}

function snapCamera() {
  cam.x = player.x * 0.8;
  cam.y = Math.min(player.y + 1.0, TH - 0.15);
  cam.z = player.z - CAM_BACK;
}

function resetPlayer(z) {
  Object.assign(player, { x: 0, y: 2, z, vx: 0, vy: 0, bank: 0, inv: 1, fireCd: 0, torpCd: 0 });
  target.x = 0; target.y = 2;
  speed = levelSpeed;
  shots = []; bolts = [];
  for (const t of towers) t.pending = 0;
  snapCamera();
}

function startGame() {
  level = 1; score = 0; player.shield = 100;
  briefing();
}

// Every level is unlocked by answering science questions.
function briefing() {
  const w = worldFor(level);
  startQuiz(QUIZ_NEED_LEVEL, 'MISSION BRIEFING',
    `Level ${level} — ${w.name}: get ${QUIZ_NEED_LEVEL} questions right to launch your ${w.vehicleName}!`,
    () => offerBonus(() => startLevel(level)));
}

function retryLevel() {
  score = levelStartScore;
  player.shield = 100;
  startLevel(level);
}

function startLevel(n) {
  levelStartScore = score;
  buildLevel(n);
  resetPlayer(0);
  finalWarned = false;
  state = 'playing';
  hideOverlay();
  if (bonus.torp || bonus.shield) {
    ammo.torp += bonus.torp;
    player.shield = Math.min(SHIELD_MAX, player.shield + bonus.shield);
    showMsg(`BONUS: +${bonus.torp} ${bonus.torp === 1 ? world.secOne : world.secName}, +${bonus.shield} SHIELDS`, 3);
    bonus = { torp: 0, shield: 0 };
  } else showMsg(`LEVEL ${n}: ${world.name}`, 2.5);
}

function retryApproach() {
  resetPlayer(endZ - 260);
  finalWarned = false;
  let rearmed = false;
  if (ammo.torp < 2) { ammo.torp = 2; rearmed = true; }
  if (ammo.laser < 20) { ammo.laser = 20; rearmed = true; }
  state = 'playing';
  hideOverlay();
  showMsg(rearmed ? 'REARMED — LINE UP AND FIRE!' : 'LINE UP AND FIRE!', 2);
}

function menuScene() {
  state = 'menu';
  setWorld(worldFor(level));   // the quiz and menu background shows the world you're about to fly in
  obstacles = []; towers = []; pickups = []; shots = []; bolts = [];
  endZ = 1e9; levelSpeed = speed = 24;
}

// ---------- Particles ----------
function burst(x, y, z, n, cols, spd, size, life = 0.8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, b = Math.random() * Math.PI - Math.PI / 2;
    const v = spd * rand(0.3, 1);
    particles.push({
      x, y, z,
      vx: Math.cos(a) * Math.cos(b) * v, vy: Math.sin(b) * v, vz: Math.sin(a) * Math.cos(b) * v,
      life: life * rand(0.5, 1), max: life, col: pick(cols), size: size * rand(0.5, 1.2),
    });
  }
}
const FIRE = [[255, 230, 120], [255, 150, 40], [255, 90, 20], [255, 255, 220]];
const SPARK = [[255, 220, 140], [255, 180, 80]];
const BLUE = [[120, 200, 255], [200, 240, 255]];
const SNOW = [[200, 214, 230], [176, 194, 214]];

// ---------- Weapons ----------
// Is the straight line between two points free of bulkheads?
function clearShot(x0, y0, z0, x1, y1, z1) {
  for (const o of obstacles) {
    if (o.z + o.depth <= z0 || o.z >= z1) continue;
    const t = (o.z - z0) / (z1 - z0);
    const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
    if (o.rects.some(r => x > r[0] && x < r[1] && y > r[2] && y < r[3])) return false;
  }
  return true;
}

// Next available enemy for aim assist: the closest tower ahead that is within the assist radius,
// has a clear line of fire and isn't already going to be destroyed by shots in flight.
function pickTarget(kind) {
  const a = ASSIST[assist];
  if (!a.radius) return null;
  let best = null;
  for (const t of towers) {
    if (!t.alive || t.rise < 1 || t.pending >= t.hp) continue;
    const d = t.z - player.z;
    if (d < 6 || d > 130) continue;
    if (Math.abs(t.x - player.x) > a.radius || Math.abs(t.y - player.y) > a.radius) continue;
    if (best && t.z >= best.z) continue;
    if (!clearShot(player.x, player.y, player.z + 1, t.x, t.y, t.z - 0.3)) continue;
    best = t;
  }
  if (!best && kind === 'torp' && endZ - player.z < VIEW &&
      Math.hypot(port.x - player.x, port.y - player.y) < a.radius * 1.2) return 'port';
  return best;
}

function fireShot(kind) {
  const torp = kind === 'torp';
  if (ammo[kind] <= 0) {
    if (msgT <= 0.3) showMsg(torp ? `NO ${world.secName} LEFT` : `${world.laserName} DEPLETED`, 1);
    sfx.empty();
    return;
  }
  ammo[kind]--;
  let sx, sy;
  if (torp) { sx = player.x; sy = player.y - 0.15; }
  else {
    const g = world.guns[player.gun++ % world.guns.length];
    sx = player.x + g[0];
    sy = player.y + g[1];
  }
  const tgt = pickTarget(kind);
  const dmg = torp ? TOWER_HP : 1;
  if (tgt && tgt !== 'port') tgt.pending += dmg;
  shots.push({
    kind, dmg, tgt,
    x: sx, y: sy, z: player.z + 0.5, z0: player.z + 0.5,
    // unassisted shots converge onto the flight line; assisted ones steer from the muzzle
    bx: tgt ? sx : player.x, by: tgt ? sy : player.y,
    ox: tgt ? 0 : sx - player.x, oy: tgt ? 0 : sy - player.y,
    vx: 0, vy: 0, vz: speed + (torp ? 80 : 150), life: torp ? 4 : 1.7,
  });
  if (torp) sfx.torp(); else sfx.laser();
}

function hitTower(t, s) {
  t.hp -= s.dmg;
  if (t.hp <= 0) {
    t.alive = false;
    score += 150;
    sfx.small();
    burst(t.x, t.y, t.z, s.kind === 'torp' ? 50 : 30, FIRE, s.kind === 'torp' ? 9 : 6, 0.25, 0.8);
  } else {
    t.hitFlash = 0.12;
    sfx.tick();
    burst(s.x, s.y, t.z - 0.3, 8, SPARK, 4, 0.08, 0.3);
  }
}

function damage(a) {
  if (player.inv > 0) return;
  player.shield -= a;
  player.inv = 0.8;
  shake = 0.6; hitFlash = 1;
  sfx.hit();
  burst(player.x, player.y, player.z, 18, SPARK, 6, 0.12, 0.5);
  if (player.shield <= 0) { player.shield = 0; die(); }
}

function die() {
  state = 'dead';
  stateTimer = 2;
  shake = 1.3; flash = 0.6;
  sfx.boom();
  burst(player.x, player.y, player.z, 70, FIRE, 9, 0.35, 1.3);
  shots = [];
}

function victory() {
  state = 'victory';
  stateTimer = 3;
  flash = 1; shake = 1.4;
  const ammoBonus = ammo.laser * 5 + ammo.torp * 100;
  const bonus = 1000 * level + Math.round(player.shield) * 10 + ammoBonus;
  score += bonus;
  victory.bonus = bonus;
  victory.ammoBonus = ammoBonus;
  sfx.boom(); sfx.win();
  burst(port.x, port.y, endZ - 0.5, 120, FIRE, 14, 0.6, 1.6);
  shots = []; bolts = [];
  showMsg('DIRECT HIT!', 2.5);
}

function saveHi() {
  if (score > hi) { hi = Math.floor(score); localStorage.setItem('xw_hi', hi); }
}

// ---------- Update ----------
function updateSteering(dt) {
  const KS = 8;
  if (!input.mouse) {
    target.x += ((input.right ? 1 : 0) - (input.left ? 1 : 0)) * KS * dt;
    target.y += ((input.up ? 1 : 0) - (input.down ? 1 : 0)) * KS * dt;
  }
  target.x = clamp(target.x, -TW + SHIP_HW + 0.05, TW - SHIP_HW - 0.05);
  target.y = clamp(target.y, SHIP_HH + 0.15, TH - 0.4);
  const MAXV = 10;
  const dvx = clamp((target.x - player.x) * 8, -MAXV, MAXV);
  const dvy = clamp((target.y - player.y) * 8, -MAXV, MAXV);
  const k = Math.min(1, dt * 10);
  player.vx += (dvx - player.vx) * k;
  player.vy += (dvy - player.vy) * k;
  player.x = clamp(player.x + player.vx * dt, -TW + SHIP_HW, TW - SHIP_HW);
  player.y = clamp(player.y + player.vy * dt, SHIP_HH + 0.1, TH - 0.3);
  player.bank += (player.vx * 0.06 - player.bank) * Math.min(1, dt * 8);
}

function updateShots(dt) {
  const turn = ASSIST[assist].turn;
  for (const s of shots) {
    const pz = s.z;
    // aim-assist steering
    if (s.tgt && s.tgt !== 'port' && !s.tgt.alive) s.tgt = null;
    if (s.tgt) {
      const tx = s.tgt === 'port' ? port.x : s.tgt.x;
      const ty = s.tgt === 'port' ? port.y : s.tgt.y;
      const tz = s.tgt === 'port' ? endZ : s.tgt.z - 0.3;
      const tt = Math.max(0.02, (tz - s.z) / s.vz);
      s.vx = clamp((tx - s.x) / tt, -turn, turn);
      s.vy = clamp((ty - s.y) / tt, -turn, turn);
    }
    s.z += s.vz * dt; s.life -= dt;
    s.bx += s.vx * dt; s.by += s.vy * dt;
    const c = Math.max(0, 1 - (s.z - s.z0) / 25);
    s.x = s.bx + s.ox * c; s.y = s.by + s.oy * c;

    // bulkheads
    for (const o of obstacles) {
      if (s.z >= o.z && pz <= o.z + o.depth && o.z > pz - 2) {
        if (o.rects.some(r => s.x > r[0] && s.x < r[1] && s.y > r[2] && s.y < r[3])) {
          s.life = 0;
          if (s.kind === 'torp') { burst(s.x, s.y, o.z - 0.05, 30, FIRE, 6, 0.2, 0.6); sfx.small(); }
          else burst(s.x, s.y, o.z - 0.05, 6, SPARK, 4, 0.08, 0.3);
          break;
        }
      }
    }
    if (s.life <= 0) continue;

    // turbolaser towers
    for (const t of towers) {
      if (!t.alive || t.rise <= 0.2) continue;
      const b = towerBox(t);
      if (s.z >= t.z - 0.4 && pz <= t.z + 0.4 &&
          s.x > b[0] - 0.25 && s.x < b[1] + 0.25 && s.y > b[2] - 0.25 && s.y < b[3] + 0.25) {
        s.life = 0;
        hitTower(t, s);
        break;
      }
    }
    if (s.life <= 0) continue;

    // final target (exhaust port / bunker blast door / AT-AT leg)
    if (s.z >= endZ) {
      s.life = 0;
      const inPort = Math.hypot(s.x - port.x, s.y - port.y) < port.r;
      // the Death Star wall and the bunker are solid; on Hoth only the AT-AT's legs stop a shot
      const solid = world.key !== 'hoth' || (Math.abs(Math.abs(s.x) - 1) < 0.32 && s.y < 5.6);
      if (s.kind === 'torp') {
        if (inPort) { victory(); return; }
        if (solid) { burst(s.x, s.y, endZ - 0.1, 40, FIRE, 7, 0.25, 0.7); sfx.small(); }
        showMsg(world.missMsg, 1.6);
      } else {
        if (solid) burst(s.x, s.y, endZ - 0.05, 8, SPARK, 4, 0.1, 0.35);
        if (inPort) showMsg(world.laserMsg, 1.8);
      }
    }
  }
  shots = shots.filter(s => {
    if (s.life > 0) return true;
    if (s.tgt && s.tgt !== 'port') s.tgt.pending -= s.dmg;
    return false;
  });
}

function updatePlaying(dt) {
  const prevZ = player.z;
  player.z += speed * dt;
  score += speed * dt * 0.2;
  player.inv = Math.max(0, player.inv - dt);
  updateSteering(dt);

  // Fire
  player.fireCd -= dt; player.torpCd -= dt;
  if ((input.fire || input.pointerFire || input.btnLaser) && player.fireCd <= 0) {
    fireShot('laser');
    player.fireCd = ammo.laser > 0 ? 0.16 : 0.4;
  }
  if (input.torp && player.torpCd <= 0) {
    input.torp = false;   // one torpedo per press
    fireShot('torp');
    player.torpCd = 0.7;
  }

  // Bulkhead collisions
  for (const o of obstacles) {
    if (o.passed) continue;
    // Swept test: ship span this frame overlaps the obstacle's depth
    if (!o.hit && player.z + 0.5 > o.z && prevZ - 0.5 < o.z + o.depth) {
      for (const r of o.rects) {
        if (player.x + SHIP_HW > r[0] && player.x - SHIP_HW < r[1] &&
            player.y + SHIP_HH > r[2] && player.y - SHIP_HH < r[3]) {
          o.hit = true;
          player.inv = 0;
          damage(30);
          showMsg('DEFLECTORS HIT!', 1);
          break;
        }
      }
    }
    if (player.z - 0.5 > o.z + o.depth) {
      o.passed = true;
      if (!o.hit) score += 50;
    }
  }
  if (state !== 'playing') return;

  // Towers pop up and fire
  const boltSpeed = 40 + level * 3;
  for (const t of towers) {
    if (!t.alive) continue;
    t.flash = Math.max(0, t.flash - dt);
    t.hitFlash = Math.max(0, t.hitFlash - dt);
    const d = t.z - player.z;
    if (t.rise < 1 && d < 150) {
      if (t.rise === 0) {
        sfx.rise();
        if (t.kind === 'tower') burst(t.x, t.y, t.z, 10, SPARK, 2, 0.1, 0.5);
        else if (t.kind === 'probe') burst(t.fx, 0.1, t.z, 16, SNOW, 3, 0.14, 0.7);
      }
      t.rise = Math.min(1, t.rise + dt * 1.6);
    }
    if (d < 160) updateTowerPos(t);
    if (t.hp < TOWER_HP && Math.random() < dt * 6) burst(t.x, t.y + 0.3, t.z, 1, FIRE, 1.5, 0.12, 0.5);
    if (t.rise >= 1 && d > 20 && d < 120) {
      t.cd -= dt;
      if (t.cd <= 0) {
        t.cd = rand(1.4, 2.6) / (1 + level * 0.12);
        t.flash = 0.15;
        const T = d / (boltSpeed + speed);
        const ax = player.x + rand(-0.3, 0.3), ay = player.y + rand(-0.3, 0.3), az = player.z + speed * T;
        const dx = ax - t.x, dy = ay - t.y, dz = az - t.z;
        const len = Math.hypot(dx, dy, dz) || 1;
        bolts.push({ x: t.x, y: t.y, z: t.z - 0.35, vx: dx / len * boltSpeed, vy: dy / len * boltSpeed, vz: dz / len * boltSpeed, life: 4 });
        sfx.enemy();
      }
    }
  }

  // Enemy bolts
  for (const b of bolts) {
    const pz = b.z;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt; b.life -= dt;
    if ((pz - prevZ) >= -0.6 && (b.z - player.z) <= 0.6 &&
        Math.abs(b.x - player.x) < 0.65 && Math.abs(b.y - player.y) < 0.45) {
      b.life = 0;
      damage(12);
    }
  }
  bolts = bolts.filter(b => b.life > 0 && b.z > cam.z);
  if (state !== 'playing') return;

  updateShots(dt);
  if (state !== 'playing') return;
  lockTarget = pickTarget('laser');

  // Pickups
  for (const p of pickups) {
    if (p.taken) continue;
    if (player.z + 0.8 > p.z && prevZ - 0.8 < p.z &&
        Math.abs(p.x - player.x) < 1 && Math.abs(p.y - player.y) < 0.9) {
      p.taken = true;
      score += 50;
      sfx.pickup();
      if (p.kind === 'shield') {
        player.shield = Math.max(player.shield, Math.min(100, player.shield + 25));
        showMsg('+25 DEFLECTOR SHIELDS', 1);
        burst(p.x, p.y, p.z, 20, BLUE, 4, 0.12, 0.5);
      } else {
        ammo.laser += 30; ammo.torp += 1;
        showMsg(`+30 SHOTS  +1 ${world.secOne}`, 1);
        burst(p.x, p.y, p.z, 20, SPARK, 4, 0.12, 0.5);
      }
    }
  }

  // Final approach
  if (!finalWarned && endZ - player.z < 230) {
    finalWarned = true;
    showMsg(world.approachMsg, 2.5);
  }
  if (player.z > endZ - 10) {
    state = 'pullup';
    stateTimer = 1.4;
    showMsg('PULL UP!', 1.4);
  }
}

function updatePullup(dt) {
  speed *= Math.max(0, 1 - dt * 2);
  player.z = Math.min(player.z + speed * dt, endZ - 3);
  player.y += 9 * dt;
  player.bank *= 0.95;
  stateTimer -= dt;
  if (stateTimer <= 0) {
    player.shield -= 25;
    sfx.lose();
    if (player.shield <= 0) { player.shield = 0; crashed(); return; }
    state = 'overlay';
    showOverlay('MISSED!',
      `<p class="big">${world.missedText}</p>
       <p>Loop around for another run. Deflector shields −25.</p>`,
      'TRY AGAIN', retryApproach);
  }
}

function updateVictory(dt) {
  speed *= Math.max(0, 1 - dt * 1.2);
  player.z = Math.min(player.z + speed * dt, endZ - 6);
  stateTimer -= dt;
  if (stateTimer < 2.6) player.y += 7 * dt;
  if (world.key === 'hoth') atatFall = Math.min(1, atatFall + dt * 0.55);
  if (Math.random() < dt * 12) {
    burst(port.x + rand(-2, 2), port.y + rand(-1.5, 1.5), endZ - 0.5, 25, FIRE, 9, 0.5, 1.2);
    shake = Math.max(shake, 0.4);
  }
  if (stateTimer <= 0) {
    saveHi();
    state = 'overlay';
    showOverlay(world.winTitle,
      `<p class="big">Level ${level} complete — ${world.winText}</p>
       <p>Next mission: <b>${worldFor(level + 1).name}</b> in a ${worldFor(level + 1).vehicleName}!</p>
       <p>Bonus: <b>+${victory.bonus}</b> (unused ammo: +${victory.ammoBonus})</p>
       <p>Score: <b>${Math.floor(score)}</b></p>
       ${bookCard()}`,
      'NEXT LEVEL', () => { level++; player.shield = Math.max(player.shield, Math.min(100, player.shield + 30)); briefing(); });
  }
}

function crashed() {
  saveHi();
  state = 'overlay';
  sfx.lose();
  showOverlay(`${world.vehicleName.toUpperCase()} DESTROYED`,
    `<p class="big">Don't give up, pilot!</p>
     <p>Answer ${QUIZ_NEED_RETRY} science question correctly in the repair bay to get a new ${world.vehicleName}
     and try level ${level} again.</p>
     <p>High score: ${hi}</p>`,
    'TO THE REPAIR BAY',
    () => startQuiz(QUIZ_NEED_RETRY, 'REPAIR BAY',
      `Get ${QUIZ_NEED_RETRY} right and the mechanics will rebuild your ${world.vehicleName}!`, () => offerBonus(retryLevel)));
}

function updateCamera(dt) {
  const tx = player.x * 0.8, ty = Math.min(player.y + 1.0, TH - 0.15);
  const k = Math.min(1, dt * 6);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  cam.z = player.z - CAM_BACK;
}

function update(dt) {
  time += dt;
  if (msgT > 0) msgT -= dt;
  shake = Math.max(0, shake - dt * 2.5);
  flash = Math.max(0, flash - dt * 0.8);
  hitFlash = Math.max(0, hitFlash - dt * 2);

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vx *= 0.97; p.vy *= 0.97; p.vz *= 0.97;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  if (state === 'menu' || state === 'quiz') {
    player.z += speed * dt;
    const nx = Math.sin(time * 0.6) * 1.6, ny = 2.4 + Math.sin(time * 0.9) * 1.2;
    player.vx = (nx - player.x) / Math.max(dt, 1e-3);
    player.x = nx; player.y = ny;
    player.bank += (player.vx * 0.06 - player.bank) * Math.min(1, dt * 8);
  } else if (state === 'playing') updatePlaying(dt);
  else if (state === 'pullup') updatePullup(dt);
  else if (state === 'victory') updateVictory(dt);
  else if (state === 'dead') {
    speed *= Math.max(0, 1 - dt * 1.5);
    player.z += speed * dt;
    stateTimer -= dt;
    if (stateTimer <= 0) crashed();
  }
  if (state !== 'overlay') updateCamera(dt);
}

// ---------- Rendering ----------
function proj(x, y, z) {
  const dz = z - cam.z;
  if (dz < 0.1) return null;
  const s = F / dz;
  return { x: CX + (x - cam.x) * s, y: CY - (y - cam.y) * s, s };
}

function shade(r, g, b, d) {
  let k = 1 - d / VIEW;
  k = k < 0 ? 0 : k > 1 ? 1 : k;
  k = Math.pow(k, 1.2);
  return `rgb(${(FOG[0] + (r - FOG[0]) * k) | 0},${(FOG[1] + (g - FOG[1]) * k) | 0},${(FOG[2] + (b - FOG[2]) * k) | 0})`;
}

function face(pts, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const q = proj(pts[i][0], pts[i][1], pts[i][2]);
    if (!q) return;
    if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

// Draw a group of axis-aligned boxes sharing the same z-range: side faces first, then fronts.
function drawBoxes(rects, z0, z1, rgb, inset) {
  const n = cam.z + NEAR;
  if (z1 <= n) return;
  const front = z0 >= n;
  if (!front) z0 = n;
  const d = z0 - cam.z;
  const [r, g, b] = rgb;
  const edge = shade(r * 0.45, g * 0.45, b * 0.45, d);
  for (const [x0, x1, y0, y1] of rects) {
    if (cam.y > y1) face([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], shade(r * 1.3, g * 1.3, b * 1.3, d), edge);
    if (cam.y < y0) face([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], shade(r * 0.45, g * 0.45, b * 0.45, d), edge);
    if (cam.x < x0) face([[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], shade(r * 0.85, g * 0.85, b * 0.85, d), edge);
    if (cam.x > x1) face([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], shade(r * 0.65, g * 0.65, b * 0.65, d), edge);
  }
  if (!front) return;
  for (const [x0, x1, y0, y1] of rects) {
    face([[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], shade(r, g, b, d), edge);
    if (inset && x1 - x0 > 0.7 && y1 - y0 > 0.7) {
      const m = 0.18, zz = z0 - 0.01;
      face([[x0 + m, y0 + m, zz], [x1 - m, y0 + m, zz], [x1 - m, y1 - m, zz], [x0 + m, y1 - m, zz]],
        shade(r * 0.78, g * 0.78, b * 0.78, d));
    }
  }
}

const stars = Array.from({ length: 260 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() }));
const canopy = Array.from({ length: 50 }, () => ({ x: Math.random(), y: Math.random() * 0.12, r: rand(0.04, 0.1), c: pick(['#0c1d12', '#12291a', '#091610', '#183520']) }));
const peaks = Array.from({ length: 26 }, (_, i) => ({ x: i / 25, h: i % 2 ? rand(0.02, 0.05) : rand(0.06, 0.12) }));
const flakes = Array.from({ length: 150 }, () => ({ x: Math.random(), y: Math.random(), s: rand(1, 3.2), v: rand(0.08, 0.25) }));

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (world.key === 'deathstar') { g.addColorStop(0, '#02030a'); g.addColorStop(1, '#0a0f24'); }
  else if (world.key === 'endor') { g.addColorStop(0, '#07110a'); g.addColorStop(0.45, '#2a4432'); g.addColorStop(1, '#3d5a45'); }
  else { g.addColorStop(0, '#7f9cb8'); g.addColorStop(0.42, '#d6e3ee'); g.addColorStop(1, '#eef4f8'); }
  ctx.fillStyle = g;
  ctx.fillRect(-30, -30, W + 60, H + 60);
  if (world.key === 'deathstar') {
    for (const s of stars) {
      let x = (s.x * W * 1.3 - cam.x * 6 * (0.5 + s.s)) % W;
      if (x < 0) x += W;
      const y = s.y * H * 0.9 + cam.y * 4;
      const tw = 0.5 + 0.5 * Math.sin(time * 2 + s.x * 50);
      ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.6 * s.s * tw})`;
      const sz = s.s > 0.9 ? 2 : 1.2;
      ctx.fillRect(x, y, sz, sz);
    }
  } else if (world.key === 'hoth') {
    // distant snowy mountains on the horizon
    const off = -cam.x * 4;
    ctx.fillStyle = '#b2c4d6';
    ctx.beginPath(); ctx.moveTo(-60, CY + 2);
    for (const p of peaks) ctx.lineTo(p.x * (W + 120) - 60 + off, CY - p.h * H);
    ctx.lineTo(W + 60, CY + 2); ctx.closePath(); ctx.fill();
  }
}

// Endor's treetops close over the path like a ceiling of leaves
function drawCanopy() {
  ctx.fillStyle = '#081209';
  ctx.fillRect(-30, -30, W + 60, H * 0.04 + 30);
  for (const b of canopy) {
    let x = (b.x * W * 1.3 - cam.x * 12) % (W * 1.3);
    if (x < 0) x += W * 1.3;
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.arc(x - W * 0.15, b.y * H, b.r * Math.max(W, H), 0, Math.PI * 2); ctx.fill();
  }
}

function drawSnowfall() {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const f of flakes) {
    let x = (f.x + Math.sin(time * 0.7 + f.y * 9) * 0.02 - cam.x * 0.01 * f.s) % 1;
    if (x < 0) x += 1;
    const y = (f.y + time * f.v * (0.6 + f.s * 0.3)) % 1;
    ctx.beginPath(); ctx.arc(x * W, y * H, f.s, 0, Math.PI * 2); ctx.fill();
  }
}

// Death Star trench and Hoth ice canyon: a floor and two walls, drawn in segments far → near
function drawSurface() {
  if (world.key === 'endor') return drawForest();
  const near = cam.z + NEAR;
  const zEnd = world.clipEnd ? endZ : Infinity;
  const startSeg = Math.floor(near / SEG);
  const endSeg = Math.floor(Math.min(cam.z + VIEW, zEnd) / SEG);
  const [fr, fg, fb] = world.floor, [lr, lg, lb] = world.wallL, [rr, rg, rb] = world.wallR;
  const ice = world.key === 'hoth';
  const vr = ice ? 10 : 18;
  for (let i = endSeg; i >= startSeg; i--) {
    const z0 = Math.max(i * SEG, near), z1 = Math.min((i + 1) * SEG, zEnd);
    if (z0 >= z1) continue;
    const d = z0 - cam.z;
    const v = (hash(i) - 0.5) * vr;
    const line = ice ? shade(160, 180, 204, d) : shade(30, 32, 40, d);
    face([[-TW, 0, z0], [TW, 0, z0], [TW, 0, z1], [-TW, 0, z1]], shade(fr + v, fg + v, fb + v, d), line);
    face([[-TW, 0, z0], [-TW, TH, z0], [-TW, TH, z1], [-TW, 0, z1]], shade(lr + v, lg + v, lb + v, d), line);
    face([[TW, 0, z0], [TW, TH, z0], [TW, TH, z1], [TW, 0, z1]], shade(rr + v, rg + v, rb + v, d), line);

    // Surface details (greebles / ice cracks) and lights
    for (let k = 0; k < 4; k++) {
      const h = hash(i * 13 + k * 3.1);
      const y0 = hash(i * 17 + k) * TH * 0.85;
      const hh = Math.min(0.3 + hash(i * 19 + k) * 1.3, TH - y0);
      let za = i * SEG + hash(i * 23 + k) * SEG * 0.6;
      let zb = Math.min(za + 0.4 + hash(i * 29 + k) * 1.4, (i + 1) * SEG, zEnd);
      if (zb <= near) continue;
      za = Math.max(za, near);
      if (za >= zb) continue;
      const light = world.lights && hash(i * 31 + k) < 0.12;
      const left = h < 0.5;
      const x = left ? -TW + 0.01 : TW - 0.01;
      if (light) {
        const ly0 = y0, ly1 = y0 + 0.15;
        face([[x, ly0, za], [x, ly1, za], [x, ly1, Math.min(zb, za + 0.5)], [x, ly0, Math.min(zb, za + 0.5)]],
          `rgba(255,${200 + (h * 50) | 0},120,${clamp(1 - d / VIEW, 0, 1)})`);
      } else {
        const c = h < 0.25 || h > 0.75 ? (ice ? 0.88 : 0.7) : (ice ? 1.06 : 1.25);
        const [br, bg, bb] = left ? world.wallL : world.wallR;
        face([[x, y0, za], [x, y0 + hh, za], [x, y0 + hh, zb], [x, y0, zb]],
          shade((br + v) * c, (bg + v) * c, (bb + v) * c, d));
      }
    }
    if (hash(i * 37) < 0.6) {
      const fx = -TW + hash(i * 41) * (TW * 2 - 1.2);
      const fw = 0.4 + hash(i * 43) * 0.8;
      let za = Math.max(i * SEG + hash(i * 47) * 2, near);
      const zb = Math.min(za + 0.6 + hash(i * 53) * 1.3, zEnd);
      const k = ice ? 0.92 : 0.76;
      if (za < zb) face([[fx, 0.01, za], [fx + fw, 0.01, za], [fx + fw, 0.01, zb], [fx, 0.01, zb]], shade((fr + v) * k, (fg + v) * k, (fb + v) * k, d));
    }
  }
}

// Endor: a dirt path through a forest of giant trees
function drawForest() {
  const near = cam.z + NEAR;
  const startSeg = Math.floor(near / SEG);
  const endSeg = Math.floor((cam.z + VIEW) / SEG);
  const [fr, fg, fb] = world.floor, [pr, pg, pb] = world.path;
  for (let i = endSeg; i >= startSeg; i--) {
    const z0 = Math.max(i * SEG, near), z1 = (i + 1) * SEG;
    const d = z0 - cam.z;
    const v = (hash(i) - 0.5) * 14;
    face([[-60, 0, z0], [60, 0, z0], [60, 0, z1], [-60, 0, z1]], shade(fr + v, fg + v, fb + v * 0.5, d));
    face([[-TW - 0.3, 0.005, z0], [TW + 0.3, 0.005, z0], [TW + 0.3, 0.005, z1], [-TW - 0.3, 0.005, z1]], shade(pr + v, pg + v, pb + v, d));
    // ferns and bushes beside the path
    {
      const side = hash(i * 7) < 0.5 ? -1 : 1;
      const x = side * (TW + 0.6 + hash(i * 9) * 5), w = 0.4 + hash(i * 11) * 0.6;
      const za = i * SEG + hash(i * 13) * 2;
      drawBoxes([[x - w, x + w, 0, 0.3 + hash(i * 15) * 0.6]], za, za + w * 1.5, [42 + v, 74 + v, 34], false);
    }
    // giant tree trunks (none past the bunker)
    if (i * SEG > endZ - 6) continue;
    for (let k = 0; k < 3; k++) {
      const h = hash(i * 5 + k * 1.7);
      if (h > 0.72) continue;
      const side = k === 1 ? (hash(i * 3) < 0.5 ? -1 : 1) : (k === 0 ? -1 : 1);
      const w = 0.7 + hash(i * 19 + k) * 1.3;
      const x = side * (TW + 0.8 + w / 2 + hash(i * 23 + k) * 9);
      const za = i * SEG + hash(i * 29 + k) * (SEG - 1);
      const t = (hash(i * 31 + k) - 0.5) * 16;
      drawBoxes([[x - w / 2, x + w / 2, 0, TH + 20]], za, za + w, [86 + t, 60 + t * 0.7, 40 + t * 0.4], false);
    }
  }
}

function drawEndWall() {
  const d = endZ - cam.z;
  if (d > VIEW + 10 || d < NEAR) return;
  face([[-TW, 0, endZ], [TW, 0, endZ], [TW, TH, endZ], [-TW, TH, endZ]], shade(98, 102, 116, d), shade(40, 42, 50, d));
  for (let yy = 1; yy < TH; yy++) {
    const a = proj(-TW, yy, endZ), b = proj(TW, yy, endZ);
    ctx.strokeStyle = shade(70, 72, 84, d); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  const p = proj(port.x, port.y, endZ);
  const R = port.r * p.s;
  ctx.fillStyle = shade(60, 62, 72, d);
  ctx.beginPath(); ctx.arc(p.x, p.y, R * 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = shade(30, 31, 38, d);
  ctx.beginPath(); ctx.arc(p.x, p.y, R * 1.35, 0, Math.PI * 2); ctx.fill();
  const pulse = 0.65 + 0.35 * Math.sin(time * 6);
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
  g.addColorStop(0, `rgba(255,240,180,${pulse})`);
  g.addColorStop(0.5, `rgba(255,120,30,${0.9 * pulse})`);
  g.addColorStop(1, 'rgba(60,10,0,1)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
}

// Pulsing target marker
function targetGlow(x, y, z, r, col) {
  const p = proj(x, y, z);
  if (!p) return;
  const R = r * p.s, pulse = 0.65 + 0.35 * Math.sin(time * 6);
  ctx.save();
  ctx.strokeStyle = `rgba(${col},0.9)`; ctx.lineWidth = Math.max(2, R * 0.12);
  ctx.beginPath(); ctx.arc(p.x, p.y, R * 1.1, 0, Math.PI * 2); ctx.stroke();
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
  g.addColorStop(0, `rgba(255,255,240,${pulse})`);
  g.addColorStop(0.5, `rgba(${col},${0.85 * pulse})`);
  g.addColorStop(1, `rgba(${col},0.1)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Endor: the shield generator bunker, built into a hillside
function drawBunker(d) {
  const z = endZ, x = port.x;
  face([[-18, 0, z + 0.5], [18, 0, z + 0.5], [13, 12, z + 30], [-13, 12, z + 30]], shade(38, 58, 36, d));
  face([[-4.6, 0, z], [4.6, 0, z], [4.6, 3.9, z], [-4.6, 3.9, z]], shade(122, 126, 112, d), shade(70, 72, 64, d));
  drawBoxes([[-5, 5, 3.9, 4.5]], z - 0.6, z + 2.5, [104, 108, 96], false);
  face([[x - 1.3, 0, z - 0.01], [x + 1.3, 0, z - 0.01], [x + 1.3, 3.4, z - 0.01], [x - 1.3, 3.4, z - 0.01]], shade(70, 72, 68, d));
  face([[x - 1.05, 0, z - 0.02], [x + 1.05, 0, z - 0.02], [x + 1.05, 3.1, z - 0.02], [x - 1.05, 3.1, z - 0.02]], shade(150, 152, 142, d));
  ctx.strokeStyle = shade(96, 98, 90, d); ctx.lineWidth = 1.5;
  for (let yy = 0.45; yy < 3.1; yy += 0.45) {
    const a = proj(x - 1.05, yy, z - 0.03), b = proj(x + 1.05, yy, z - 0.03);
    if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  }
  if (state !== 'victory') targetGlow(port.x, port.y, z - 0.04, port.r, '255,190,70');
}

// Hoth: a giant AT-AT walker; when tripped by the tow cable it topples sideways
function drawATAT() {
  const fs = port.x > 0 ? 1 : -1;
  const a = atatFall * atatFall * 1.4;
  drawMesh(MESH.atat, { x: 0, y: 0, z: endZ, roll: -fs * a, pivot: [fs * 1.4, 0, 0] });
  if (state !== 'victory') targetGlow(port.x, port.y, endZ - 0.37, port.r, '90,210,255');
}

function drawEnd() {
  const d = endZ - cam.z;
  if (d > VIEW + 10 || d < NEAR) return;
  if (world.key === 'deathstar') drawEndWall();
  else if (world.key === 'endor') drawBunker(d);
  else drawATAT();
}

function drawTower(t) {
  if (t.rise <= 0) return;
  const b = towerBox(t);
  const dmg = t.hp / TOWER_HP;
  const rgb = t.hitFlash > 0 ? [235, 235, 235] : [50 + 22 * dmg, 52 + 22 * dmg, 60 + 24 * dmg];
  drawBoxes([b], t.z - 0.3, t.z + 0.3, rgb, false);
  if (t.rise < 1) return;
  // barrel pointing at the incoming X-wing
  drawBoxes([[t.x - 0.06, t.x + 0.06, t.y - 0.06, t.y + 0.06]], t.z - 0.7, t.z - 0.3, [40, 42, 48], false);
  const p = proj(t.x, t.y, t.z - 0.71);
  if (!p) return;
  const r = Math.max(1.5, (t.flash > 0 ? 0.28 : 0.1) * p.s);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.5);
  g.addColorStop(0, 'rgba(255,120,100,1)'); g.addColorStop(0.4, 'rgba(255,30,20,0.8)'); g.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawPickup(pk) {
  const p = proj(pk.x, pk.y, pk.z);
  if (!p) return;
  const r = 0.45 * p.s * (1 + 0.12 * Math.sin(time * 8));
  const shield = pk.kind === 'shield';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 1.6);
  if (shield) { g.addColorStop(0, 'rgba(230,250,255,1)'); g.addColorStop(0.35, 'rgba(90,180,255,0.9)'); g.addColorStop(1, 'rgba(40,100,255,0)'); }
  else { g.addColorStop(0, 'rgba(255,250,220,1)'); g.addColorStop(0.35, 'rgba(255,170,40,0.9)'); g.addColorStop(1, 'rgba(255,100,0,0)'); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = shield ? 'rgba(180,230,255,0.9)' : 'rgba(255,220,150,0.9)';
  ctx.lineWidth = Math.max(1, r * 0.12);
  ctx.beginPath(); ctx.ellipse(p.x, p.y, r * 1.3, r * 0.45, time * 2, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawShadow() {
  const p = proj(player.x, 0.02, player.z);
  if (!p) return;
  const a = clamp(0.45 - player.y * 0.06, 0.1, 0.45);
  ctx.fillStyle = `rgba(0,0,0,${a})`;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, 0.9 * p.s, 0.25 * p.s, 0, 0, Math.PI * 2);
  ctx.fill();
}

// ---------- 3D models ----------
// A mesh is a list of flat faces { p: [[x, y, z], ...], c: [r, g, b], e: glows? }.
// Local axes: x = right, y = up, z = forward (nose).
function rectAt(x0, x1, y0, y1, z) { return [[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]]; }
function ringAt(cx, cy, r, z, n = 8) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = (i + 0.5) / n * Math.PI * 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r, z]); }
  return p;
}
function addPrism(m, A, B, c, e) {
  m.push({ p: A, c, e }, { p: B, c, e });
  for (let i = 0; i < A.length; i++) { const j = (i + 1) % A.length; m.push({ p: [A[i], A[j], B[j], B[i]], c, e }); }
}
function addBox(m, x0, x1, y0, y1, z0, z1, c, e) { addPrism(m, rectAt(x0, x1, y0, y1, z0), rectAt(x0, x1, y0, y1, z1), c, e); }
function addCyl(m, cx, cy, r, z0, z1, c, n = 8, r1 = r) { addPrism(m, ringAt(cx, cy, r, z0, n), ringAt(cx, cy, r1, z1, n), c); }
function addFrustum(m, z0, x0, y0, w0, h0, z1, x1, y1, w1, h1, c) {
  addPrism(m, rectAt(x0 - w0 / 2, x0 + w0 / 2, y0 - h0 / 2, y0 + h0 / 2, z0), rectAt(x1 - w1 / 2, x1 + w1 / 2, y1 - h1 / 2, y1 + h1 / 2, z1), c);
}
function mapMesh(m, fn) { for (const f of m) f.p = f.p.map(fn); return m; }

// Incom T-65 X-wing: long nose, four S-foil wings in an X, engines at the wing roots, laser cannons on the tips
function buildXWing() {
  const m = [];
  const HULL = [210, 212, 216], GREY = [150, 154, 162], DARK = [66, 70, 78], RED = [196, 44, 36], GLASS = [28, 42, 64], ENG = [128, 132, 140];
  addBox(m, -0.13, 0.13, -0.11, 0.11, -0.62, 0.05, HULL);
  addFrustum(m, 0.05, 0, 0, 0.24, 0.2, 0.8, 0, -0.02, 0.14, 0.12, HULL);
  addFrustum(m, 0.8, 0, -0.02, 0.14, 0.12, 0.92, 0, -0.025, 0.125, 0.105, RED);
  addFrustum(m, 0.92, 0, -0.025, 0.125, 0.105, 1.28, 0, -0.04, 0.035, 0.035, HULL);
  addPrism(m, [[-0.085, 0.1, -0.08], [0.085, 0.1, -0.08], [0.06, 0.21, -0.08], [-0.06, 0.21, -0.08]],
              [[-0.06, 0.09, 0.42], [0.06, 0.09, 0.42], [0.02, 0.11, 0.42], [-0.02, 0.11, 0.42]], GLASS);   // cockpit canopy
  addBox(m, -0.055, 0.055, 0.11, 0.17, -0.34, -0.22, [226, 230, 238]);   // astromech droid
  addBox(m, -0.035, 0.035, 0.17, 0.2, -0.32, -0.24, [50, 95, 200]);
  addBox(m, -0.1, 0.1, -0.08, 0.08, -0.66, -0.62, DARK);
  for (const sx of [1, -1]) for (const sy of [1, -1]) {
    const w = [];
    // wing: root chord z -0.6..-0.05, tip chord z -0.55..-0.27, with a red stripe near the tip
    const zr = x => { const t = (x - 0.12) / 0.73; return [-0.6 + t * 0.05, -0.05 - t * 0.22]; };
    const span = (x0, x1, c) => {
      const [a0, b0] = zr(x0), [a1, b1] = zr(x1);
      addPrism(w, [[x0, 0.016, a0], [x1, 0.016, a1], [x1, 0.016, b1], [x0, 0.016, b0]],
                  [[x0, -0.016, a0], [x1, -0.016, a1], [x1, -0.016, b1], [x0, -0.016, b0]], c);
    };
    span(0.12, 0.56, HULL); span(0.56, 0.67, RED); span(0.67, 0.85, HULL);
    addCyl(w, 0.86, 0, 0.032, -0.5, 0.05, GREY, 6);     // laser cannon
    addCyl(w, 0.86, 0, 0.014, 0.05, 0.72, DARK, 6);
    addCyl(w, 0.86, 0, 0.024, 0.68, 0.8, GREY, 6);
    const a = 0.24 * sx * sy, ca = Math.cos(a), sa = Math.sin(a);
    mapMesh(w, q => { const x = q[0] * sx; return [x * ca - q[1] * sa, x * sa + q[1] * ca, q[2]]; });

    addCyl(m, sx * 0.2, sy * 0.105, 0.078, -0.68, 0.06, ENG, 10);
    addCyl(m, sx * 0.2, sy * 0.105, 0.086, 0.06, 0.12, DARK, 10, 0.064);
    m.push({ p: ringAt(sx * 0.2, sy * 0.105, 0.06, -0.685, 10), c: [255, 140, 110], e: true });
  }
  return m;
}

const ENGINE_GLOWS = {
  xwing: { pts: [[0.2, 0.105, -0.7], [-0.2, 0.105, -0.7], [0.2, -0.105, -0.7], [-0.2, -0.105, -0.7]], r: 0.13, col: '255,110,90' },

};

const LIGHT = (() => { const l = [0.35, 0.85, -0.4], n = Math.hypot(...l); return l.map(v => v / n); })();

// Transform a mesh (roll → pitch → yaw about an optional pivot, then move to x,y,z), sort faces far → near and fill them.
// Returns the transform so callers can place glows on the model.
function drawMesh(mesh, o) {
  const cyw = Math.cos(o.yaw || 0), syw = Math.sin(o.yaw || 0);
  const cp = Math.cos(o.pitch || 0), sp = Math.sin(o.pitch || 0);
  const cr = Math.cos(o.roll || 0), sr = Math.sin(o.roll || 0);
  const pv = o.pivot || [0, 0, 0];
  const tf = q => {
    const x = q[0] - pv[0], y = q[1] - pv[1], z = q[2] - pv[2];
    const x1 = x * cr - y * sr, y1 = x * sr + y * cr;
    const y2 = y1 * cp - z * sp, z2 = y1 * sp + z * cp;
    const x3 = x1 * cyw + z2 * syw, z3 = -x1 * syw + z2 * cyw;
    return [x3 + pv[0] + o.x, y2 + pv[1] + o.y, z3 + pv[2] + o.z];
  };
  const nearZ = cam.z + NEAR;
  const list = [];
  for (const f of mesh) {
    const w = f.p.map(tf);
    let mx = 0, my = 0, mz = 0, ok = true;
    for (const q of w) { if (q[2] < nearZ) { ok = false; break; } mx += q[0]; my += q[1]; mz += q[2]; }
    if (!ok) continue;
    const n = w.length;
    mx = mx / n - cam.x; my = my / n - cam.y; mz = mz / n - cam.z;
    list.push({ w, f, d: mx * mx + my * my + mz * mz });
  }
  list.sort((a, b) => b.d - a.d);
  for (const { w, f, d } of list) {
    let c = f.c;
    if (!f.e) {
      const ux = w[1][0] - w[0][0], uy = w[1][1] - w[0][1], uz = w[1][2] - w[0][2];
      const vx = w[2][0] - w[0][0], vy = w[2][1] - w[0][1], vz = w[2][2] - w[0][2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;
      if (nx * (cam.x - w[0][0]) + ny * (cam.y - w[0][1]) + nz * (cam.z - w[0][2]) < 0) { nx = -nx; ny = -ny; nz = -nz; }
      const lum = 0.4 + 0.6 * Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
      c = o.tint ? [c[0] * lum * 0.3 + 180, c[1] * lum * 0.3 + 180, c[2] * lum * 0.3 + 180] : [c[0] * lum, c[1] * lum, c[2] * lum];
    }
    const col = shade(c[0], c[1], c[2], Math.sqrt(d));
    ctx.beginPath();
    for (let i = 0; i < w.length; i++) {
      const q = proj(w[i][0], w[i][1], w[i][2]);
      if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
    }
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 0.6; ctx.stroke();
  }
  return tf;
}

function glowAt(x, y, z, r, col) {
  const p = proj(x, y, z);
  if (!p) return;
  const R = Math.max(2, r * p.s * (0.85 + Math.random() * 0.3));
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
  g.addColorStop(0, 'rgba(255,255,235,1)');
  g.addColorStop(0.35, `rgba(${col},0.9)`);
  g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
}

function drawPlayer() {
  ctx.save();
  if (player.inv > 0 && Math.floor(time * 20) % 2 === 0) ctx.globalAlpha = 0.45;
  const tf = drawMesh(MESH[world.vehicle], {
    x: player.x, y: player.y, z: player.z,
    roll: -player.bank, pitch: -player.vy * 0.03, yaw: player.vx * 0.012,
  });
  const g = ENGINE_GLOWS[world.vehicle];
  ctx.globalCompositeOperation = 'lighter';
  for (const q of g.pts) { const w = tf(q); glowAt(w[0], w[1], w[2], g.r, g.col); }
  ctx.restore();
}

function drawEnemy(t) {
  if (t.kind === 'tower') return drawTower(t);
  if (t.rise <= 0) return;
  const tint = t.hitFlash > 0;
  if (t.kind === 'scout') drawMesh(MESH.scout, { x: t.x, y: t.y - 0.15, z: t.z, yaw: Math.PI, roll: (t.x - t.fx) * 0.12, tint });
  else drawMesh(MESH.probe, { x: t.x, y: t.y, z: t.z, yaw: Math.sin(time + t.phase) * 0.4, tint });
  if (t.flash > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glowAt(t.x, t.y - (t.kind === 'scout' ? 0.3 : 0), t.z - 0.7, 0.35, '80,255,110');
    ctx.restore();
  }
}

function drawWorld(showShip) {
  const zmin = cam.z + NEAR, zmax = cam.z + VIEW;
  const far = [], near = [];
  for (const o of obstacles) {
    if (o.z + o.depth < zmin || o.z > zmax) continue;
    (o.z + o.depth < player.z ? near : far).push({ z: o.z, k: 0, o });
  }
  for (const t of towers) {
    if (!t.alive || t.z < zmin || t.z > zmax) continue;
    (t.z < player.z ? near : far).push({ z: t.z, k: 1, o: t });
  }
  for (const p of pickups) {
    if (p.taken || p.z < zmin || p.z > zmax) continue;
    (p.z < player.z ? near : far).push({ z: p.z, k: 2, o: p });
  }
  far.sort((a, b) => b.z - a.z);
  near.sort((a, b) => b.z - a.z);
  const drawItem = it => {
    if (it.k === 0) {
      const o = it.o;
      drawBoxes(o.draw, o.z, o.z + o.depth, o.rgb, world.key === 'deathstar');
      if (o.decor) drawBoxes(o.decor.rects, o.decor.z0, o.decor.z1, o.decor.rgb, false);
    }
    else if (it.k === 1) drawEnemy(it.o);
    else drawPickup(it.o);
  };
  for (const it of far) drawItem(it);
  if (showShip) { drawShadow(); drawPlayer(); }
  ctx.globalAlpha = 0.35;
  for (const it of near) drawItem(it);
  ctx.globalAlpha = 1;
}

function line3d(x0, y0, z0, x1, y1, z1, color, w) {
  const n = cam.z + NEAR;
  if (z0 < n && z1 < n) return;
  if (z0 < n) { const t = (n - z0) / (z1 - z0); x0 += (x1 - x0) * t; y0 += (y1 - y0) * t; z0 = n; }
  if (z1 < n) { const t = (n - z1) / (z0 - z1); x1 += (x0 - x1) * t; y1 += (y0 - y1) * t; z1 = n; }
  const a = proj(x0, y0, z0), b = proj(x1, y1, z1);
  if (!a || !b) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1.5, w * Math.max(a.s, b.s));
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}

function drawEffects() {
  ctx.save();
  // additive glow looks great in the dark, but vanishes against Hoth's bright snow
  ctx.globalCompositeOperation = world.key === 'hoth' ? 'source-over' : 'lighter';
  ctx.lineCap = 'round';
  for (const s of shots) {
    const k = 4 / s.vz;
    const tx = s.x - s.vx * k, ty = s.y - s.vy * k;
    if (s.kind === 'laser') {
      line3d(s.x, s.y, s.z, tx, ty, s.z - 4, 'rgba(255,50,40,0.35)', 0.16);
      line3d(s.x, s.y, s.z, tx, ty, s.z - 4, 'rgba(255,210,200,0.95)', 0.05);
    } else if (world.key === 'hoth') {
      // harpoon trailing its tow cable back to the snowspeeder
      line3d(player.x, player.y + 0.03, player.z - 0.7, s.x, s.y, s.z, 'rgba(60,62,70,0.9)', 0.015);
      line3d(s.x, s.y, s.z, tx, ty, s.z - 0.5, 'rgba(90,92,100,1)', 0.06);
    } else if (world.key === 'endor') {
      // thermal detonator: small metal ball with a blinking red light
      const p = proj(s.x, s.y, s.z);
      if (p) {
        ctx.fillStyle = '#9a9ea6';
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(3, 0.12 * p.s), 0, Math.PI * 2); ctx.fill();
        if (Math.floor(time * 12) % 2) glowAt(s.x, s.y, s.z - 0.01, 0.12, '255,40,30');
      }
    } else {
      line3d(s.x, s.y, s.z, tx, ty, s.z - 4, 'rgba(255,140,40,0.35)', 0.12);
      const p = proj(s.x, s.y, s.z);
      if (p) {
        const r = Math.max(3, 0.35 * p.s * (0.9 + Math.random() * 0.2));
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(0.3, 'rgba(140,200,255,0.95)');
        g.addColorStop(0.6, 'rgba(255,140,60,0.5)');
        g.addColorStop(1, 'rgba(255,80,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  for (const b of bolts) {
    const k = 0.06;
    line3d(b.x, b.y, b.z, b.x - b.vx * k, b.y - b.vy * k, b.z - b.vz * k, 'rgba(60,255,90,0.4)', 0.2);
    line3d(b.x, b.y, b.z, b.x - b.vx * k, b.y - b.vy * k, b.z - b.vz * k, 'rgba(210,255,210,0.95)', 0.06);
  }
  for (const p of particles) {
    const q = proj(p.x, p.y, p.z);
    if (!q || p.z < cam.z + NEAR) continue;
    const a = clamp(p.life / p.max, 0, 1);
    const r = Math.max(1, p.size * q.s * (0.6 + (1 - a)));
    ctx.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${a})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 4;   // keeps the HUD readable over bright snow
  ctx.textBaseline = 'top';
  ctx.font = '700 16px system-ui, sans-serif';
  ctx.fillStyle = '#ffd84a';
  ctx.fillText('SCORE ' + Math.floor(score), 16, 16);
  ctx.fillStyle = '#cfd8ea';
  ctx.font = '600 14px system-ui, sans-serif';
  ctx.fillText('LEVEL ' + level + '   HI ' + Math.max(hi, Math.floor(score)), 16, 40);
  ctx.fillStyle = '#7fd0ff';
  ctx.fillText('AIM ASSIST: ' + ASSIST[assist].label, 16, 60);

  // Deflector shield bar
  const bw = Math.min(220, W * 0.35), bx = 16, by = H - 34;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(bx, by, bw, 14);
  const sh = Math.min(player.shield, 100) / 100;
  ctx.fillStyle = sh > 0.5 ? '#46d2ff' : sh > 0.25 ? '#ffc23a' : '#ff4a3a';
  ctx.fillRect(bx, by, bw * sh, 14);
  const extra = Math.round(player.shield - 100);
  if (extra > 0) {   // bonus shields above 100 show as a gold strip
    ctx.fillStyle = '#ffd84a';
    ctx.fillRect(bx, by + 9, bw * extra / 100, 5);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.strokeRect(bx + 0.5, by + 0.5, bw, 14);
  ctx.fillStyle = '#cfd8ea';
  ctx.fillText('DEFLECTOR SHIELDS' + (extra > 0 ? `  +${extra} BONUS` : ''), bx, by - 20);

  // Ammo (bottom right, above the touch buttons when shown)
  ctx.textAlign = 'right';
  const ax = W - 16;
  let ay = H - (touchUI ? 130 : 24);
  ctx.textBaseline = 'bottom';
  for (let i = 0; i < Math.min(ammo.torp, 12); i++) {
    const cx = ax - 6 - i * 16, cy = ay - 6;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 6);
    g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#8cc8ff'); g.addColorStop(1, '#ff8c3c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
  }
  if (ammo.torp > 12) { ctx.fillStyle = '#cfd8ea'; ctx.fillText('+' + (ammo.torp - 12), ax - 12 * 16 - 4, ay); }
  ctx.fillStyle = ammo.torp ? '#cfd8ea' : '#ff4a3a';
  ctx.fillText(world.secName + ' ' + ammo.torp, ax, ay - 16);
  ctx.fillStyle = ammo.laser > 20 ? '#ffb0a8' : '#ff4a3a';
  ctx.font = '700 16px system-ui, sans-serif';
  ctx.fillText(world.laserName + ' ' + ammo.laser, ax, ay - 38);
  ctx.textBaseline = 'top';
  ctx.font = '600 14px system-ui, sans-serif';

  // Progress to the thermal exhaust port
  ctx.textAlign = 'left';
  const pw = Math.min(360, W * 0.4), px = (W - pw) / 2, py = 20;
  const prog = clamp(player.z / endZ, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(px, py, pw, 8);
  ctx.fillStyle = '#ffd84a';
  ctx.fillRect(px, py, pw * prog, 8);
  ctx.fillStyle = '#ff7a2a';
  ctx.beginPath(); ctx.arc(px + pw, py + 4, 6, 0, Math.PI * 2); ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#cfd8ea';
  ctx.fillText(world.targetShort + '  ' + Math.max(0, Math.floor(endZ - player.z)) + ' m', W / 2, py + 14);

  if (state === 'playing') {
    // Crosshair
    const c = proj(player.x, player.y, player.z + 35);
    if (c) {
      ctx.strokeStyle = 'rgba(255,120,110,0.85)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(c.x, c.y, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(c.x - 20, c.y); ctx.lineTo(c.x - 7, c.y);
      ctx.moveTo(c.x + 7, c.y); ctx.lineTo(c.x + 20, c.y);
      ctx.moveTo(c.x, c.y - 20); ctx.lineTo(c.x, c.y - 7);
      ctx.moveTo(c.x, c.y + 7); ctx.lineTo(c.x, c.y + 20);
      ctx.stroke();
    }
    // Aim-assist lock on the next enemy
    if (lockTarget && lockTarget.alive) {
      const p = proj(lockTarget.x, lockTarget.y, lockTarget.z - 0.3);
      if (p) {
        const r = Math.max(12, 0.7 * p.s);
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(time * 3);
        ctx.strokeStyle = '#7fd0ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath(); ctx.stroke();
        ctx.restore();
      }
    }
    // Target brackets around the thermal exhaust port
    if (endZ - player.z < VIEW) {
      const p = proj(port.x, port.y, endZ);
      if (p) {
        const locked = Math.hypot(player.x - port.x, player.y - port.y) < port.r * 0.9 ||
          (ASSIST[assist].radius && Math.hypot(player.x - port.x, player.y - port.y) < ASSIST[assist].radius * 1.2);
        const r = Math.max(port.r * p.s, 10) + 10;
        const L = r * 0.45;
        ctx.strokeStyle = locked ? '#ff3a3a' : '#ffd84a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
          ctx.moveTo(p.x + sx * r, p.y + sy * (r - L)); ctx.lineTo(p.x + sx * r, p.y + sy * r); ctx.lineTo(p.x + sx * (r - L), p.y + sy * r);
        }
        ctx.stroke();
        ctx.fillStyle = locked ? '#ff3a3a' : '#ffd84a';
        ctx.font = '700 14px system-ui, sans-serif';
        ctx.fillText(locked ? `LOCKED — ${world.secVerb}!` : world.targetName, p.x, p.y + r + 6);
      }
    }
  }

  if (msgT > 0) {
    ctx.globalAlpha = clamp(msgT * 2, 0, 1);
    ctx.font = `800 ${Math.round(clamp(W / 28, 18, 40))}px system-ui, sans-serif`;
    ctx.fillStyle = '#ffd84a';
    ctx.shadowColor = 'rgba(255,180,40,0.7)'; ctx.shadowBlur = 16;
    ctx.fillText(msg, W / 2, H * 0.2);
  }
  ctx.restore();
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
  drawSky();
  // the Death Star trench ends at its wall; on Endor and Hoth the ground carries on past the target
  if (world.clipEnd) { drawEnd(); drawSurface(); }
  else { drawSurface(); drawEnd(); }
  drawWorld(state !== 'dead' && !(state === 'overlay' && player.shield <= 0));
  drawEffects();
  if (world.key === 'endor') drawCanopy();
  ctx.restore();
  if (world.key === 'hoth') drawSnowfall();

  if (hitFlash > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(255,0,0,0)');
    g.addColorStop(1, `rgba(255,30,20,${0.55 * hitFlash})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,245,220,${clamp(flash, 0, 1) * 0.85})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (state !== 'menu' && state !== 'quiz') drawHUD();
}

const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const fireButtons = document.getElementById('fireButtons');
const touchUI = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
let ovAction = null;

function showOverlay(title, html, btn, action) {
  ovTitle.innerHTML = title;
  ovBody.innerHTML = html;
  ovBtn.textContent = btn;
  ovBtn.classList.remove('hidden');
  ovAction = action;
  overlay.classList.remove('hidden');
  input.pointerFire = input.btnLaser = input.torp = false;
}
function hideOverlay() { overlay.classList.add('hidden'); }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });

function assistPicker() {
  return `<div class="assist"><div class="label">AIM ASSIST</div><div class="opts">` +
    Object.keys(ASSIST).map(k => `<button class="opt${k === assist ? ' sel' : ''}" data-assist="${k}">${ASSIST[k].label}</button>`).join('') +
    `</div><p class="hint">${ASSIST[assist].hint}</p></div>`;
}
function setAssist(k) {
  assist = k;
  localStorage.setItem('xw_assist', k);
  for (const b of ovBody.querySelectorAll('[data-assist]')) b.classList.toggle('sel', b.dataset.assist === k);
  const hint = ovBody.querySelector('.assist .hint');
  if (hint) hint.textContent = ASSIST[k].hint;
}
function gradePicker() {
  return `<div class="assist"><div class="label">SCIENCE QUESTIONS FOR</div><div class="opts">` +
    Object.keys(GRADES).map(k => `<button class="opt${k === grade ? ' sel' : ''}" data-grade="${k}">${GRADES[k].label}</button>`).join('') +
    `</div></div>`;
}
function setGrade(k) {
  grade = k;
  localStorage.setItem('xw_grade', k);
  for (const b of ovBody.querySelectorAll('[data-grade]')) b.classList.toggle('sel', b.dataset.grade === k);
}

ovBody.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  sfx.init();
  if (b.dataset.assist) setAssist(b.dataset.assist);
  else if (b.dataset.grade) setGrade(b.dataset.grade);
  else if (b.dataset.choice) answerQuiz(+b.dataset.choice);
  else if (b.dataset.hint) showHint();
  else if (b.dataset.bonus) chooseBonus(b.dataset.bonus === 'yes');
});

function togglePause() {
  if (state === 'playing') {
    pausedFrom = state;
    state = 'paused';
    showOverlay('PAUSED', '<p>Stay on target, pilot.</p>' + gradePicker() + assistPicker(), 'RESUME', togglePause);
  } else if (state === 'paused') {
    state = pausedFrom || 'playing';
    hideOverlay();
  }
}

function toggleMute() {
  muted = !muted;
  document.getElementById('btnMute').textContent = muted ? '🔇' : '🔊';
}

function toggleFullscreen() {
  const d = document, el = d.documentElement;
  const isFs = d.fullscreenElement || d.webkitFullscreenElement;
  const fn = isFs ? (d.exitFullscreen || d.webkitExitFullscreen) : (el.requestFullscreen || el.webkitRequestFullscreen);
  if (!fn) return;
  const r = fn.call(isFs ? d : el);
  if (r && r.catch) r.catch(() => {});
}
const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if (!fsSupported) document.getElementById('btnFs').style.display = 'none';
document.addEventListener('fullscreenchange', resize);
document.addEventListener('webkitfullscreenchange', resize);

document.getElementById('btnPause').addEventListener('click', e => { e.currentTarget.blur(); togglePause(); });
document.getElementById('btnMute').addEventListener('click', e => { e.currentTarget.blur(); sfx.init(); toggleMute(); });
document.getElementById('btnFs').addEventListener('click', e => { e.currentTarget.blur(); toggleFullscreen(); });

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function numberChoices(ans) {
  const cands = shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans * 2, Math.round(ans / 2)]);
  const wrong = [];
  for (const c of cands) if (c > 0 && c !== ans && !wrong.includes(c) && wrong.length < 3) wrong.push(c);
  const choices = shuffle([ans, ...wrong]);
  return { choices: choices.map(String), correct: choices.indexOf(ans) };
}
