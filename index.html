    a: ['Yellowstone', 'The Grand Canyon', 'Yosemite', 'The Everglades'],
    hint: 'It is named after a river with yellow-coloured rocks.',
    learn: 'Yellowstone became the world’s first national park in 1872. Old Faithful shoots boiling water into the air about every 1½ hours, heated by hot magma deep underground!' },
  { g: 'y', t: 'INVENTORS', q: 'Who made the first telephone call in 1876?',
    a: ['Alexander Graham Bell', 'George Washington', 'The Wright brothers', 'Abraham Lincoln'],
    hint: 'His last name sounds like something that rings.',
    learn: 'Alexander Graham Bell’s first words on the telephone were: "Mr. Watson, come here, I want to see you." Today phones fit in your pocket!' },
  { g: 'p', t: 'ECONOMICS', q: 'A store buys a toy for $6 and sells it for $10. How much profit does the store make?',
    a: ['$4', '$16', '$10', '$6'],
    hint: 'Profit = selling price − cost.',
    learn: '$10 − $6 = $4 profit. Profit rewards a business for making things people want, and it can be used to grow the business and hire more workers.' },
  { g: 'b', t: 'ECONOMICS', q: 'Why do people specialize — like one person baking bread and another fixing bikes — and then trade?',
    a: ['Everyone gets better at their job, so more gets made', 'It is a law that you must', 'So nobody ever has to work', 'Because tools are not allowed'],
    hint: 'Think about what happens when you practise one thing a lot.',
    learn: 'When people specialize and trade, everyone can end up with more than if each person tried to make everything alone. The economist Adam Smith wrote about this idea in 1776.' },
  { g: 'y', t: 'AMERICAN HISTORY', q: 'In 1620, the Pilgrims sailed to America on a ship called the…',
    a: ['Mayflower', 'Titanic', 'Millennium Falcon', 'Santa Maria'],
    hint: 'Its name is a spring flower.',
    learn: 'The Mayflower carried about 100 passengers across the Atlantic Ocean. Before landing, the men signed the Mayflower Compact, agreeing to make fair laws together.' },
  { g: 'p', t: 'INVENTORS', q: 'Which American scientist found hundreds of uses for peanuts and taught farmers how to keep their soil healthy?',
    a: ['George Washington Carver', 'Thomas Edison', 'Henry Ford', 'Neil Armstrong'],
    hint: 'He worked at the Tuskegee Institute in Alabama.',
    learn: 'Carver taught farmers to rotate crops — planting peanuts and sweet potatoes to put nutrients back into soil worn out by cotton. He found about 300 uses for peanuts!' },
  { g: 'b', t: 'SPACE', q: 'In 1962, John Glenn became the first American to…',
    a: ['Orbit (circle) the Earth', 'Walk on the Moon', 'Fly an airplane', 'Visit Mars'],
    hint: 'His capsule was called Friendship 7.',
    learn: 'John Glenn circled Earth 3 times. In 1998, at age 77, he flew to space again on the Space Shuttle — the oldest person in space at the time!' },
];

const decks = {};
function drawFromDeck(key, list) {
  if (!decks[key] || !decks[key].length) decks[key] = shuffle(list.filter(q => q.g === grade || q.g === 'b'));
  const c = decks[key].pop();
  const order = shuffle(c.a.map((text, i) => ({ text, i })));
  return { topic: c.t, q: c.q, choices: order.map(o => o.text), correct: order.findIndex(o => o.i === 0), hint: c.hint, learn: c.learn };
}

// kind: 'gate' = science or math, 'sci' = science only, 'usa' = America trivia
let lastMath = null;
function drawQuestion(kind = 'gate') {
  if (kind === 'usa') return drawFromDeck('usa-' + grade, AMERICA);
  if (kind === 'gate' && Math.random() < 0.4) {
    let gen;
    do { gen = pick(MATH[grade]); } while (gen === lastMath && MATH[grade].length > 1);
    lastMath = gen;
    const m = gen();
    return { topic: 'MATH', q: m.q, ...numberChoices(m.ans), hint: m.hint, learn: m.learn };
  }
  return drawFromDeck('sci-' + grade, QUESTIONS);
}

let quiz = null;

// mode 'gate': keep asking until `need` are right. mode 'bonus': ask exactly `need` questions, reward each right one.
function startQuiz(need, title, intro, onPass, mode = 'gate') {
  menuScene();
  state = 'quiz';
  quiz = { mode, need, got: 0, results: [], title, intro, onPass, q: null, answered: false, kinds: shuffle(['usa', 'sci']) };
  nextQuestion();
}

function quizStars() {
  if (quiz.mode === 'bonus') {
    return Array.from({ length: quiz.need }, (_, i) => i < quiz.results.length ? (quiz.results[i] ? '★' : '✗') : '☆').join('');
  }
  return Array.from({ length: quiz.need }, (_, i) => i < quiz.got ? '★' : '☆').join('');
}

// ---------- Bonus round ----------
let bonusLaunch = null;
function offerBonus(launch) {
  bonus = { torp: 0, shield: 0 };
  bonusLaunch = launch;
  state = 'quiz';
  showOverlay('BONUS ROUND',
    `<p class="big">Do you want ${BONUS_QUESTIONS * BONUS_TORP} extra ${world.secName.toLowerCase()} and some extra deflector shields too?</p>
     <p>Answer ${BONUS_QUESTIONS} trivia questions about science and America!
     Every right answer earns <b>+${BONUS_TORP} ${world.secOne.toLowerCase()}</b> and <b>+${BONUS_SHIELD} shields</b>.</p>
     <div class="yesno">
       <button data-bonus="yes">YES, BONUS ROUND! 🎁</button>
       <button class="no" data-bonus="no">NO THANKS — LAUNCH 🚀</button>
     </div>
     <p class="keys">Press Y or N</p>`,
    '', null);
  ovBtn.classList.add('hidden');
}
function chooseBonus(yes) {
  if (!bonusLaunch) return;
  const launch = bonusLaunch;
  bonusLaunch = null;
  if (yes) {
    startQuiz(BONUS_QUESTIONS, 'BONUS ROUND',
      `Each right answer = +${BONUS_TORP} ${world.secOne.toLowerCase()} and +${BONUS_SHIELD} shields!`, launch, 'bonus');
  } else launch();
}

// ---------- Book recommendations ----------
const BOOKS = [
  { g: 'b', title: 'The Tuttle Twins Learn About the Law', author: 'Connor Boyack',
    about: 'Ethan and Emily Tuttle find out what makes a law fair — and what happens when it isn’t.' },
  { g: 'b', title: 'The Tuttle Twins and the Miraculous Pencil', author: 'Connor Boyack',
    about: 'How does a simple pencil get made? Thousands of people around the world work together through trade — without anyone being in charge!' },
  { g: 'b', title: 'The Tuttle Twins and the Food Truck Fiasco', author: 'Connor Boyack',
    about: 'The twins help a friend start a food truck and learn about entrepreneurs, competition and rules.' },
  { g: 'p', title: 'The Tuttle Twins and the Creature from Jekyll Island', author: 'Connor Boyack',
    about: 'What is money, where does it come from, and why do prices go up? The twins investigate.' },
  { g: 'y', title: 'National Geographic Little Kids First Big Book of Space', author: 'Catherine D. Hughes',
    about: 'Amazing photos and fun facts about the Sun, planets, stars and astronauts.' },
  { g: 'y', title: 'There’s No Place Like Space!', author: 'Tish Rabe',
    about: 'The Cat in the Hat takes you on a rhyming tour of our solar system.' },
  { g: 'y', title: 'The Magic School Bus Lost in the Solar System', author: 'Joanna Cole',
    about: 'Ms. Frizzle’s class blasts off on a field trip past every planet.' },
  { g: 'b', title: 'Who Was Neil Armstrong?', author: 'Roberta Edwards',
    about: 'The true story of the first person to walk on the Moon.' },
  { g: 'b', title: 'Who Were the Wright Brothers?', author: 'James Buckley Jr.',
    about: 'How two bicycle-shop brothers from Ohio invented the airplane.' },
  { g: 'b', title: 'Who Was Ben Franklin?', author: 'Dennis Brindell Fradin',
    about: 'Inventor, scientist, writer and Founding Father — and yes, the kite experiment!' },
  { g: 'p', title: 'What Is the Declaration of Independence?', author: 'Michael C. Harris',
    about: 'The story behind the famous document that started the United States.' },
  { g: 'p', title: 'Hidden Figures (Young Readers’ Edition)', author: 'Margot Lee Shetterly',
    about: 'The true story of the brilliant women mathematicians who helped NASA send astronauts into space.' },
  { g: 'y', title: 'Mae Among the Stars', author: 'Roda Ahmed',
    about: 'Little Mae dreams of space — and grows up to be Mae Jemison, the first African American woman in space.' },
  { g: 'y', title: 'Ada Twist, Scientist', author: 'Andrea Beaty',
    about: 'Ada asks "Why?" about everything and uses science to find the answers.' },
  { g: 'b', title: 'One Grain of Rice: A Mathematical Folktale', author: 'Demi',
    about: 'A clever girl uses the power of doubling to outsmart a greedy raja.' },
  { g: 'y', title: 'Lemonade in Winter', author: 'Emily Jenkins',
    about: 'Two kids run a lemonade stand in the snow and learn about counting money, prices and profit.' },
  { g: 'p', title: 'A Child’s Introduction to the Night Sky', author: 'Michael Driscoll',
    about: 'Learn the stars, planets and constellations — then go outside and find them yourself!' },

function bookCard() {
  const b = drawBook();
  const url = 'https://search.worldcat.org/search?q=' + encodeURIComponent(b.title + ' ' + b.author);
  return `<div class="book">
      <div class="bk-head">📚 Do you want to learn more? Check out this book!</div>
      <div class="bk-title">${b.title}</div>
      <div class="bk-author">by ${b.author}</div>
      <p>${b.about}</p>
      <a href="${url}" target="_blank" rel="noopener">Find it at a library →</a>
    </div>`;
}
function drawBook() {
  const key = 'books-' + grade;
  if (!decks[key] || !decks[key].length) decks[key] = shuffle(BOOKS.filter(b => b.g === grade || b.g === 'b'));
  return decks[key].pop();
}

function nextQuestion() {
  const kind = quiz.mode === 'bonus' ? quiz.kinds[quiz.results.length % quiz.kinds.length] : 'gate';
  const q = quiz.q = drawQuestion(kind);
  quiz.answered = false;
  showOverlay(quiz.title,
    `<div class="quiz">
       <p class="qneed">${quiz.intro}</p>
       <div class="qtop"><span class="topic">${q.topic}</span><span class="stars">${quizStars()}</span></div>
       <p class="qtext">${q.q}</p>
       <div class="choices">${q.choices.map((c, i) => `<button class="choice" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span><span>${c}</span></button>`).join('')}</div>
       <button class="hintbtn" data-hint="1">💡 Need a hint?</button>
       <p class="hinttext hidden">${q.hint}</p>
       <div class="feedback hidden"></div>
     </div>`,
    '', null);
  ovBtn.classList.add('hidden');
}

function showHint() {
  if (!quiz || quiz.answered) return;
  ovBody.querySelector('.hinttext').classList.remove('hidden');
  ovBody.querySelector('.hintbtn').classList.add('hidden');
}

function answerQuiz(i) {
  if (!quiz || quiz.answered || state !== 'quiz') return;
  const q = quiz.q;
  if (i < 0 || i >= q.choices.length) return;
  quiz.answered = true;
  const right = i === q.correct;
  ovBody.querySelectorAll('.choice').forEach((b, j) => {
    b.disabled = true;
    if (j === q.correct) b.classList.add('right');
    else if (j === i) b.classList.add('wrong');
  });
  ovBody.querySelector('.hintbtn').classList.add('hidden');
  ovBody.querySelector('.hinttext').classList.add('hidden');
  quiz.results.push(right);
  const isBonus = quiz.mode === 'bonus';
  if (right) {
    quiz.got++;
    sfx.right();
    if (isBonus) { bonus.torp += BONUS_TORP; bonus.shield += BONUS_SHIELD; }
  } else sfx.wrong();
  ovBody.querySelector('.stars').textContent = quizStars();
  const done = isBonus ? quiz.results.length >= quiz.need : quiz.got >= quiz.need;
  const fb = ovBody.querySelector('.feedback');
  fb.classList.remove('hidden');
  fb.classList.add(right ? 'good' : 'bad');
  fb.innerHTML = (right
    ? `<b>✅ Correct — great job, pilot!</b>${isBonus ? ` 🎁 +${BONUS_TORP} ${world.secOne.toLowerCase()}, +${BONUS_SHIELD} shields!` : ''}<br>`
    : `<b>Not quite — good try!</b> The answer is <b>${q.choices[q.correct]}</b>.<br>`) +
    `🎓 ${q.learn}` +
    (isBonus && done
      ? `<br><br><b>Bonus round total: +${bonus.torp} ${world.secName.toLowerCase()}, +${bonus.shield} shields.</b>`
      : '');
  ovBtn.textContent = !done ? 'NEXT QUESTION' : isBonus ? 'LAUNCH X-WING! 🚀' : 'CONTINUE ➜';
  ovAction = done ? quiz.onPass : nextQuestion;
  ovBtn.classList.remove('hidden');
}

// ---------- Input ----------
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'fire',
};
window.addEventListener('keydown', e => {
  // Quiz answers use letters A–D (checked first, since A and D also steer)
  if (state === 'quiz' && /^Key[A-D]$/.test(e.code)) { answerQuiz(e.code.charCodeAt(3) - 65); return; }
  const k = KEYMAP[e.code];
  if (k) {
    e.preventDefault();
    if (k !== 'fire' && input.mouse) { input.mouse = false; target.x = player.x; target.y = player.y; }
    input[k] = true;
    sfx.init();
    return;
  }
  if (e.code === 'KeyX' || e.code === 'KeyE') { if (!e.repeat) input.torp = true; }
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyF') toggleFullscreen();
  else if (e.code === 'KeyM') toggleMute();
  else if (state === 'quiz' && e.code === 'KeyH') showHint();
  else if (state === 'quiz' && bonusLaunch && (e.code === 'KeyY' || e.code === 'KeyN')) chooseBonus(e.code === 'KeyY');
  else if (e.code === 'Enter' && !overlay.classList.contains('hidden') && !ovBtn.classList.contains('hidden')) ovBtn.click();
});
window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) input[k] = false;
});

function pointerTarget(e) {
  input.mouse = true;
  target.x = (e.clientX / W * 2 - 1) * TW * 1.25;
  // top 10% of screen = top of the channel, bottom 15% = floor
  const fy = (e.clientY / H - 0.1) / 0.75;
  target.y = (TH - 0.4) - fy * (TH - 0.8);
}
canvas.addEventListener('pointerdown', e => {
  sfx.init();
  canvas.setPointerCapture(e.pointerId);
  pointerTarget(e);
  // Mouse buttons fire; touches on the canvas only steer (use the on-screen buttons to fire)
  if (state === 'playing' && e.pointerType === 'mouse') {
    if (e.button === 2) input.torp = true;
    else if (e.button === 0) input.pointerFire = true;
  }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' || e.buttons) pointerTarget(e);
});
const release = e => { if (e.pointerType !== 'mouse' || e.button === 0) input.pointerFire = false; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('contextmenu', e => e.preventDefault());

const btnLaser = document.getElementById('btnLaser'), btnTorp = document.getElementById('btnTorp');
btnLaser.addEventListener('pointerdown', e => { e.preventDefault(); sfx.init(); input.btnLaser = true; });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) btnLaser.addEventListener(ev, () => { input.btnLaser = false; });
btnTorp.addEventListener('pointerdown', e => { e.preventDefault(); sfx.init(); input.torp = true; });
for (const b of [btnLaser, btnTorp]) b.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('blur', () => { if (state === 'playing') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state !== 'paused') update(dt);
  fireButtons.classList.toggle('hidden', !(touchUI && state === 'playing'));
  render();
  requestAnimationFrame(frame);
}

showMenu();
snapCamera();
requestAnimationFrame(frame);
</script>
