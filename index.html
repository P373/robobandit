<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboBandit — A New Game Every Day</title>
<meta name="description" content="RoboBandit makes a brand-new free browser game every day. Pick one and play!">
<link rel="canonical" href="https://robobandit.com/">
<meta name="theme-color" content="#070b18">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Social sharing. Crawlers don't run JavaScript, so these must stay in the HTML,
     and image URLs must be absolute. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="RoboBandit">
<meta property="og:url" content="https://robobandit.com/">
<meta property="og:title" content="RoboBandit — A New Game Every Day">
<meta property="og:description" content="RoboBandit makes a brand-new free browser game every day. Pick one and play!">
<meta property="og:image" content="https://robobandit.com/social-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="RoboBandit — A New Game Every Day">
<meta name="twitter:description" content="RoboBandit makes a brand-new free browser game every day. Pick one and play!">
<meta name="twitter:image" content="https://robobandit.com/social-preview.png">
<style>
  * { box-sizing: border-box; }
  html { background: #070b18; }
  body {
    margin: 0; min-height: 100vh; color: #e6eefc; overflow-x: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #1d2d50, #070b18 65%) fixed;
  }
  /* twinkling starfield */
  .stars, .stars::after {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 30% 70%, #cfe3ff, transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, #fff, transparent),
      radial-gradient(1px 1px at 75% 45%, #ffe9a8, transparent),
      radial-gradient(1.5px 1.5px at 90% 80%, #fff, transparent),
      radial-gradient(1px 1px at 20% 90%, #fff, transparent),
      radial-gradient(1px 1px at 65% 85%, #cfe3ff, transparent),
      radial-gradient(1.5px 1.5px at 42% 40%, #fff, transparent);
    background-size: 340px 340px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars::after { content: ""; background-size: 520px 520px; animation-delay: -2s; }
  @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }

  main { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; text-align: center; }

  .logo { width: 104px; height: 104px; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
  h1 {
    margin: 4px 0 0; font-size: clamp(40px, 10vw, 76px); letter-spacing: 4px; line-height: 1;
    color: #ffd84a; text-shadow: 0 0 24px rgba(255,200,40,.55), 0 4px 0 #b4770c;
  }
  .tag {
    display: inline-block; margin: 16px 0 34px; padding: 8px 18px; border-radius: 999px;
    font-weight: 800; letter-spacing: 2px; color: #111; background: #7fd0ff;
    transform: rotate(-2deg); box-shadow: 0 4px 0 #3f8fc0;
  }

  .grid {
    display: grid; gap: 24px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 320px)); justify-content: center;
  }
  .card {
    display: block; text-decoration: none; color: inherit; text-align: left;
    background: #121a33; border: 3px solid #2a3a66; border-radius: 18px; overflow: hidden;
    box-shadow: 0 6px 0 #0b1024, 0 12px 30px rgba(0,0,0,.4);
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-6px) rotate(-1deg); border-color: #ffd84a; outline: none;
    box-shadow: 0 12px 0 #0b1024, 0 0 30px rgba(255,200,40,.35);
  }
  .card:nth-child(even):hover { transform: translateY(-6px) rotate(1deg); }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: #0b1024; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .day {
    position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #111; background: #ffd84a;
  }
  .new {
    position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 800; color: #fff; background: #ff4a3a;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  .info { padding: 14px 16px 18px; }
  .info h2 { margin: 0 0 4px; font-size: 22px; color: #fff; }
  .info p { margin: 0; color: #a9b6d3; font-size: 15px; line-height: 1.4; }

  .card.soon { border-style: dashed; cursor: default; }
  .card.soon:hover { transform: none; border-color: #2a3a66; box-shadow: 0 6px 0 #0b1024; }
  .soon .thumb { display: grid; place-items: center; font-size: 64px; color: #3b4d80; }
  .soon .thumb span { animation: bob 2s ease-in-out infinite; }

  footer { margin-top: 44px; font-size: 14px; color: #7d8aa3; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="stars"></div>
<main>
  <img class="logo" src="favicon.svg" alt="RoboBandit logo">
  <h1>ROBOBANDIT</h1>
  <div class="tag">🎮 A NEW GAME EVERY DAY!</div>

  <div class="grid" id="games"></div>

  <footer>Made with 🤖 by RoboBandit · Free to play in your browser</footer>
</main>

<script>
// Add one entry per new game, oldest first. The newest game gets the "NEW!" badge.
const GAMES = [
  {
    title: 'Space Wars',
    url: 'space-wars.html',
    thumb: 'thumbs/space-wars.jpg',
    blurb: 'Fly six starfighter missions and answer science questions to launch!',
  },
  {
    title: 'Floppy Bird',
    url: 'floppy-bird.html',
    thumb: 'thumbs/floppy-bird.jpg',
    blurb: 'Flap through 8 wild worlds: rain, snow, volcanoes, jungle and space!',
  },
  {
    title: "Surf's Up",
    url: 'surfs-up.html',
    thumb: 'thumbs/surfs-up.jpg',
    blurb: 'Ride the curl, launch off the lip and spin for the judges!',
  },
];

const grid = document.getElementById('games');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Newest first, numbered by the day it came out.
grid.innerHTML = GAMES.map((g, i) => `
  <a class="card" href="${esc(g.url)}">
    <div class="thumb">
      <img src="${esc(g.thumb)}" alt="${esc(g.title)}" loading="lazy">
      <span class="day">DAY ${i + 1}</span>
      ${i === GAMES.length - 1 ? '<span class="new">NEW!</span>' : ''}
    </div>
    <div class="info"><h2>${esc(g.title)}</h2><p>${esc(g.blurb)}</p></div>
  </a>`).reverse().join('') + `
  <div class="card soon">
    <div class="thumb"><span>❓</span></div>
    <div class="info"><h2>Day ${GAMES.length + 1}</h2><p>A brand-new game is coming tomorrow!</p></div>
  </div>`;
</script>
</body>
</html>
