const LIGHT = (() => { const l = [0.35, 0.85, -0.4], n = Math.hypot(...l); return l.map(v => v / n); })();

// Transform a mesh (roll → pitch → yaw about an optional pivot, then move to x,y,z), sort faces far → near and fill them.
// Returns the transform so callers can place glows on the model.
function drawMesh(mesh, o) {
  const cyw = Math.cos(o.yaw || 0), syw = Math.sin(o.yaw || 0);
  const cp = Math.cos(o.pitch || 0), sp = Math.sin(o.pitch || 0);
  const cr = Math.cos(o.roll || 0), sr = Math.sin(o.roll || 0);
  const pv = o.pivot || [0, 0, 0], sc = o.scale || 1;
  const tf = q => {
    const x = q[0] * sc - pv[0], y = q[1] * sc - pv[1], z = q[2] * sc - pv[2];
    const x1 = x * cr - y * sr, y1 = x * sr + y * cr;
    const y2 = y1 * cp - z * sp, z2 = y1 * sp + z * cp;
    const x3 = x1 * cyw + z2 * syw, z3 = -x1 * syw + z2 * cyw;
    return [x3 + pv[0] + o.x, y2 + pv[1] + o.y, z3 + pv[2] + o.z];
  };
  const nearZ = cam.z + NEAR;
  const list = [];
  for (const f of mesh) {
    const w = f.p.map(tf);
    let mx = 0, my = 0, mz = 0, ok = true;
    for (const q of w) { if (q[2] < nearZ) { ok = false; break; } mx += q[0]; my += q[1]; mz += q[2]; }
    if (!ok) continue;
    const n = w.length;
    mx = mx / n - cam.x; my = my / n - cam.y; mz = mz / n - cam.z;
    list.push({ w, f, d: mx * mx + my * my + mz * mz });
  }
  list.sort((a, b) => b.d - a.d);
  for (const { w, f, d } of list) {
    let c = f.c;
    if (!f.e) {
      const ux = w[1][0] - w[0][0], uy = w[1][1] - w[0][1], uz = w[1][2] - w[0][2];
      const vx = w[2][0] - w[0][0], vy = w[2][1] - w[0][1], vz = w[2][2] - w[0][2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;
      if (nx * (cam.x - w[0][0]) + ny * (cam.y - w[0][1]) + nz * (cam.z - w[0][2]) < 0) { nx = -nx; ny = -ny; nz = -nz; }
      const lum = 0.4 + 0.6 * Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
      c = o.tint ? [c[0] * lum * 0.3 + 180, c[1] * lum * 0.3 + 180, c[2] * lum * 0.3 + 180] : [c[0] * lum, c[1] * lum, c[2] * lum];
    }
    const col = shade(c[0], c[1], c[2], Math.sqrt(d));
    ctx.beginPath();
    for (let i = 0; i < w.length; i++) {
      const q = proj(w[i][0], w[i][1], w[i][2]);
      if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
    }
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 0.6; ctx.stroke();
  }
  return tf;
}

function glowAt(x, y, z, r, col) {
  const p = proj(x, y, z);
  if (!p) return;
  const R = Math.max(2, r * p.s * (0.85 + Math.random() * 0.3));
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
  g.addColorStop(0, 'rgba(255,255,235,1)');
  g.addColorStop(0.35, `rgba(${col},0.9)`);
  g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
}

function drawPlayer() {
  ctx.save();
  if (player.inv > 0 && Math.floor(time * 20) % 2 === 0) ctx.globalAlpha = 0.45;
  const tf = drawMesh(MESH[world.vehicle === 'spike' ? 'spikeP' : world.vehicle], {
    x: player.x, y: player.y, z: player.z,
    roll: -player.bank, pitch: -player.vy * 0.03, yaw: player.vx * 0.012,
  });
  if (world.vehicle === 'racer') drawRacerExtras(tf, player.boostT > 0);
  else {
    const g = ENGINE_GLOWS[world.vehicle];
    ctx.globalCompositeOperation = 'lighter';
    for (const q of g.pts) { const w = tf(q); glowAt(w[0], w[1], w[2], g.r, g.col); }
  }
  ctx.restore();
}

// Rocket racer cables, the crackling energy link between the engines, and engine flames
function drawRacerExtras(tf, boosting) {
  ctx.save();
  ctx.lineCap = 'round';
  for (const s of [1, -1]) {
    const a = tf([s * 0.48, 0, -0.45]), b = tf([s * 0.12, 0.02, -1.0]);
    line3d(a[0], a[1], a[2], b[0], b[1], b[2], 'rgba(40,40,46,0.9)', 0.012);
  }
  const j = (Math.random() - 0.5) * 0.06;
  const a = tf([0.33, 0.05 + j, 0.75]), b = tf([-0.33, 0.05 - j, 0.75]);
  line3d(a[0], a[1], a[2], b[0], b[1], b[2], 'rgba(120,200,255,0.45)', 0.08);
  line3d(a[0], a[1], a[2], b[0], b[1], b[2], 'rgba(235,250,255,0.95)', 0.02);
  ctx.globalCompositeOperation = 'lighter';
  for (const s of [1, -1]) { const w = tf([s * 0.48, 0, -0.52]); glowAt(w[0], w[1], w[2], boosting ? 0.34 : 0.14, boosting ? '255,170,90' : '140,200,255'); }
  ctx.restore();
}

function drawRival(r) {
  drawShadow(r.x, r.y, r.z, 1.1);
  const tf = drawMesh(rivalMesh(r), { x: r.x, y: r.y, z: r.z, roll: -r.bank });
  drawRacerExtras(tf, r.boostT > 0);
  const d = r.z - cam.z;
  if (d < 70 && d > 2) {
    const p = proj(r.x, r.y + 0.7, r.z);
    if (p) {
      ctx.save();
      ctx.font = '700 13px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 3;
      ctx.fillStyle = `rgba(255,240,210,${clamp(1.4 - d / 50, 0, 1)})`;
      ctx.fillText(r.name, p.x, p.y);
      ctx.restore();
    }
  }
}

function drawEnemy(t) {
  if (t.kind === 'tower') return drawTower(t);
  if (t.rise <= 0) return;
  const tint = t.hitFlash > 0;
  if (t.kind === 'spike') drawMesh(MESH.spikeEnemy, { x: t.x, y: t.y, z: t.z, yaw: t.chase ? 0 : Math.PI, roll: Math.sin(time * 0.9 + t.phase) * 0.5, scale: 0.3 + 0.7 * t.rise, tint });
  else if (t.kind === 'scout') drawMesh(MESH.scout, { x: t.x, y: t.y - 0.15, z: t.z, yaw: Math.PI, roll: (t.x - t.fx) * 0.12, tint });
  else drawMesh(MESH.probe, { x: t.x, y: t.y, z: t.z, yaw: Math.sin(time + t.phase) * 0.4, tint });
  if (t.flash > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glowAt(t.x, t.y - (t.kind === 'scout' ? 0.3 : 0), t.z - 0.7, 0.35, world.boltCol || '80,255,110');
    ctx.restore();
  }
}

function drawWorld(showShip) {
  const zmin = cam.z + NEAR, zmax = cam.z + VIEW;
  const far = [], near = [];
  for (const o of obstacles) {
    if (o.z + o.depth < zmin || o.z > zmax) continue;
    (o.z + o.depth < player.z ? near : far).push({ z: o.z, k: 0, o });
  }
  for (const t of towers) {
    if (!t.alive || t.z < zmin || t.z > zmax) continue;
    (t.z < player.z ? near : far).push({ z: t.z, k: 1, o: t });
  }
  for (const p of pickups) {
    if (p.taken || p.z < zmin || p.z > zmax) continue;
    (p.z < player.z ? near : far).push({ z: p.z, k: 2, o: p });
  }
  for (const k of decorRocks) {
    if (k.z < zmin + k.r || k.z > zmax) continue;
    (k.z < player.z ? near : far).push({ z: k.z, k: 4, o: k });
  }
  for (const r of rivals) {
    if (r.z < zmin + 1.5 || r.z > zmax) continue;
    (r.z < player.z ? near : far).push({ z: r.z, k: 3, o: r });
  }
  far.sort((a, b) => b.z - a.z);
  near.sort((a, b) => b.z - a.z);
  const drawItem = it => {
    if (it.k === 0 && it.o.rocks) {
      const o = it.o;
      for (const k of o.rocks) drawMesh(MESH.rocks[k.v], { x: k.x, y: k.y, z: o.z + o.depth / 2, scale: k.r, yaw: time * k.s + k.p, pitch: time * k.s * 0.6 });
    } else if (it.k === 0) {
      const o = it.o;
      drawBoxes(o.draw, o.z, o.z + o.depth, o.rgb, world.key === 'deathstar');
      if (o.decor) drawBoxes(o.decor.rects, o.decor.z0, o.decor.z1, o.decor.rgb, false);
    }
    else if (it.k === 1) drawEnemy(it.o);
    else if (it.k === 2) drawPickup(it.o);
    else if (it.k === 3) drawRival(it.o);
    else { const k = it.o; drawMesh(MESH.rocks[k.v], { x: k.x, y: k.y, z: k.z, scale: k.r, yaw: time * k.s + k.p, pitch: time * k.s * 0.5 }); }
  };
  for (const it of far) drawItem(it);
  if (showShip) { if (!world.space) drawShadow(); drawPlayer(); }
  ctx.globalAlpha = 0.35;
  for (const it of near) drawItem(it);
  ctx.globalAlpha = 1;
}

function line3d(x0, y0, z0, x1, y1, z1, color, w) {
  const n = cam.z + NEAR;
  if (z0 < n && z1 < n) return;
  if (z0 < n) { const t = (n - z0) / (z1 - z0); x0 += (x1 - x0) * t; y0 += (y1 - y0) * t; z0 = n; }
  if (z1 < n) { const t = (n - z1) / (z0 - z1); x1 += (x0 - x1) * t; y1 += (y0 - y1) * t; z1 = n; }
  const a = proj(x0, y0, z0), b = proj(x1, y1, z1);
  if (!a || !b) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1.5, w * Math.max(a.s, b.s));
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}

function drawEffects() {
  ctx.save();
  // additive glow looks great in the dark, but vanishes against Frostal's bright snow
  ctx.globalCompositeOperation = world.bright ? 'source-over' : 'lighter';
  ctx.lineCap = 'round';
  for (const s of shots) {
    const k = 4 / s.vz;
    const tx = s.x - s.vx * k, ty = s.y - s.vy * k;
    if (s.kind === 'laser') {
      line3d(s.x, s.y, s.z, tx, ty, s.z - 4, `rgba(${world.shotCol || '255,50,40'},0.35)`, 0.16);
      line3d(s.x, s.y, s.z, tx, ty, s.z - 4, 'rgba(255,210,200,0.95)', 0.05);
    } else if (world.key === 'hoth') {
      // harpoon trailing its tow cable back to the snow skimmer
      line3d(player.x, player.y + 0.03, player.z - 0.7, s.x, s.y, s.z, 'rgba(60,62,70,0.9)', 0.015);
      line3d(s.x, s.y, s.z, tx, ty, s.z - 0.5, 'rgba(90,92,100,1)', 0.06);
    } else if (world.key === 'endor') {
      // blast charge: small metal ball with a blinking red light
      const p = proj(s.x, s.y, s.z);
      if (p) {
        ctx.fillStyle = '#9a9ea6';
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(3, 0.12 * p.s), 0, Math.PI * 2); ctx.fill();
        if (Math.floor(time * 12) % 2) glowAt(s.x, s.y, s.z - 0.01, 0.12, '255,40,30');
      }
    } else {
      line3d(s.x, s.y, s.z, tx, ty, s.z - 4, 'rgba(255,140,40,0.35)', 0.12);
      const p = proj(s.x, s.y, s.z);
      if (p) {
        const r = Math.max(3, 0.35 * p.s * (0.9 + Math.random() * 0.2));
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(0.3, 'rgba(140,200,255,0.95)');
        g.addColorStop(0.6, 'rgba(255,140,60,0.5)');
        g.addColorStop(1, 'rgba(255,80,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  for (const b of bolts) {
    const k = 0.06;
    line3d(b.x, b.y, b.z, b.x - b.vx * k, b.y - b.vy * k, b.z - b.vz * k, `rgba(${world.boltCol || '60,255,90'},0.4)`, 0.2);
    line3d(b.x, b.y, b.z, b.x - b.vx * k, b.y - b.vy * k, b.z - b.vz * k, 'rgba(210,255,210,0.95)', 0.06);
  }
  for (const p of particles) {
    const q = proj(p.x, p.y, p.z);
    if (!q || p.z < cam.z + NEAR) continue;
    const a = clamp(p.life / p.max, 0, 1);
    const r = Math.max(1, p.size * q.s * (0.6 + (1 - a)));
    ctx.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${a})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 4;   // keeps the HUD readable over bright snow
  ctx.textBaseline = 'top';
  ctx.font = '700 16px system-ui, sans-serif';
  ctx.fillStyle = '#ffd84a';
  ctx.fillText('SCORE ' + Math.floor(score), 16, 16);
  ctx.fillStyle = '#cfd8ea';
  ctx.font = '600 14px system-ui, sans-serif';
  ctx.fillText('LEVEL ' + level + '   HI ' + Math.max(hi, Math.floor(score)), 16, 40);
  ctx.fillStyle = '#7fd0ff';
  ctx.fillText('AIM ASSIST: ' + ASSIST[assist].label, 16, 60);

  // Deflector shield bar
  const bw = Math.min(220, W * 0.35), bx = 16, by = H - 34;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(bx, by, bw, 14);
  const sh = Math.min(player.shield, 100) / 100;
  ctx.fillStyle = sh > 0.5 ? '#46d2ff' : sh > 0.25 ? '#ffc23a' : '#ff4a3a';
  ctx.fillRect(bx, by, bw * sh, 14);
  const extra = Math.round(player.shield - 100);
  if (extra > 0) {   // bonus shields above 100 show as a gold strip
    ctx.fillStyle = '#ffd84a';
    ctx.fillRect(bx, by + 9, bw * extra / 100, 5);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.strokeRect(bx + 0.5, by + 0.5, bw, 14);
  ctx.fillStyle = '#cfd8ea';
  ctx.fillText('DEFLECTOR SHIELDS' + (extra > 0 ? `  +${extra} BONUS` : ''), bx, by - 20);

  // Ammo (bottom right, above the touch buttons when shown)
  ctx.textAlign = 'right';
  const ax = W - 16;
  let ay = H - (touchUI ? 130 : 24);
  ctx.textBaseline = 'bottom';
  for (let i = 0; i < Math.min(ammo.torp, 12); i++) {
    const cx = ax - 6 - i * 16, cy = ay - 6;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 6);
    g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#8cc8ff'); g.addColorStop(1, '#ff8c3c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
  }
  if (ammo.torp > 12) { ctx.fillStyle = '#cfd8ea'; ctx.fillText('+' + (ammo.torp - 12), ax - 12 * 16 - 4, ay); }
  ctx.fillStyle = ammo.torp ? '#cfd8ea' : '#ff4a3a';
  ctx.fillText(world.secName + ' ' + ammo.torp, ax, ay - 16);
  ctx.fillStyle = ammo.laser > 20 ? '#ffb0a8' : '#ff4a3a';
  ctx.font = '700 16px system-ui, sans-serif';
  if (!world.noGuns) ctx.fillText(world.laserName + ' ' + ammo.laser, ax, ay - 38);
  ctx.textBaseline = 'top';
  ctx.font = '600 14px system-ui, sans-serif';

  // Progress to the target
  ctx.textAlign = 'left';
  const pw = Math.min(360, W * 0.4), px = (W - pw) / 2, py = 20;
  const prog = world.quota ? clamp(levelKills / quota, 0, 1) : clamp(player.z / endZ, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(px, py, pw, 8);
  ctx.fillStyle = '#ffd84a';
  ctx.fillRect(px, py, pw * prog, 8);
  ctx.fillStyle = '#ff7a2a';
  ctx.beginPath(); ctx.arc(px + pw, py + 4, 6, 0, Math.PI * 2); ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#cfd8ea';
  ctx.fillText(world.quota ? `${world.targetShort} DOWN  ${levelKills} / ${quota}`
                           : world.targetShort + '  ' + Math.max(0, Math.floor(endZ - player.z)) + ' m', W / 2, py + 14);
  if (world.race) {
    const place = racePlace();
    ctx.font = '800 26px system-ui, sans-serif';
    ctx.fillStyle = place === 1 ? '#ffd84a' : '#ffffff';
    ctx.fillText(`${ordinal(place).toUpperCase()} PLACE`, W / 2, py + 36);
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillStyle = '#cfd8ea';
    ctx.fillText(`of ${rivals.length + 1} racers`, W / 2, py + 66);
    ctx.font = '600 14px system-ui, sans-serif';
  }

  if (state === 'playing' && !world.noGuns) {
    // Crosshair
    const c = proj(player.x, player.y, player.z + 35);
    if (c) {
      ctx.strokeStyle = 'rgba(255,120,110,0.85)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(c.x, c.y, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(c.x - 20, c.y); ctx.lineTo(c.x - 7, c.y);
      ctx.moveTo(c.x + 7, c.y); ctx.lineTo(c.x + 20, c.y);
      ctx.moveTo(c.x, c.y - 20); ctx.lineTo(c.x, c.y - 7);
      ctx.moveTo(c.x, c.y + 7); ctx.lineTo(c.x, c.y + 20);
      ctx.stroke();
    }
    // Aim-assist lock on the next enemy
    if (lockTarget && lockTarget.alive) {
      const p = proj(lockTarget.x, lockTarget.y, lockTarget.z - 0.3);
      if (p) {
        const r = Math.max(12, 0.7 * p.s);
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(time * 3);
        ctx.strokeStyle = '#7fd0ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath(); ctx.stroke();
        ctx.restore();
      }
    }
    // Target brackets around the final target
    if (endZ - player.z < VIEW) {
      const p = proj(port.x, port.y, endZ);
      if (p) {
        const locked = Math.hypot(player.x - port.x, player.y - port.y) < port.r * 0.9 ||
          (ASSIST[assist].radius && Math.hypot(player.x - port.x, player.y - port.y) < ASSIST[assist].radius * 1.2);
        const r = Math.max(port.r * p.s, 10) + 10;
        const L = r * 0.45;
        ctx.strokeStyle = locked ? '#ff3a3a' : '#ffd84a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
          ctx.moveTo(p.x + sx * r, p.y + sy * (r - L)); ctx.lineTo(p.x + sx * r, p.y + sy * r); ctx.lineTo(p.x + sx * (r - L), p.y + sy * r);
        }
        ctx.stroke();
        ctx.fillStyle = locked ? '#ff3a3a' : '#ffd84a';
        ctx.font = '700 14px system-ui, sans-serif';
        ctx.fillText(locked ? (world.lockText || `LOCKED — ${world.secVerb}!`) : world.targetName, p.x, p.y + r + 6);
      }
    }
  }

  if (msgT > 0) {
    ctx.globalAlpha = clamp(msgT * 2, 0, 1);
    ctx.font = `800 ${Math.round(clamp(W / 28, 18, 40))}px system-ui, sans-serif`;
    ctx.fillStyle = '#ffd84a';
    ctx.shadowColor = 'rgba(255,180,40,0.7)'; ctx.shadowBlur = 16;
    ctx.fillText(msg, W / 2, H * 0.2);
  }
  ctx.restore();
}

function render() {
  if (finaleActive) { drawFinale(); return; }
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
  drawSky();
  // the Doom Moon trench ends at its wall; on Verda and Frostal the ground carries on past the target
  if (world.clipEnd) { drawEnd(); drawSurface(); }
  else { drawSurface(); drawEnd(); }
  drawWorld(state !== 'dead' && !(state === 'overlay' && player.shield <= 0));
  drawEffects();
  drawMotes();
  if (hyper.t > 0) drawHyperspace(hyperAmount());
  if (world.key === 'endor') drawCanopy();
  ctx.restore();
  if (world.key === 'hoth') drawSnowfall();
  drawVignette();
  if (caveDark > 0) { ctx.fillStyle = `rgba(0,0,0,${caveDark})`; ctx.fillRect(0, 0, W, H); }

  if (hitFlash > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(255,0,0,0)');
    g.addColorStop(1, `rgba(255,30,20,${0.55 * hitFlash})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,245,220,${clamp(flash, 0, 1) * 0.85})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (state !== 'menu' && state !== 'quiz') drawHUD();
}

// ---------- Secret ending (after all missions) ----------
// Commander Grimm's spike fighter chases your Starling, the Comet Runner blasts him away, the Doom Moon explodes,
// and Grimm's robot mask looms over the stars, grumbling about next time.
let finaleActive = false, finaleT = 0, finBolts = [], finFlags = {};
const finDebris = Array.from({ length: 110 }, () => ({ a: rand(0, Math.PI * 2), v: rand(0.2, 1.5), s: rand(1, 4) }));
const ease = u => (u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u));

function startFinale() {
  finaleActive = true; finaleT = 0; finBolts = []; finFlags = {}; particles = [];
  state = 'finale';
  hideOverlay();
  setWorld(WORLDS[0]);
  obstacles = []; towers = []; pickups = []; shots = []; bolts = []; rivals = [];
}

// Where each ship is at time t (camera sits at the origin looking down +z)
function finPos(t) {
  const hero = { x: Math.sin(t * 1.3) * 0.6, y: -0.5 + Math.sin(t * 0.9) * 0.25, z: 7, roll: -Math.cos(t * 1.3) * 0.35 };
  let grimm;
  if (t < 5.2) {
    const u = ease((t - 0.8) / 2.2);
    grimm = { x: -3.2 + 2.0 * u + Math.sin(t * 1.7) * 0.2, y: 1.6 - 1.0 * u, z: -1 + 4.6 * u, roll: 0.3 * Math.sin(t * 2) };
  } else {
    const u = t - 5.2;   // knocked spinning away
    grimm = { x: -1.0 - u * 3.5, y: 0.6 + u * 1.6, z: 3.6 + u * 2.5, roll: u * 9 };
  }
  const u = ease((t - 4.0) / 1.0), v = ease((t - 5.0) / 1.6);
  const runner = { x: 3 - 1.7 * u - 5.5 * v, y: 7 - 5.4 * u + 3.5 * v, z: 26 - 14 * u - 6 * v, roll: 0.5 * u - 0.9 * v, pitch: 0.4 * (1 - u) };
  return { hero, grimm, runner };
}

function fireFin(from, to, col, miss, spd) {
  const dx = to.x + miss - from.x, dy = to.y + miss * 0.5 - from.y, dz = to.z - from.z;
  const len = Math.hypot(dx, dy, dz) || 1;
  finBolts.push({ x: from.x, y: from.y, z: from.z, vx: dx / len * spd, vy: dy / len * spd, vz: dz / len * spd, col, life: len / spd + 0.3 });
}

function updateFinale(dt) {
  finaleT += dt;
  const t = finaleT, P = finPos(t);
  const once = (k, at, fn) => { if (!finFlags[k] && t >= at) { finFlags[k] = true; fn(); } };
  once('grumble', 1.6, () => sfx.grumble());
  if (t > 2.2 && t < 4.6) {   // Grimm fires… and keeps missing
    finFlags.tf = (finFlags.tf || 0) - dt;
    if (finFlags.tf <= 0) { finFlags.tf = 0.3; fireFin(P.grimm, P.hero, '80,255,110', rand(-0.7, 0.7), 30); sfx.enemy(); }
  }
  once('runner', 4.0, () => sfx.torp());
  if (t > 4.5 && t < 5.2) {   // the Comet Runner to the rescue
    finFlags.ff = (finFlags.ff || 0) - dt;
    if (finFlags.ff <= 0) { finFlags.ff = 0.12; fireFin(P.runner, P.grimm, '255,70,50', 0, 40); sfx.laser(); }
  }
  once('grimmHit', 5.2, () => { burst(P.grimm.x, P.grimm.y, P.grimm.z, 50, FIRE, 5, 0.12, 1); sfx.small(); });
  once('boom', 7.2, () => { sfx.boom(); flash = 1; shake = 1.2; });
  once('grimm', 9.6, () => sfx.grumble());
  for (const b of finBolts) { b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt; b.life -= dt; }
  finBolts = finBolts.filter(b => b.life > 0);
  if (t >= 13.4 && state === 'finale') finishFinale();
}

function finishFinale() {
  if (state !== 'finale') return;
  saveHi();
  state = 'overlay';
  sfx.win();
  showOverlay('🏆 YOU DID IT, PILOT! 🏆',
    `<p class="big">You completed all ${TOTAL_LEVELS} missions!</p>
     <p>🥚 <b>Secret ending unlocked:</b> Commander Grimm himself came after you — and Captain Nova of the Star Guard had your back.</p>
     <p class="big" style="color:#ff6a5a">“Grr… you got lucky, pilot. Next time I’m bringing MORE spikes!” — Commander Grimm</p>
     <p>Final score: <b>${Math.floor(score)}</b> · High score: ${hi}</p>
     <button class="link" data-menu="share">🔗 Challenge a friend — share Space Wars!</button>
     ${bookCard()}`,
    'PLAY AGAIN', showMenu);
}

function drawDoomMoon2D(x, y, r) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, '#a3a9b3'); g.addColorStop(0.7, '#5a5f68'); g.addColorStop(1, '#25282e');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
  ctx.strokeStyle = 'rgba(30,32,38,0.35)'; ctx.lineWidth = 1;
  for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.ellipse(x, y + k * r * 0.24, r, r * 0.1, 0, 0, Math.PI); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(15,16,20,0.85)'; ctx.lineWidth = r * 0.035;   // equatorial trench
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.02, r, r * 0.12, 0, 0, Math.PI); ctx.stroke();
  for (const [cx, cy, cr] of [[-0.45, -0.5, 0.1], [0.5, 0.45, 0.13], [-0.2, 0.55, 0.07], [0.62, -0.3, 0.06]]) {   // old craters
    ctx.fillStyle = 'rgba(30,32,38,0.4)';
    ctx.beginPath(); ctx.arc(x + cx * r, y + cy * r, cr * r, 0, Math.PI * 2); ctx.fill();
  }
  const dx = x + r * 0.1, dy = y - r * 0.36, dr = r * 0.2;                // glowing red reactor eye
  const dg = ctx.createRadialGradient(dx, dy, dr * 0.05, dx, dy, dr);
  dg.addColorStop(0, '#ffd2a0'); dg.addColorStop(0.35, '#ff4a2a'); dg.addColorStop(1, '#3a0a08');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.ellipse(dx, dy, dr * 1.3, dr * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2a2d33'; ctx.lineWidth = r * 0.03;
  ctx.beginPath(); ctx.ellipse(dx, dy, dr * 1.3, dr * 0.7, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawDoomMoonBoom(x, y, r, et) {
  const a = clamp(1 - et / 2.4, 0, 1), fr = r * (1 + et * 1.6);
  const g = ctx.createRadialGradient(x, y, 0, x, y, fr);
  g.addColorStop(0, `rgba(255,255,240,${a})`);
  g.addColorStop(0.4, `rgba(255,170,60,${a * 0.8})`);
  g.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, fr, 0, Math.PI * 2); ctx.fill();
  const ra = clamp(1 - et / 3, 0, 1);   // flat shockwave ring
  ctx.strokeStyle = `rgba(255,225,180,${ra})`;
  ctx.lineWidth = Math.max(1, r * 0.06 * ra);
  ctx.beginPath(); ctx.ellipse(x, y, r * (0.5 + et * 3), r * (0.1 + et * 0.45), -0.2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = `rgba(255,200,140,${clamp(1 - et / 3.5, 0, 1)})`;
  for (const d of finDebris) ctx.fillRect(x + Math.cos(d.a) * d.v * r * et * 1.4, y + Math.sin(d.a) * d.v * r * et * 1.4, d.s, d.s);
}

// Commander Grimm's robot mask, drawn in 2D (unit size ≈ 1, centred on x, y):
// a boxy metal head with one glowing red visor and a blinking antenna
function drawGrimmMask(x, y, s, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.scale(s, s);
  const rr = (x0, y0, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x0 + r, y0); ctx.lineTo(x0 + w - r, y0); ctx.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
    ctx.lineTo(x0 + w, y0 + h - r); ctx.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h);
    ctx.lineTo(x0 + r, y0 + h); ctx.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r);
    ctx.lineTo(x0, y0 + r); ctx.quadraticCurveTo(x0, y0, x0 + r, y0); ctx.closePath();
  };
  ctx.strokeStyle = '#3a3d48'; ctx.lineWidth = 0.05;   // antenna
  ctx.beginPath(); ctx.moveTo(0.35, -0.78); ctx.lineTo(0.5, -1.25); ctx.stroke();
  const blink = 0.55 + 0.45 * Math.sin(finaleT * 9);
  const ag = ctx.createRadialGradient(0.5, -1.28, 0, 0.5, -1.28, 0.2);
  ag.addColorStop(0, `rgba(255,220,200,${blink})`); ag.addColorStop(0.4, `rgba(255,50,30,${blink})`); ag.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(0.5, -1.28, 0.2, 0, Math.PI * 2); ctx.fill();
  for (const k of [-1, 1]) {   // ear bolts
    ctx.fillStyle = '#2a2c34';
    rr(k > 0 ? 0.8 : -0.98, -0.2, 0.18, 0.4, 0.06); ctx.fill();
  }
  const g = ctx.createLinearGradient(-0.8, -0.85, 0.8, 0.85);   // the head
  g.addColorStop(0, '#6a7080'); g.addColorStop(0.5, '#2a2d36'); g.addColorStop(1, '#0c0d12');
  ctx.fillStyle = g;
  rr(-0.82, -0.82, 1.64, 1.6, 0.32); ctx.fill();
  ctx.strokeStyle = 'rgba(170,180,200,0.45)'; ctx.lineWidth = 0.025;
  rr(-0.82, -0.82, 1.64, 1.6, 0.32); ctx.stroke();
  ctx.fillStyle = '#101117';   // visor band
  rr(-0.66, -0.34, 1.32, 0.36, 0.16); ctx.fill();
  const vg = ctx.createLinearGradient(-0.6, 0, 0.6, 0);   // one glowing red visor
  vg.addColorStop(0, '#5a0d0d'); vg.addColorStop(0.5, '#ff4a2a'); vg.addColorStop(1, '#5a0d0d');
  ctx.shadowColor = 'rgba(255,40,20,0.9)'; ctx.shadowBlur = 0.25 * 40;
  ctx.fillStyle = vg;
  rr(-0.56, -0.24, 1.12, 0.16, 0.08); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(190,195,210,0.55)'; ctx.lineWidth = 0.035;   // grumpy speaker-grille mouth
  for (let i = 0; i < 4; i++) { const yy = 0.3 + i * 0.1; ctx.beginPath(); ctx.moveTo(-0.32 + i * 0.03, yy); ctx.lineTo(0.32 - i * 0.03, yy); ctx.stroke(); }
  ctx.fillStyle = '#8a90a0';   // rivets
  for (const [rx, ry] of [[-0.66, -0.66], [0.66, -0.66], [-0.66, 0.62], [0.66, 0.62]]) { ctx.beginPath(); ctx.arc(rx, ry, 0.04, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

function drawFinale() {
  const t = finaleT, P = finPos(t);
  cam.x = 0; cam.y = 0; cam.z = 0;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
  ctx.fillStyle = '#02030a';
  ctx.fillRect(-30, -30, W + 60, H + 60);
  for (const st of stars) {
    const x = ((st.x * W * 1.3 - t * 6 * (0.5 + st.s)) % W + W) % W;
    ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.6 * st.s})`;
    ctx.fillRect(x, st.y * H, st.s > 0.9 ? 2 : 1.2, st.s > 0.9 ? 2 : 1.2);
  }
  const dsx = W * 0.74, dsy = H * 0.3, dsr = Math.min(W, H) * 0.24;
  if (t < 7.2) drawDoomMoon2D(dsx, dsy, dsr);
  else drawDoomMoonBoom(dsx, dsy, dsr, t - 7.2);
  if (t > 9.4) drawGrimmMask(W * 0.5, H * 0.36, Math.min(W, H) * 0.2, clamp((t - 9.4) / 1.2, 0, 0.92));

  const ships = [
    { m: MESH.starling, p: P.hero, glow: true },
    { m: MESH.runner, p: P.runner, yaw: Math.PI },
    { m: MESH.grimm, p: P.grimm },
  ].filter(sh => sh.p.z > 0.8).sort((a, b) => b.p.z - a.p.z);
  for (const sh of ships) {
    const tf = drawMesh(sh.m, { x: sh.p.x, y: sh.p.y, z: sh.p.z, roll: sh.p.roll || 0, pitch: sh.p.pitch || 0, yaw: sh.yaw || 0 });
    if (sh.glow) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const q of ENGINE_GLOWS.starling.pts) { const w = tf(q); glowAt(w[0], w[1], w[2], 0.13, ENGINE_GLOWS.starling.col); }
      ctx.restore();
    }
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const b of finBolts) {
    line3d(b.x, b.y, b.z, b.x - b.vx * 0.05, b.y - b.vy * 0.05, b.z - b.vz * 0.05, `rgba(${b.col},0.45)`, 0.12);
    line3d(b.x, b.y, b.z, b.x - b.vx * 0.05, b.y - b.vy * 0.05, b.z - b.vz * 0.05, 'rgba(255,255,240,0.9)', 0.035);
  }
  for (const p of particles) {
    const q = proj(p.x, p.y, p.z);
    if (!q) continue;
    const a = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${a})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1, p.size * q.s * (0.6 + (1 - a))), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.restore();

  // subtitles
  const subs = [
    [0.3, 2.0, '', 'Mission complete… but someone is on your tail!', '#cfd8ea'],
    [2.0, 4.5, 'COMMANDER GRIMM', '“Hold still, little Starling!”', '#ff6a5a'],
    [4.8, 7.0, 'CAPTAIN NOVA', '“WOO-HOO! Got him! The sky’s all yours, pilot!”', '#ffd84a'],
    [7.4, 9.4, '', 'The Doom Moon is destroyed!', '#cfd8ea'],
    [10.0, 13.4, 'COMMANDER GRIMM', '“Grr… this isn’t over! Next time: MORE spikes!”', '#ff6a5a'],
  ];
  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 6;
  for (const [a, b, who, line, col] of subs) {
    if (t < a || t > b) continue;
    ctx.globalAlpha = clamp(Math.min(t - a, b - t) * 3, 0, 1);
    if (who) { ctx.font = '700 15px system-ui, sans-serif'; ctx.fillStyle = col; ctx.fillText(who, W / 2, H * 0.8); }
    ctx.font = `800 ${Math.round(clamp(W / 30, 18, 34))}px system-ui, sans-serif`;
    ctx.fillStyle = who ? '#ffffff' : col;
    ctx.fillText(line, W / 2, H * 0.8 + 36);
  }
  ctx.globalAlpha = 1;
  if (state === 'finale' && t > 1) {
    ctx.font = '600 13px system-ui, sans-serif'; ctx.fillStyle = 'rgba(200,210,230,0.7)';
    ctx.fillText('Click or press any key to skip', W / 2, H - 20);
  }
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,245,220,${clamp(flash, 0, 1) * 0.85})`; ctx.fillRect(0, 0, W, H); }
  drawVignette();
}

// ---------- Overlay / UI ----------
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovBody = document.getElementById('ovBody');
const ovBtn = document.getElementById('ovBtn');
const fireButtons = document.getElementById('fireButtons');
const touchUI = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
let ovAction = null;

function showOverlay(title, html, btn, action) {
  ovTitle.innerHTML = title;
  ovBody.innerHTML = html;
  ovBtn.textContent = btn;
  ovBtn.classList.remove('hidden');
  ovAction = action;
  overlay.classList.remove('hidden');
  input.pointerFire = input.btnLaser = input.torp = false;
}
function hideOverlay() { overlay.classList.add('hidden'); }
ovBtn.addEventListener('click', () => { sfx.init(); if (ovAction) ovAction(); });

function assistPicker() {
  return `<div class="assist"><div class="label">AIM ASSIST</div><div class="opts">` +
    Object.keys(ASSIST).map(k => `<button class="opt${k === assist ? ' sel' : ''}" data-assist="${k}">${ASSIST[k].label}</button>`).join('') +
    `</div><p class="hint">${ASSIST[assist].hint}</p></div>`;
}
function setAssist(k) {
  assist = k;
  localStorage.setItem('xw_assist', k);
  for (const b of ovBody.querySelectorAll('[data-assist]')) b.classList.toggle('sel', b.dataset.assist === k);
  const hint = ovBody.querySelector('.assist .hint');
  if (hint) hint.textContent = ASSIST[k].hint;
}
// Picture cards for choosing the first mission
function startPicker() {
  return `<p class="pick-label">CHOOSE YOUR FIRST MISSION</p><div class="mission-grid">` +
    WORLDS.map((w, i) => `<button class="mission${i === startWorld ? ' sel' : ''}" data-start="${i}">
        <img src="thumbs/${w.key}.jpg" alt="">
        <span>${w.icon} ${w.short}</span></button>`).join('') +
    `</div>`;
}
function setStart(i) {
  startWorld = i;
  localStorage.setItem('xw_start', i);
  for (const b of ovBody.querySelectorAll('[data-start]')) b.classList.toggle('sel', +b.dataset.start === i);
  worldOrder = [i, ...WORLDS.map((_, k) => k).filter(k => k !== i)];
  menuScene();   // show the chosen world behind the menu
}

function gradePicker() {
  return `<div class="assist"><div class="label">SCIENCE QUESTIONS FOR</div><div class="opts">` +
    Object.keys(GRADES).map(k => `<button class="opt${k === grade ? ' sel' : ''}" data-grade="${k}">${GRADES[k].label}</button>`).join('') +
    `</div></div>`;
}
function setGrade(k) {
  grade = k;
  localStorage.setItem('xw_grade', k);
  for (const b of ovBody.querySelectorAll('[data-grade]')) b.classList.toggle('sel', b.dataset.grade === k);
}

ovBody.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  sfx.init();
  if (b.dataset.assist) setAssist(b.dataset.assist);
  else if (b.dataset.grade) setGrade(b.dataset.grade);
  else if (b.dataset.start) setStart(+b.dataset.start);
  else if (b.dataset.menu === 'howto') showHowTo();
  else if (b.dataset.menu === 'settings') showSettings();
  else if (b.dataset.menu === 'share') shareGame();
  else if (b.dataset.menu === 'home') location.href = 'index.html';
  else if (b.dataset.choice) answerQuiz(+b.dataset.choice);
  else if (b.dataset.hint) showHint();
  else if (b.dataset.bonus) chooseBonus(b.dataset.bonus === 'yes');
  else if (b.dataset.quit === 'ask') confirmQuit();
  else if (b.dataset.quit) answerQuit(b.dataset.quit === 'yes');
});

}

// ---------- Game menu: quit the current game ----------
const quitButton = () => '<div class="yesno"><button class="no" data-quit="ask">🏠 QUIT TO MAIN MENU</button></div>';
let quitSnapshot = null;   // the screen to go back to if they decide not to quit

// ☰ button: pauses during flight; on quiz and mission screens it asks whether to quit
function openGameMenu() {
  if (state === 'playing' || state === 'paused') togglePause();
  else if (state === 'quiz' || (state === 'overlay' && !finaleActive)) confirmQuit();
}

function confirmQuit() {
  if (quitSnapshot) return;
  quitSnapshot = {
    title: ovTitle.innerHTML, body: ovBody.innerHTML, btn: ovBtn.textContent,
    btnHidden: ovBtn.classList.contains('hidden'), action: ovAction,
  };
  showOverlay('QUIT THIS GAME?',
    `<p class="big">Head back to the main menu?</p>
     <p>Your progress in this game will be lost, but your high score is saved.</p>
     <div class="yesno">
       <button data-quit="yes">YES, QUIT</button>
       <button class="no" data-quit="no">NO, KEEP PLAYING</button>
     </div>
     <p class="keys">Press Y or N</p>`,
    '', null);
  ovBtn.classList.add('hidden');
}

function answerQuit(yes) {
  const snap = quitSnapshot;
  if (!snap) return;
  quitSnapshot = null;
  if (yes) {
    saveHi();
    bonus = { torp: 0, shield: 0 };
    bonusLaunch = null;
    quiz = null;
    pausedFrom = null;
    Object.assign(input, { left: false, right: false, up: false, down: false, fire: false, torp: false, pointerFire: false, btnLaser: false });
    showMenu();
    return;
  }
  showOverlay(snap.title, snap.body, snap.btn, snap.action);   // put the previous screen back exactly as it was
  if (snap.btnHidden) ovBtn.classList.add('hidden');
}

function togglePause() {
  if (state === 'playing') {
    pausedFrom = state;
    state = 'paused';
    showOverlay('PAUSED', '<p>Steady hands, pilot. Take a breather.</p>' + gradePicker() + assistPicker() + quitButton(), 'RESUME', togglePause);
  } else if (state === 'paused') {
    state = pausedFrom || 'playing';
    hideOverlay();
  }
}

function toggleMute() { RB.setMuted(!muted); }
document.getElementById('btnMute').textContent = muted ? '🔇' : '🔊';

function toggleFullscreen() {
  const d = document, el = d.documentElement;
  const isFs = d.fullscreenElement || d.webkitFullscreenElement;
  const fn = isFs ? (d.exitFullscreen || d.webkitExitFullscreen) : (el.requestFullscreen || el.webkitRequestFullscreen);
  if (!fn) return;
  const r = fn.call(isFs ? d : el);
  if (r && r.catch) r.catch(() => {});
}
const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if (!fsSupported) document.getElementById('btnFs').style.display = 'none';
document.addEventListener('fullscreenchange', resize);
document.addEventListener('webkitfullscreenchange', resize);

// 🏠 button: back to the games list. Mid-game, pause and check first so a stray tap doesn't lose a run.
document.getElementById('btnHome').addEventListener('click', e => {
  if (state === 'menu') return;
  if (state === 'playing') togglePause();
  if (!confirm('Leave Space Wars and go back to all the games? Your high score is saved.')) { e.preventDefault(); return; }
  saveHi();
});
document.getElementById('btnPause').addEventListener('click', e => { e.currentTarget.blur(); openGameMenu(); });
addEventListener('rb-leave', () => saveHi());   // leaving with the controller's View button saves your high score too
document.getElementById('btnMute').addEventListener('click', e => { e.currentTarget.blur(); sfx.init(); toggleMute(); });
document.getElementById('btnFs').addEventListener('click', e => { e.currentTarget.blur(); toggleFullscreen(); });
document.getElementById('btnShare').addEventListener('click', e => { e.currentTarget.blur(); if (state === 'playing') togglePause(); shareGame(); });

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function numberChoices(ans) {
  const cands = shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans * 2, Math.round(ans / 2)]);
  const wrong = [];
  for (const c of cands) if (c > 0 && c !== ans && !wrong.includes(c) && wrong.length < 3) wrong.push(c);
  const choices = shuffle([ans, ...wrong]);
  return { choices: choices.map(String), correct: choices.indexOf(ans) };
}

const decks = {};   // book rotation

// Which hand-written questions this player has already been asked, saved in the browser so every
// question comes up once before any repeats — even across visits. Keyed by bank, e.g. 'sci-y'.
const ASKED_KEY = 'xw_asked';
let asked = {};
try { asked = JSON.parse(localStorage.getItem(ASKED_KEY)) || {}; } catch (e) { asked = {}; }
function qid(q) {   // short, stable id from the question text
  let h = 5381;
  for (let i = 0; i < q.q.length; i++) h = (h * 33 + q.q.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
// Cadets get cadet + shared questions; Pilots get everything (their own, shared and cadet)
const forGrade = q => q.g === 'b' || q.g === grade || (grade === 'p' && q.g === 'y');

function drawFromDeck(key, list) {
  const pool = list.filter(forGrade);
  const done = asked[key] || (asked[key] = []);
  let fresh = pool.filter(q => !done.includes(qid(q)));
  if (!fresh.length) {   // every question has been asked: start a new round (but not with the one just asked)
    const last = done[done.length - 1];
    done.length = 0;
    fresh = pool.filter(q => qid(q) !== last);
  }
  const c = pick(fresh);
  done.push(qid(c));
  try { localStorage.setItem(ASKED_KEY, JSON.stringify(asked)); } catch (e) { /* storage full or blocked: still works for this visit */ }
  const order = shuffle(c.a.map((text, i) => ({ text, i })));
  return { topic: c.t, q: c.q, choices: order.map(o => o.text), correct: order.findIndex(o => o.i === 0), hint: c.hint, learn: c.learn };
}

// kind: 'gate' = science or math, 'sci' = science only, 'usa' = America trivia
let lastMath = null;
function drawQuestion(kind = 'gate') {
  if (kind === 'usa') return drawFromDeck('usa-' + grade, AMERICA);
  if (kind === 'gate' && Math.random() < 0.4) {
    let gen;
    do { gen = pick(MATH[grade]); } while (gen === lastMath && MATH[grade].length > 1);
    lastMath = gen;
    const m = gen();
    return { topic: 'MATH', q: m.q, ...numberChoices(m.ans), hint: m.hint, learn: m.learn };
  }
  return drawFromDeck('sci-' + grade, QUESTIONS);
}

let quiz = null;

// mode 'gate': keep asking until `need` are right. mode 'bonus': ask exactly `need` questions, reward each right one.
function startQuiz(need, title, intro, onPass, mode = 'gate') {
  menuScene();
  state = 'quiz';
  quiz = { mode, need, got: 0, results: [], title, intro, onPass, q: null, answered: false, kinds: shuffle(['usa', 'sci']) };
  nextQuestion();
}

function quizStars() {
  if (quiz.mode === 'bonus') {
    return Array.from({ length: quiz.need }, (_, i) => i < quiz.results.length ? (quiz.results[i] ? '★' : '✗') : '☆').join('');
  }
  return Array.from({ length: quiz.need }, (_, i) => i < quiz.got ? '★' : '☆').join('');
}

function drawBook() {
  const key = 'books-' + grade;
  if (!decks[key] || !decks[key].length) decks[key] = shuffle(BOOKS.filter(b => b.g === grade || b.g === 'b'));

function nextQuestion() {
  const kind = quiz.mode === 'bonus' ? quiz.kinds[quiz.results.length % quiz.kinds.length] : 'gate';
  const q = quiz.q = drawQuestion(kind);
  quiz.answered = false;
  showOverlay(quiz.title,
    `<div class="quiz">
       <p class="qneed">${quiz.intro}</p>
       <div class="qtop"><span class="topic">${q.topic}</span><span class="stars">${quizStars()}</span></div>
       <p class="qtext">${q.q}</p>
       <div class="choices">${q.choices.map((c, i) => `<button class="choice" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span><span>${c}</span></button>`).join('')}</div>
       <button class="hintbtn" data-hint="1">💡 Need a hint?</button>
       <p class="hinttext hidden">${q.hint}</p>
       <div class="feedback hidden"></div>
     </div>`,
    '', null);
  ovBtn.classList.add('hidden');
}

function showHint() {
  if (!quiz || quiz.answered) return;
  ovBody.querySelector('.hinttext').classList.remove('hidden');
  ovBody.querySelector('.hintbtn').classList.add('hidden');
}

function answerQuiz(i) {
  if (!quiz || quiz.answered || state !== 'quiz') return;
  const q = quiz.q;
  if (i < 0 || i >= q.choices.length) return;
  quiz.answered = true;
  const right = i === q.correct;
  ovBody.querySelectorAll('.choice').forEach((b, j) => {
    b.disabled = true;
    if (j === q.correct) b.classList.add('right');
    else if (j === i) b.classList.add('wrong');
  });
  ovBody.querySelector('.hintbtn').classList.add('hidden');
  ovBody.querySelector('.hinttext').classList.add('hidden');
  quiz.results.push(right);
  const isBonus = quiz.mode === 'bonus';
  if (right) {
    quiz.got++;
    sfx.right();
    if (isBonus) { bonus.torp += BONUS_TORP; bonus.shield += BONUS_SHIELD; }
  } else sfx.wrong();
  ovBody.querySelector('.stars').textContent = quizStars();
  const done = isBonus ? quiz.results.length >= quiz.need : quiz.got >= quiz.need;
  const fb = ovBody.querySelector('.feedback');
  fb.classList.remove('hidden');
  fb.classList.add(right ? 'good' : 'bad');
  fb.innerHTML = (right
    ? `<b>✅ Correct — great job, pilot!</b>${isBonus ? ` 🎁 +${BONUS_TORP} ${world.secOne.toLowerCase()}, +${BONUS_SHIELD} shields!` : ''}<br>`
    : `<b>Not quite — good try!</b> The answer is <b>${q.choices[q.correct]}</b>.<br>`) +
    `🎓 ${q.learn}` +
    (isBonus && done
      ? `<br><br><b>Bonus round total: +${bonus.torp} ${world.secName.toLowerCase()}, +${bonus.shield} shields.</b>`
      : '');
  ovBtn.textContent = !done ? 'NEXT QUESTION' : isBonus ? `LAUNCH ${world.vehicleName.toUpperCase()}! 🚀` : 'CONTINUE ➜';
  ovAction = done ? quiz.onPass : nextQuestion;
  ovBtn.classList.remove('hidden');
}

// ---------- Input ----------
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'fire',
};
window.addEventListener('keydown', e => {
  if (state === 'finale') { if (finaleT > 1) finishFinale(); return; }
  if (quitSnapshot) {
    if (e.code === 'KeyY') answerQuit(true);
    else if (e.code === 'KeyN' || e.code === 'Escape') answerQuit(false);
    return;
  }
  // Quiz answers use letters A–D (checked first, since A and D also steer)
  if (state === 'quiz' && /^Key[A-D]$/.test(e.code)) { answerQuiz(e.code.charCodeAt(3) - 65); return; }
  const k = KEYMAP[e.code];
  if (k) {
    e.preventDefault();
    if (k !== 'fire' && input.mouse) { input.mouse = false; target.x = player.x; target.y = player.y; }
    input[k] = true;
    sfx.init();
    return;
  }
  if (e.code === 'KeyX' || e.code === 'KeyE') { if (!e.repeat) input.torp = true; }
  else if (e.code === 'KeyP' || e.code === 'Escape') openGameMenu();
  else if (e.code === 'KeyF') toggleFullscreen();
  else if (e.code === 'KeyM') toggleMute();
  else if (state === 'quiz' && e.code === 'KeyH') showHint();
  else if (state === 'quiz' && bonusLaunch && (e.code === 'KeyY' || e.code === 'KeyN')) chooseBonus(e.code === 'KeyY');
  else if (e.code === 'Enter' && !overlay.classList.contains('hidden') && !ovBtn.classList.contains('hidden')) ovBtn.click();
});
window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) input[k] = false;
});

function pointerTarget(e) {
  input.mouse = true;
  target.x = (e.clientX / W * 2 - 1) * TW * 1.25;
  // top 10% of screen = top of the channel, bottom 15% = floor
  const fy = (e.clientY / H - 0.1) / 0.75;
  target.y = (TH - 0.4) - fy * (TH - 0.8);
}
// Touch screens steer with a floating joystick: put a thumb down anywhere and drag.
const stick = createTouchStick(canvas, { enabled: () => state === 'playing' });
canvas.addEventListener('pointerdown', e => {
  sfx.init();
  if (state === 'finale') { if (finaleT > 1) finishFinale(); return; }
  canvas.setPointerCapture(e.pointerId);
  if (e.pointerType !== 'mouse') {
    // hand steering back from the mouse to the joystick, starting where the ship is
    if (input.mouse) { input.mouse = false; target.x = player.x; target.y = player.y; }
    return;
  }
  pointerTarget(e);
  // Mouse buttons fire; touches use the on-screen buttons
  if (state === 'playing') {
    if (e.button === 2) input.torp = true;
    else if (e.button === 0) input.pointerFire = true;
  }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') pointerTarget(e);
});
const release = e => { if (e.pointerType !== 'mouse' || e.button === 0) input.pointerFire = false; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('contextmenu', e => e.preventDefault());

const btnLaser = document.getElementById('btnLaser'), btnTorp = document.getElementById('btnTorp');
btnLaser.addEventListener('pointerdown', e => { e.preventDefault(); sfx.init(); input.btnLaser = true; });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) btnLaser.addEventListener(ev, () => { input.btnLaser = false; });
btnTorp.addEventListener('pointerdown', e => { e.preventDefault(); sfx.init(); input.torp = true; });
for (const b of [btnLaser, btnTorp]) b.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('blur', () => { if (state === 'playing') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state !== 'paused') update(dt);
  fireButtons.classList.toggle('hidden', !(touchUI && state === 'playing'));
  render();
  requestAnimationFrame(frame);
}

showMenu();
snapCamera();
requestAnimationFrame(frame);
</script>
</body>
</html>
