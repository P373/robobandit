const TOTAL_LEVELS = WORLDS.length;
// You pick the first world; the rest follow in a random order, each played once per game.
let startWorld = +(localStorage.getItem('xw_start') || 0);
if (!WORLDS[startWorld]) startWorld = 0;
let worldOrder = [startWorld, ...WORLDS.map((_, i) => i).filter(i => i !== startWorld)];
const worldFor = n => WORLDS[worldOrder[(n - 1) % TOTAL_LEVELS]];
const tierFor = n => (n >= 5 ? 3 : n >= 3 ? 2 : 1);   // later missions unlock trickier obstacles

// ---------- Canvas ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, F = 0, CX = 0, CY = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  F = Math.min(W * 0.9, H * 1.15);
  CX = W / 2; CY = H * 0.40;
}
window.addEventListener('resize', resize);
resize();

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

// ---------- Audio ----------
let muted = RB.muted;   // shared with the other RoboBandit games
RB.onMute(m => { muted = m; });
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  function init() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  const ok = () => ac && !muted;
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (!ok()) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, f0, f1) {
    if (!ok()) return;
    const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const fl = ac.createBiquadFilter(); fl.type = 'lowpass';
    fl.frequency.setValueAtTime(f0, t);
    fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur);
  }
  return {
    init,
    laser()  { tone('square', 1400, 180, 0.13, 0.06); },
    torp()   { tone('sawtooth', 220, 900, 0.35, 0.08); noise(0.4, 0.25, 4000, 300); },
    empty()  { tone('square', 120, 100, 0.06, 0.05); },
    enemy()  { tone('sawtooth', 500, 120, 0.18, 0.025); },
    tick()   { tone('square', 900, 600, 0.05, 0.05); },
    rise()   { tone('triangle', 80, 220, 0.25, 0.05); },
    hit()    { noise(0.35, 0.5, 2000, 100); tone('sawtooth', 160, 40, 0.3, 0.12); },
    small()  { noise(0.4, 0.35, 2500, 150); },
    boom()   { noise(1.4, 0.9, 3000, 40); tone('sine', 90, 25, 1.2, 0.4); },
    pickup() { tone('sine', 600, 1200, 0.15, 0.15); tone('sine', 900, 1800, 0.15, 0.1, 0.08); },
    right()  { [660, 880, 1320].forEach((f, i) => tone('sine', f, f, 0.18, 0.12, i * 0.08)); },
    wrong()  { tone('triangle', 300, 200, 0.3, 0.1); },
    win()    { [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.35, 0.15, 0.4 + i * 0.13)); },
    hyper()  { tone('sawtooth', 60, 1400, 1.4, 0.07); noise(2.4, 0.25, 600, 4000); },
    grumble() { tone('square', 140, 80, 0.45, 0.04); tone('square', 120, 60, 0.55, 0.04, 0.5); tone('sine', 70, 50, 1.0, 0.12); },
    lose()   { [392, 330, 262].forEach((f, i) => tone('triangle', f, f * 0.98, 0.4, 0.15, i * 0.18)); },
  };
})();

const player = { x: 0, y: 2, z: 0, vx: 0, vy: 0, bank: 0, shield: 100, inv: 0, fireCd: 0, torpCd: 0, gun: 0, boostT: 0 };

// ---------- Level generation ----------
function setWorld(w) {
  world = w;
  FOG = w.fog;
  [SHIP_HW, SHIP_HH] = w.hit;
  TW = w.tw || 3;
  TH = w.th || 5;
  btnLaser.innerHTML = w.laserName.replace(' ', '<br>');
  btnLaser.style.display = w.noGuns ? 'none' : '';
  btnTorp.innerHTML = w.secBtn;
}

// rects = collision boxes [x0, x1, y0, y1]; draw = what to render (e.g. tree trunks that rise above the
// play area); decor = extra scenery boxes that can't be hit (e.g. the body above Mega Walker legs).
function makeObstacle(type, z, n) {
  let rects, draw = null, decor = null, depth = rand(0.8, 1.4);
  let rgb = pick(world.obstacleRGB);
  const tall = rs => rs.map(r => [r[0], r[1], r[2], r[3] >= TH ? TH + 14 : r[3]]);
  switch (type) {
    case 'low': case 'ridge': case 'dune':     rects = [[-TW, TW, 0, rand(1.9, 2.5)]]; break;
    case 'high': case 'icicle': case 'ledge':  rects = [[-TW, TW, rand(2.4, 3.0), TH]]; break;
    case 'left': case 'iceL': case 'rockL':    rects = [[-TW, rand(0, 0.8), 0, TH]]; break;
    case 'right': case 'iceR': case 'rockR':   rects = [[rand(-0.8, 0), TW, 0, TH]]; break;
    case 'center': case 'spire': case 'boulder': { const w = rand(0.7, 1.0); rects = [[-w, w, 0, TH]]; break; }
    case 'diag':
      rects = Math.random() < 0.5
        ? [[-TW, 0, 0, 2.5], [0, TW, 2.5, TH]]
        : [[0, TW, 0, 2.5], [-TW, 0, 2.5, TH]];
      break;
    case 'cross':  rects = [[-TW, TW, 0, 1.6], [-0.6, 0.6, 1.6, TH]]; break;
    case 'window': case 'arch': case 'rockArch': {
      const hw = clamp(1.3 - n * 0.05, 0.95, 1.3), hh = clamp(1.05 - n * 0.04, 0.8, 1.05);
      const hx = rand(-TW + hw + 0.2, TW - hw - 0.2), hy = rand(hh + 0.3, TH - hh - 0.3);
      rects = [[-TW, hx - hw, 0, TH], [hx + hw, TW, 0, TH],
               [hx - hw, hx + hw, 0, hy - hh], [hx - hw, hx + hw, hy + hh, TH]]
        .filter(r => r[1] - r[0] > 0.01 && r[3] - r[2] > 0.01);
      break;
    }
    // Verda
    case 'trunk': {
      const w = rand(0.9, 1.3), x = rand(-2, 2);
      rects = [[x - w / 2, x + w / 2, 0, TH]]; depth = w; draw = tall(rects);
      break;
    }
    case 'twin': rects = [[-2.05, -1.15, 0, TH], [1.15, 2.05, 0, TH]]; depth = 0.9; draw = tall(rects); break;
    case 'log': rects = [[-TW, TW, 0, rand(1.4, 2.0)]]; depth = 0.9; rgb = [106, 78, 52]; break;
    case 'branch': { const y = rand(2.5, 2.9); rects = [[-TW, TW, y, y + 0.6]]; depth = 0.5; rgb = [88, 64, 42]; break; }
    case 'branchLow': { const y = rand(1.5, 1.9); rects = [[-TW, TW, y, y + 0.55]]; depth = 0.5; rgb = [88, 64, 42]; break; }
    case 'trunkLog': {
      const x = rand(-1.5, 1.5);
      rects = [[-TW, TW, 0, 1.5], [x - 0.5, x + 0.5, 1.5, TH]]; depth = 1; draw = tall(rects);
      break;
    }
    // Space: tumbling asteroids. Collision boxes are a little smaller than the rocks look.
    case 'rock': case 'rock2': case 'rockPair': case 'rockWall': {
      const rocks = [];
      const add = (x, y, r) => rocks.push({ x, y, r, v: (Math.random() * 6) | 0, s: rand(-0.6, 0.6), p: rand(0, 6) });
      if (type === 'rockWall') {
        // fill a 3 × 2 grid of cells with rocks, leaving one cell open to fly through
        const open = (Math.random() * 6) | 0, cw = (TW * 2) / 3, ch = TH / 2;
        for (let c = 0; c < 6; c++) if (c !== open) {
          const r = rand(0.9, 1.3);
          add(-TW + cw * (c % 3 + 0.5) + rand(-0.3, 0.3), ch * ((c / 3 | 0) + 0.5) + rand(-0.3, 0.3), r);
        }
      } else {
        const count = type === 'rock' ? 1 : type === 'rock2' ? 2 : 3;
        for (let k = 0; k < count; k++) { const r = rand(0.7, 1.4); add(rand(-TW + r, TW - r), rand(r, TH - r), r); }
      }
      const R = Math.max(...rocks.map(k => k.r));
      rects = rocks.map(k => [k.x - k.r * 0.8, k.x + k.r * 0.8, k.y - k.r * 0.8, k.y + k.r * 0.8]);
      depth = R * 1.6;
      return { z, depth, rects, draw: rects, rocks, decor: null, rgb, hit: false, passed: false };
    }
    // Frostal: a pair of Mega Walker legs with the walker's body overhead
    case 'legs': {
      // a 3-unit gap between the legs, plus room to fly around the outside
      const c = rand(-0.6, 0.6);
      rects = [[c - 2.1, c - 1.5, 0, TH], [c + 1.5, c + 2.1, 0, TH]];
      draw = rects.map(r => [r[0], r[1], 0, 6.2]);
      depth = 0.6; rgb = [128, 84, 56];
      decor = { rects: [[c - 2.4, c + 2.4, 6.2, 8.4]], z0: z - 0.8, z1: z + 3.6, rgb: [140, 92, 62] };
      break;
    }
  }
  return { z, depth, rects, draw: draw || rects, decor, rgb, hit: false, passed: false };
}

// Enemies pop up as you approach: laser turrets rise from the Doom Moon's surface,
// scout riders swoop out from behind Verda's trees, probe bots rise out of Frostal's snow.
function makeEnemy(z) {
  const t = { kind: world.enemy, z, hp: TOWER_HP, pending: 0, rise: 0, alive: true, cd: rand(0.5, 2), flash: 0, hitFlash: 0, phase: rand(0, 6) };
  if (t.kind === 'tower') { t.side = pick(['L', 'R', 'F']); t.ax = rand(-2.2, 2.2); t.ay = rand(1, 4.2); }
  else if (t.kind === 'scout') { const s = pick([-1, 1]); t.fx = s * rand(1.2, 2.3); t.sx = s * 7; t.fy = rand(0.8, 2.2); }
  else if (t.kind === 'spike') {
    // most come at you head-on and shoot; some fly away and you chase them
    t.chase = Math.random() < 0.35;
    t.vz = levelSpeed * (t.chase ? rand(0.5, 0.65) : -rand(0.1, 0.25));
    t.fx = rand(-TW + 1.2, TW - 1.2); t.fy = rand(1.2, TH - 1.2);
  }
  else { t.fx = rand(-TW + 0.8, TW - 0.8); t.fy = rand(1.4, 3.6); t.sy = -0.8; }
  updateTowerPos(t);
  return t;
}

function towerBox(t) {
  if (t.kind === 'tower') {
    const h = 0.6 * t.rise;
    if (t.side === 'L') return [-TW, -TW + h, t.ay - 0.3, t.ay + 0.3];
    if (t.side === 'R') return [TW - h, TW, t.ay - 0.3, t.ay + 0.3];
    return [t.ax - 0.3, t.ax + 0.3, 0, h];
  }
  const hw = t.kind === 'scout' ? 0.45 : t.kind === 'spike' ? 0.65 : 0.35;
  const hh = t.kind === 'spike' ? 0.6 : 0.35;
  return [t.x - hw, t.x + hw, t.y - hh, t.y + hh];
}
function updateTowerPos(t) {
  if (t.kind === 'tower') {
    const b = towerBox(t);
    t.x = (b[0] + b[1]) / 2; t.y = (b[2] + b[3]) / 2;
    return;
  }
  const e = 1 - (1 - t.rise) ** 2;
  const bob = Math.sin(time * 3 + t.phase) * 0.08 * t.rise;
  if (t.kind === 'scout') { t.x = t.sx + (t.fx - t.sx) * e; t.y = t.fy + bob; }
  else if (t.kind === 'spike') {   // swoop and weave
    t.x = clamp(t.fx + Math.sin(time * 0.9 + t.phase) * 1.6, -TW + 0.7, TW - 0.7);
    t.y = clamp(t.fy + Math.cos(time * 1.1 + t.phase) * 0.9, 0.7, TH - 0.7);
  }
  else { t.x = t.fx + Math.sin(time * 1.3 + t.phase) * 0.15 * t.rise; t.y = t.sy + (t.fy - t.sy) * e + bob; }
}

let walkerFall = 0;   // Frostal victory: how far the Mega Walker has toppled (0..1)

// Spike fighter dogfight: open space with a few drifting rocks; enemy fighters keep coming until you hit the quota
function buildDogfight(n) {
  quota = 8 + tierFor(n) * 2;
  endZ = 1e9;
  let z = 90;
  while (z < 40000) { obstacles.push(makeObstacle(pick(world.pool.slice(0, tierFor(n)).flat()), z, n)); z += levelSpeed * rand(2.2, 3.4); }
  port = { x: 0, y: TH / 2, r: 1 };
  ammo.laser = 160 + n * 20;
  ammo.torp = 6;
}

// Comet Runner: Spike fighters in open space → hyperspace jump → dense asteroid field → cave in a giant asteroid
function buildRunnerEscape(n) {
  const tier = tierFor(n);
  const spaceEnd = 520, fieldStart = spaceEnd + 760, fieldLen = 820 + n * 40;
  endZ = fieldStart + fieldLen + 220;
  hyper = { z: spaceEnd, exitZ: fieldStart - 40, t: 0, done: false, exited: false };
  let z = 90, prev = 40;
  while (z < spaceEnd - 30) {   // open space: sparse rocks and Spike fighters
    obstacles.push(makeObstacle('rock', z, n));
    if (Math.random() < 0.7) towers.push(makeEnemy((prev + z) / 2));
    prev = z; z += levelSpeed * rand(1.6, 2.4);
  }
  const pool = world.pool.slice(0, tier).flat();
  z = fieldStart;
  while (z < endZ - 240) {      // the asteroid field
    obstacles.push(makeObstacle(pick(pool), z, n));
    if (Math.random() < 0.12) pickups.push({ kind: Math.random() < 0.5 ? 'shield' : 'ammo', x: rand(-3, 3), y: rand(1, TH - 1), z: z + 8, taken: false });
    z += levelSpeed * Math.max(0.5, 0.95 - n * 0.05) * rand(0.8, 1.2);
  }
  for (let rz = fieldStart - 60; rz < endZ + 40; rz += 5) {   // scenery rocks all around the flight path
    const side = Math.random() < 0.5 ? -1 : 1;
    decorRocks.push({ x: side * rand(TW + 2, 34), y: rand(-14, 18), z: rz + rand(0, 5), r: rand(0.8, 3.6), v: (Math.random() * 6) | 0, s: rand(-0.4, 0.4), p: rand(0, 6) });
  }
  port = { x: rand(-2, 2), y: rand(2, TH - 2), r: 1.35 };   // the cave entrance
  ammo.laser = 140 + n * 20;
  ammo.torp = 5;
}

function buildLevel(n) {
  setWorld(worldFor(n));
  const tier = tierFor(n);
  levelSpeed = Math.min(60, 30 + (n - 1) * 4);
  endZ = 900 + Math.min(n, 4) * 300;
  obstacles = []; towers = []; pickups = []; rivals = [];
  walkerFall = 0;
  levelKills = 0; caveDark = 0; decorRocks = [];
  hyper = { z: Infinity, exitZ: Infinity, t: 0, done: true, exited: false };
  if (world.quota) { buildDogfight(n); return; }
  if (world.hyper) { buildRunnerEscape(n); return; }

  const pool = world.pool.slice(0, tier).flat();
  const gapTime = Math.max(0.55, 1.1 - n * 0.08);
  const gap = gapTime * levelSpeed;
  let z = 70, prev = 30;
  while (z < endZ - 260) {
    obstacles.push(makeObstacle(pick(pool), z, n));
    const mid = (prev + z) / 2;
    const r = Math.random();
    if (world.enemy && r < Math.min(0.75, 0.3 + n * 0.1)) towers.push(makeEnemy(mid));
    else if (r > 0.88) {
      pickups.push({ kind: Math.random() < 0.5 ? 'shield' : 'ammo', x: rand(-2, 2), y: rand(1, 4), z: mid, taken: false });
    }
    prev = z;
    z += gap * rand(0.85, 1.35);
  }
  const r = Math.max(0.6, 1.15 - n * 0.1);
  if (world.key === 'deathstar') port = { x: rand(-1.8, 1.8), y: rand(1.2, 3.8), r };
  else if (world.key === 'endor') port = { x: rand(-1.6, 1.6), y: rand(1.2, 2.0), r };
  else if (world.key === 'hoth') port = { x: pick([-1, 1]), y: 2.7, r: Math.max(0.55, r * 0.9) };   // Mega Walker front leg's knee
  else port = { x: 0, y: 4.5, r: 1 };   // rocket race finish line (where the fireworks go)
  ammo.laser = 100 + n * 20;
  ammo.torp = 5 + Math.floor(n / 2);
  rivals = [];
  if (world.race) { ammo.laser = 0; ammo.torp = 4; makeRivals(n); }
}

function snapCamera() {
  cam.x = player.x * 0.8;
  cam.y = Math.min(player.y + 1.0, TH - 0.15);
  cam.z = player.z - CAM_BACK;
}

function resetPlayer(z) {
  Object.assign(player, { x: 0, y: 2, z, vx: 0, vy: 0, bank: 0, inv: 1, fireCd: 0, torpCd: 0, boostT: 0 });
  target.x = 0; target.y = 2;
  speed = levelSpeed;
  shots = []; bolts = [];
  for (const t of towers) t.pending = 0;
  snapCamera();
}

function startGame() {
  worldOrder = [startWorld, ...shuffle(WORLDS.map((_, i) => i).filter(i => i !== startWorld))];
  level = 1; score = 0; player.shield = 100;
  briefing();
}

// Every level is unlocked by answering science questions.
function briefing() {
  const w = worldFor(level);
  startQuiz(QUIZ_NEED_LEVEL, 'MISSION BRIEFING',
    `Mission ${level} of ${TOTAL_LEVELS} — ${w.name}: get ${QUIZ_NEED_LEVEL} questions right to launch your ${w.vehicleName}!`,
    () => offerBonus(() => startLevel(level)));
}

function retryLevel() {
  score = levelStartScore;
  player.shield = 100;
  startLevel(level);
}

function startLevel(n) {
  levelStartScore = score;
  buildLevel(n);
  resetPlayer(0);
  finalWarned = false;
  state = 'playing';
  hideOverlay();
  if (bonus.torp || bonus.shield) {
    ammo.torp += bonus.torp;
    player.shield = Math.min(SHIELD_MAX, player.shield + bonus.shield);
    showMsg(`BONUS: +${bonus.torp} ${bonus.torp === 1 ? world.secOne : world.secName}, +${bonus.shield} SHIELDS`, 3);
    bonus = { torp: 0, shield: 0 };
  } else showMsg(`LEVEL ${n}: ${world.name}`, 2.5);
}

function retryApproach() {
  resetPlayer(endZ - 260);
  finalWarned = false;
  let rearmed = false;
  if (ammo.torp < 2) { ammo.torp = 2; rearmed = true; }
  if (ammo.laser < 20) { ammo.laser = 20; rearmed = true; }
  state = 'playing';
  hideOverlay();
  showMsg(rearmed ? 'REARMED — LINE UP AND FIRE!' : 'LINE UP AND FIRE!', 2);
}

function menuScene() {
  state = 'menu';
  setWorld(worldFor(level));   // the quiz and menu background shows the world you're about to fly in
  obstacles = []; towers = []; pickups = []; shots = []; bolts = []; rivals = []; decorRocks = [];
  hyper = { z: Infinity, exitZ: Infinity, t: 0, done: true, exited: false };
  caveDark = 0;
  endZ = 1e9; levelSpeed = speed = 24;
}

// ---------- Particles ----------
function burst(x, y, z, n, cols, spd, size, life = 0.8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, b = Math.random() * Math.PI - Math.PI / 2;
    const v = spd * rand(0.3, 1);
    particles.push({
      x, y, z,
      vx: Math.cos(a) * Math.cos(b) * v, vy: Math.sin(b) * v, vz: Math.sin(a) * Math.cos(b) * v,
      life: life * rand(0.5, 1), max: life, col: pick(cols), size: size * rand(0.5, 1.2),
    });
  }
}
const FIRE = [[255, 230, 120], [255, 150, 40], [255, 90, 20], [255, 255, 220]];
const SPARK = [[255, 220, 140], [255, 180, 80]];
const BLUE = [[120, 200, 255], [200, 240, 255]];
const SNOW = [[200, 214, 230], [176, 194, 214]];

// ---------- Weapons ----------
// Is the straight line between two points free of bulkheads?
function clearShot(x0, y0, z0, x1, y1, z1) {
  for (const o of obstacles) {
    if (o.z + o.depth <= z0 || o.z >= z1) continue;
    const t = (o.z - z0) / (z1 - z0);
    const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
    if (o.rects.some(r => x > r[0] && x < r[1] && y > r[2] && y < r[3])) return false;
  }
  return true;
}

// Next available enemy for aim assist: the closest tower ahead that is within the assist radius,
// has a clear line of fire and isn't already going to be destroyed by shots in flight.
function pickTarget(kind) {
  const a = ASSIST[assist];
  if (!a.radius) return null;
  let best = null;
  for (const t of towers) {
    if (!t.alive || t.rise < 1 || t.pending >= t.hp) continue;
    const d = t.z - player.z;
    if (d < 6 || d > 130) continue;
    if (Math.abs(t.x - player.x) > a.radius || Math.abs(t.y - player.y) > a.radius) continue;
    if (best && t.z >= best.z) continue;
    if (!clearShot(player.x, player.y, player.z + 1, t.x, t.y, t.z - 0.3)) continue;
    best = t;
  }
  if (!best && kind === 'torp' && !world.cave && endZ - player.z < VIEW &&
      Math.hypot(port.x - player.x, port.y - player.y) < a.radius * 1.2) return 'port';
  return best;
}

function fireShot(kind) {
  const torp = kind === 'torp';
  if (ammo[kind] <= 0) {
    if (msgT <= 0.3) showMsg(torp ? `NO ${world.secName} LEFT` : `${world.laserName} DEPLETED`, 1);
    sfx.empty();
    return;
  }
  ammo[kind]--;
  let sx, sy;
  if (torp) { sx = player.x; sy = player.y - 0.15; }
  else {
    const g = world.guns[player.gun++ % world.guns.length];
    sx = player.x + g[0];
    sy = player.y + g[1];
  }
  const tgt = pickTarget(kind);
  const dmg = torp ? TOWER_HP : 1;
  if (tgt && tgt !== 'port') tgt.pending += dmg;
  shots.push({
    kind, dmg, tgt,
    x: sx, y: sy, z: player.z + 0.5, z0: player.z + 0.5,
    // unassisted shots converge onto the flight line; assisted ones steer from the muzzle
    bx: tgt ? sx : player.x, by: tgt ? sy : player.y,
    ox: tgt ? 0 : sx - player.x, oy: tgt ? 0 : sy - player.y,
    vx: 0, vy: 0, vz: speed + (torp ? 80 : 150), life: torp ? 4 : 1.7,
  });
  if (torp) sfx.torp(); else sfx.laser();
}

function hitTower(t, s) {
  t.hp -= s.dmg;
  if (t.hp <= 0) {
    t.alive = false;
    levelKills++;
    score += 150;
    sfx.small();
    burst(t.x, t.y, t.z, s.kind === 'torp' ? 50 : 30, FIRE, s.kind === 'torp' ? 9 : 6, 0.25, 0.8);
  } else {
    t.hitFlash = 0.12;
    sfx.tick();
    burst(s.x, s.y, t.z - 0.3, 8, SPARK, 4, 0.08, 0.3);
  }
}

function damage(a) {
  if (player.inv > 0) return;
  player.shield -= a;
  player.inv = 0.8;
  shake = 0.6; hitFlash = 1;
  sfx.hit();
  burst(player.x, player.y, player.z, 18, SPARK, 6, 0.12, 0.5);
  if (player.shield <= 0) { player.shield = 0; die(); }
}

function die() {
  state = 'dead';
  stateTimer = 2;
  shake = 1.3; flash = 0.6;
  sfx.boom();
  burst(player.x, player.y, player.z, 70, FIRE, 9, 0.35, 1.3);
  shots = [];
}

function victory() {
  state = 'victory';
  stateTimer = 3;
  fxZ = world.quota ? player.z + 25 : endZ - 0.5;   // where the fireworks go
  if (world.quota) port = { x: player.x, y: player.y + 1, r: 1 };
  if (!world.cave) { flash = 1; shake = 1.4; }
  const ammoBonus = ammo.laser * 5 + ammo.torp * 100;
  const bonus = 1000 * level + Math.round(player.shield) * 10 + ammoBonus;
  score += bonus;
  victory.bonus = bonus;
  victory.ammoBonus = ammoBonus;
  if (world.cave) sfx.win();   // a quiet landing, no explosions
  else { sfx.boom(); sfx.win(); burst(port.x, port.y, fxZ, 120, FIRE, 14, 0.6, 1.6); }
  shots = []; bolts = [];
  showMsg(world.winMsg || 'DIRECT HIT!', 2.5);
}

// ---------- Rocket race (Dunara) ----------
const RIVALS = [
  { name: 'Zip Zorbo', col: { engine: [214, 124, 52], trim: [120, 70, 40], stripe: [240, 204, 90], pod: [190, 110, 50] } },
  { name: 'Gax Mungo', col: { engine: [150, 170, 96], trim: [70, 90, 50], stripe: [230, 230, 210], pod: [120, 140, 80] } },
  { name: 'Bree Quill', col: { engine: [205, 205, 196], trim: [150, 60, 60], stripe: [60, 60, 70], pod: [170, 70, 70] } },
  { name: 'Moxa Tiv', col: { engine: [112, 150, 172], trim: [50, 70, 90], stripe: [230, 190, 80], pod: [90, 120, 150] } },
  { name: 'Rudd Banter', col: { engine: [92, 122, 92], trim: [40, 60, 40], stripe: [200, 60, 50], pod: [80, 100, 80] } },
  { name: 'Ollo Mink', col: { engine: [222, 200, 84], trim: [140, 110, 40], stripe: [60, 60, 70], pod: [200, 170, 60] } },
  { name: 'Tess Paga', col: { engine: [182, 92, 92], trim: [100, 40, 40], stripe: [230, 230, 230], pod: [160, 80, 80] } },
];
const ordinal = n => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');
const racePlace = () => 1 + rivals.filter(r => r.z > player.z).length;

// Everyone starts ahead of you on the grid; rivals are a little slower than you at full speed,
// so clean flying and smart boosts let you work your way to the front.
function makeRivals(n) {
  rivals = shuffle(RIVALS).map((r, i) => ({
    name: r.name, col: r.col,
    x: (i % 2 ? 1 : -1) * rand(0.9, TW - 1), y: rand(1.2, 2.6), z: 12 + i * 13,
    base: levelSpeed * clamp(rand(0.84, 0.95) + (tierFor(n) - 1) * 0.03, 0.8, 0.99),
    speed: levelSpeed * 0.9, boostT: 0, oi: 0, plan: null, hitO: null, bumpCd: 0, skill: rand(0.8, 0.95), bank: 0,
  }));
  for (const r of rivals) { r.tx = r.x; r.ty = r.y; }
}

// Closest open spot (for a vehicle of half-size hw × hh) in an obstacle's cross-section
function findGap(o, x, y, hw, hh) {
  let best = null, bd = Infinity;
  for (let gx = -TW + hw + 0.1; gx <= TW - hw - 0.1; gx += 0.35) {
    for (let gy = hh + 0.3; gy <= TH - 0.5; gy += 0.35) {
      if (o.rects.some(q => gx + hw > q[0] && gx - hw < q[1] && gy + hh > q[2] && gy - hh < q[3])) continue;
      const d = Math.hypot(gx - x, gy - y) + Math.random() * 0.6;
      if (d < bd) { bd = d; best = [gx, gy]; }
    }
  }
  return best;
}

function updateRivals(dt) {
  for (const r of rivals) {
    if (r.z > endZ + 150) continue;
    r.boostT -= dt; r.bumpCd -= dt;
    if (r.boostT <= 0 && Math.random() < dt * 0.04) r.boostT = 1.2;
    const want = r.base * (r.boostT > 0 ? 1.35 : 1);
    r.speed += (want - r.speed) * Math.min(1, dt * 1.2);
    const pz = r.z;
    r.z += r.speed * dt;
    // look ahead to the next rock and steer for a gap (they don't always find one!)
    while (r.oi < obstacles.length && obstacles[r.oi].z + obstacles[r.oi].depth < r.z - 0.6) r.oi++;
    const o = obstacles[r.oi];
    if (o && o !== r.plan && o.z - r.z < 45) {
      r.plan = o;
      if (Math.random() < r.skill) { const g = findGap(o, r.x, r.y, 0.65, 0.4); if (g) { r.tx = g[0]; r.ty = g[1]; } }
    }
    const vx = clamp(r.tx - r.x, -7 * dt, 7 * dt);
    r.x += vx;
    r.y += clamp(r.ty - r.y, -6 * dt, 6 * dt);
    r.bank += (vx / Math.max(dt, 1e-3) * 0.06 - r.bank) * Math.min(1, dt * 6);
    if (o && r.hitO !== o && r.z + 0.5 > o.z && pz - 0.5 < o.z + o.depth &&
        o.rects.some(q => r.x + 0.55 > q[0] && r.x - 0.55 < q[1] && r.y + 0.25 > q[2] && r.y - 0.25 < q[3])) {
      r.hitO = o;
      r.speed *= 0.4;
      burst(r.x, r.y, o.z, 20, FIRE, 5, 0.2, 0.6);
    }
    // side-by-side bumping with you
    if (state === 'playing' && r.bumpCd <= 0 && Math.abs(r.z - player.z) < 1.4 &&
        Math.abs(r.x - player.x) < 1.1 && Math.abs(r.y - player.y) < 0.6) {
      r.bumpCd = 0.6;
      const push = player.x < r.x ? -1 : 1;
      player.vx += push * 8; target.x += push * 0.8; r.tx -= push * 0.8;
      speed *= 0.92;
      shake = Math.max(shake, 0.3);
      sfx.tick();
      burst((r.x + player.x) / 2, player.y, player.z + 0.5, 10, SPARK, 4, 0.08, 0.3);
    }
  }
}

// The Comet Runner's jump to lightspeed: stars stretch, you blast through an empty stretch of space,
// then drop out right at the edge of the asteroid field.
function updateHyper(dt) {
  if (!hyper.done && hyper.t === 0 && player.z >= hyper.z) {
    hyper.t = 1e-4;
    showMsg('HOLD ON TIGHT! JUMPING TO HYPERSPACE!', 2.2);
    sfx.hyper();
    shots = []; bolts = [];
  }
  if (hyper.t <= 0) return;
  hyper.t += dt;
  target.x = 0; target.y = TH / 2;   // the autopilot flies during the jump
  player.inv = Math.max(player.inv, 0.6);
  if (hyper.t > 0.6 && hyper.t < 2.6) player.z = Math.min(player.z + levelSpeed * 9 * dt, hyper.exitZ);
  if (hyper.t >= 2.6 && !hyper.exited) {
    hyper.exited = true;
    player.z = hyper.exitZ;
    flash = 0.8;
    showMsg('OUT OF HYPERSPACE — ASTEROID FIELD!', 2.5);
  }
  if (hyper.t >= 3.2) { hyper.t = 0; hyper.done = true; }
}
// 0..1: how stretched the stars are
const hyperAmount = () => hyper.t <= 0 ? 0 : hyper.t < 0.6 ? hyper.t / 0.6 : hyper.t < 2.6 ? 1 : Math.max(0, 1 - (hyper.t - 2.6) / 0.6);

function useBoost() {
  if (ammo.torp <= 0) { if (msgT <= 0.3) showMsg('NO BOOSTS LEFT', 1); sfx.empty(); return; }
  if (player.boostT > 0) return;
  ammo.torp--;
  player.boostT = 1.6;
  shake = Math.max(shake, 0.25);
  sfx.torp();
  showMsg('BOOST!', 0.8);
}

function finishRace() {
  const place = racePlace();
  if (place === 1) { victory(); return; }
  const winner = rivals.reduce((a, b) => (b.z > a.z ? b : a));
  saveHi();
  state = 'overlay';
  sfx.lose();
  showOverlay(`YOU FINISHED ${ordinal(place).toUpperCase()}!`,
    `<p class="big">So close! ${winner.name} won this time.</p>
     <p>Only first place wins the Sandstorm Cup. Dodge the rocks, save your boosts for open stretches, and pass every racer!</p>`,
    'RACE AGAIN', retryRace);
}
function retryRace() { score = levelStartScore; startLevel(level); }

function saveHi() {
  if (score > hi) { hi = Math.floor(score); localStorage.setItem('xw_hi', hi); }
}

// ---------- Update ----------
function updateSteering(dt) {
  const KS = 8;
  if (!input.mouse) {
    // keys, plus the on-screen joystick on touch screens (drag up = fly up)
    target.x += ((input.right ? 1 : 0) - (input.left ? 1 : 0) + stick.x) * KS * dt;
    target.y += ((input.up ? 1 : 0) - (input.down ? 1 : 0) - stick.y) * KS * dt;
  }
  target.x = clamp(target.x, -TW + SHIP_HW + 0.05, TW - SHIP_HW - 0.05);
  target.y = clamp(target.y, SHIP_HH + 0.15, TH - 0.4);
  const MAXV = 10;
  const dvx = clamp((target.x - player.x) * 8, -MAXV, MAXV);
  const dvy = clamp((target.y - player.y) * 8, -MAXV, MAXV);
  const k = Math.min(1, dt * 10);
  player.vx += (dvx - player.vx) * k;
  player.vy += (dvy - player.vy) * k;
  player.x = clamp(player.x + player.vx * dt, -TW + SHIP_HW, TW - SHIP_HW);
  player.y = clamp(player.y + player.vy * dt, SHIP_HH + 0.1, TH - 0.3);
  player.bank += (player.vx * 0.06 - player.bank) * Math.min(1, dt * 8);
}

function updateShots(dt) {
  const turn = ASSIST[assist].turn;
  for (const s of shots) {
    const pz = s.z;
    // aim-assist steering
    if (s.tgt && s.tgt !== 'port' && !s.tgt.alive) s.tgt = null;
    if (s.tgt) {
      const tx = s.tgt === 'port' ? port.x : s.tgt.x;
      const ty = s.tgt === 'port' ? port.y : s.tgt.y;
      const tz = s.tgt === 'port' ? endZ : s.tgt.z - 0.3;
      const tt = Math.max(0.02, (tz - s.z) / s.vz);
      s.vx = clamp((tx - s.x) / tt, -turn, turn);
      s.vy = clamp((ty - s.y) / tt, -turn, turn);
    }
    s.z += s.vz * dt; s.life -= dt;
    s.bx += s.vx * dt; s.by += s.vy * dt;
    const c = Math.max(0, 1 - (s.z - s.z0) / 25);
    s.x = s.bx + s.ox * c; s.y = s.by + s.oy * c;

    // bulkheads
    for (const o of obstacles) {
      if (s.z >= o.z && pz <= o.z + o.depth && o.z > pz - 2) {
        if (o.rects.some(r => s.x > r[0] && s.x < r[1] && s.y > r[2] && s.y < r[3])) {
          s.life = 0;
          if (s.kind === 'torp') { burst(s.x, s.y, o.z - 0.05, 30, FIRE, 6, 0.2, 0.6); sfx.small(); }
          else burst(s.x, s.y, o.z - 0.05, 6, SPARK, 4, 0.08, 0.3);
          break;
        }
      }
    }
    if (s.life <= 0) continue;

    // laser turrets
    for (const t of towers) {
      if (!t.alive || t.rise <= 0.2) continue;
      const b = towerBox(t);
      if (s.z >= t.z - 0.4 && pz <= t.z + 0.4 &&
          s.x > b[0] - 0.25 && s.x < b[1] + 0.25 && s.y > b[2] - 0.25 && s.y < b[3] + 0.25) {
        s.life = 0;
        hitTower(t, s);
        break;
      }
    }
    if (s.life <= 0) continue;

    // the giant asteroid is solid rock — shots just spark off it
    if (world.cave && s.z >= endZ - 0.5) {
      s.life = 0;
      burst(s.x, s.y, endZ - 0.6, 6, SPARK, 4, 0.08, 0.3);
      continue;
    }
    // final target (reactor vent / bunker blast door / Mega Walker leg)
    if (s.z >= endZ) {
      s.life = 0;
      const inPort = Math.hypot(s.x - port.x, s.y - port.y) < port.r;
      // the Doom Moon's wall and the bunker are solid; on Frostal only the Mega Walker's legs stop a shot
      const solid = world.key !== 'hoth' || (Math.abs(Math.abs(s.x) - 1) < 0.32 && s.y < 5.6);
      if (s.kind === 'torp') {
        if (inPort) { victory(); return; }
        if (solid) { burst(s.x, s.y, endZ - 0.1, 40, FIRE, 7, 0.25, 0.7); sfx.small(); }
        showMsg(world.missMsg, 1.6);
      } else {
        if (solid) burst(s.x, s.y, endZ - 0.05, 8, SPARK, 4, 0.1, 0.35);
        if (inPort) showMsg(world.laserMsg, 1.8);
      }
    }
  }
  shots = shots.filter(s => {
    if (s.life > 0) return true;
    if (s.tgt && s.tgt !== 'port') s.tgt.pending -= s.dmg;
    return false;
  });
}

function updatePlaying(dt) {
  const prevZ = player.z;
  if (world.race) {
    // rocket racers speed up and slow down: boosts push you past top speed, crashes cost speed
    player.boostT -= dt;
    const want = levelSpeed * (player.boostT > 0 ? 1.6 : 1);
    speed += (want - speed) * Math.min(1, dt * (speed < want ? 1.1 : 2.5));
  }
  player.z += speed * dt;
  score += speed * dt * 0.2;
  player.inv = Math.max(0, player.inv - dt);
  updateSteering(dt);

  // Fire
  player.fireCd -= dt; player.torpCd -= dt;
  if (world.noGuns) {
    if ((input.fire || input.pointerFire || input.btnLaser) && msgT <= 0.3) showMsg('ROCKET RACERS HAVE NO GUNS — USE A BOOST!', 1.2);
    if (input.torp && player.torpCd <= 0) { input.torp = false; useBoost(); player.torpCd = 0.3; }
  } else {
    if ((input.fire || input.pointerFire || input.btnLaser) && player.fireCd <= 0) {
      fireShot('laser');
      player.fireCd = ammo.laser > 0 ? 0.16 : 0.4;
    }
    if (input.torp && player.torpCd <= 0) {
      input.torp = false;   // one torpedo per press
      fireShot('torp');
      player.torpCd = 0.7;
    }
  }
  if (world.race) updateRivals(dt);
  if (world.quota) {
    // keep a few enemy fighters ahead until the squadron is down
    const ahead = towers.filter(t => t.alive && t.z > player.z + 8).length;
    if (ahead < 5 && levelKills + ahead < quota + 3) towers.push(makeEnemy(player.z + rand(120, 175)));
    towers = towers.filter(t => t.alive && t.z > cam.z - 2);
    if (levelKills >= quota) { victory(); return; }
  }
  if (world.hyper) updateHyper(dt);

  // Bulkhead collisions
  for (const o of obstacles) {
    if (o.passed) continue;
    // Swept test: ship span this frame overlaps the obstacle's depth
    if (!o.hit && player.z + 0.5 > o.z && prevZ - 0.5 < o.z + o.depth) {
      for (const r of o.rects) {
        if (player.x + SHIP_HW > r[0] && player.x - SHIP_HW < r[1] &&
            player.y + SHIP_HH > r[2] && player.y - SHIP_HH < r[3]) {
          o.hit = true;
          player.inv = 0;
          if (world.race) speed *= 0.5;
          damage(30);
          showMsg('DEFLECTORS HIT!', 1);
          break;
        }
      }
    }
    if (player.z - 0.5 > o.z + o.depth) {
      o.passed = true;
      if (!o.hit) score += 50;
    }
  }
  if (state !== 'playing') return;

  // Towers pop up and fire
  const boltSpeed = 40 + level * 3;
  for (const t of towers) {
    if (!t.alive) continue;
    t.flash = Math.max(0, t.flash - dt);
    t.hitFlash = Math.max(0, t.hitFlash - dt);
    if (t.kind === 'spike') t.z += t.vz * dt;
    const d = t.z - player.z;
    if (t.rise < 1 && d < 150) {
      if (t.rise === 0) {
        sfx.rise();
        if (t.kind === 'tower') burst(t.x, t.y, t.z, 10, SPARK, 2, 0.1, 0.5);
        else if (t.kind === 'probe') burst(t.fx, 0.1, t.z, 16, SNOW, 3, 0.14, 0.7);
      }
      t.rise = Math.min(1, t.rise + dt * 1.6);
    }
    if (d < 160) updateTowerPos(t);
    if (t.hp < TOWER_HP && Math.random() < dt * 6) burst(t.x, t.y + 0.3, t.z, 1, FIRE, 1.5, 0.12, 0.5);
    if (t.rise >= 1 && !t.chase && d > 20 && d < 120) {
      t.cd -= dt;
      if (t.cd <= 0) {
        t.cd = rand(1.4, 2.6) / (1 + level * 0.12);
        t.flash = 0.15;
        const T = d / (boltSpeed + speed);
        const ax = player.x + rand(-0.3, 0.3), ay = player.y + rand(-0.3, 0.3), az = player.z + speed * T;
        const dx = ax - t.x, dy = ay - t.y, dz = az - t.z;
        const len = Math.hypot(dx, dy, dz) || 1;
        bolts.push({ x: t.x, y: t.y, z: t.z - 0.35, vx: dx / len * boltSpeed, vy: dy / len * boltSpeed, vz: dz / len * boltSpeed, life: 4 });
        sfx.enemy();
      }
    }
  }

  // Enemy bolts
  for (const b of bolts) {
    const pz = b.z;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt; b.life -= dt;
    if ((pz - prevZ) >= -0.6 && (b.z - player.z) <= 0.6 &&
        Math.abs(b.x - player.x) < 0.65 && Math.abs(b.y - player.y) < 0.45) {
      b.life = 0;
      damage(12);
    }
  }
  bolts = bolts.filter(b => b.life > 0 && b.z > cam.z);
  if (state !== 'playing') return;

  updateShots(dt);
  if (state !== 'playing') return;
  lockTarget = pickTarget('laser');

  // Pickups
  for (const p of pickups) {
    if (p.taken) continue;
    if (player.z + 0.8 > p.z && prevZ - 0.8 < p.z &&
        Math.abs(p.x - player.x) < 1 && Math.abs(p.y - player.y) < 0.9) {
      p.taken = true;
      score += 50;
      sfx.pickup();
      if (p.kind === 'shield') {
        player.shield = Math.max(player.shield, Math.min(100, player.shield + 25));
        showMsg('+25 DEFLECTOR SHIELDS', 1);
        burst(p.x, p.y, p.z, 20, BLUE, 4, 0.12, 0.5);
      } else {
        if (!world.noGuns) ammo.laser += 30;
        ammo.torp += 1;
        showMsg(world.noGuns ? '+1 BOOST' : `+30 SHOTS  +1 ${world.secOne}`, 1);
        burst(p.x, p.y, p.z, 20, SPARK, 4, 0.12, 0.5);
      }
    }
  }

  // Final approach
  if (!finalWarned && endZ - player.z < 230) {
    finalWarned = true;
    showMsg(world.approachMsg, 2.5);
  }
  if (world.race) {
    if (player.z >= endZ) finishRace();
  } else if (world.quota) {
    // no finish line — the level ends when the squadron is destroyed
  } else if (world.cave) {
    if (player.z >= endZ - 2) {
      if (Math.hypot(player.x - port.x, player.y - port.y) < port.r) victory();
      else { state = 'pullup'; stateTimer = 1.4; showMsg('PULL UP!', 1.4); }
    }
  } else if (player.z > endZ - 10) {
    state = 'pullup';
    stateTimer = 1.4;
    showMsg('PULL UP!', 1.4);
  }
}

function updatePullup(dt) {
  speed *= Math.max(0, 1 - dt * 2);
  player.z = Math.min(player.z + speed * dt, endZ - 3);
  player.y += 9 * dt;
  player.bank *= 0.95;
  stateTimer -= dt;
  if (stateTimer <= 0) {
    player.shield -= 25;
    sfx.lose();
    if (player.shield <= 0) { player.shield = 0; crashed(); return; }
    state = 'overlay';
    showOverlay('MISSED!',
      `<p class="big">${world.missedText}</p>
       <p>Loop around for another run. Deflector shields −25.</p>`,
      'TRY AGAIN', retryApproach);
  }
}

function updateVictory(dt) {
  stateTimer -= dt;
  if (world.race) {
    // cruise past the finish line with the rest of the pack
    speed *= Math.max(0, 1 - dt * 0.6);
    player.z += speed * dt;
    updateRivals(dt);
  } else if (world.cave) {
    // glide into the dark cave
    speed *= Math.max(0, 1 - dt * 1.5);
    player.z = Math.min(player.z + speed * dt, endZ - 1.2);
    player.x += (port.x - player.x) * Math.min(1, dt * 3);
    player.y += (port.y - player.y) * Math.min(1, dt * 3);
    caveDark = Math.min(1, caveDark + dt * 0.6);
  } else {
    speed *= Math.max(0, 1 - dt * 1.2);
    player.z = Math.min(player.z + speed * dt, endZ - 6);
    if (stateTimer < 2.6) player.y += 7 * dt;
  }
  if (world.key === 'hoth') walkerFall = Math.min(1, walkerFall + dt * 0.55);
  if (!world.cave && Math.random() < dt * 12) {
    burst(port.x + rand(-2, 2), port.y + rand(-1.5, 1.5), fxZ, 25, FIRE, 9, 0.5, 1.2);
    shake = Math.max(shake, 0.4);
  }
  if (stateTimer <= 0) {
    saveHi();
    state = 'overlay';
    const last = level >= TOTAL_LEVELS;
    showOverlay(world.winTitle,
      `<p class="big">Mission ${level} of ${TOTAL_LEVELS} complete — ${world.winText}</p>
       <p>${last ? 'That was your final mission… or was it? 👀'
                 : `Next mission: <b>${worldFor(level + 1).name}</b> in a ${worldFor(level + 1).vehicleName}!`}</p>
       <p>Bonus: <b>+${victory.bonus}</b> (unused ammo: +${victory.ammoBonus})</p>
       <p>Score: <b>${Math.floor(score)}</b></p>
       ${bookCard()}`,
      last ? 'CONTINUE ➜' : 'NEXT MISSION',
      last ? startFinale
           : () => { level++; player.shield = Math.max(player.shield, Math.min(100, player.shield + 30)); briefing(); });
  }
}

function crashed() {
  saveHi();
  state = 'overlay';
  sfx.lose();
  showOverlay(`${world.vehicleName.toUpperCase()} DESTROYED`,
    `<p class="big">Don't give up, pilot!</p>
     <p>Answer ${QUIZ_NEED_RETRY} science question correctly in the repair bay to get a new ${world.vehicleName}
     and try level ${level} again.</p>
     <p>High score: ${hi}</p>`,
    'TO THE REPAIR BAY',
    () => startQuiz(QUIZ_NEED_RETRY, 'REPAIR BAY',
      `Get ${QUIZ_NEED_RETRY} right and the mechanics will rebuild your ${world.vehicleName}!`, () => offerBonus(retryLevel)));
}

function updateCamera(dt) {
  const tx = player.x * 0.8, ty = Math.min(player.y + 1.0, TH - 0.15);
  const k = Math.min(1, dt * 6);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  cam.z = player.z - CAM_BACK;
}

function update(dt) {
  time += dt;
  if (msgT > 0) msgT -= dt;
  shake = Math.max(0, shake - dt * 2.5);
  flash = Math.max(0, flash - dt * 0.8);
  hitFlash = Math.max(0, hitFlash - dt * 2);

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vx *= 0.97; p.vy *= 0.97; p.vz *= 0.97;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  if (finaleActive) { updateFinale(dt); return; }

  if (state === 'menu' || state === 'quiz') {
    player.z += speed * dt;
    const nx = Math.sin(time * 0.6) * 1.6, ny = 2.4 + Math.sin(time * 0.9) * 1.2;
    player.vx = (nx - player.x) / Math.max(dt, 1e-3);
    player.x = nx; player.y = ny;
    player.bank += (player.vx * 0.06 - player.bank) * Math.min(1, dt * 8);
  } else if (state === 'playing') updatePlaying(dt);
  else if (state === 'pullup') updatePullup(dt);
  else if (state === 'victory') updateVictory(dt);
  else if (state === 'dead') {
    speed *= Math.max(0, 1 - dt * 1.5);
    player.z += speed * dt;
    stateTimer -= dt;
    if (stateTimer <= 0) crashed();
  }
  if (state !== 'overlay') updateCamera(dt);
}

// ---------- Rendering ----------
function proj(x, y, z) {
  const dz = z - cam.z;
  if (dz < 0.1) return null;
  const s = F / dz;
  return { x: CX + (x - cam.x) * s, y: CY - (y - cam.y) * s, s };
}

function shade(r, g, b, d) {
  let k = 1 - d / VIEW;
  k = k < 0 ? 0 : k > 1 ? 1 : k;
  k = Math.pow(k, 1.2);
  return `rgb(${(FOG[0] + (r - FOG[0]) * k) | 0},${(FOG[1] + (g - FOG[1]) * k) | 0},${(FOG[2] + (b - FOG[2]) * k) | 0})`;
}

function face(pts, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const q = proj(pts[i][0], pts[i][1], pts[i][2]);
    if (!q) return;
    if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

// Draw a group of axis-aligned boxes sharing the same z-range: side faces first, then fronts.
function drawBoxes(rects, z0, z1, rgb, inset) {
  const n = cam.z + NEAR;
  if (z1 <= n) return;
  const front = z0 >= n;
  if (!front) z0 = n;
  const d = z0 - cam.z;
  const [r, g, b] = rgb;
  const edge = shade(r * 0.45, g * 0.45, b * 0.45, d);
  for (const [x0, x1, y0, y1] of rects) {
    if (cam.y > y1) face([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], shade(r * 1.3, g * 1.3, b * 1.3, d), edge);
    if (cam.y < y0) face([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], shade(r * 0.45, g * 0.45, b * 0.45, d), edge);
    if (cam.x < x0) face([[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], shade(r * 0.85, g * 0.85, b * 0.85, d), edge);
    if (cam.x > x1) face([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], shade(r * 0.65, g * 0.65, b * 0.65, d), edge);
  }
  if (!front) return;
  for (const [x0, x1, y0, y1] of rects) {
    face([[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], shade(r, g, b, d), edge);
    if (inset && x1 - x0 > 0.7 && y1 - y0 > 0.7) {
      const m = 0.18, zz = z0 - 0.01;
      face([[x0 + m, y0 + m, zz], [x1 - m, y0 + m, zz], [x1 - m, y1 - m, zz], [x0 + m, y1 - m, zz]],
        shade(r * 0.78, g * 0.78, b * 0.78, d));
    }
  }
}

const stars = Array.from({ length: 260 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() }));
const canopy = Array.from({ length: 50 }, () => ({ x: Math.random(), y: Math.random() * 0.12, r: rand(0.04, 0.1), c: pick(['#0c1d12', '#12291a', '#091610', '#183520']) }));
const peaks = Array.from({ length: 26 }, (_, i) => ({ x: i / 25, h: i % 2 ? rand(0.02, 0.05) : rand(0.06, 0.12) }));
const mesas = Array.from({ length: 7 }, (_, i) => ({ x: (i + Math.random() * 0.6) / 7, w: rand(0.05, 0.12), h: rand(0.02, 0.06) }));
const motes = Array.from({ length: 70 }, () => ({ x: 0, y: 0, z: -1 }));
const flakes = Array.from({ length: 150 }, () => ({ x: Math.random(), y: Math.random(), s: rand(1, 3.2), v: rand(0.08, 0.25) }));

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (world.key === 'deathstar' || world.space) { g.addColorStop(0, '#02030a'); g.addColorStop(1, '#0a0f24'); }
  else if (world.key === 'endor') { g.addColorStop(0, '#07110a'); g.addColorStop(0.45, '#2a4432'); g.addColorStop(1, '#3d5a45'); }
  else if (world.key === 'hoth') { g.addColorStop(0, '#7f9cb8'); g.addColorStop(0.42, '#d6e3ee'); g.addColorStop(1, '#eef4f8'); }
  else { g.addColorStop(0, '#4f8fcf'); g.addColorStop(0.4, '#9cc4e4'); g.addColorStop(0.6, '#f0d6a8'); g.addColorStop(1, '#f6e2c0'); }
  ctx.fillStyle = g;
  ctx.fillRect(-30, -30, W + 60, H + 60);
  if (world.key === 'deathstar' || world.space) {
    for (const s of stars) {
      let x = (s.x * W * 1.3 - cam.x * 6 * (0.5 + s.s)) % W;
      if (x < 0) x += W;
      const y = s.y * H * 0.9 + cam.y * 4;
      const tw = 0.5 + 0.5 * Math.sin(time * 2 + s.x * 50);
      ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.6 * s.s * tw})`;
      const sz = s.s > 0.9 ? 2 : 1.2;
      ctx.fillRect(x, y, sz, sz);
    }
    if (world.key === 'tiefight') {
      drawPlanet(W * 0.16 - cam.x * 3, H * 0.86, Math.min(W, H) * 0.5, ['#f5c27a', '#c8662e', '#2a0e04'], true);
      drawDoomMoon2D(W * 0.8 - cam.x * 4, H * 0.18, Math.min(W, H) * 0.085);
    } else if (world.key === 'falcon') {
      if (!hyper.exited) drawPlanet(W * 0.82 - cam.x * 3, H * 0.8, Math.min(W, H) * 0.32, ['#a8dcff', '#3a7cc8', '#081830'], false);
      else {   // dusty glow of the asteroid field
        const g2 = ctx.createRadialGradient(W * 0.3, H * 0.3, 0, W * 0.3, H * 0.3, W * 0.7);
        g2.addColorStop(0, 'rgba(120,80,60,0.25)'); g2.addColorStop(1, 'rgba(120,80,60,0)');
        ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
        sunGlow(W * 0.75 - cam.x * 2, H * 0.12, Math.max(W, H) * 0.012, '255,236,200', 0.35);
      }
    }
  } else if (world.key === 'hoth') {
    // distant snowy mountains on the horizon
    const off = -cam.x * 4;
    ctx.fillStyle = '#b2c4d6';
    ctx.beginPath(); ctx.moveTo(-60, CY + 2);
    for (const p of peaks) ctx.lineTo(p.x * (W + 120) - 60 + off, CY - p.h * H);
    ctx.lineTo(W + 60, CY + 2); ctx.closePath(); ctx.fill();
    sunGlow(W * 0.2 - cam.x * 3, H * 0.06, Math.max(W, H) * 0.02, '255,255,245', 0.5);
  } else if (world.key === 'tatooine') {
    // Dunara's twin suns
    sunGlow(W * 0.7 - cam.x * 3, H * 0.1, Math.max(W, H) * 0.03, '255,244,210', 0.6);
    sunGlow(W * 0.79 - cam.x * 3, H * 0.16, Math.max(W, H) * 0.021, '255,206,140', 0.55);
    // flat-topped mesas on the horizon
    const off = -cam.x * 4;
    ctx.fillStyle = '#d4a273';
    for (const m of mesas) {
      const x = m.x * (W + 200) - 100 + off, w = m.w * W, h = m.h * H;
      ctx.beginPath();
      ctx.moveTo(x - w * 0.6, CY + 2); ctx.lineTo(x - w * 0.42, CY - h); ctx.lineTo(x + w * 0.42, CY - h); ctx.lineTo(x + w * 0.6, CY + 2);
      ctx.closePath(); ctx.fill();
    }
  }
}

// A planet lit from the upper left, with optional cloud bands
function drawPlanet(x, y, r, [hi, mid, dark], bands) {
  const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, hi); g.addColorStop(0.55, mid); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  if (bands) {
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
    ctx.strokeStyle = 'rgba(80,30,10,0.18)';
    for (let k = -4; k <= 4; k++) { ctx.lineWidth = r * (0.03 + (k & 1) * 0.04); ctx.beginPath(); ctx.ellipse(x, y + k * r * 0.2, r * 1.1, r * 0.12, -0.25, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(180,220,255,0.18)'; ctx.lineWidth = r * 0.03;   // thin atmosphere glow
  ctx.beginPath(); ctx.arc(x, y, r * 1.01, Math.PI * 0.9, Math.PI * 1.75); ctx.stroke();
}

function sunGlow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
  g.addColorStop(0, `rgba(${col},${a})`);
  g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgb(${col})`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

// Verda's treetops close over the path like a ceiling of leaves
function drawCanopy() {
  ctx.fillStyle = '#081209';
  ctx.fillRect(-30, -30, W + 60, H * 0.04 + 30);
  for (const b of canopy) {
    let x = (b.x * W * 1.3 - cam.x * 12) % (W * 1.3);
    if (x < 0) x += W * 1.3;
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.arc(x - W * 0.15, b.y * H, b.r * Math.max(W, H), 0, Math.PI * 2); ctx.fill();
  }
  // sunbeams slanting down through gaps in the leaves
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const x = ((i * 0.23 + 0.08) * W * 1.3 - cam.x * 10) % (W * 1.3) - W * 0.15;
    const w = W * (0.025 + (i % 3) * 0.012);
    const a = 0.05 + 0.025 * Math.sin(time * 0.7 + i * 2);
    const g = ctx.createLinearGradient(0, H * 0.05, 0, H * 0.85);
    g.addColorStop(0, `rgba(230,255,200,${a})`);
    g.addColorStop(1, 'rgba(230,255,200,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, H * 0.05); ctx.lineTo(x + w, H * 0.05); ctx.lineTo(x + w * 3 + W * 0.12, H * 0.85); ctx.lineTo(x + W * 0.12, H * 0.85);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// Dust, pollen, snow or sand whooshing past the camera — makes the speed feel real
function drawMotes() {
  const col = { tiefight: '200,215,255', falcon: '220,200,170', deathstar: '170,190,255', endor: '220,240,170', hoth: '255,255,255', tatooine: '255,226,170' }[world.key];
  const len = Math.max(0.6, speed * 0.04);
  ctx.save();
  ctx.lineCap = 'round';
  for (const m of motes) {
    if (m.z < cam.z + 0.8 || m.z > cam.z + 70) {
      m.z = cam.z + rand(8, 60);
      m.x = rand(-TW, TW); m.y = rand(0.2, TH);
    }
    line3d(m.x, m.y, m.z, m.x, m.y, m.z + len, `rgba(${col},${world.bright ? 0.55 : 0.35})`, 0.012);
  }
  ctx.restore();
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, world.bright ? 'rgba(60,40,20,0.3)' : 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawSnowfall() {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const f of flakes) {
    let x = (f.x + Math.sin(time * 0.7 + f.y * 9) * 0.02 - cam.x * 0.01 * f.s) % 1;
    if (x < 0) x += 1;
    const y = (f.y + time * f.v * (0.6 + f.s * 0.3)) % 1;
    ctx.beginPath(); ctx.arc(x * W, y * H, f.s, 0, Math.PI * 2); ctx.fill();
  }
}

// Doom Moon trench and Frostal ice canyon: a floor and two walls, drawn in segments far → near
function drawSurface() {
  if (world.space) return;
  if (world.key === 'endor') return drawForest();
  const near = cam.z + NEAR;
  const zEnd = world.clipEnd ? endZ : Infinity;
  const startSeg = Math.floor(near / SEG);
  const endSeg = Math.floor(Math.min(cam.z + VIEW, zEnd) / SEG);
  const [fr, fg, fb] = world.floor, [lr, lg, lb] = world.wallL, [rr, rg, rb] = world.wallR;
  const bright = !!world.bright;
  const vr = bright ? 10 : 18;
  for (let i = endSeg; i >= startSeg; i--) {
    const z0 = Math.max(i * SEG, near), z1 = Math.min((i + 1) * SEG, zEnd);
    if (z0 >= z1) continue;
    const d = z0 - cam.z;
    const v = (hash(i) - 0.5) * vr;
    const line = world.lineRGB ? shade(...world.lineRGB, d) : shade(30, 32, 40, d);
    face([[-TW, 0, z0], [TW, 0, z0], [TW, 0, z1], [-TW, 0, z1]], shade(fr + v, fg + v, fb + v, d), line);
    face([[-TW, 0, z0], [-TW, TH, z0], [-TW, TH, z1], [-TW, 0, z1]], shade(lr + v, lg + v, lb + v, d), line);
    face([[TW, 0, z0], [TW, TH, z0], [TW, TH, z1], [TW, 0, z1]], shade(rr + v, rg + v, rb + v, d), line);

    // Surface details (greebles / ice cracks) and lights
    for (let k = 0; k < 4; k++) {
      const h = hash(i * 13 + k * 3.1);
      const y0 = hash(i * 17 + k) * TH * 0.85;
      const hh = Math.min(0.3 + hash(i * 19 + k) * 1.3, TH - y0);
      let za = i * SEG + hash(i * 23 + k) * SEG * 0.6;
      let zb = Math.min(za + 0.4 + hash(i * 29 + k) * 1.4, (i + 1) * SEG, zEnd);
      if (zb <= near) continue;
      za = Math.max(za, near);
      if (za >= zb) continue;
      const light = world.lights && hash(i * 31 + k) < 0.12;
      const left = h < 0.5;
      const x = left ? -TW + 0.01 : TW - 0.01;
      if (light) {
        const ly0 = y0, ly1 = y0 + 0.15;
        face([[x, ly0, za], [x, ly1, za], [x, ly1, Math.min(zb, za + 0.5)], [x, ly0, Math.min(zb, za + 0.5)]],
          `rgba(255,${200 + (h * 50) | 0},120,${clamp(1 - d / VIEW, 0, 1)})`);
      } else {
        const c = h < 0.25 || h > 0.75 ? (bright ? 0.88 : 0.7) : (bright ? 1.06 : 1.25);
        const [br, bg, bb] = left ? world.wallL : world.wallR;
        face([[x, y0, za], [x, y0 + hh, za], [x, y0 + hh, zb], [x, y0, zb]],
          shade((br + v) * c, (bg + v) * c, (bb + v) * c, d));
      }
    }
    if (hash(i * 37) < 0.6) {
      const fx = -TW + hash(i * 41) * (TW * 2 - 1.2);
      const fw = 0.4 + hash(i * 43) * 0.8;
      let za = Math.max(i * SEG + hash(i * 47) * 2, near);
      const zb = Math.min(za + 0.6 + hash(i * 53) * 1.3, zEnd);
      const k = bright ? 0.92 : 0.76;
      if (za < zb) face([[fx, 0.01, za], [fx + fw, 0.01, za], [fx + fw, 0.01, zb], [fx, 0.01, zb]], shade((fr + v) * k, (fg + v) * k, (fb + v) * k, d));
    }
  }
}

// Verda: a dirt path through a forest of giant trees
function drawForest() {
  const near = cam.z + NEAR;
  const startSeg = Math.floor(near / SEG);
  const endSeg = Math.floor((cam.z + VIEW) / SEG);
  const [fr, fg, fb] = world.floor, [pr, pg, pb] = world.path;
  for (let i = endSeg; i >= startSeg; i--) {
    const z0 = Math.max(i * SEG, near), z1 = (i + 1) * SEG;
    const d = z0 - cam.z;
    const v = (hash(i) - 0.5) * 14;
    face([[-60, 0, z0], [60, 0, z0], [60, 0, z1], [-60, 0, z1]], shade(fr + v, fg + v, fb + v * 0.5, d));
    face([[-TW - 0.3, 0.005, z0], [TW + 0.3, 0.005, z0], [TW + 0.3, 0.005, z1], [-TW - 0.3, 0.005, z1]], shade(pr + v, pg + v, pb + v, d));
    // ferns and bushes beside the path
    {
      const side = hash(i * 7) < 0.5 ? -1 : 1;
      const x = side * (TW + 0.6 + hash(i * 9) * 5), w = 0.4 + hash(i * 11) * 0.6;
      const za = i * SEG + hash(i * 13) * 2;
      drawBoxes([[x - w, x + w, 0, 0.3 + hash(i * 15) * 0.6]], za, za + w * 1.5, [42 + v, 74 + v, 34], false);
    }
    // giant tree trunks (none past the bunker)
    if (i * SEG > endZ - 6) continue;
    for (let k = 0; k < 3; k++) {
      const h = hash(i * 5 + k * 1.7);
      if (h > 0.72) continue;
      const side = k === 1 ? (hash(i * 3) < 0.5 ? -1 : 1) : (k === 0 ? -1 : 1);
      const w = 0.7 + hash(i * 19 + k) * 1.3;
      const x = side * (TW + 0.8 + w / 2 + hash(i * 23 + k) * 9);
      const za = i * SEG + hash(i * 29 + k) * (SEG - 1);
      const t = (hash(i * 31 + k) - 0.5) * 16;
      drawBoxes([[x - w / 2, x + w / 2, 0, TH + 20]], za, za + w, [86 + t, 60 + t * 0.7, 40 + t * 0.4], false);
    }
  }
}

function drawEndWall() {
  const d = endZ - cam.z;
  if (d > VIEW + 10 || d < NEAR) return;
  face([[-TW, 0, endZ], [TW, 0, endZ], [TW, TH, endZ], [-TW, TH, endZ]], shade(98, 102, 116, d), shade(40, 42, 50, d));
  for (let yy = 1; yy < TH; yy++) {
    const a = proj(-TW, yy, endZ), b = proj(TW, yy, endZ);
    ctx.strokeStyle = shade(70, 72, 84, d); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  const p = proj(port.x, port.y, endZ);
  const R = port.r * p.s;
  ctx.fillStyle = shade(60, 62, 72, d);
  ctx.beginPath(); ctx.arc(p.x, p.y, R * 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = shade(30, 31, 38, d);
  ctx.beginPath(); ctx.arc(p.x, p.y, R * 1.35, 0, Math.PI * 2); ctx.fill();
  const pulse = 0.65 + 0.35 * Math.sin(time * 6);
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
  g.addColorStop(0, `rgba(255,240,180,${pulse})`);
  g.addColorStop(0.5, `rgba(255,120,30,${0.9 * pulse})`);
  g.addColorStop(1, 'rgba(60,10,0,1)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
}

// Pulsing target marker
function targetGlow(x, y, z, r, col) {
  const p = proj(x, y, z);
  if (!p) return;
  const R = r * p.s, pulse = 0.65 + 0.35 * Math.sin(time * 6);
  ctx.save();
  ctx.strokeStyle = `rgba(${col},0.9)`; ctx.lineWidth = Math.max(2, R * 0.12);
  ctx.beginPath(); ctx.arc(p.x, p.y, R * 1.1, 0, Math.PI * 2); ctx.stroke();
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
  g.addColorStop(0, `rgba(255,255,240,${pulse})`);
  g.addColorStop(0.5, `rgba(${col},${0.85 * pulse})`);
  g.addColorStop(1, `rgba(${col},0.1)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Verda: the shield generator bunker, built into a hillside
function drawBunker(d) {
  const z = endZ, x = port.x;
  face([[-18, 0, z + 0.5], [18, 0, z + 0.5], [13, 12, z + 30], [-13, 12, z + 30]], shade(38, 58, 36, d));
  face([[-4.6, 0, z], [4.6, 0, z], [4.6, 3.9, z], [-4.6, 3.9, z]], shade(122, 126, 112, d), shade(70, 72, 64, d));
  drawBoxes([[-5, 5, 3.9, 4.5]], z - 0.6, z + 2.5, [104, 108, 96], false);
  face([[x - 1.3, 0, z - 0.01], [x + 1.3, 0, z - 0.01], [x + 1.3, 3.4, z - 0.01], [x - 1.3, 3.4, z - 0.01]], shade(70, 72, 68, d));
  face([[x - 1.05, 0, z - 0.02], [x + 1.05, 0, z - 0.02], [x + 1.05, 3.1, z - 0.02], [x - 1.05, 3.1, z - 0.02]], shade(150, 152, 142, d));
  ctx.strokeStyle = shade(96, 98, 90, d); ctx.lineWidth = 1.5;
  for (let yy = 0.45; yy < 3.1; yy += 0.45) {
    const a = proj(x - 1.05, yy, z - 0.03), b = proj(x + 1.05, yy, z - 0.03);
    if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  }
  if (state !== 'victory') targetGlow(port.x, port.y, z - 0.04, port.r, '255,190,70');
}

// Frostal: a giant Mega Walker; when tripped by the tow cable it topples sideways
function drawMegaWalker() {
  const fs = port.x > 0 ? 1 : -1;
  const a = walkerFall * walkerFall * 1.4;
  drawMesh(MESH.walker, { x: 0, y: 0, z: endZ, roll: -fs * a, pivot: [fs * 1.4, 0, 0] });
  if (state !== 'victory') targetGlow(port.x, port.y, endZ - 0.37, port.r, '90,210,255');
}

function drawEnd() {
  const d = endZ - cam.z;
  if (d > VIEW + 10 || d < NEAR) return;
  if (world.key === 'deathstar') drawEndWall();
  else if (world.key === 'endor') drawBunker(d);
  else if (world.key === 'hoth') drawMegaWalker();
  else if (world.cave) drawGiantAsteroid();
  else if (world.quota) return;
  else drawFinishLine(d);
}

// Comet Runner: a huge asteroid filling the view, with a dark cave mouth to fly into
function drawGiantAsteroid() {
  drawMesh(MESH.bigRock, { x: 0, y: 2.5, z: endZ + 14.5, scale: 14, yaw: 0.4 });
  const p = proj(port.x, port.y, endZ - 0.4);
  if (!p) return;
  const R = port.r * p.s * 1.15;
  ctx.save();
  ctx.translate(p.x, p.y); ctx.scale(1, 0.8);
  const g = ctx.createRadialGradient(0, 0, R * 0.2, 0, 0, R);
  g.addColorStop(0, '#000'); g.addColorStop(0.75, '#0b0806'); g.addColorStop(1, 'rgba(40,30,24,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  if (state === 'playing') {
    ctx.strokeStyle = `rgba(255,210,140,${0.35 + 0.25 * Math.sin(time * 5)})`;
    ctx.lineWidth = Math.max(2, R * 0.05);
    ctx.setLineDash([R * 0.18, R * 0.12]);
    ctx.beginPath(); ctx.arc(0, 0, R * 0.92, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

// Hyperspace: stars stretch into long streaks rushing past
const hyperStars = Array.from({ length: 240 }, () => ({ a: rand(0, Math.PI * 2), d: Math.random(), w: rand(0.6, 2.2) }));
function drawHyperspace(k) {
  const maxR = Math.hypot(W, H) * 0.6;
  ctx.save();
  ctx.fillStyle = `rgba(10,20,50,${0.55 * k})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const st of hyperStars) {
    const d = (st.d + time * (0.2 + 1.6 * k)) % 1;
    const r0 = d * d * maxR, len = maxR * (0.02 + 0.5 * k) * d;
    const ca = Math.cos(st.a), sa = Math.sin(st.a);
    ctx.strokeStyle = `rgba(200,225,255,${0.25 + 0.7 * d})`;
    ctx.lineWidth = st.w * (0.5 + d);
    ctx.beginPath(); ctx.moveTo(CX + ca * r0, CY + sa * r0); ctx.lineTo(CX + ca * (r0 + len), CY + sa * (r0 + len)); ctx.stroke();
  }
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, maxR * 0.35);
  g.addColorStop(0, `rgba(220,240,255,${0.5 * k})`); g.addColorStop(1, 'rgba(220,240,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// Rocket race finish: checkered strip on the ground, stone towers and a checkered banner overhead
function drawFinishLine(d) {
  const z = endZ, n = 14, w = (TW * 2) / n;
  const sq = (i, j) => (i + j) % 2 ? shade(20, 20, 22, d) : shade(244, 244, 238, d);
  for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) {
    const x0 = -TW + i * w, x1 = x0 + w;
    face([[x0, 0.02, z + j * 0.7], [x1, 0.02, z + j * 0.7], [x1, 0.02, z + (j + 1) * 0.7], [x0, 0.02, z + (j + 1) * 0.7]], sq(i, j));
  }
  drawBoxes([[-TW - 0.9, -TW + 0.1, 0, 7.4]], z - 0.4, z + 0.6, [190, 146, 98], false);
  drawBoxes([[TW - 0.1, TW + 0.9, 0, 7.4]], z - 0.4, z + 0.6, [190, 146, 98], false);
  for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) {
    const x0 = -TW + i * w, x1 = x0 + w, y0 = 5.7 + j * 0.55;
    face([[x0, y0, z], [x1, y0, z], [x1, y0 + 0.55, z], [x0, y0 + 0.55, z]], sq(i, j));
  }
}

function drawTower(t) {
  if (t.rise <= 0) return;
  const b = towerBox(t);
  const dmg = t.hp / TOWER_HP;
  const rgb = t.hitFlash > 0 ? [235, 235, 235] : [50 + 22 * dmg, 52 + 22 * dmg, 60 + 24 * dmg];
  drawBoxes([b], t.z - 0.3, t.z + 0.3, rgb, false);
  if (t.rise < 1) return;
  // barrel pointing at the incoming Starling
  drawBoxes([[t.x - 0.06, t.x + 0.06, t.y - 0.06, t.y + 0.06]], t.z - 0.7, t.z - 0.3, [40, 42, 48], false);
  const p = proj(t.x, t.y, t.z - 0.71);
  if (!p) return;
  const r = Math.max(1.5, (t.flash > 0 ? 0.28 : 0.1) * p.s);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.5);
  g.addColorStop(0, 'rgba(255,120,100,1)'); g.addColorStop(0.4, 'rgba(255,30,20,0.8)'); g.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawPickup(pk) {
  const p = proj(pk.x, pk.y, pk.z);
  if (!p) return;
  const r = 0.45 * p.s * (1 + 0.12 * Math.sin(time * 8));
  const shield = pk.kind === 'shield';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 1.6);
  if (shield) { g.addColorStop(0, 'rgba(230,250,255,1)'); g.addColorStop(0.35, 'rgba(90,180,255,0.9)'); g.addColorStop(1, 'rgba(40,100,255,0)'); }
  else { g.addColorStop(0, 'rgba(255,250,220,1)'); g.addColorStop(0.35, 'rgba(255,170,40,0.9)'); g.addColorStop(1, 'rgba(255,100,0,0)'); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = shield ? 'rgba(180,230,255,0.9)' : 'rgba(255,220,150,0.9)';
  ctx.lineWidth = Math.max(1, r * 0.12);
  ctx.beginPath(); ctx.ellipse(p.x, p.y, r * 1.3, r * 0.45, time * 2, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawShadow(x = player.x, y = player.y, z = player.z, w = 1) {
  const p = proj(x, 0.02, z);
  if (!p) return;
  const a = clamp(0.5 - y * 0.07, 0.08, 0.5);
  const r = w * p.s * (0.9 + y * 0.05);   // higher up = bigger, fainter shadow
  ctx.save();
  ctx.translate(p.x, p.y); ctx.scale(1, 0.28);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, `rgba(0,0,0,${a})`);
  g.addColorStop(0.6, `rgba(0,0,0,${a * 0.6})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- 3D models ----------
// A mesh is a list of flat faces { p: [[x, y, z], ...], c: [r, g, b], e: glows? }.
// Local axes: x = right, y = up, z = forward (nose).
function rectAt(x0, x1, y0, y1, z) { return [[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]]; }
function ringAt(cx, cy, r, z, n = 8) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = (i + 0.5) / n * Math.PI * 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r, z]); }
  return p;
}
function addPrism(m, A, B, c, e) {
  m.push({ p: A, c, e }, { p: B, c, e });
  for (let i = 0; i < A.length; i++) { const j = (i + 1) % A.length; m.push({ p: [A[i], A[j], B[j], B[i]], c, e }); }
}
function addBox(m, x0, x1, y0, y1, z0, z1, c, e) { addPrism(m, rectAt(x0, x1, y0, y1, z0), rectAt(x0, x1, y0, y1, z1), c, e); }
function addCyl(m, cx, cy, r, z0, z1, c, n = 8, r1 = r) { addPrism(m, ringAt(cx, cy, r, z0, n), ringAt(cx, cy, r1, z1, n), c); }
function addFrustum(m, z0, x0, y0, w0, h0, z1, x1, y1, w1, h1, c) {
  addPrism(m, rectAt(x0 - w0 / 2, x0 + w0 / 2, y0 - h0 / 2, y0 + h0 / 2, z0), rectAt(x1 - w1 / 2, x1 + w1 / 2, y1 - h1 / 2, y1 + h1 / 2, z1), c);
}
function mapMesh(m, fn) { for (const f of m) f.p = f.p.map(fn); return m; }

// Starling: our Star Guard fighter. Long nose, four wings in an X, engines at the wing roots, laser cannons on the tips
function buildStarling() {
  const m = [];
  const HULL = [210, 212, 216], GREY = [150, 154, 162], DARK = [66, 70, 78], BLUE = [40, 110, 210], GLASS = [28, 42, 64], ENG = [128, 132, 140];
  addBox(m, -0.13, 0.13, -0.11, 0.11, -0.62, 0.05, HULL);
  addFrustum(m, 0.05, 0, 0, 0.24, 0.2, 0.8, 0, -0.02, 0.14, 0.12, HULL);
  addFrustum(m, 0.8, 0, -0.02, 0.14, 0.12, 0.92, 0, -0.025, 0.125, 0.105, BLUE);
  addFrustum(m, 0.92, 0, -0.025, 0.125, 0.105, 1.28, 0, -0.04, 0.035, 0.035, HULL);
  addPrism(m, [[-0.085, 0.1, -0.08], [0.085, 0.1, -0.08], [0.06, 0.21, -0.08], [-0.06, 0.21, -0.08]],
              [[-0.06, 0.09, 0.42], [0.06, 0.09, 0.42], [0.02, 0.11, 0.42], [-0.02, 0.11, 0.42]], GLASS);   // cockpit canopy
  addPrism(m, [[-0.02, 0.11, -0.5], [0.02, 0.11, -0.5], [0.012, 0.25, -0.46], [-0.012, 0.25, -0.46]],
              [[-0.02, 0.11, -0.2], [0.02, 0.11, -0.2], [0.012, 0.13, -0.24], [-0.012, 0.13, -0.24]], HULL);   // dorsal fin
  addBox(m, -0.1, 0.1, -0.08, 0.08, -0.66, -0.62, DARK);
  for (const sx of [1, -1]) for (const sy of [1, -1]) {
    const w = [];
    // wing: root chord z -0.6..-0.05, tip chord z -0.55..-0.27, with a blue stripe near the tip
    const zr = x => { const t = (x - 0.12) / 0.73; return [-0.6 + t * 0.05, -0.05 - t * 0.22]; };
    const span = (x0, x1, c) => {
      const [a0, b0] = zr(x0), [a1, b1] = zr(x1);
      addPrism(w, [[x0, 0.016, a0], [x1, 0.016, a1], [x1, 0.016, b1], [x0, 0.016, b0]],
                  [[x0, -0.016, a0], [x1, -0.016, a1], [x1, -0.016, b1], [x0, -0.016, b0]], c);
    };
    span(0.12, 0.56, HULL); span(0.56, 0.67, BLUE); span(0.67, 0.85, HULL);
    addCyl(w, 0.86, 0, 0.032, -0.5, 0.05, GREY, 6);     // laser cannon
    addCyl(w, 0.86, 0, 0.014, 0.05, 0.72, DARK, 6);
    addCyl(w, 0.86, 0, 0.024, 0.68, 0.8, GREY, 6);
    const a = 0.24 * sx * sy, ca = Math.cos(a), sa = Math.sin(a);
    mapMesh(w, q => { const x = q[0] * sx; return [x * ca - q[1] * sa, x * sa + q[1] * ca, q[2]]; });
    m.push(...w);
    // engine
    addCyl(m, sx * 0.2, sy * 0.105, 0.078, -0.68, 0.06, ENG, 10);
    addCyl(m, sx * 0.2, sy * 0.105, 0.086, 0.06, 0.12, DARK, 10, 0.064);
    m.push({ p: ringAt(sx * 0.2, sy * 0.105, 0.06, -0.685, 10), c: [255, 140, 110], e: true });
  }
  return m;
}

// Hover bike with its rider
function buildBike(rider) {
  const m = [];
  const BODY = [104, 108, 98], DARK = [56, 60, 56], METAL = [140, 144, 140];
  addFrustum(m, -0.5, 0, 0, 0.22, 0.16, 0.35, 0, -0.01, 0.12, 0.1, BODY);
  addBox(m, -0.14, 0.14, -0.1, 0.08, -0.82, -0.45, DARK);                        // engine
  m.push({ p: ringAt(0, -0.01, 0.045, -0.825, 8), c: [255, 150, 90], e: true });
  addBox(m, -0.07, 0.07, 0.08, 0.12, -0.5, -0.12, [40, 40, 40]);                 // seat
  addBox(m, -0.16, 0.16, 0.16, 0.19, 0.06, 0.1, DARK);                           // handlebars

  for (const s of [1, -1]) {
    addBox(m, s * 0.04, s * 0.065, -0.025, 0.0, 0.3, 1.3, METAL);                // steering rods
    addBox(m, s * 0.03, s * 0.24, 0.0, 0.018, 1.12, 1.38, BODY);                 // steering vanes
    addBox(m, s * 0.03, s * 0.2, -0.09, -0.072, 1.15, 1.36, BODY);
    addBox(m, s * 0.1, s * 0.18, -0.08, -0.05, -0.35, -0.05, DARK);              // footrests
    // rider's legs, boots and arms
    addBox(m, s * 0.04, s * 0.12, -0.04, 0.14, -0.32, -0.12, rider.suit);
    addBox(m, s * 0.08, s * 0.15, -0.08, 0.0, -0.18, -0.02, rider.boot);

  addPrism(m, [[-0.085, 0.13, -0.4], [0.085, 0.13, -0.4], [0.085, 0.13, -0.24], [-0.085, 0.13, -0.24]],
              [[-0.1, 0.4, -0.3], [0.1, 0.4, -0.3], [0.1, 0.4, -0.15], [-0.1, 0.4, -0.15]], rider.armor);   // leaning torso
  addBox(m, -0.065, 0.065, 0.2, 0.36, -0.4, -0.33, rider.pack);                    // backpack
  addCyl(m, 0, 0.48, 0.068, -0.29, -0.13, rider.helmet, 10);                       // rounded helmet
  addBox(m, -0.05, 0.05, 0.45, 0.5, -0.135, -0.12, rider.visor);
  return mapMesh(m, q => [q[0] * 1.3, q[1] * 1.3, q[2] * 1.3]);
}
const GUARD_RIDER = { suit: [74, 92, 56], armor: [92, 108, 66], helmet: [70, 86, 52], visor: [22, 22, 22], boot: [44, 34, 26], pack: [104, 88, 60] };
const SCOUT_RIDER = { suit: [30, 30, 34], armor: [228, 230, 234], helmet: [232, 234, 238], visor: [16, 16, 20], boot: [232, 232, 236], pack: [40, 40, 44] };

// Enemy probe bot: dark head with red sensor eyes and dangling arms
function buildProbe() {
  const m = [], BLK = [48, 50, 56], DARK = [28, 28, 32];
  addCyl(m, 0, 0, 0.26, -0.2, 0.2, BLK, 8);
  addBox(m, -0.13, 0.13, 0.24, 0.33, -0.13, 0.13, BLK);
  for (const [x, y] of [[-0.1, 0.06], [0.1, 0.06], [0, -0.06]]) m.push({ p: rectAt(x - 0.04, x + 0.04, y - 0.03, y + 0.03, -0.21), c: [255, 40, 30], e: true });
  for (const [x, z] of [[-0.15, -0.08], [0.15, -0.08], [-0.08, 0.12], [0.08, 0.12], [0, 0]]) addBox(m, x - 0.015, x + 0.015, -0.85, -0.2, z - 0.015, z + 0.015, DARK);
  addBox(m, 0.1, 0.125, 0.33, 0.75, -0.012, 0.012, DARK);

// Lumpy asteroid: a jittered sphere (radius ≈ 1; scale it when drawing)
function buildRock(seed, jitter = 0.24, nu = 7, nv = 5) {
  const rows = [];
  for (let j = 0; j <= nv; j++) {
    const phi = j / nv * Math.PI, row = [];
    for (let i = 0; i < nu; i++) {
      const th = i / nu * Math.PI * 2;
      const r = j === 0 || j === nv ? 1 - jitter * 0.3 : 1 + (hash(seed * 31 + j * 7 + i * 13) - 0.5) * 2 * jitter;
      row.push([r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th)]);
    }
    rows.push(row);
  }
  const m = [];
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const i2 = (i + 1) % nu, k = 0.82 + hash(seed * 17 + j * 5 + i) * 0.3;
    const c = [112 * k, 104 * k, 96 * k];
    if (j === 0) m.push({ p: [rows[0][0], rows[1][i2], rows[1][i]], c });
    else if (j === nv - 1) m.push({ p: [rows[j][i], rows[j][i2], rows[nv][0]], c });
    else m.push({ p: [rows[j][i], rows[j][i2], rows[j + 1][i2], rows[j + 1][i]], c });
  }
  return m;
}

const MESH = {

const ENGINE_GLOWS = {
  starling: { pts: [[0.2, 0.105, -0.7], [-0.2, 0.105, -0.7], [0.2, -0.105, -0.7], [-0.2, -0.105, -0.7]], r: 0.13, col: '255,110,90' },
  bike: { pts: [[0, -0.013, -1.08]], r: 0.08, col: '255,150,90' },

  spike: { pts: [[0.09, 0, -0.32], [-0.09, 0, -0.32]], r: 0.07, col: '255,110,80' },
