<script>
'use strict';
const INK = '#14254d', BLUE = '#2f7fe0', GREEN = '#2fae5a', ORANGE = '#f08a24', PINK = '#e8457a', YELLOW = '#ffd84a', PURPLE = '#7b4bd6', RED = '#e8453a';
// place value colours: hundreds, tens, ones
const HC = '#ff9fbf', TC = '#7fc4ff', OC = '#8fe07a';

// ---------- Drawing helpers ----------
function unitCube(d, x, y, u, col = OC) { d.rect(x, y, u, u, { r: 2, fill: col, stroke: INK, lw: 1.5 }); }
function rod(d, x, y, u, col = TC) {
  d.rect(x, y, u, u * 10, { r: 2, fill: col, stroke: INK, lw: 2 });
  for (let i = 1; i < 10; i++) d.line(x, y + i * u, x + u, y + i * u, { stroke: 'rgba(20,37,77,.35)', lw: 1 });
}
function flat(d, x, y, u, col = HC) {
  d.rect(x, y, u * 10, u * 10, { r: 3, fill: col, stroke: INK, lw: 2 });
  for (let i = 1; i < 10; i++) {
    d.line(x, y + i * u, x + u * 10, y + i * u, { stroke: 'rgba(20,37,77,.25)', lw: 1 });
    d.line(x + i * u, y, x + i * u, y + u * 10, { stroke: 'rgba(20,37,77,.25)', lw: 1 });
  }
}
// US coins: value, size and colour
const COINS = {
  p: { name: 'penny', v: 1, r: 27, fill: '#d98c4f', edge: '#9a5a2a' },
  n: { name: 'nickel', v: 5, r: 31, fill: '#cfd5de', edge: '#7d8697' },
  d: { name: 'dime', v: 10, r: 24, fill: '#dfe4ec', edge: '#7d8697' },
  q: { name: 'quarter', v: 25, r: 36, fill: '#d6dbe4', edge: '#6d7687' },
};
function coin(d, k, x, y, s = 1, glow = false) {
  const C = COINS[k];
  if (glow) d.circle(x, y, C.r * s + 10, { fill: 'rgba(255,216,74,.6)' });
  d.circle(x, y, C.r * s, { fill: C.fill, stroke: C.edge, lw: 3 });
  d.circle(x, y, C.r * s - 5 * s, { stroke: 'rgba(255,255,255,.55)', lw: 2 });
  d.text(C.v + '¢', x, y + 1, { size: Math.round((14 + C.r * 0.25) * s), weight: 700, color: '#3a2a0a' });
}
function dollar(d, x, y, s = 1) {
  d.rect(x - 80 * s, y - 36 * s, 160 * s, 72 * s, { r: 6, fill: '#bfe3b0', stroke: '#3f7a3a', lw: 3 });
  d.ellipse(x, y, 26 * s, 26 * s, { stroke: '#3f7a3a', lw: 2 });
  d.text('$1', x, y + 2, { size: 30 * s, weight: 700, color: '#2d5a2a' });
}
// an analog clock showing `mins` minutes after 12:00
function clock(d, x, y, r, mins, o = {}) {
  d.circle(x, y, r + 8, { fill: o.rim || BLUE });
  d.circle(x, y, r, { fill: '#fff', stroke: INK, lw: 3 });
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * Math.PI * 2, big = i % 5 === 0, r1 = r - (big ? 14 : 7);
    d.line(x + Math.cos(a) * r1, y + Math.sin(a) * r1, x + Math.cos(a) * (r - 3), y + Math.sin(a) * (r - 3), { stroke: big ? INK : '#9aa6c0', lw: big ? 3 : 1.5 });
  }
  for (let n = 1; n <= 12; n++) {
    const a = n / 12 * Math.PI * 2 - Math.PI / 2;
    d.text(String(n), x + Math.cos(a) * (r - 32), y + Math.sin(a) * (r - 32), { size: Math.max(20, r * 0.17), weight: 700 });
  }
  if (o.fives) for (let n = 1; n <= 12; n++) {
    const a = n / 12 * Math.PI * 2 - Math.PI / 2;
    d.text(String(n * 5 % 60).padStart(2, '0'), x + Math.cos(a) * (r + 30), y + Math.sin(a) * (r + 30), { size: 20, weight: 700, color: RED });
  }
  const ha = (mins % 720) / 720 * Math.PI * 2 - Math.PI / 2, ma = (mins % 60) / 60 * Math.PI * 2 - Math.PI / 2;
  d.line(x, y, x + Math.cos(ha) * r * 0.5, y + Math.sin(ha) * r * 0.5, { stroke: INK, lw: 10 });
  d.line(x, y, x + Math.cos(ma) * r * 0.8, y + Math.sin(ma) * r * 0.8, { stroke: RED, lw: 6 });
  d.circle(x, y, 8, { fill: INK });
}
const timeStr = mins => { const h = Math.floor(mins / 60) % 12 || 12, m = Math.floor(mins % 60); return `${h}:${String(m).padStart(2, '0')}`; };
function tenFrame(d, x, y, cells, cs = 56) {
  for (let i = 0; i < 10; i++) {
    const cx = x + (i % 5) * cs, cy = y + Math.floor(i / 5) * cs;
    d.rect(cx, cy, cs, cs, { r: 0, fill: '#fff', stroke: INK, lw: 3 });
  }
  cells.forEach(([i, col, a = 1]) => d.alpha(a, () => d.circle(x + (i % 5) * cs + cs / 2, y + Math.floor(i / 5) * cs + cs / 2, cs * 0.36, { fill: col, stroke: INK, lw: 2 })));
}
function poly(d, x, y, r, n, o = {}) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i / n * Math.PI * 2 + (o.rot || 0); pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); }
  d.poly(pts, { close: true, fill: o.fill || '#cfe0ff', stroke: INK, lw: 4 });
  return pts;
}
const big = (d, s, x, y, size = 64, color = INK) => d.text(s, x, y, { size, weight: 700, color });

// ---------- The pictures ----------
const DIAGRAMS = {
  // ----- place value -----
  'pv-what'(d, t) {
    d.bg('#f2f7ff', '#e2edff');
    [['3', HC, 400], ['4', TC, 480], ['5', OC, 560]].forEach(([s, c, x]) => { d.rect(x - 36, 22, 72, 90, { r: 12, fill: c, stroke: INK }); big(d, s, x, 70, 70); });
    const cols = [[170, 'Hundreds', HC], [480, 'Tens', TC], [790, 'Ones', OC]];
    cols.forEach(([x, s, c]) => { d.rect(x - 140, 132, 280, 300, { r: 16, fill: '#fff', stroke: c, lw: 4 }); d.text(s, x, 160, { size: 26, weight: 700 }); });
    for (let i = 0; i < 3; i++) d.alpha(d.in(t, 0.4 + i * 0.4), () => flat(d, 95 + i * 22, 190 + i * 22, 10));
    for (let i = 0; i < 4; i++) d.alpha(d.in(t, 1.8 + i * 0.3), () => rod(d, 430 + i * 28, 195, 13));
    for (let i = 0; i < 5; i++) d.alpha(d.in(t, 3.2 + i * 0.25), () => unitCube(d, 745 + (i % 3) * 34, 250 + Math.floor(i / 3) * 40, 26));
    [['3 hundreds = 300', 170, 0.8], ['4 tens = 40', 480, 2.4], ['5 ones = 5', 790, 3.8]].forEach(([s, x, a]) => d.alpha(d.in(t, a), () => d.pill(s, x, 400, { size: 24 })));
    d.alpha(d.in(t, 4.8), () => d.pill('345 = 300 + 40 + 5', 480, 495, { size: 30, bg: YELLOW }));
  },
  'pv-why'(d, t) {
    d.bg('#fffaf0', '#fff1d6');
    const T = t % 6;
    [[5, 'ones'], [50, 'tens'], [500, 'hundreds']].forEach(([n, s], i) => {
      const x = 170 + i * 310, on = Math.floor(T / 2) === i;
      d.rect(x - 140, 40, 280, 380, { r: 20, fill: on ? '#fff3b0' : '#fff', stroke: INK, lw: on ? 5 : 3 });
      big(d, String(n), x, 100, 70, on ? PINK : INK);
      d.text(`the 5 is in the ${s} place`, x, 160, { size: 21 });
      if (i === 0) for (let k = 0; k < 5; k++) unitCube(d, x - 95 + k * 40, 260, 30);
      if (i === 1) for (let k = 0; k < 5; k++) rod(d, x - 85 + k * 36, 200, 18);
      if (i === 2) for (let k = 0; k < 5; k++) flat(d, x - 110 + k * 20, 200 + k * 26, 10);
    });
    d.pill('Same digit, different value!', 480, 480, { size: 30, bg: YELLOW });
  },
  'pv-blocks'(d, t) {
    d.bg('#f2f7ff', '#e2edff');
    const T = t % 9, k1 = d.in(T, 0.5, 1.5), k2 = d.in(T, 3, 1.5), k3 = d.in(T, 5.5, 1.5);
    for (let i = 0; i < 10; i++) {
      const sx = 40 + (i % 5) * 44, sy = 140 + Math.floor(i / 5) * 60, tx = 130, ty = 110 + i * 22;
      unitCube(d, d.lerp(sx, tx, k1), d.lerp(sy, ty, k1), 22);
    }
    for (let i = 0; i < 10; i++) rod(d, d.lerp(340 + i * 28, 380 + i * 14, k2), 110, 14);
    for (let i = 0; i < 10; i++) {
      const sx = 640 + (i % 2) * 140, sy = 110 + Math.floor(i / 2) * 50, tx = 700, ty = 340 - i * 16;
      const x = d.lerp(sx, tx, k3), y = d.lerp(sy, ty, k3);
      d.poly([[x, y], [x + 120, y], [x + 150, y - 24], [x + 30, y - 24]], { close: true, fill: HC, stroke: INK, lw: 2 });
      d.rect(x, y, 120, 16, { r: 0, fill: '#f07fa6', stroke: INK, lw: 2 });
    }
    d.pill('10 ones = 1 ten', 140, 420, { size: 24, bg: OC });
    d.pill('10 tens = 1 hundred', 450, 420, { size: 24, bg: TC });
    d.pill('10 hundreds = 1 thousand', 775, 420, { size: 24, bg: HC });
    d.text('Bundle 10 to make the next place!', 480, 500, { size: 30, weight: 700, color: BLUE });
  },
  'pv-forms'(d, t) {
    d.bg('#f2f7ff', '#e2edff');
    const rows = [['Standard form', () => { big(d, '4', 560, 110, 60, '#d63c78'); big(d, '7', 600, 110, 60, '#2f7fe0'); big(d, '2', 640, 110, 60, '#2a9a3a'); }],
      ['Word form', () => d.text('four hundred seventy-two', 600, 250, { size: 40, weight: 700 })],
      ['Expanded form', () => d.text('400 + 70 + 2', 600, 390, { size: 52, weight: 700, color: BLUE })]];
    rows.forEach(([s, fn], i) => d.alpha(d.in(t, i * 1.2), () => {
      d.rect(30, 50 + i * 140, 900, 120, { r: 18, fill: '#fff', stroke: INK });
      d.pill(s, 160, 110 + i * 140, { size: 24, bg: [HC, TC, OC][i] });
      fn();
    }));
    d.alpha(d.in(t, 4), () => d.text('Three ways to write the same number!', 480, 510, { size: 28, weight: 700, color: PURPLE }));
  },
  'pv-compare'(d, t) {
    d.bg('#f2fbf5', '#dff4e6');
    const T = t % 9, step = T < 2 ? 0 : T < 4.5 ? 1 : 2;
    const num = (s, x) => s.split('').forEach((c, i) => {
      const hl = (step === 1 && i === 0) || (step === 2 && i === 1);
      if (hl) d.rect(x + i * 70 - 34, 120, 68, 110, { r: 12, fill: YELLOW });
      big(d, c, x + i * 70, 180, 90);
    });
    num('352', 130); num('325', 690);
    if (step === 1) d.pill('Hundreds: 3 and 3 are the same. Look at the tens!', 480, 330, { size: 26 });
    if (step === 2) {
      d.pill('Tens: 5 tens is more than 2 tens!', 480, 330, { size: 26, bg: '#c8f0c0' });
      const k = d.in(T, 5, 0.6);
      d.text('>', 480, 180, { size: 140 * k + 1, weight: 700, color: GREEN });
      d.emoji('🐊', 480, 440, 110, { flip: true, alpha: k });
      d.alpha(d.in(T, 6), () => d.text('The alligator eats the bigger number!', 480, 510, { size: 28, weight: 700 }));
    }
    if (step === 0) d.text('Which is greater?', 480, 330, { size: 36, weight: 700, color: BLUE });
  },
  // ----- add & subtract -----
  'as-what'(d, t) {
    d.bg('#fffaf0', '#fff1d6');
    const T = t % 8, k = d.in(T, 1, 1.4);
    d.rect(20, 30, 440, 440, { r: 20, fill: '#fff', stroke: GREEN, lw: 4 }); d.text('ADD: put together', 240, 70, { size: 30, weight: 700, color: GREEN });
    d.rect(500, 30, 440, 440, { r: 20, fill: '#fff', stroke: PINK, lw: 4 }); d.text('SUBTRACT: take away', 720, 70, { size: 30, weight: 700, color: PINK });
    for (let i = 0; i < 3; i++) d.emoji('🍎', d.lerp(70 + i * 50, 150 + i * 50, k), d.lerp(160, 300, k), 50);
    for (let i = 0; i < 2; i++) d.emoji('🍎', d.lerp(330 + i * 50, 300 + i * 50, k), d.lerp(160, 300, k), 50);
    d.emoji('🧺', 250, 340, 120);
    d.text('3 + 2 = 5', 240, 430, { size: 40, weight: 700 });
    for (let i = 0; i < 5; i++) {
      const away = i >= 3, fly = away ? d.in(T, 1.5, 2) : 0;
      d.emoji('🐦', 590 + i * 60 + fly * 200, 280 - fly * 220, 50, { alpha: 1 - fly * 0.7, flip: !away });
    }
    d.line(560, 310, 900, 310, { stroke: '#8a5a34', lw: 8 });
    d.text('5 − 2 = 3', 720, 430, { size: 40, weight: 700 });
    d.pill('sum', 240, 500, { size: 20, bg: '#c8f0c0' }); d.pill('difference', 720, 500, { size: 20, bg: '#ffd8e2' });
  },
  'as-why'(d, t) {
    d.bg('#1d2d60', '#33478a');
    const F = ['8 + 7 = 15', '9 + 4 = 13', '6 + 6 = 12', '14 − 5 = 9', '7 + 5 = 12', '16 − 8 = 8'];
    const i = Math.floor(t / 1.5) % F.length, k = d.in(t % 1.5, 0, 0.3);
    d.emoji('🧠', 230, 230, 170);
    for (let j = 0; j < 3; j++) d.emoji('⚡', 130 + j * 100, 90 + (j % 2) * 30, 50, { alpha: 0.5 + 0.5 * Math.sin(t * 6 + j) });
    d.at(640, 230, 0, 0.6 + 0.4 * k, () => { d.rect(-220, -100, 440, 200, { r: 20, fill: '#fff', stroke: YELLOW, lw: 6 }); big(d, F[i], 0, 0, 64); });
    d.pill('⏱️ A few minutes of fact practice every night', 480, 420, { size: 26, bg: YELLOW });
    d.text('Facts in a flash = more brain power for big problems!', 480, 490, { size: 26, weight: 700, color: '#fff' });
  },
  'as-family'(d, t) {
    d.bg('#f2fbf5', '#dff4e6');
    d.poly([[480, 30], [700, 160], [260, 160]], { close: true, fill: '#ff9fbf', stroke: INK, lw: 4 });
    d.rect(290, 160, 380, 340, { r: 0, fill: '#fff8e6', stroke: INK, lw: 4 });
    d.circle(400, 120, 26, { fill: '#fff', stroke: INK }); d.text('7', 400, 121, { size: 30, weight: 700 });
    d.circle(560, 120, 26, { fill: '#fff', stroke: INK }); d.text('8', 560, 121, { size: 30, weight: 700 });
    d.circle(480, 78, 28, { fill: YELLOW, stroke: INK }); d.text('15', 480, 79, { size: 28, weight: 700 });
    ['7 + 8 = 15', '8 + 7 = 15', '15 − 8 = 7', '15 − 7 = 8'].forEach((s, i) => d.alpha(d.in(t, 0.6 + i * 0.8), () => d.text(s, 480, 210 + i * 72, { size: 44, weight: 700, color: i < 2 ? GREEN : PINK })));
    d.emoji('👨‍👩‍👦', 140, 380, 110);
    d.alpha(d.in(t, 4), () => d.pill('Know one fact, know four!', 800, 330, { size: 24, bg: YELLOW }));
  },
  'as-ten'(d, t) {
    d.bg('#fffaf0', '#fff1d6');
    const T = t % 8, k = d.in(T, 1.5, 1.5);
    big(d, '8 + 5 = ?', 480, 50, 50);
    const cells = [];
    for (let i = 0; i < 8; i++) cells.push([i, RED]);
    tenFrame(d, 60, 110, cells, 70);
    tenFrame(d, 550, 110, [], 70);
    // the 5 blue dots: 2 hop over to fill the first ten frame, the other 3 slide left
    for (let i = 0; i < 5; i++) {
      const sx = 550 + i * 70 + 35, sy = 145;
      const [tx, ty] = i < 2 ? [60 + (3 + i) * 70 + 35, 215] : [550 + (i - 2) * 70 + 35, 145];
      d.circle(d.lerp(sx, tx, k), d.lerp(sy, ty, k), 25, { fill: BLUE, stroke: INK, lw: 2 });
    }
    d.alpha(d.in(T, 3.2), () => { d.pill('10', 235, 300, { size: 30, bg: YELLOW }); d.pill('3', 690, 300, { size: 30, bg: YELLOW }); });
    d.alpha(d.in(T, 4), () => big(d, '8 + 5 = 10 + 3 = 13', 480, 400, 52, GREEN));
    d.alpha(d.in(T, 5), () => d.text('Move 2 over to make a ten. Tens are easy to add!', 480, 480, { size: 26, weight: 700 }));
  },
  'as-regroup'(d, t) {
    d.bg('#f2f7ff', '#e2edff');
    const T = t % 10;
    // the written problem
    d.rect(30, 40, 300, 420, { r: 18, fill: '#fff', stroke: INK });
    d.text('tens', 130, 80, { size: 20, color: '#5a6f99' }); d.text('ones', 220, 80, { size: 20, color: '#5a6f99' });
    big(d, '4', 130, 170, 64); big(d, '7', 220, 170, 64);
    big(d, '+', 60, 250, 56); big(d, '2', 130, 250, 64); big(d, '5', 220, 250, 64);
    d.line(60, 300, 280, 300, { lw: 5 });
    d.alpha(d.in(T, 3.5), () => { d.text('1', 130, 112, { size: 34, weight: 700, color: RED }); big(d, '2', 220, 360, 64, GREEN); });
    d.alpha(d.in(T, 6), () => big(d, '7', 130, 360, 64, GREEN));
    // blocks
    d.text('Tens', 520, 50, { size: 26, weight: 700 }); d.text('Ones', 810, 50, { size: 26, weight: 700 });
    d.line(660, 70, 660, 470, { stroke: '#b9c6e0', lw: 3, dash: [8, 8] });
    for (let i = 0; i < 6; i++) rod(d, 400 + i * 32, 80, 18);
    const k = d.in(T, 2, 1.4);
    for (let i = 0; i < 12; i++) {
      const sx = 700 + (i % 4) * 46, sy = 90 + Math.floor(i / 4) * 46;
      if (i < 10) { const tx = 400 + 6 * 32, ty = 80 + i * 18; unitCube(d, d.lerp(sx, tx, k), d.lerp(sy, ty, k), d.lerp(36, 18, k)); }
      else unitCube(d, d.lerp(sx, 700 + (i - 10) * 46, k), d.lerp(sy, 90, k), 36);
    }
    d.pill('7 ones + 5 ones = 12 ones', 800, 300, { size: 22 });
    d.alpha(d.in(T, 2.5), () => d.pill('Trade 10 ones for 1 ten!', 800, 360, { size: 22, bg: YELLOW }));
    d.alpha(d.in(T, 6), () => d.pill('4 + 2 + 1 = 7 tens', 520, 360, { size: 22 }));
    d.alpha(d.in(T, 7), () => big(d, '47 + 25 = 72', 650, 460, 50, BLUE));
  },
  'as-word'(d, t) {
    d.bg('#e6f6ff', '#f2fbff');
    const T = t % 9;
    d.wrap('12 birds sit on a fence. 5 birds fly away. How many birds are left?', 480, 26, 880, { size: 30, weight: 700 });
    d.line(80, 270, 880, 270, { stroke: '#8a5a34', lw: 10 });
    for (let i = 0; i < 12; i++) {
      const away = i >= 7, f = away ? d.in(T, 1.5 + (i - 7) * 0.2, 1.5) : 0;
      d.emoji('🐦', 110 + i * 64 + f * 200, 240 - f * 90, 52, { alpha: 1 - f });
    }
    d.alpha(d.in(T, 3.5), () => d.pill('"left" means subtract!', 480, 330, { size: 26, bg: '#ffd8e2' }));
    d.alpha(d.in(T, 5), () => big(d, '12 − 5 = 7 birds', 480, 400, 52, GREEN));
    d.alpha(d.in(T, 6.5), () => { d.pill('➕ in all, altogether, total', 250, 490, { size: 22, bg: '#c8f0c0' }); d.pill('➖ left, fewer, how many more', 700, 490, { size: 22, bg: '#ffd8e2' }); });
  },
  // ----- money & time -----
  'mt-coins'(d, t) {
    d.bg('#fffaf0', '#fff1d6');
    const C = [['p', 'Penny'], ['n', 'Nickel'], ['d', 'Dime'], ['q', 'Quarter']];
    C.forEach(([k, s], i) => {

// ---------- Game 1: Fact Rocket ----------
function rocketGame(api) {
  const { root, board, sfx, shuffle, d } = api;
  const N = 12, rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const facts = [];
  for (let i = 0; i < N; i++) {
    let q, ans;
    if (i % 2 === 0) { const a = rnd(3, 10), b = rnd(2, 10); q = `${a} + ${b}`; ans = a + b; }
    else { const b = rnd(2, 9); ans = rnd(2, 10); q = `${ans + b} − ${b}`; }
    const wrong = shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 10].filter(n => n >= 0 && n !== ans)).slice(0, 2);
    facts.push({ q, ans, opts: shuffle([ans, ...wrong]) });
  }
  let fi = 0, score = 0, firstTry = 0, miss = 0, done = false, t = 0, h = 0, cheer = 0;
  root.innerHTML = `<div class="hud"><span id="fr-n"></span><span>🏆 <b id="fr-s">0</b></span></div>
    <canvas class="board" id="fr-cv"></canvas>
    <p id="fr-q" style="font-weight:700;font-size:34px;margin:4px auto"></p><div class="choices" id="fr-c"></div>`;
  const draw = board(api.$('fr-cv'));
  function ask() {
    const F = facts[fi];
    api.$('fr-n').textContent = `Fact ${fi + 1} of ${N}`;
    api.$('fr-q').textContent = `${F.q} = ?`;
    api.$('fr-c').innerHTML = F.opts.map((o, k) => `<button class="ans" data-k="${k}" style="font-size:28px">${o}</button>`).join('');
    api.$('fr-c').querySelectorAll('.ans').forEach(b => b.addEventListener('click', () => pick(+b.dataset.k)));
    miss = 0;
  }
  function pick(k) {
    if (done) return;
    RB.audio();
    const F = facts[fi], b = api.$('fr-c').children[k];
    if (F.opts[k] !== F.ans) { sfx.wrong(); miss++; b.disabled = true; b.classList.add('wrong', 'shake'); return; }
    sfx.right(); cheer = 1;
    if (!miss) { score += 100; firstTry++; } else score += 50;
    api.$('fr-s').textContent = score;
    fi++;
    if (fi === N) {
      done = true;
      api.$('fr-c').innerHTML = ''; api.$('fr-q').textContent = '🌕 You made it to the Moon!';
      setTimeout(() => api.done({ score, stars: firstTry >= 10 ? 3 : firstTry >= 7 ? 2 : 1,
        rows: [['🚀 Facts answered', N], ['⚡ Right on the first try', `${firstTry} of ${N}`]], hint: 'Get 10 or more right on the first try for ★★★' }), 1200);
      return;
    }
    ask();
  }
  function render() {
    const p = h / N;
    draw(() => {
      const top = `rgb(${Math.round(d.lerp(110, 10, p))},${Math.round(d.lerp(190, 20, p))},${Math.round(d.lerp(255, 60, p))})`;
      d.bg(top, p < 0.5 ? '#e6f6ff' : '#33478a');
      if (p > 0.3) for (let i = 0; i < 50; i++) d.circle((i * 211) % 960, (i * 97) % 540, 1.8, { fill: `rgba(255,255,255,${(p - 0.3) * 1.4})` });
      for (let i = 0; i < 4; i++) { const y = ((i * 150 + p * 1400) % 700) - 80; d.emoji('☁️', 120 + (i * 260) % 760, y, 90, { alpha: Math.max(0, 1 - p * 1.6) }); }
      d.rect(0, 470 + p * 400, d.W, 100, { r: 0, fill: '#6dbb5c' });
      d.emoji('🌕', 800, d.lerp(-120, 90, Math.max(0, (p - 0.6) / 0.4)), 120);
      const y = 400 - p * 280 + Math.sin(t * 8) * 3;
      for (let i = 0; i < 5; i++) d.emoji('🔥', 480 + (Math.random() - 0.5) * 18, y + 70 + i * 12, 40 - i * 6, { alpha: 0.9 - i * 0.15, rot: Math.PI });
      d.emoji('🚀', 480, y, 110, { rot: -Math.PI / 4 });
      d.rect(30, 30, 30, 480, { r: 15, fill: 'rgba(255,255,255,.3)', stroke: '#fff', lw: 3 });
      d.rect(30, 30 + 480 * (1 - p), 30, 480 * p, { r: 15, fill: YELLOW });
      if (cheer > 0) d.text(miss ? 'Got it!' : '+100', 600, y - 60 - (1 - cheer) * 40, { size: 40, weight: 700, color: YELLOW, stroke: INK, lw: 6, alpha: cheer });
    });
  }
  ask(); render();
  return {
    tick(dt) { t += dt; cheer = Math.max(0, cheer - dt); h += (fi - h) * Math.min(1, dt * 3); render(); },
    key(k) { const n = '123'.indexOf(k); if (n >= 0) pick(n); },
    bot() { if (!done) pick(facts[fi].opts.indexOf(facts[fi].ans)); },
  };
}

// ---------- Game 2: Coin Shop ----------
function shopGame(api) {
  const { root, board, sfx, d } = api;
  const ITEMS = [['🍎', 'an apple', 35], ['✏️', 'a pencil', 18], ['🎈', 'a balloon', 40], ['🍪', 'a cookie', 52], ['🧃', 'a juice box', 75], ['🦖', 'a toy dinosaur', 91]];
  const fewest = c => { let n = 0; for (const k of ['q', 'd', 'n', 'p']) { n += Math.floor(c / COINS[k].v); c %= COINS[k].v; } return n; };
  let ii = 0, tray = [], tries = 0, score = 0, perfect = 0, done = false, t = 0, cheer = 0;

    <canvas class="board" id="cs-cv" style="width:min(100%, calc((100vh - 420px) * 16 / 9))"></canvas>

  const draw = board(api.$('cs-cv'));
  root.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => add(b.dataset.c)));
  api.$('cs-clr').addEventListener('click', () => { RB.audio(); tray = []; sfx.pop(); });
  api.$('cs-pay').addEventListener('click', pay);
  const sum = () => tray.reduce((a, k) => a + COINS[k].v, 0);
  function add(k) { if (done || tray.length >= 14) return; RB.audio(); tray.push(k); sfx.pop(); }
  function show() { api.$('cs-n').textContent = `Customer ${ii + 1} of ${ITEMS.length}`; tray = []; tries = 0; }
  function pay() {
    if (done) return;
    RB.audio();
    if (sum() !== ITEMS[ii][2]) { tries++; sfx.wrong(); const cv = api.$('cs-cv'); cv.classList.remove('shake'); void cv.offsetWidth; cv.classList.add('shake'); return; }
    sfx.right(); cheer = 1.4;
    score += [200, 100, 50][Math.min(tries, 2)] + (tray.length === fewest(ITEMS[ii][2]) ? 50 : 0);
    if (!tries) perfect++;
    api.$('cs-s').textContent = score;
    ii++;
    if (ii === ITEMS.length) {
      done = true;
      api.done({ score, stars: score >= 1200 ? 3 : score >= 800 ? 2 : 1, rows: [['🛍️ Things bought', ITEMS.length], ['🎯 Paid right on the first try', `${perfect} of ${ITEMS.length}`]],
        hint: 'Pay the exact amount on the first try (with the fewest coins for a bonus) for ★★★' });
      return;
    }
    show();
  }
  function render() {
    if (done) return;
    const [e, name, price] = ITEMS[ii], s = sum();
    draw(() => {
      d.bg('#fff6e0', '#ffe8c0');
      d.rect(0, 0, d.W, 50, { r: 0, fill: '#e8453a' });
      for (let i = 0; i < 12; i++) d.rect(i * 80, 0, 40, 50, { r: 0, fill: '#fff' });
      d.text('COIN SHOP', 480, 26, { size: 30, color: INK, font: "'Bungee', sans-serif", stroke: '#fff', lw: 6 });
      d.emoji(e, 200, 200, 150);
      d.pill(price + '¢', 200, 330, { size: 40, bg: YELLOW });
      d.text(`Pay exactly ${price}¢ for ${name}`, 200, 400, { size: 24, weight: 700, maxW: 380 });
      d.rect(420, 80, 510, 330, { r: 20, fill: '#fff', stroke: INK });
      d.text('Your coins', 675, 110, { size: 24, weight: 700, color: '#5a6f99' });
      tray.forEach((k, i) => coin(d, k, 470 + (i % 7) * 68, 175 + Math.floor(i / 7) * 90, 0.95));
      if (!tray.length) d.text('Tap coins below to add them', 675, 230, { size: 24, color: '#9aa6c0' });
      d.pill(`${s}¢`, 675, 370, { size: 34, bg: s === price ? '#c8f0c0' : s > price ? '#ffd8d0' : '#fff' });
      if (s > price) d.text('Too much!', 860, 370, { size: 22, weight: 700, color: RED });
      d.text('Bonus: use the fewest coins you can!', 480, 470, { size: 22, color: '#5a6f99' });
      if (cheer > 0) d.text('Thank you! 😀', 480, 250 - (1.4 - cheer) * 40, { size: 48, weight: 700, color: GREEN, stroke: '#fff', lw: 8, alpha: Math.min(1, cheer) });
    });
  }
  show(); render();
  return {
    tick(dt) { t += dt; cheer = Math.max(0, cheer - dt); render(); },
    key(k) { const n = '1234'.indexOf(k); if (n >= 0) add('pndq'[n]); if (k === 'enter') pay(); },
    bot() {
      if (done) return;
      tray = []; let c = ITEMS[ii][2];
      for (const k of ['q', 'd', 'n', 'p']) while (c >= COINS[k].v) { tray.push(k); c -= COINS[k].v; }
      pay();
    },
  };
}
