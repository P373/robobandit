<script>
'use strict';
const INK = '#14254d', ORANGE = '#e0682a', BLUE = '#3d8ff0', GREEN = '#2fae5a', PINK = '#e8457a', YELLOW = '#ffd84a', PURPLE = '#7b4bd6', RED = '#e8453a';

// ---------- Drawing helpers ----------
const paper = (d, a = '#fffaf0', b = '#fff1d6') => d.bg(a, b);
function panel(d, x, y, w, h, o = {}) { d.rect(x, y, w, h, { r: 18, fill: o.fill || '#fff', stroke: o.stroke || INK, lw: o.lw || 3 }); }
// a speech or thought bubble with words in it, tail pointing down-left toward (tx, ty)
function bubble(d, s, x, y, w, o = {}) {
  const lines = Math.ceil(s.length * (o.size || 24) * 0.5 / w) || 1, h = lines * (o.size || 24) * 1.3 + 30;
  if (o.think) { d.circle(o.tx, o.ty, 7, { fill: '#fff', stroke: INK, lw: 2 }); d.circle(o.tx + 12, o.ty - 18, 11, { fill: '#fff', stroke: INK, lw: 2 }); }
  else if (o.tx != null) d.poly([[x - w / 2 + 40, y + h / 2 - 4], [o.tx, o.ty], [x - w / 2 + 80, y + h / 2 - 4]], { close: true, fill: '#fff', stroke: INK, lw: 3 });
  d.rect(x - w / 2, y - h / 2, w, h, { r: 22, fill: '#fff', stroke: INK, lw: 3 });
  d.wrap(s, x, y - h / 2 + 15, w - 30, { size: o.size || 24, weight: 700 });
}
// letter tiles, centred on x
function tiles(d, parts, x, y, o = {}) {
  const sz = o.size || 64, widths = parts.map(p => p.s.length * sz * 0.62 + 20), gap = o.gap == null ? 8 : o.gap;
  let cx = x - (widths.reduce((a, b) => a + b, 0) + gap * (parts.length - 1)) / 2;
  parts.forEach((p, i) => {
    const w = widths[i];
    d.rect(cx, y - sz * 0.7, w, sz * 1.4, { r: 12, fill: p.bg || '#fff', stroke: INK, lw: 3 });
    d.text(p.s, cx + w / 2, y + 2, { size: sz, weight: 700, color: p.col || INK });
    cx += w + gap;
  });
}
// a word with its letter team in orange, centred on x
function teamWord(d, word, team, x, y, size, col = ORANGE) {
  const at = word.indexOf(team), parts = [word.slice(0, at), team, word.slice(at + team.length)], c = d.ctx;
  c.save(); c.font = `700 ${size}px 'Fredoka', system-ui, sans-serif`;
  const ws = parts.map(p => c.measureText(p).width);
  c.restore();
  let cx = x - ws.reduce((a, b) => a + b, 0) / 2;
  parts.forEach((p, i) => { d.text(p, cx, y, { size, weight: 700, align: 'left', color: i === 1 ? col : INK }); cx += ws[i]; });
}
const BALL = (d, x, y, r = 16) => { d.circle(x, y, r, { fill: RED, stroke: INK, lw: 2 }); d.circle(x - r * 0.35, y - r * 0.35, r * 0.25, { fill: 'rgba(255,255,255,.7)' }); };

// ---------- The pictures ----------
const DIAGRAMS = {
  // ----- retell -----
  'rt-what'(d, t) {
    paper(d);
    const P = [['Beginning', 'Pip plays with his red ball.'], ['Middle', 'The ball gets stuck in a tree!'], ['End', 'Kit knocks it down. They play together.']];
    P.forEach(([h, s], i) => {
      const x = 20 + i * 310, k = d.in(t, i * 1.2);
      d.alpha(k, () => {
        panel(d, x, 70, 300, 290, { fill: '#e8f6ff' });
        d.rect(x + 3, 290, 294, 67, { r: 0, fill: '#8bd06a' });
        if (i === 0) { d.emoji('🐶', x + 90, 270, 80); BALL(d, x + 200, 270 - Math.abs(Math.sin(t * 3)) * 100); }
        if (i === 1) { d.emoji('🌳', x + 180, 200, 200); BALL(d, x + 200, 160); d.emoji('🐶', x + 80, 270 - Math.abs(Math.sin(t * 4)) * 40, 74); }
        if (i === 2) { d.emoji('🐶', x + 80, 270, 74); d.emoji('🐱', x + 220, 270, 70, { flip: true }); BALL(d, x + 150, 250 - Math.abs(Math.sin(t * 3)) * 60); d.emoji('❤️', x + 150, 130, 40); }
        d.pill(h, x + 150, 70, { size: 26, bg: [YELLOW, '#ffd8b8', '#c8f0c0'][i] });
        d.wrap(s, x + 150, 380, 290, { size: 24 });
      });
    });
  },
  'rt-why'(d, t) {
    paper(d, '#f2f7ff', '#e2edff');
    d.person(220, 360, 2.2, { shirt: ORANGE, skin: '#c98d5f', hair: '#3a2a1a' });
    d.person(760, 360, 2.2, { shirt: BLUE, skin: '#f1c7a0', hair: '#a86a2a' });
    const lines = ['First, Pip plays with his ball…', 'Then it gets stuck in a tree…', 'At the end, Kit helps!'];
    const i = Math.floor(t / 2) % 3;
    bubble(d, lines[i], 420, 110, 420, { tx: 260, ty: 230 });
    d.alpha(d.in(t, 2), () => d.emoji('💡', 760, 160, 70));
    d.pill('Retelling shows you understood!', 480, 500, { size: 28, bg: YELLOW });
  },
  'rt-cs'(d, t) {
    paper(d);
    const C = [['WHO?', 'Characters', ['🐶', '🐱'], 'Pip the puppy and Kit the cat', '#ffd8b8'], ['WHERE?', 'Setting', ['🏡', '🌳'], 'in the backyard', '#c8f0c0'], ['WHEN?', 'Setting', ['☀️', '🌅'], 'on a sunny morning', '#cfe6ff']];
    C.forEach(([q, s, E, ex, bg], i) => {
      const x = 170 + i * 310;
      d.alpha(d.in(t, i * 0.9), () => {
        panel(d, x - 145, 40, 290, 400, { fill: bg });
        d.text(q, x, 90, { size: 44, weight: 700, color: ORANGE, font: "'Bungee', sans-serif" });
        d.text(s, x, 145, { size: 28, weight: 700 });
        E.forEach((e, j) => d.emoji(e, x - 55 + j * 110, 250 + Math.sin(t * 2 + j) * 6, 86));
        d.wrap(ex, x, 340, 260, { size: 24 });
      });
    });
    d.text('Characters = who.  Setting = where and when.', 480, 495, { size: 28, weight: 700, color: ORANGE });
  },
  'rt-ps'(d, t) {
    paper(d);
    panel(d, 30, 40, 400, 380, { fill: '#ffe0dc' });
    d.text('PROBLEM 😟', 230, 80, { size: 34, weight: 700, color: RED });
    d.emoji('🌳', 230, 220, 190); BALL(d, 250, 180 + Math.sin(t * 6) * 2);
    d.emoji('🐶', 120, 330 - Math.abs(Math.sin(t * 4)) * 30, 70);
    d.wrap('The ball is stuck in a tree!', 230, 360, 360, { size: 26, weight: 700 });
    d.alpha(d.in(t, 1.5), () => d.arrow(445, 230, 515, 230, { color: ORANGE, lw: 8, head: 26 }));
    d.alpha(d.in(t, 2.2), () => {
      panel(d, 530, 40, 400, 380, { fill: '#d8f5d0' });
      d.text('SOLUTION 😀', 730, 80, { size: 34, weight: 700, color: GREEN });
      d.emoji('🌳', 730, 220, 190);
      const k = d.loop(t, 2.5);
      d.emoji('🐱', 770, 160, 60, { flip: true });
      BALL(d, 760, 180 + k * 150);
      d.emoji('🐶', 650, 330, 70);
      d.wrap('Kit climbs up and knocks it down.', 730, 360, 360, { size: 26, weight: 700 });
    });
    d.text('Most stories have a problem, and the end solves it.', 480, 480, { size: 28, weight: 700, color: ORANGE });
  },
  'rt-seq'(d, t) {
    paper(d, '#f2fbf5', '#dff4e6');
    const S = [['First', '🥣', 'Get a bowl.'], ['Next', '🥣', 'Pour the cereal.'], ['Then', '🥛', 'Add the milk.'], ['Last', '🥄', 'Eat it up!']];
    S.forEach(([w, e, s], i) => {
      const x = 125 + i * 237, k = d.in(t % 8, i * 0.8, 0.5);
      d.at(x, 230 + (1 - k) * 60, 0, 1, () => d.alpha(k, () => {
        panel(d, -105, -160, 210, 300, { fill: '#fff' });
        d.pill(w, 0, -160, { size: 28, bg: [YELLOW, '#ffd8b8', '#cfe6ff', '#c8f0c0'][i] });
        d.emoji(e, 0, -40, 90);
        if (i === 1) for (let j = 0; j < 6; j++) d.circle(-30 + j * 12, -70 - (j % 2) * 10, 6, { fill: '#e8b04a' });
        d.wrap(s, 0, 50, 190, { size: 26, weight: 700 });
      }));
      if (i < 3) d.alpha(d.in(t % 8, i * 0.8 + 0.5), () => d.arrow(x + 108, 230, x + 130, 230, { color: GREEN, lw: 5, head: 14 }));
    });
    d.text('Signal words tell you the ORDER things happen.', 480, 500, { size: 28, weight: 700, color: GREEN });
  },
  // ----- main idea -----
  'mi-what'(d, t) {
    paper(d, '#fff9e0', '#ffefb8');
    d.rect(100, 120, 760, 80, { r: 12, fill: '#c9894a', stroke: INK, lw: 4 });
    d.text('MAIN IDEA: Bees are busy helpers.', 480, 162, { size: 36, weight: 700, color: '#fff', stroke: INK, lw: 5 });
    const D = [['They make honey.', '🍯'], ['They carry pollen.', '🌸'], ['They build hives.', '🐝']];
    D.forEach(([s, e], i) => {
      const x = 200 + i * 280, k = d.in(t, 0.5 + i * 0.8);
      d.alpha(k, () => {
        d.rect(x - 22, 200, 44, 220 * k, { r: 4, fill: '#a86a34', stroke: INK, lw: 3 });
        d.emoji(e, x, 290, 60);
        d.pill(s, x, 380, { size: 22, bg: '#fff' });
      });
    });
    d.emoji('🐝', 480 + Math.cos(t * 2) * 300, 70 + Math.sin(t * 3) * 25, 44);
    d.text('The details hold up the main idea, like legs hold up a table!', 480, 480, { size: 26, weight: 700, color: ORANGE });
  },
  'mi-why'(d, t) {
    paper(d, '#f2f7ff', '#e2edff');
    const F = ['Bees make honey', 'Bees have 6 legs', 'Bees carry pollen', 'Bees build hives', 'Bees help flowers grow', 'Bees dance to talk'];
    const T = t % 8, k = d.in(T, 1.5, 2);
    F.forEach((s, i) => {
      const sx = 160 + (i % 3) * 320, sy = 70 + Math.floor(i / 3) * 90;
      d.alpha(1 - k, () => d.pill(s, d.lerp(sx, 480, k), d.lerp(sy, 300, k), { size: 22 }));
    });
    d.alpha(d.in(T, 3.2), () => { d.emoji('🐝', 480, 260, 80); d.pill('Bees are busy helpers!', 480, 360, { size: 36, bg: YELLOW }); });
    d.text('The main idea helps you remember the big point.', 480, 480, { size: 28, weight: 700, color: BLUE });
  },
  'mi-topic'(d, t) {
    paper(d);
    panel(d, 40, 60, 400, 360, { fill: '#e6dcff' });
    d.text('TOPIC', 240, 110, { size: 40, color: PURPLE, font: "'Bungee', sans-serif" });
    d.text('one or two words', 240, 160, { size: 24, color: '#5a6f99' });
    d.emoji('🐝', 240, 260, 90); d.text('Bees', 240, 360, { size: 50, weight: 700 });
    d.alpha(d.in(t, 1.2), () => {
      panel(d, 520, 60, 400, 360, { fill: '#ffe8c8' });
      d.text('MAIN IDEA', 720, 110, { size: 40, color: ORANGE, font: "'Bungee', sans-serif" });
      d.text('a whole sentence', 720, 160, { size: 24, color: '#5a6f99' });
      d.wrap('Bees are busy helpers.', 720, 230, 340, { size: 42 });
    });
    d.text('The topic says WHAT. The main idea says what about it.', 480, 480, { size: 26, weight: 700 });
  },
  'mi-find'(d, t) {
    paper(d, '#eaf7ff', '#d6efff');
    panel(d, 30, 30, 620, 420, { fill: '#fffdf6' });
    const S = ['Penguins are amazing swimmers.', 'They use their wings like flippers.', 'They can dive deep under the ice.', 'They zoom through the water to catch fish.'];
    const T = t % 8;
    S.forEach((s, i) => {
      const y = 90 + i * 95;
      if (i === 0) d.alpha(d.in(T, 1, 0.8), () => d.rect(50, y - 30, 580, 62, { r: 10, fill: YELLOW }));
      d.wrap(s, 340, y - 16, 560, { size: 28, weight: i === 0 ? 700 : 600 });
    });
    d.emoji('🐧', 800 + Math.sin(t * 2) * 50, 200 + Math.cos(t * 2) * 30, 110, { rot: 0.6 });
    for (let i = 0; i < 4; i++) d.circle(720 + i * 40, 320 - d.loop(t + i * 0.3, 1.5) * 200, 8, { stroke: '#7fc4ff', lw: 3 });
    d.alpha(d.in(T, 2), () => d.wrap('The main idea is often the first or last sentence. The rest are details!', 800, 380, 280, { size: 22, weight: 700, color: ORANGE }));
  },
  'mi-odd'(d, t) {
    paper(d, '#f2fbf5', '#dff4e6');
    d.pill('Main idea: Dogs make great pets. 🐶', 480, 50, { size: 30, bg: YELLOW });
    const D = [['They love to play.', '🎾'], ['They keep you company.', '🛋️'], ['The sky is blue.', '☁️'], ['They can learn tricks.', '🦴']];
    const T = t % 8;
    D.forEach(([s, e], i) => {
      const x = 125 + i * 237, odd = i === 2, k = odd ? d.in(T, 3, 1.4) : 0;
      d.at(x + (odd && T > 2 && T < 3 ? Math.sin(T * 30) * 6 : 0), 260 + k * 60, 0, 1, () => d.alpha(1 - k, () => {
        panel(d, -105, -110, 210, 220, { fill: odd && T > 2 ? '#ffe0dc' : '#fff' });
        d.emoji(e, 0, -40, 70);
        d.wrap(s, 0, 20, 190, { size: 23, weight: 700 });
      }));
      if (odd) d.alpha(d.in(T, 2, 0.3) * (1 - k), () => d.emoji('❌', x, 120, 50));
    });
    d.alpha(d.in(T, 4.5), () => d.text('Every detail should tell about the main idea.', 480, 470, { size: 28, weight: 700, color: GREEN }));
  },
  // ----- compare & contrast -----
  'cc-what'(d, t) {
    paper(d);
    d.emoji('🐱', 200, 200, 170); d.emoji('🐶', 760, 200, 170);
    d.text('Cats', 200, 330, { size: 34, weight: 700 }); d.text('Dogs', 760, 330, { size: 34, weight: 700 });
    const T = t % 8;
    d.alpha(d.in(T, 0.8), () => { d.pill('ALIKE: both are furry pets', 480, 120, { size: 26, bg: '#c8f0c0' }); });
    d.alpha(d.in(T, 2.5), () => { d.pill('DIFFERENT: cats meow…', 330, 420, { size: 26, bg: '#ffd8d0' }); d.pill('…but dogs bark!', 680, 420, { size: 26, bg: '#ffd8d0' }); });
    d.text('Compare = how they are alike.  Contrast = how they are different.', 480, 500, { size: 24, weight: 700, color: ORANGE });
  },
  'cc-why'(d, t) {
    paper(d, '#f2f7ff', '#e2edff');
    d.emoji('🍎', 240, 210, 170); d.emoji('🍏', 720, 210, 170);
    const same = ['fruit', 'round', 'has seeds', 'crunchy'], i = Math.floor(t / 1.2) % 4;
    d.pill('Same: ' + same[i], 480, 110, { size: 28, bg: '#c8f0c0' });
    d.pill('Different: red or green!', 480, 340, { size: 28, bg: '#ffd8d0' });
    d.text('Noticing what\'s the same and different', 480, 430, { size: 28, weight: 700 });
    d.text('helps you understand and remember.', 480, 470, { size: 28, weight: 700 });
  },
  'cc-venn'(d, t) {
    paper(d, '#fffdf6', '#fff6e0');
    d.alpha(0.85, () => { d.circle(350, 280, 220, { fill: 'rgba(127,196,255,.45)', stroke: BLUE, lw: 5 }); d.circle(610, 280, 220, { fill: 'rgba(255,159,191,.45)', stroke: PINK, lw: 5 }); });
    d.text('Cats 🐱', 260, 60, { size: 32, weight: 700, color: BLUE }); d.text('Dogs 🐶', 700, 60, { size: 32, weight: 700, color: PINK });
    d.text('Both', 480, 140, { size: 28, weight: 700, color: PURPLE });
    const F = [['meow', 240, 220], ['climb trees', 240, 300], ['use a litter box', 240, 380], ['bark', 720, 220], ['play fetch', 720, 300], ['go on walks', 720, 380], ['pets', 480, 220], ['fur', 480, 290], ['4 legs', 480, 360]];
    F.forEach(([s, x, y], i) => d.alpha(d.in(t, 0.3 + i * 0.4, 0.4), () => d.text(s, x, y, { size: 26, weight: 700 })));
    d.text('A Venn diagram: the middle shows what\'s the SAME', 480, 515, { size: 24, weight: 700, color: ORANGE });
  },
  'cc-words'(d, t) {
    paper(d);
    panel(d, 30, 30, 430, 330, { fill: '#d8f5d0' }); panel(d, 500, 30, 430, 330, { fill: '#ffe0dc' });
    d.text('SAME', 245, 75, { size: 36, color: GREEN, font: "'Bungee', sans-serif" }); d.text('DIFFERENT', 715, 75, { size: 36, color: RED, font: "'Bungee', sans-serif" });
    ['both', 'alike', 'same', 'also', 'too'].forEach((w, i) => d.alpha(d.in(t, i * 0.3), () => d.pill(w, 130 + (i % 3) * 115, 160 + Math.floor(i / 3) * 80, { size: 28 })));
    ['but', 'unlike', 'different', 'instead'].forEach((w, i) => d.alpha(d.in(t, 1.5 + i * 0.3), () => d.pill(w, 620 + (i % 2) * 190, 160 + Math.floor(i / 2) * 80, { size: 28 })));
    d.alpha(d.in(t, 3), () => { d.text('Cats and dogs are BOTH pets.', 480, 420, { size: 30, weight: 700, color: GREEN }); d.text('Cats meow, BUT dogs bark.', 480, 480, { size: 30, weight: 700, color: RED }); });
  },
  'cc-stories'(d, t) {
    paper(d, '#f2fbf5', '#dff4e6');
    panel(d, 30, 30, 420, 260, { fill: '#ffe8f0' }); panel(d, 510, 30, 420, 260, { fill: '#e8f3ff' });
    d.text('The Three Little Pigs', 240, 70, { size: 28, weight: 700 }); d.text('Three Billy Goats Gruff', 720, 70, { size: 28, weight: 700 });
    for (let i = 0; i < 3; i++) { d.emoji('🐷', 90 + i * 70, 150, 54 + i * 8); d.emoji('🐐', 570 + i * 70, 150, 54 + i * 8); }
    d.emoji('🐺', 370, 150, 70); d.emoji('🧌', 850, 150, 70);
    d.text('houses', 240, 240, { size: 24, color: '#5a6f99' }); d.text('a bridge', 720, 240, { size: 24, color: '#5a6f99' });
    d.alpha(d.in(t, 1), () => d.pill('BOTH: 3 characters, a mean bad guy, the third one wins!', 480, 350, { size: 24, bg: '#c8f0c0' }));
    d.alpha(d.in(t, 2.5), () => d.pill('DIFFERENT: houses vs. a bridge, a wolf vs. a troll', 480, 430, { size: 24, bg: '#ffd8d0' }));
    d.alpha(d.in(t, 3.5), () => d.text('You can compare two stories, too!', 480, 505, { size: 26, weight: 700, color: ORANGE }));
  },
  // ----- predict & infer -----
  'pi-what'(d, t) {
    const T = t % 10, dark = d.in(T, 0.5, 3);
    d.bg(`rgb(${Math.round(d.lerp(150, 90, dark))},${Math.round(d.lerp(210, 110, dark))},${Math.round(d.lerp(255, 140, dark))})`, '#e6f0ff');
    d.rect(0, 420, d.W, 120, { r: 0, fill: '#6dbb5c' });
    for (let i = 0; i < 4; i++) d.emoji('☁️', d.lerp(-200 + i * 80, 120 + i * 220, dark), 80 + (i % 2) * 40, 130, { alpha: 0.4 + dark * 0.6 });
    d.person(300, 360, 1.8, { shirt: ORANGE, skin: '#8a5a3c', hair: '#1a1a1a' });
    d.emoji('☂️', 380, 230, 90);
    bubble(d, 'Dark clouds… I predict it will rain!', 640, 250, 380, { think: true, tx: 380, ty: 320 });
    if (T > 5.5) for (let i = 0; i < 30; i++) { const y = ((i * 53 + (T - 5.5) * 500) % 420); d.line((i * 97) % 960, y, (i * 97) % 960 - 6, y + 18, { stroke: '#3d8ff0', lw: 3 }); }
    d.alpha(d.in(T, 6), () => d.pill('My prediction was right! 🌧️', 480, 480, { size: 26, bg: YELLOW }));
  },
  'pi-why'(d, t) {
    paper(d, '#f2f7ff', '#e2edff');
    d.emoji('📖', 300, 290, 170);
    d.person(150, 380, 1.8, { shirt: GREEN, skin: '#f1c7a0', hair: '#e0b04a' });
    ['❓', '🤔', '💡'].forEach((e, i) => d.emoji(e, 520 + i * 130, 170 - Math.abs(Math.sin(t * 2 + i)) * 30, 80));
    d.wrap('Good readers think ahead: "What will happen next?" Then they read on to find out!', 680, 280, 480, { size: 28, weight: 700 });
  },
  'pi-eq'(d, t) {

// ---------- Game 1: Word Builder ----------
function wordGame(api) {
  const { root, board, sfx, shuffle, d } = api;
  // [picture, word, the missing letter team, two wrong teams]
  const WORDS = shuffle([['🚂', 'train', 'ai', ['oa', 'ur']], ['⛵', 'boat', 'oa', ['ir', 'ar']], ['🌳', 'tree', 'ee', ['oa', 'ai']], ['🍃', 'leaf', 'ea', ['oa', 'ai']], ['❄️', 'snow', 'ow', ['oa', 'ai']],
    ['⭐', 'star', 'ar', ['or', 'ee']], ['🌽', 'corn', 'or', ['ar', 'ee']], ['🐦', 'bird', 'ir', ['oo', 'ai']], ['🐢', 'turtle', 'ur', ['ar', 'ee']], ['🦷', 'tooth', 'oo', ['ai', 'ow']]]);
  let wi = 0, score = 0, firstTry = 0, miss = 0, done = false, t = 0, fill = 0, opts = [];
  root.innerHTML = `<div class="hud"><span id="wb-n"></span><span>🏆 <b id="wb-s">0</b></span></div>
    <canvas class="board" id="wb-cv"></canvas>
    <p style="font-weight:600;margin:4px auto">Which letters finish the word?</p><div class="choices" id="wb-c"></div>`;
  const draw = board(api.$('wb-cv'));
  function ask() {
    const [, , team, wrong] = WORDS[wi];
    opts = shuffle([team, ...wrong]);
    api.$('wb-n').textContent = `Word ${wi + 1} of ${WORDS.length}`;
    api.$('wb-c').innerHTML = opts.map((o, k) => `<button class="ans" data-k="${k}" style="font-size:30px">${o}</button>`).join('');
    api.$('wb-c').querySelectorAll('.ans').forEach(b => b.addEventListener('click', () => pick(+b.dataset.k)));
    miss = 0; fill = 0;
  }
  function pick(k) {
    if (done || fill > 0) return;
    RB.audio();
    const b = api.$('wb-c').children[k];
    if (opts[k] !== WORDS[wi][2]) { sfx.wrong(); miss++; b.disabled = true; b.classList.add('wrong', 'shake'); return; }
    sfx.right(); fill = 0.01;
    if (!miss) { score += 100; firstTry++; } else score += 50;
    api.$('wb-s').textContent = score;
  }
  function next() {
    wi++;
    if (wi === WORDS.length) {
      done = true;
      api.done({ score, stars: firstTry >= 8 ? 3 : firstTry >= 5 ? 2 : 1, rows: [['🧩 Words built', WORDS.length], ['✅ Right on the first try', `${firstTry} of ${WORDS.length}`]],
        hint: 'Get 8 or more right on the first try for ★★★' });
      return;
    }
    ask();
  }
  function render() {
    if (done) return;
    const [e, word, team] = WORDS[wi], at = word.indexOf(team);
    draw(() => {
      d.bg('#fff9e0', '#ffefb8');
      d.circle(480, 170, 120, { fill: '#fff', stroke: ORANGE, lw: 6 });
      d.emoji(e, 480, 170 + Math.sin(t * 2) * 6, 150);
      const parts = [];
      if (at > 0) parts.push({ s: word.slice(0, at) });
      parts.push({ s: fill > 0 ? team : '__', bg: fill > 0 ? '#c8f0c0' : YELLOW, col: fill > 0 ? GREEN : ORANGE });
      if (at + 2 < word.length) parts.push({ s: word.slice(at + 2) });
      tiles(d, parts, 480, 400, { size: 80 });
      if (fill > 0) d.text('⭐', 480 + Math.cos(t * 6) * 260, 400 + Math.sin(t * 6) * 70, { size: 40 });
    });
  }
  ask(); render();
  return {
    tick(dt) { t += dt; if (fill > 0) { fill += dt; if (fill > 0.9) next(); } render(); },
    key(k) { const n = '123'.indexOf(k); if (n >= 0) pick(n); },
    bot() { if (fill > 0) { this.tick(1); return; } if (!done) pick(opts.indexOf(WORDS[wi][2])); },
  };
}

// ---------- Game 2: Story Order ----------
function orderGame(api) {
  const { root, board, sfx, shuffle, d } = api;
  const STORIES = [
    ['Planting a Seed', [['🕳️', 'Dig a hole in the dirt.'], ['🌰', 'Drop a seed in the hole.'], ['💧', 'Water it every day.'], ['🌻', 'A flower grows!']]],
    ['Pip\'s Ball', [['⚽', 'Pip plays with his ball.'], ['🌳', 'The ball gets stuck in a tree.'], ['🐱', 'Kit climbs up and knocks it down.'], ['🐶', 'Pip and Kit play together.']]],
    ['Snow Day', [['❄️', 'It snows all night.'], ['⚪', 'We roll three big snowballs.'], ['⛄', 'We stack them up.'], ['🥕', 'We add a carrot nose!']]],
  ];
  const WORDS = ['First', 'Next', 'Then', 'Last'];
  let si = 0, placed = 0, mistakes = 0, score = 0, perfect = 0, done = false, t = 0, order = [], wait = 0;
  root.innerHTML = `<div class="hud"><span id="so-n"></span><span>🏆 <b id="so-s">0</b></span></div>
    <canvas class="board" id="so-cv"></canvas>
    <p id="so-q" style="font-weight:600;margin:4px auto"></p><div class="choices" id="so-c"></div>`;
  const draw = board(api.$('so-cv'));
  function deal() {
    order = shuffle([0, 1, 2, 3]); placed = 0; mistakes = 0; wait = 0;
    api.$('so-n').textContent = `Story ${si + 1} of ${STORIES.length}: ${STORIES[si][0]}`;
    api.$('so-c').innerHTML = order.map(j => `<button class="ans" data-j="${j}">${STORIES[si][1][j][0]} ${api.esc(STORIES[si][1][j][1])}</button>`).join('');
    api.$('so-c').querySelectorAll('.ans').forEach(b => b.addEventListener('click', () => pick(+b.dataset.j, b)));
    prompt();
  }
  const prompt = () => { api.$('so-q').textContent = placed < 4 ? `What happens ${WORDS[placed].toLowerCase()}?` : '🎉 Great retelling!'; };
  function pick(j, b) {
    if (done || wait > 0 || placed >= 4) return;
    RB.audio();
    b = b || api.$('so-c').querySelector(`[data-j="${j}"]`);
    if (j !== placed) { sfx.wrong(); mistakes++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
    sfx.pop(); b.disabled = true; b.classList.add('right');
    placed++;
    prompt();
    if (placed === 4) {
      sfx.right();
      const pts = [300, 200, 100][Math.min(mistakes, 2)];
      score += pts; if (!mistakes) perfect++;
      api.$('so-s').textContent = score;
      wait = 1.2;
    }
  }
  function next() {
    si++;
    if (si === STORIES.length) {
      done = true;
      api.done({ score, stars: score >= 800 ? 3 : score >= 500 ? 2 : 1, rows: [['📚 Stories put in order', STORIES.length], ['🎯 With no mistakes', `${perfect} of ${STORIES.length}`]],
        hint: 'Put every story in order with at most one slip for ★★★' });
      return;
    }
    deal();
  }
  function render() {
    if (done) return;
    const S = STORIES[si][1];
    draw(() => {
      d.bg('#f2fbf5', '#dff4e6');
      WORDS.forEach((w, i) => {
        const x = 125 + i * 237, has = i < placed;
        d.rect(x - 108, 60, 216, 400, { r: 18, fill: has ? '#fff' : 'rgba(255,255,255,.5)', stroke: i === placed ? ORANGE : INK, lw: i === placed ? 6 : 3, dash: has ? [] : [10, 8] });
        d.pill(w, x, 60, { size: 28, bg: [YELLOW, '#ffd8b8', '#cfe6ff', '#c8f0c0'][i] });
        if (has) { d.emoji(S[i][0], x, 190, 90); d.wrap(S[i][1], x, 280, 190, { size: 24, weight: 700 }); }
        else d.text('?', x, 230, { size: 80, weight: 700, color: '#b9c6e0' });
      });
      if (wait > 0) d.text('⭐ ⭐ ⭐', 480, 505, { size: 36, alpha: Math.min(1, wait) });
    });
  }
  deal(); render();
  return {
    tick(dt) { t += dt; if (wait > 0) { wait -= dt; if (wait <= 0) next(); } render(); },
    key(k) { const n = '1234'.indexOf(k); if (n >= 0 && n < order.length) pick(order[n]); },
    bot() { if (wait > 0) { this.tick(1.3); return; } if (!done) pick(placed); },
  };
}
