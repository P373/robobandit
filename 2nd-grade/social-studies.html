<script>
'use strict';
const INK = '#14254d', RED = '#d63c4a', NAVY = '#23407a', BLUE = '#3d8ff0', GREEN = '#2fae5a', ORANGE = '#f08a24', YELLOW = '#ffd84a', PURPLE = '#7b4bd6', SEA = '#7fc4f0', LAND = '#9ccf7a';
const SKINS = ['#f1c7a0', '#c98d5f', '#8a5a3c', '#e0ac7e', '#5a3a28', '#f5d6b8'], SHIRTS = ['#3d8ff0', '#e8457a', '#2fae5a', '#f08a24', '#7b4bd6', '#ffb400'];

// ---------- Drawing helpers ----------
const paper = (d, a = '#fffaf0', b = '#fff1d6') => d.bg(a, b);
const panel = (d, x, y, w, h, fill = '#fff', lw = 3) => d.rect(x, y, w, h, { r: 18, fill, stroke: INK, lw });
const kid = (d, x, y, s, i, o = {}) => d.person(x, y, s, { shirt: SHIRTS[i % 6], skin: SKINS[i % 6], hair: ['#3a2a1a', '#a86a2a', '#1a1a1a', '#e0b04a'][i % 4], ...o });
// a framed portrait of a famous person: an emoji face, a name and years
function portrait(d, x, y, e, name, years, o = {}) {
  d.rect(x - 110, y - 130, 220, 260, { r: 10, fill: '#c9971e', stroke: INK, lw: 3 });
  d.rect(x - 96, y - 116, 192, 180, { r: 6, fill: o.bg || '#e8f3ff' });
  d.emoji(e, x, y - 26, 110);
  d.text(name, x, y + 88, { size: o.size || 24, weight: 700, color: '#fff', stroke: INK, lw: 5, maxW: 200 });
  if (years) d.text(years, x, y + 116, { size: 18, color: '#fff' });
}
function compass(d, x, y, r = 60, spin = 0) {
  d.circle(x, y, r, { fill: '#fff', stroke: INK, lw: 3 });
  d.at(x, y, spin, 1, () => {
    d.poly([[0, -r * 0.85], [r * 0.18, 0], [0, r * 0.85], [-r * 0.18, 0]], { close: true, fill: RED, stroke: INK, lw: 2 });
    d.poly([[-r * 0.85, 0], [0, r * 0.18], [r * 0.85, 0], [0, -r * 0.18]], { close: true, fill: NAVY, stroke: INK, lw: 2 });
  });
  [['N', 0, -1], ['E', 1, 0], ['S', 0, 1], ['W', -1, 0]].forEach(([s, dx, dy]) => d.text(s, x + dx * (r + 20), y + dy * (r + 20), { size: Math.max(20, r * 0.4), weight: 700, color: s === 'N' ? RED : INK }));
}
function flag(d, x, y, w = 120) {
  const h = w * 0.55;
  for (let i = 0; i < 7; i++) d.rect(x, y + i * h / 7, w, h / 7 + 0.5, { r: 0, fill: i % 2 ? '#fff' : '#d63c4a' });
  d.rect(x, y, w * 0.42, h * 4 / 7, { r: 0, fill: NAVY });
  for (let i = 0; i < 9; i++) d.circle(x + 8 + (i % 3) * w * 0.13, y + 7 + Math.floor(i / 3) * h * 0.17, 2.5, { fill: '#fff' });
  d.rect(x, y, w, h, { r: 0, stroke: INK, lw: 2 });
}
// the world: rough continent shapes on a 960×540 picture
const CONT = {
  'North America': [[60, 110], [180, 80], [330, 90], [340, 150], [280, 210], [250, 270], [210, 280], [160, 220], [90, 190]],
  'South America': [[230, 290], [300, 300], [340, 340], [310, 420], [280, 470], [260, 430], [240, 350]],
  'Europe': [[440, 100], [520, 90], [540, 140], [500, 170], [450, 165]],
  'Africa': [[450, 190], [540, 185], [580, 250], [560, 330], [520, 400], [490, 350], [470, 280], [440, 240]],
  'Asia': [[540, 80], [760, 70], [850, 120], [820, 200], [740, 250], [660, 270], [600, 220], [560, 170]],
  'Australia': [[740, 330], [830, 320], [860, 370], [820, 410], [750, 400]],
  'Antarctica': [[200, 500], [760, 500], [700, 530], [260, 530]],
};
const CONT_LABEL = { 'North America': [200, 160], 'South America': [290, 370], 'Europe': [490, 130], 'Africa': [510, 280], 'Asia': [700, 160], 'Australia': [800, 365], 'Antarctica': [480, 515] };
const OCEANS = [['Pacific', 70, 330], ['Atlantic', 380, 240], ['Indian', 640, 360], ['Arctic', 480, 40], ['Southern', 480, 465], ['Pacific', 910, 280]];

// ---------- The pictures ----------
const DIAGRAMS = {
  // ----- citizenship -----
  'ci-what'(d, t) {
    d.bg('#bfe6ff', '#eaf7ff');
    d.rect(0, 380, d.W, 160, { r: 0, fill: '#8bd06a' });
    [['🏫', 150, 'school'], ['🏠', 330, 'homes'], ['🏪', 500, 'stores'], ['🏥', 670, 'hospital'], ['🏛️', 840, 'town hall']].forEach(([e, x, s]) => { d.emoji(e, x, 300, 110); d.pill(s, x, 380, { size: 20 }); });
    for (let i = 0; i < 6; i++) kid(d, (i * 160 + t * 40 * (i % 2 ? 1 : -1) + 2000) % 1000 - 20, 450, 1, i);
    d.pill('A COMMUNITY: people who live, work and play together', 480, 60, { size: 26, bg: YELLOW });
    d.text('A citizen is a member of a community.', 480, 130, { size: 28, weight: 700, color: RED });
  },
  'ci-why'(d, t) {
    d.bg('#bfe6ff', '#eaf7ff'); d.rect(0, 360, d.W, 180, { r: 0, fill: '#8bd06a' });
    d.emoji('🌳', 140, 290, 150); d.emoji('🌳', 820, 290, 150);
    const k = d.loop(t, 6);
    ['🥤', '📄', '🍌', '🥫'].forEach((e, i) => { if (k < 0.2 + i * 0.18) d.emoji(e, 300 + i * 110, 470, 40); });
    kid(d, 300 + Math.min(1, k * 1.2) * 330, 420, 1.4, 1);
    d.emoji('🗑️', 760, 450, 70);
    d.pill('Picking up litter makes the park nicer for everyone', 480, 60, { size: 24, bg: YELLOW });
    d.text('When everyone does their part, our community is safe, fair and fun!', 480, 120, { size: 24, weight: 700, color: RED });
  },
  'ci-rules'(d, t) {
    paper(d);
    panel(d, 30, 30, 430, 380, '#e8f3ff'); panel(d, 500, 30, 430, 380, '#ffe8e0');
    d.text('RULES at school', 245, 75, { size: 30, weight: 700, color: BLUE }); d.text('LAWS in town', 715, 75, { size: 30, weight: 700, color: RED });
    [['🙋', 'Raise your hand'], ['🚶', 'Walk in the hall'], ['🧹', 'Clean up your space']].forEach(([e, s], i) => d.alpha(d.in(t, i * 0.4), () => { d.emoji(e, 100, 150 + i * 90, 56); d.text(s, 145, 150 + i * 90, { size: 26, weight: 700, align: 'left' }); }));
    [['🛑', 'Stop at stop signs'], ['🚸', 'Cross at crosswalks'], ['🚲', 'Wear a bike helmet']].forEach(([e, s], i) => d.alpha(d.in(t, 1.2 + i * 0.4), () => { d.emoji(e, 570, 150 + i * 90, 56); d.text(s, 615, 150 + i * 90, { size: 26, weight: 700, align: 'left' }); }));
    d.text('Rules and laws keep us SAFE and make things FAIR.', 480, 470, { size: 28, weight: 700, color: NAVY });
  },
  'ci-ssr'(d, t) {
    paper(d, '#f2f7ff', '#e2edff');
    const S = [['Be Safe', '🦺', ['walking feet', 'hands to yourself', 'pick up after yourself'], '#cfe6ff'], ['Be Kind', '💗', ['include others', 'use kind words', 'share and help'], '#ffd8e2'], ['Be Respectful', '👂', ['listen to others', 'raise your hand', 'care for supplies'], '#d8f5d0']];
    const on = Math.floor(t / 2) % 3;
    S.forEach(([n, e, L, bg], i) => {
      const x = 170 + i * 310;
      d.at(x, 240, 0, i === on ? 1.05 : 1, () => {
        d.poly([[-140, -200], [140, -200], [140, 60], [0, 200], [-140, 60]], { close: true, fill: bg, stroke: INK, lw: i === on ? 5 : 3 });
        d.emoji(e, 0, -140, 64);
        d.text(n, 0, -70, { size: 30, weight: 700 });
        L.forEach((s, j) => d.text('• ' + s, 0, -20 + j * 42, { size: 22 }));
      });
    });
    d.text('Good citizens are safe, kind and respectful.', 480, 505, { size: 28, weight: 700, color: RED });
  },
  'ci-vote'(d, t) {
    paper(d);
    d.text('Vote: what should we name the class fish? 🐠', 480, 45, { size: 30, weight: 700 });
    const N = [['Bubbles', 7, '#7fc4ff'], ['Captain Fin', 12, '#ffcf7a'], ['Goldie', 5, '#ffd8e2']], T = t % 9;
    N.forEach(([n, v, c], i) => {
      const y = 130 + i * 110, shown = Math.min(v, Math.floor(d.in(T, 0.5 + i * 0.3, 4) * v));
      panel(d, 40, y - 45, 880, 90, c);
      d.text(n, 160, y, { size: 30, weight: 700 });
      for (let k = 0; k < shown; k++) {
        const g = Math.floor(k / 5), m = k % 5, x = 320 + g * 110 + m * 18;
        if (m < 4) d.line(x, y - 28, x, y + 28, { lw: 5 }); else d.line(x - 80, y + 20, x - 4, y - 20, { lw: 5 });
      }
      d.text(String(shown), 860, y, { size: 36, weight: 700 });
    });
    d.alpha(d.in(T, 5), () => d.pill('🏆 Captain Fin wins! The choice with the most votes wins.', 480, 480, { size: 24, bg: YELLOW }));
  },
  'ci-leaders'(d, t) {
    d.bg('#f2f7ff', '#e2edff');
    const L = [['🏫', 'School', 'principal'], ['🏘️', 'Town or city', 'mayor'], ['🏞️', 'State', 'governor'], ['🇺🇸', 'Country', 'president']];
    L.forEach(([e, p, l], i) => {
      const x = 130 + i * 233, y = 420 - i * 90;
      d.alpha(d.in(t, i * 0.6), () => {
        d.rect(x - 105, y, 210, 540 - y, { r: 6, fill: ['#ffe08a', '#ffcf7a', '#ffb07a', '#ff8f8a'][i], stroke: INK, lw: 3 });
        d.emoji(e, x, y - 60, 70);
        d.text(p, x, y + 30, { size: 24, weight: 700 }); d.pill(l, x, y + 72, { size: 22 });
      });
    });
    d.text('Communities choose LEADERS to help make decisions.', 480, 40, { size: 28, weight: 700, color: RED });
  },
  // ----- families & traditions -----
  'ft-what'(d, t) {
    paper(d);
    const F = [[2, 1], [3, 2], [4, 3], [2, 4]];
    let n = 0;
    F.forEach(([size], i) => {
      const x = 130 + i * 233;
      panel(d, x - 105, 60, 210, 330, ['#ffe8f0', '#e8f3ff', '#e8f8e0', '#fff3d6'][i]);
      d.emoji('🏠', x, 120, 60);
      for (let k = 0; k < size; k++) { const s = k === 0 ? 1.15 : k % 2 ? 0.9 : 1.05; kid(d, x - (size - 1) * 30 + k * 60, 280 + (1 - s) * 30, s, n++); }
    });
    d.emoji('🐶', 790, 360, 40);
    d.text('Families come in all shapes and sizes.', 480, 460, { size: 32, weight: 700, color: RED });
  },
  'ft-why'(d, t) {
    d.bg('#2a2050', '#4a3a80');
    for (let i = 0; i < 40; i++) d.circle((i * 211) % 960, (i * 97) % 300, 1.5, { fill: 'rgba(255,255,255,.6)' });
    d.ellipse(480, 470, 360, 60, { fill: '#8a5a34', stroke: INK, lw: 3 });
    d.emoji('🔥', 480, 420 + Math.sin(t * 8) * 3, 80);
    for (let i = 0; i < 5; i++) { const a = Math.PI + i / 4 * Math.PI; kid(d, 480 + Math.cos(a) * 260, 420 + Math.sin(a) * 40 - 20, 1.1, i); }
    d.pill('Traditions connect us to our families and our past', 480, 70, { size: 24, bg: YELLOW });
    d.text('Learning about other traditions helps us respect each other.', 480, 140, { size: 24, weight: 700, color: '#fff' });
  },
  'ft-trad'(d, t) {
    paper(d, '#fff6e0', '#ffe8c0');
    const T = [['🎂', 'Birthdays'], ['🏮', 'Lunar New Year'], ['🕎', 'Hanukkah'], ['🪔', 'Diwali'], ['🦃', 'Thanksgiving'], ['🎄', 'Christmas'], ['🌙', 'Eid'], ['🎆', 'Fourth of July']];
    T.forEach(([e, s], i) => {
      const x = 120 + (i % 4) * 240, y = 120 + Math.floor(i / 4) * 200, bob = Math.sin(t * 2 + i) * 6;
      d.alpha(d.in(t, i * 0.25, 0.4), () => { d.circle(x, y + bob, 70, { fill: '#fff', stroke: RED, lw: 4 }); d.emoji(e, x, y + bob, 76); d.pill(s, x, y + 92, { size: 20 }); });
    });
    d.text('Traditions: special ways families celebrate, cook, sing and remember.', 480, 505, { size: 23, weight: 700, color: RED });
  },
  'ft-time'(d, t) {
    paper(d, '#f2f7ff', '#e2edff');
    const x0 = 80, x1 = 880, y = 290;
    d.line(x0, y, x1, y, { lw: 8 });
    const E = [['👶', 'Born', 'past'], ['🚶', 'First steps', 'past'], ['🎒', 'Started school', 'past'], ['✏️', '2nd grade!', 'present'], ['🎓', 'Graduate', 'future'], ['🚀', '???', 'future']];
    E.forEach(([e, s, w], i) => {
      const x = x0 + 40 + i * 145, col = w === 'past' ? BLUE : w === 'present' ? RED : GREEN;
      d.alpha(d.in(t, i * 0.5), () => { d.circle(x, y, 14, { fill: col, stroke: INK, lw: 3 }); d.emoji(e, x, y - 80, 64); d.text(s, x, y + 50, { size: 22, weight: 700 }); });
    });
    d.pill('PAST', 280, 420, { size: 28, bg: '#cfe6ff' }); d.pill('PRESENT', 555, 420, { size: 28, bg: '#ffd8d0' }); d.pill('FUTURE', 790, 420, { size: 28, bg: '#c8f0c0' });
    d.text('A TIMELINE shows events in the order they happened.', 480, 60, { size: 28, weight: 700, color: RED });
  },
  'ft-then'(d, t) {
    paper(d);
    d.text('THEN', 250, 45, { size: 36, color: '#8a5a34', font: "'Bungee', sans-serif" }); d.text('NOW', 710, 45, { size: 36, color: BLUE, font: "'Bungee', sans-serif" });
    const P = [['☎️', 'phone on the wall', '📱', 'phone in your pocket'], ['🕯️', 'candles for light', '💡', 'electric lights'], ['🐎', 'horses and wagons', '🚗', 'cars and buses'], ['✉️', 'letters by mail', '💻', 'email and video calls']];
    const on = Math.floor(t / 2) % P.length;
    P.forEach(([a, sa, b, sb], i) => {
      const y = 110 + i * 100, hi = i === on;
      d.rect(40, y - 42, 880, 84, { r: 14, fill: hi ? '#fff3b0' : '#fff', stroke: INK, lw: hi ? 4 : 2 });
      d.emoji(a, 100, y, 56); d.text(sa, 140, y, { size: 24, weight: 700, align: 'left' });
      d.arrow(420, y, 520, y, { color: RED, lw: 5, head: 16 });
      d.emoji(b, 570, y, 56); d.text(sb, 610, y, { size: 24, weight: 700, align: 'left' });
    });
    d.text('Life changes over time, but families still love and care for each other.', 480, 515, { size: 22, weight: 700, color: RED });
  },
  // ----- famous Americans -----
  'fa-what'(d, t) {
    d.bg('#f6efe4', '#eadbc4');
    const P = [['🎩', 'Leaders'], ['⚡', 'Inventors'], ['🕯️', 'Freedom fighters'], ['🎒', 'Brave kids']];
    P.forEach(([e, s], i) => {
      const x = 130 + i * 233, bob = Math.sin(t * 2 + i) * 5;
      d.rect(x - 95, 70 + bob, 190, 230, { r: 10, fill: '#c9971e', stroke: INK, lw: 3 });
      d.rect(x - 80, 85 + bob, 160, 160, { r: 6, fill: '#e8f3ff' });
      d.emoji(e, x, 165 + bob, 90);
      d.text(s, x, 272 + bob, { size: 22, weight: 700, color: '#fff', stroke: INK, lw: 5 });
    });
    flag(d, 420, 350, 120);
    d.text('Famous Americans made a difference with their ideas, courage and kindness.', 480, 495, { size: 23, weight: 700, color: NAVY });
  },
  'fa-why'(d, t) {
    paper(d, '#f2f7ff', '#e2edff');
    kid(d, 240, 300, 1.8, 3);
    d.emoji('💭', 380, 140, 80);
    d.rect(450, 60, 440, 300, { r: 22, fill: '#fff', stroke: INK, lw: 3 });
    const Q = ['brave', 'honest', 'curious', 'kind', 'hardworking'], i = Math.floor(t / 1.2) % Q.length;
    d.text('I can be…', 670, 130, { size: 34, weight: 700 });
    d.text(Q[i] + '!', 670, 220, { size: 56, weight: 700, color: RED });
    d.text('just like them', 670, 300, { size: 26, color: '#5a6f99' });
    d.text('Their stories show that anyone can make a difference.', 480, 470, { size: 28, weight: 700, color: NAVY });
  },
  'fa-lead'(d, t) {
    d.bg('#f6efe4', '#eadbc4');
    portrait(d, 210, 200, '🎖️', 'George Washington', '1732–1799', { bg: '#dde8f6' });
    portrait(d, 750, 200, '🎩', 'Abraham Lincoln', '1809–1865', { bg: '#e8e0f6' });
    d.alpha(d.in(t, 0.8), () => { d.pill('1st president', 210, 380, { size: 22, bg: YELLOW }); d.pill('on the $1 bill and the quarter', 210, 430, { size: 20 }); });
    d.alpha(d.in(t, 1.8), () => { d.pill('16th president', 750, 380, { size: 22, bg: YELLOW }); d.pill('on the penny and the $5 bill', 750, 430, { size: 20 }); });
    d.alpha(d.in(t, 2.6), () => { d.wrap('Washington led the army that won freedom from Britain. Lincoln kept the country together and worked to end slavery.', 480, 120, 300, { size: 22, weight: 700 }); });
    flag(d, 420, 380, 120);
  },
  'fa-franklin'(d, t) {
    d.bg('#3a4a6a', '#6a7a9a');
    for (let i = 0; i < 3; i++) d.emoji('☁️', 200 + i * 220, 70, 130);
    const flash = d.loop(t, 3) < 0.08;
    if (flash) d.poly([[520, 90], [490, 170], [520, 170], [480, 260]], { stroke: YELLOW, lw: 8 });
    const kx = 560 + Math.sin(t) * 20, ky = 190 + Math.cos(t * 1.3) * 10;
    d.poly([[kx, ky - 40], [kx + 30, ky], [kx, ky + 40], [kx - 30, ky]], { close: true, fill: '#ffcf7a', stroke: INK, lw: 3 });
    d.curve(kx, ky + 40, 420, 330, 300, 380, { color: '#fff', lw: 2, head: 0 });
    d.emoji('🔑', 380, 330, 30);
    d.person(270, 410, 1.6, { shirt: '#7a4a2a', skin: '#f1c7a0', hair: '#ddd' });
    d.alpha(flash ? 1 : 0.85, () => d.pill('Benjamin Franklin (1706–1790)', 680, 330, { size: 24, bg: YELLOW }));
    d.wrap('His kite experiment showed lightning is electricity. He invented the lightning rod and bifocal glasses, and helped start our country!', 700, 370, 480, { size: 21, weight: 700, color: '#fff' });
  },
  'fa-tubman'(d, t) {
    d.bg('#0b1638', '#1d2d60');
    for (let i = 0; i < 50; i++) d.circle((i * 211) % 960, (i * 97) % 300, 1.5, { fill: 'rgba(255,255,255,.7)' });
    d.emoji('⭐', 820, 60, 50 + Math.sin(t * 3) * 6); d.text('North Star', 820, 110, { size: 20, color: '#fff' });
    d.rect(0, 400, d.W, 140, { r: 0, fill: '#1d3a2a' });
    for (let i = 0; i < 6; i++) d.emoji('🌲', 60 + i * 170, 380, 90, { alpha: 0.6 });
    const k = d.loop(t, 8);
    for (let i = 0; i < 4; i++) d.person(100 + k * 600 - i * 50, 420, 1.1, { shirt: SHIRTS[i + 1], skin: SKINS[2 + (i % 3)], pants: '#2a2a3a' });
    d.emoji('🏠', 860, 440, 70); d.emoji('🕯️', 880, 410, 30);
    d.pill('Harriet Tubman (about 1822–1913)', 400, 60, { size: 24, bg: YELLOW });
    d.wrap('She escaped slavery, then bravely went back about 13 times to lead about 70 people to freedom on the Underground Railroad.', 400, 110, 600, { size: 22, weight: 700, color: '#fff' });
    d.pill('safe house', 860, 500, { size: 18 });
  },

// ---------- Game 1: Map Quest ----------
function mapGame(api) {
  const { root, board, sfx, d } = api;
  const COLS = 10, ROWS = 5, CS = 80, X0 = 30, Y0 = 70;
  // landmarks: [emoji, name, col, row]
  const L = { school: ['🏫', 'school', 1, 0], library: ['📚', 'library', 8, 0], park: ['🌳', 'park', 5, 2], pond: ['🦆', 'duck pond', 0, 4], store: ['🏪', 'store', 7, 4], fire: ['🚒', 'fire station', 9, 2], home: ['🏠', 'house', 2, 2], museum: ['🏛️', 'museum', 5, 0], bakery: ['🥐', 'bakery', 5, 4] };
  const TASKS = [
    ['Walk to the 🏫 school.', 'school'], ['Go to the 📚 library.', 'library'], ['Start at the 🏛️ museum in your head, then go two blocks SOUTH. Walk to what you find there!', 'park'],
    ['Go to the 🚒 fire station. It is on the EAST edge of town.', 'fire'], ['The 🥐 bakery is two blocks SOUTH of the 🌳 park. Go there!', 'bakery'], ['Go to the place in the SOUTHWEST corner of the map.', 'pond'],
  ];
  let ti = 0, pos = [0, 2], from = null, mv = 1, steps = 0, score = 0, perfect = 0, done = false, t = 0, cheer = 0, trail = [];
  root.innerHTML = `<div class="hud"><span id="mq-n"></span><span>👣 <b id="mq-st">0</b> steps</span><span>🏆 <b id="mq-s">0</b></span></div>
    <p id="mq-q" style="font-weight:600;margin:4px auto"></p>
    <canvas class="board" id="mq-cv" style="width:min(100%, calc((100vh - 400px) * 16 / 9))"></canvas>
    <div class="pad"><button data-m="-1,0">⬅️ West</button><button data-m="0,-1">⬆️ North</button><button data-m="0,1">⬇️ South</button><button data-m="1,0">East ➡️</button></div>`;
  const draw = board(api.$('mq-cv'));
  root.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => { const [dx, dy] = b.dataset.m.split(',').map(Number); step(dx, dy); }));
  const target = () => L[TASKS[ti][1]];
  const shortest = () => Math.abs(target()[2] - pos[0]) + Math.abs(target()[3] - pos[1]);
  let best = 0;
  function task() {
    api.$('mq-n').textContent = `Trip ${ti + 1} of ${TASKS.length}`;
    api.$('mq-q').textContent = '🧭 ' + TASKS[ti][0];
    steps = 0; best = shortest(); trail = [pos.slice()];
    api.$('mq-st').textContent = 0;
  }
  function step(dx, dy) {
    if (done || mv < 1 || cheer > 0) return;
    RB.audio();
    const nx = pos[0] + dx, ny = pos[1] + dy;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { sfx.wrong(); return; }
    from = pos.slice(); pos = [nx, ny]; mv = 0; steps++; sfx.pop();
    trail.push(pos.slice());
    api.$('mq-st').textContent = steps;
    if (nx === target()[2] && ny === target()[3]) {
      sfx.right(); cheer = 1.2;
      const extra = steps - best, pts = extra === 0 ? 150 : extra <= 4 ? 100 : 50;
      score += pts; if (!extra) perfect++;
      api.$('mq-s').textContent = score;
    }
  }
  function next() {
    ti++;
    if (ti === TASKS.length) {
      done = true;
      api.done({ score, stars: score >= 800 ? 3 : score >= 550 ? 2 : 1, rows: [['🗺️ Trips taken', TASKS.length], ['🧭 Shortest way', `${perfect} of ${TASKS.length}`]],
        hint: 'Take the shortest way on most trips for ★★★' });
      return;
    }
    task();
  }
  const cell = (c, r) => [X0 + c * CS + CS / 2, Y0 + r * CS + CS / 2];
  function render() {
    if (done) return;
    draw(() => {
      d.bg('#f2f7ff', '#e2edff');
      d.rect(X0, Y0, COLS * CS, ROWS * CS, { r: 8, fill: LAND, stroke: INK, lw: 3 });
      for (let c = 1; c < COLS; c++) d.line(X0 + c * CS, Y0, X0 + c * CS, Y0 + ROWS * CS, { stroke: 'rgba(20,37,77,.15)', lw: 2 });
      for (let r = 1; r < ROWS; r++) d.line(X0, Y0 + r * CS, X0 + COLS * CS, Y0 + r * CS, { stroke: 'rgba(20,37,77,.15)', lw: 2 });
      const tg = target();
      Object.values(L).forEach(([e, , c, r]) => {
        const [x, y] = cell(c, r);
        if (e === tg[0]) d.circle(x, y, 36 + Math.sin(t * 5) * 3, { fill: 'rgba(255,216,74,.55)' });
        d.emoji(e, x, y, 52);
      });
      d.poly(trail.map(([c, r]) => cell(c, r)), { stroke: 'rgba(214,60,74,.6)', lw: 6, dash: [8, 8] });
      const [px, py] = from && mv < 1 ? cell(d.lerp(from[0], pos[0], mv), d.lerp(from[1], pos[1], mv)) : cell(pos[0], pos[1]);
      d.circle(px, py + 22, 16, { fill: 'rgba(0,0,0,.15)' });
      d.emoji('🤖', px, py - Math.abs(Math.sin(mv * Math.PI)) * 12, 50);
      compass(d, 895, 175, 38);
      d.text('N is up!', 895, 270, { size: 20, weight: 700, color: RED });
      d.text(`Fewest steps: ${best}`, 895, 330, { size: 18, weight: 700, color: '#5a6f99', maxW: 120 });
      d.text('MAP OF RIVERTOWN', X0 + COLS * CS / 2, 40, { size: 26, color: NAVY, font: "'Bungee', sans-serif" });
      if (cheer > 0) d.text('You made it! 🎉', X0 + COLS * CS / 2, 270 - (1.2 - cheer) * 30, { size: 52, weight: 700, color: GREEN, stroke: '#fff', lw: 8, alpha: Math.min(1, cheer) });
    });
  }
  task(); render();
  return {
    tick(dt) {
      t += dt;
      if (mv < 1) mv = Math.min(1, mv + dt / 0.22);
      if (cheer > 0) { cheer -= dt; if (cheer <= 0) { cheer = 0; next(); } }
      render();
    },
    key(k, e) {
      const m = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
      if (m) { if (e) e.preventDefault(); step(...m); }
    },
    bot() {
      if (cheer > 0) { this.tick(1.3); return; }
      if (mv < 1) this.tick(0.3);
      const tg = target(), dx = Math.sign(tg[2] - pos[0]), dy = Math.sign(tg[3] - pos[1]);
      if (dx) step(dx, 0); else if (dy) step(0, dy);
    },
  };
}

function marketGame(api) {
  const { root, board, sfx, shuffle, d } = api;
  // [picture, question, right answer, wrong answer, why]
  const Q = shuffle([
    ['🍞', 'A baker makes bread to sell. The baker is a…', 'Producer', 'Consumer', 'Producers make or grow things.'],
    ['🛒', 'You buy apples at the store. You are a…', 'Consumer', 'Producer', 'Consumers buy and use things.'],
    ['💇', 'A haircut is a…', 'Service', 'Good', 'A service is work someone does for you.'],
    ['🧸', 'A teddy bear is a…', 'Good', 'Service', 'Goods are things you can touch.'],
    ['💧', 'Water to drink is a…', 'Need', 'Want', 'We need water to live.'],
    ['🎮', 'A new video game is a…', 'Want', 'Need', 'It\'s fun, but we can live without it.'],
    ['🧑‍⚕️', 'A doctor checking your ears is a…', 'Service', 'Good', 'The doctor does work for you.'],
    ['🧑‍🌾', 'A farmer grows corn. The farmer is a…', 'Producer', 'Consumer', 'Growing food makes the farmer a producer.'],
    ['🧥', 'A warm coat in winter is a…', 'Need', 'Want', 'Clothes to stay warm are a need.'],
    ['🍭', 'A giant lollipop is a…', 'Want', 'Need', 'Candy is a treat, not a need.'],
  ]);
  let qi = 0, score = 0, firstTry = 0, miss = 0, done = false, t = 0, coins = 0, wait = 0, opts = [];
  root.innerHTML = `<div class="hud"><span id="md-n"></span><span>🏆 <b id="md-s">0</b></span></div>
    <canvas class="board" id="md-cv"></canvas>
    <p id="md-q" style="font-weight:700;font-size:22px;margin:4px auto"></p><div class="choices" id="md-c"></div><p id="md-why" style="font-size:18px;color:var(--soft);margin:4px auto"></p>`;
  const draw = board(api.$('md-cv'));
  function ask() {
    const [, q, right, wrong] = Q[qi];
    opts = shuffle([right, wrong]);
    api.$('md-n').textContent = `Card ${qi + 1} of ${Q.length}`;
    api.$('md-q').textContent = q;
    api.$('md-c').innerHTML = opts.map((o, k) => `<button class="ans" data-k="${k}" style="font-size:24px">${o}</button>`).join('');
    api.$('md-c').querySelectorAll('.ans').forEach(b => b.addEventListener('click', () => pick(+b.dataset.k)));
    miss = 0;
  }
  function pick(k) {
    if (done || wait > 0) return;
    RB.audio();
    const b = api.$('md-c').children[k];
    if (opts[k] !== Q[qi][2]) { sfx.wrong(); miss++; b.disabled = true; b.classList.add('wrong', 'shake'); return; }
    sfx.right(); b.classList.add('right');
    if (!miss) { score += 100; firstTry++; coins++; } else score += 50;
    api.$('md-s').textContent = score;
    api.$('md-why').textContent = '✅ ' + Q[qi][4];
    wait = 0.9;
  }
  function next() {
    qi++;
    if (qi === Q.length) {
      done = true;
      api.done({ score, stars: firstTry >= 8 ? 3 : firstTry >= 5 ? 2 : 1, rows: [['🛒 Cards answered', Q.length], ['🪙 Right on the first try', `${firstTry} of ${Q.length}`]],
        hint: 'Get 8 or more right on the first try for ★★★' });
      return;
    }
    ask();
  }
  function render() {
    if (done) return;
    draw(() => {
      d.bg('#fff6e0', '#ffe8c0');
      d.rect(140, 60, 680, 60, { r: 0, fill: RED });
      for (let i = 0; i < 9; i++) d.rect(140 + i * 76, 60, 38, 60, { r: 0, fill: '#fff' });
      d.text('MARKET DAY', 480, 92, { size: 32, color: INK, font: "'Bungee', sans-serif", stroke: '#fff', lw: 6 });
      d.rect(160, 120, 640, 280, { r: 0, fill: '#fffdf6', stroke: INK, lw: 3 });
      d.rect(140, 400, 680, 60, { r: 6, fill: '#a86a34', stroke: INK, lw: 3 });
      d.circle(480, 260, 110, { fill: '#fff', stroke: RED, lw: 5 });
      d.emoji(Q[qi][0], 480, 260 + Math.sin(t * 2) * 6, 130);
      for (let i = 0; i < coins; i++) d.emoji('🪙', 200 + (i % 5) * 36, 380 - Math.floor(i / 5) * 22, 36);
      d.text('tip jar', 270, 470, { size: 18, weight: 700, color: '#fff' });
      if (wait > 0) d.text('⭐', 480 + Math.cos(t * 6) * 150, 260 + Math.sin(t * 6) * 120, { size: 40 });
    });
  }
  ask(); render();
  return {
    tick(dt) { t += dt; if (wait > 0) { wait -= dt; if (wait <= 0) { api.$('md-why').textContent = ''; next(); } } render(); },
    key(k) { const n = '12'.indexOf(k); if (n >= 0) pick(n); },
    bot() { if (wait > 0) { this.tick(1); return; } if (!done) pick(opts.indexOf(Q[qi][2])); },
  };
}
