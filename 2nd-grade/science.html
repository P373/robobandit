<script>
'use strict';
const INK = '#14254d', TEAL = '#1f9a7a', BLUE = '#3d8ff0', GREEN = '#2fae5a', ORANGE = '#f08a24', PINK = '#e8457a', YELLOW = '#ffd84a', BROWN = '#8a5a34', RED = '#e8453a', SAND = '#e8c88a';

// ---------- Drawing helpers ----------
const sky = (d, a = '#9fd6ff', b = '#e6f6ff') => d.bg(a, b);
function hill(d, x, y, w, h, col = '#7cc45a') {
  d.ctx.beginPath(); d.ctx.moveTo(x - w / 2, y);
  d.ctx.quadraticCurveTo(x, y - h * 2, x + w / 2, y); d.ctx.closePath();
  d.paint({ fill: col, stroke: 'rgba(20,37,77,.4)', lw: 2 });
}
function mountain(d, x, y, w, h, snow = true) {
  d.poly([[x - w / 2, y], [x, y - h], [x + w / 2, y]], { close: true, fill: '#9aa3b5', stroke: '#5a6378', lw: 3 });
  if (snow) d.poly([[x - w * 0.12, y - h * 0.76], [x, y - h], [x + w * 0.12, y - h * 0.76], [x + w * 0.04, y - h * 0.7], [x - w * 0.04, y - h * 0.78]], { close: true, fill: '#fff', stroke: '#fff', lw: 1 });
}
function rain(d, t, x0, x1, y0, y1, n = 30, col = '#3d8ff0') {
  for (let i = 0; i < n; i++) {
    const x = x0 + ((i * 97) % (x1 - x0)), y = y0 + ((i * 53 + t * 420) % (y1 - y0));
    d.line(x, y, x - 5, y + 16, { stroke: col, lw: 3 });
  }
}
// a box of particles: 'solid' (packed, wiggling), 'liquid' (sliding past each other) or 'gas' (zooming apart)
function particles(d, kind, x, y, w, h, t, col) {
  d.rect(x, y, w, h, { r: 14, fill: '#fff', stroke: INK, lw: 3 });
  const r = 13;
  if (kind === 'solid') for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++)
    d.circle(x + w / 2 - 2 * 2 * r - 4 + i * (2 * r + 2) + Math.sin(t * 20 + i + j) * 1.5, y + h - 20 - r - j * (2 * r + 2) + Math.cos(t * 23 + i * j) * 1.5, r, { fill: col, stroke: INK, lw: 2 });
  if (kind === 'liquid') for (let i = 0; i < 16; i++) {
    const a = t * 0.8 + i * 1.7, px = x + 30 + ((i * 37 + Math.sin(a) * 30 + t * 30) % (w - 60) + (w - 60)) % (w - 60), py = y + h - 24 - (i % 3) * 26 - Math.abs(Math.sin(a)) * 6;
    d.circle(px, py, r, { fill: col, stroke: INK, lw: 2 });
  }
  if (kind === 'gas') for (let i = 0; i < 8; i++) {
    const bx = (i * 131 + t * (90 + i * 13)) % (2 * (w - 2 * r)), by = (i * 71 + t * (70 + i * 17)) % (2 * (h - 2 * r));
    d.circle(x + r + (bx > w - 2 * r ? 2 * (w - 2 * r) - bx : bx), y + r + (by > h - 2 * r ? 2 * (h - 2 * r) - by : by), r, { fill: col, stroke: INK, lw: 2 });
  }
}
function thermo(d, x, y, k) {
  d.rect(x - 14, y - 150, 28, 160, { r: 14, fill: '#fff', stroke: INK, lw: 3 });
  d.circle(x, y + 16, 24, { fill: RED, stroke: INK, lw: 3 });
  d.rect(x - 7, y - 140 * k, 14, 140 * k + 10, { r: 7, fill: RED });
}
const panel = (d, x, y, w, h, fill = '#fff', lw = 3) => d.rect(x, y, w, h, { r: 18, fill, stroke: INK, lw });

// ---------- The pictures ----------
const DIAGRAMS = {
  // ----- erosion & landforms -----
  'er-what'(d, t) {
    sky(d, '#8fa8c8', '#d6e4f2');
    for (let i = 0; i < 3; i++) d.emoji('☁️', 140 + i * 260, 60, 110);
    rain(d, t, 40, 700, 80, 380);
    d.poly([[0, 540], [0, 180], [180, 160], [420, 330], [620, 470], [960, 470], [960, 540]], { close: true, fill: '#b88a5a', stroke: '#7a5a3a', lw: 3 });
    d.rect(0, 470, d.W, 70, { r: 0, fill: '#5ab0e8' });
    for (let i = 0; i < 14; i++) {
      const k = d.loop(t * 0.35 + i / 14, 1), x = d.lerp(120, 760, k), y = k < 0.7 ? d.lerp(175, 465, k / 0.7) : 465 + (k - 0.7) * 40;
      d.circle(x, y, 7, { fill: '#7a5a3a', stroke: INK, lw: 1.5 });
    }
    d.pill('rain loosens bits of rock and soil', 280, 120, { size: 22 });
    d.pill('water carries them away', 640, 380, { size: 22, bg: '#cfe6ff' });
    d.alpha(d.in(t, 2), () => d.pill('EROSION = moving rock and soil to a new place', 480, 505, { size: 26, bg: YELLOW }));
  },
  'er-why'(d, t) {
    sky(d);
    d.rect(560, 380, 400, 160, { r: 0, fill: '#5ab0e8' });
    d.poly([[0, 540], [0, 300], [500, 300], [560, 380], [520, 540]], { close: true, fill: '#c9a06a', stroke: '#7a5a3a', lw: 3 });
    d.rect(0, 290, 500, 14, { r: 0, fill: '#6dbb5c' });
    const k = d.loop(t, 4);
    for (let i = 0; i < 6; i++) { const f = (k + i / 6) % 1; d.circle(530 + f * 40 + i * 4, 320 + f * 200, 8 - f * 3, { fill: '#a8804a', stroke: INK, lw: 1.5 }); }
    d.emoji('🏠', 430, 250, 90);
    d.emoji('🌊', 700 + Math.sin(t * 2) * 20, 420, 70);
    d.pill('Waves wear away the cliff…', 760, 120, { size: 24 });
    d.pill('…and the house gets closer to the edge!', 720, 180, { size: 24, bg: '#ffd8d0' });
    d.text('Knowing about erosion helps us protect land, homes and farms.', 480, 40, { size: 26, weight: 700, color: TEAL });
  },
  'er-land'(d, t) {
    sky(d, '#bfe6ff', '#eaf7ff');
    mountain(d, 170, 330, 300, 240); mountain(d, 330, 330, 220, 170);
    hill(d, 560, 340, 220, 60);
    d.rect(0, 330, d.W, 210, { r: 0, fill: '#8bd06a' });
    d.poly([[400, 330], [460, 330], [520, 540], [380, 540]], { close: true, fill: '#5ab0e8' });
    d.ellipse(760, 440, 140, 50, { fill: '#5ab0e8', stroke: '#2f7fc8', lw: 3 });
    d.ellipse(760, 440, 40, 16, { fill: SAND }); d.emoji('🌴', 760, 412, 40);
    d.poly([[860, 330], [960, 330], [960, 540], [900, 540], [880, 420]], { close: true, fill: '#c9805a', stroke: '#7a4a2a', lw: 3 });
    const L = [['mountain', 170, 70], ['valley', 255, 300], ['hill', 560, 250], ['plain', 220, 420], ['river', 450, 500], ['lake', 660, 390], ['island', 760, 500], ['canyon', 900, 300]];
    L.forEach(([s, x, y], i) => d.alpha(d.in(t, 0.3 + i * 0.4), () => d.pill(s, x, y, { size: 24 })));
  },
  'er-agents'(d, t) {
    d.bg('#f2fbf8', '#dff4ee');
    // water
    panel(d, 20, 30, 300, 400, '#eaf6ff');
    d.poly([[23, 200], [130, 200], [150, 400], [190, 400], [210, 200], [317, 200], [317, 427], [23, 427]], { close: true, fill: '#c9805a', stroke: '#7a4a2a', lw: 3 });
    d.rect(150, 380, 40, 20, { r: 0, fill: '#3d8ff0' });
    for (let i = 0; i < 4; i++) d.line(170, 200 + ((t * 80 + i * 50) % 180), 170, 220 + ((t * 80 + i * 50) % 180), { stroke: '#3d8ff0', lw: 6 });
    d.text('💧 Water', 170, 70, { size: 30, weight: 700, color: BLUE }); d.text('carves canyons', 170, 110, { size: 22 });
    // wind
    panel(d, 330, 30, 300, 400, '#fff8e6');
    for (let i = 0; i < 3; i++) hill(d, 400 + i * 90, 427, 160, 40 + i * 10, SAND);
    for (let i = 0; i < 10; i++) { const x = 340 + ((t * 160 + i * 47) % 280); d.circle(x, 300 + (i * 23) % 80, 3, { fill: '#c9a060' }); }
    d.emoji('🌬️', 400 + Math.sin(t) * 10, 210, 70);
    d.text('🌬️ Wind', 480, 70, { size: 30, weight: 700, color: ORANGE }); d.text('blows sand into dunes', 480, 110, { size: 22 });
    // ice
    panel(d, 640, 30, 300, 400, '#f2f8ff');
    d.poly([[643, 427], [643, 180], [720, 300], [860, 300], [937, 180], [937, 427]], { close: true, fill: '#9aa3b5', stroke: '#5a6378', lw: 3 });
    d.poly([[700, 160], [880, 160], [860, 300 - Math.sin(t) * 6], [720, 300 - Math.sin(t) * 6]], { close: true, fill: '#dff2ff', stroke: '#7fb8e0', lw: 3 });
    d.text('🧊 Ice', 790, 70, { size: 30, weight: 700, color: '#2f7fc8' }); d.text('glaciers scrape valleys', 790, 110, { size: 22 });
    d.text('Water, wind and ice all move rock and soil.', 480, 485, { size: 28, weight: 700, color: TEAL });
  },
  'er-fast'(d, t) {
    d.bg('#fffaf0', '#fff1d6');
    panel(d, 20, 30, 450, 400, '#fff');
    d.text('SLOW 🐢', 245, 70, { size: 34, weight: 700, color: TEAL });
    const k = d.loop(t, 6), deep = 40 + k * 200;
    d.rect(40, 110, 410, 300, { r: 0, fill: '#c9805a' });
    d.poly([[200, 110], [290, 110], [260, 110 + deep], [230, 110 + deep]], { close: true, fill: '#bfe6ff' });
    d.rect(232, 100 + deep, 26, 12, { r: 3, fill: '#3d8ff0' });
    d.pill(`${Math.round(k * 6)} million years`, 245, 390, { size: 24, bg: YELLOW });
    panel(d, 490, 30, 450, 400, '#fff');
    d.text('FAST ⚡', 715, 70, { size: 34, weight: 700, color: RED });
    const f = d.loop(t, 3);
    d.poly([[510, 410], [510, 140], [700, 140], [920, 410]], { close: true, fill: '#8bd06a', stroke: '#4a8a3a', lw: 3 });
    for (let i = 0; i < 8; i++) d.circle(560 + i * 20 + f * 250, 170 + i * 6 + f * 200, 14, { fill: '#a8804a', stroke: INK, lw: 2 });
    d.pill('landslide: in minutes!', 715, 390, { size: 24, bg: '#ffd8d0' });
    d.text('Some changes take millions of years. Some happen in a flash!', 480, 485, { size: 26, weight: 700, color: TEAL });
  },
  'er-stop'(d, t) {
    sky(d, '#8fa8c8', '#d6e4f2');
    rain(d, t, 0, 960, 0, 300, 40);
    const side = (x, plants) => {
      d.poly([[x, 440], [x + 120, 220], [x + 300, 220], [x + 420, 440]], { close: true, fill: '#b88a5a', stroke: '#7a5a3a', lw: 3 });
      if (plants) {
        for (let i = 0; i < 9; i++) { const px = x + 40 + i * 42, py = px < x + 120 ? 440 - (px - x) * 1.83 : px > x + 300 ? 220 + (px - x - 300) * 1.83 : 220; d.emoji('🌱', px, py - 10, 34); }
        for (let i = 0; i < 6; i++) d.line(x + 80 + i * 50, 260, x + 70 + i * 50, 330, { stroke: '#e8d2a8', lw: 3 });
      } else for (let i = 0; i < 10; i++) { const k = d.loop(t * 0.5 + i / 10, 1); d.circle(x + 110 + (i % 2) * 220 + (i % 2 ? 1 : -1) * k * 100, 240 + k * 200, 6, { fill: '#7a5a3a' }); }
      d.rect(x - 10, 440, 440, 100, { r: 0, fill: plants ? '#8bd06a' : '#a8804a' });
    };
    side(30, false); side(510, true);
    d.pill('bare soil washes away 😟', 240, 480, { size: 22, bg: '#ffd8d0' });
    d.pill('roots hold the soil 😀', 720, 480, { size: 22, bg: '#c8f0c0' });
    d.pill('Plants, walls and fences can slow erosion', 480, 40, { size: 24, bg: YELLOW });
  },
  // ----- states of matter -----
  'sm-what'(d, t) {
    d.bg('#f2fbf8', '#dff4ee');
    const S = [['Solid', '🪨', 'keeps its own shape', '#ffd8b8'], ['Liquid', '🥛', 'flows and takes the shape of its container', '#cfe6ff'], ['Gas', '🎈', 'spreads out to fill any space', '#e6dcff']];
    S.forEach(([n, e, s, bg], i) => d.alpha(d.in(t, i * 0.9), () => {
      const x = 170 + i * 310;
      panel(d, x - 145, 40, 290, 380, bg);
      d.text(n, x, 90, { size: 40, weight: 700, color: TEAL });
      d.emoji(e, x, 210 + Math.sin(t * 2 + i) * 6, 110);
      d.wrap(s, x, 300, 250, { size: 24, weight: 700 });
    }));
    d.text('MATTER is anything that takes up space.', 480, 485, { size: 30, weight: 700, color: TEAL });
  },
  'sm-why'(d, t) {
    sky(d, '#a8c8e8', '#e6f0ff');
    rain(d, t, 0, 960, 0, 540, 30, '#7fb8ff');
    const I = [['🧥', 'raincoat', 'waterproof plastic keeps you dry'], ['🪟', 'window', 'clear glass lets light in'], ['🛏️', 'pillow', 'soft and squishy for sleeping'], ['🔨', 'hammer', 'hard metal for banging nails']];
    I.forEach(([e, n, s], i) => {
      const x = 125 + i * 237, on = Math.floor(t / 1.5) % 4 === i;
      panel(d, x - 108, 60, 216, 330, on ? '#fff3b0' : '#fff', on ? 5 : 3);
      d.emoji(e, x, 150, 90); d.text(n, x, 240, { size: 28, weight: 700 });
      d.wrap(s, x, 275, 190, { size: 21 });
    });
    d.pill('We pick materials that are right for the job!', 480, 470, { size: 26, bg: YELLOW });
  },
  'sm-parts'(d, t) {
    d.bg('#f2fbf8', '#dff4ee');
    particles(d, 'solid', 30, 80, 280, 280, t, '#ff9f6a');
    particles(d, 'liquid', 340, 80, 280, 280, t, '#7fc4ff');
    particles(d, 'gas', 650, 80, 280, 280, t, '#c9b3ff');
    [['Solid', 'packed tight, just wiggle'], ['Liquid', 'close, but slide around'], ['Gas', 'far apart, zooming!']].forEach(([n, s], i) => {
      d.text(n, 170 + i * 310, 50, { size: 32, weight: 700, color: TEAL });
      d.pill(s, 170 + i * 310, 400, { size: 22 });
    });
    d.text('Everything is made of tiny pieces called particles.', 480, 485, { size: 28, weight: 700 });
  },
  'sm-props'(d, t) {
    d.bg('#fffaf0', '#fff1d6');
    const P = [['🧸', 'soft'], ['🪨', 'hard'], ['🥨', 'rough'], ['🪀', 'bendy?'], ['🧊', 'cold'], ['🪵', 'floats'], ['🔑', 'sinks'], ['🔦', 'shiny']];
    P.forEach(([e, s], i) => {
      const x = 120 + (i % 4) * 240, y = 120 + Math.floor(i / 4) * 200, k = d.in(t, 0.2 + i * 0.3, 0.4);
      d.alpha(k, () => { d.circle(x, y, 70, { fill: '#fff', stroke: INK, lw: 3 }); d.emoji(e, x, y, 76); d.pill(s, x, y + 90, { size: 24, bg: YELLOW }); });
    });
    d.text('PROPERTIES describe matter: how it looks, feels and acts.', 480, 505, { size: 26, weight: 700, color: TEAL });
  },
  'sm-heat'(d, t) {
    d.bg('#f2f8ff', '#e2edff');
    const T = t % 12, k = T < 6 ? T / 6 : (12 - T) / 6;
    thermo(d, 870, 330, k);
    d.text(T < 6 ? 'heating 🔥' : 'cooling ❄️', 870, 400, { size: 26, weight: 700, color: T < 6 ? RED : BLUE });
    // a pot: ice cube melts into water, then steam rises
    d.rect(250, 260, 340, 170, { r: 10, fill: '#cfd5de', stroke: INK, lw: 4 });
    d.rect(220, 250, 400, 22, { r: 8, fill: '#9aa3b5', stroke: INK, lw: 3 });
    const ice = Math.max(0, 1 - k * 2.5), water = Math.min(1, k * 2.5) * (1 - Math.max(0, k - 0.6) * 1.5);
    if (water > 0) d.rect(256, 425 - 110 * water, 328, 110 * water, { r: 6, fill: 'rgba(61,143,240,.6)' });
    if (ice > 0) d.rect(370 - 40 * ice, 420 - 100 * ice, 100 * ice, 100 * ice, { r: 10, fill: '#dff6ff', stroke: '#7fb8e0', lw: 3 });
    if (k > 0.6) for (let i = 0; i < 6; i++) { const f = d.loop(t * 0.6 + i / 6, 1); d.emoji('💨', 300 + i * 50 + Math.sin(f * 6) * 10, 230 - f * 180, 40, { alpha: (k - 0.6) * 2.5 * (1 - f) }); }
    if (T < 6) d.emoji('🔥', 420, 470, 60);
    d.pill(k < 0.35 ? 'SOLID ice' : k < 0.6 ? 'LIQUID water' : 'GAS: water vapor (steam)', 420, 60, { size: 28, bg: YELLOW });
    d.text('Heat it: solid → liquid → gas.  Cool it: back again!', 480, 505, { size: 26, weight: 700, color: TEAL });
  },
  'sm-undo'(d, t) {
    d.bg('#fffaf0', '#fff1d6');
    panel(d, 20, 30, 450, 400, '#e6f6ea');
    d.text('Can be undone ↔️', 245, 75, { size: 30, weight: 700, color: GREEN });
    const k = (Math.sin(t * 1.5) + 1) / 2;
    d.emoji('🍫', 245, 200, 100, { alpha: 1 - k });
    d.ellipse(245, 240, 80 * k, 18 * k, { fill: '#7a4a2a' });
    d.wrap('Chocolate melts when warm and gets hard again when cool.', 245, 300, 400, { size: 24 });
    panel(d, 490, 30, 450, 400, '#ffece6');
    d.text('Can\'t be undone ➡️', 715, 75, { size: 30, weight: 700, color: RED });
    const f = d.in(t % 6, 1, 1.5);
    d.emoji('🥚', 620, 190, 80); d.arrow(670, 190, 740, 190, { color: RED });
    d.emoji('🍳', 810, 190, 90 * f + 1);
    d.emoji('🍞', 620, 270, 60); d.arrow(670, 270, 740, 270, { color: RED });
    d.at(810, 270, 0, f, () => { d.rect(-30, -30, 60, 60, { r: 10, fill: '#a8641a', stroke: INK, lw: 2 }); });
    d.wrap('A cooked egg or toast can never turn back!', 715, 330, 400, { size: 24 });
    d.text('Heating and cooling can change matter.', 480, 485, { size: 28, weight: 700, color: TEAL });
  },
  // ----- habitats & adaptations -----
  'hb-what'(d, t) {
    sky(d); d.rect(0, 330, d.W, 210, { r: 0, fill: '#8bd06a' });
    d.ellipse(480, 420, 300, 80, { fill: '#5ab0e8', stroke: '#2f7fc8', lw: 3 });
    d.emoji('🐸', 300, 380 - Math.abs(Math.sin(t * 2)) * 40, 60); d.emoji('🦆', 520 + Math.sin(t) * 60, 400, 60, { flip: Math.cos(t) < 0 });
    d.emoji('🐟', 600 + Math.sin(t * 1.4) * 60, 450, 40); d.emoji('🪷', 400, 430, 40); d.emoji('🌾', 160, 330, 70); d.emoji('🌾', 820, 330, 70); d.emoji('🐞', 140, 300, 30);
    const N = [['🍃 food', 140, 80], ['💧 water', 380, 80], ['🏠 shelter', 600, 80], ['↔️ space', 820, 80]];
    N.forEach(([s, x, y], i) => d.alpha(d.in(t, 0.5 + i * 0.6), () => d.pill(s, x, y, { size: 26, bg: YELLOW })));
    d.alpha(d.in(t, 3), () => d.text('A pond habitat', 480, 170, { size: 34, weight: 700, color: TEAL }));
  },
  'hb-why'(d, t) {
    d.bg('#f2fbf8', '#dff4ee');
    d.emoji('🐼', 250, 230, 160); d.emoji('🎋', 380, 220, 120);
    d.wrap('Pandas eat almost only bamboo. If the bamboo forest is cut down, pandas can\'t find food!', 700, 120, 440, { size: 26, weight: 700 });
    d.alpha(d.in(t, 1.5), () => d.pill('Living things need their habitats to survive', 480, 420, { size: 28, bg: YELLOW }));
    d.alpha(d.in(t, 2.5), () => d.text('Protecting habitats protects animals and plants. 💚', 480, 490, { size: 26, weight: 700, color: TEAL }));
  },

// ---------- Shared bits for the two choice games ----------
function choiceGame(api, o) {
  const { root, board, sfx, shuffle } = api;
  const list = shuffle(o.items);
  let i = 0, score = 0, firstTry = 0, miss = 0, done = false, t = 0, move = 0;
  root.innerHTML = `<div class="hud"><span id="cg-n"></span><span>🏆 <b id="cg-s">0</b></span></div>
    <canvas class="board" id="cg-cv"></canvas>
    <p id="cg-q" style="font-weight:600;margin:4px auto"></p><div class="choices" id="cg-c"></div><p id="cg-why" style="font-size:18px;color:var(--soft);margin:4px auto"></p>`;
  const draw = board(api.$('cg-cv'));
  api.$('cg-c').innerHTML = o.bins.map((b, k) => `<button class="ans" data-k="${k}"${o.bins.length > 3 ? ' style="flex-basis:170px"' : ''}>${b.icon} ${api.esc(b.name)}</button>`).join('');
  api.$('cg-c').querySelectorAll('.ans').forEach(b => b.addEventListener('click', () => pick(+b.dataset.k)));
  function ask() {
    api.$('cg-n').textContent = `${o.noun} ${i + 1} of ${list.length}`;
    api.$('cg-q').textContent = o.question(list[i]);
    api.$('cg-c').querySelectorAll('.ans').forEach(b => { b.disabled = false; b.classList.remove('wrong', 'shake', 'right'); });
    miss = 0; move = 0;
  }
  function pick(k) {
    if (done || move > 0) return;
    RB.audio();
    const b = api.$('cg-c').children[k];
    if (k !== list[i].bin) { sfx.wrong(); miss++; b.disabled = true; b.classList.add('wrong', 'shake'); return; }
    sfx.right(); b.classList.add('right');
    if (!miss) { score += 100; firstTry++; } else score += 50;
    api.$('cg-s').textContent = score;
    api.$('cg-why').textContent = '✅ ' + list[i].why;
    move = 0.01;
  }
  function next() {
    o.placed(list[i]);
    i++;
    if (i === list.length) {
      done = true;
      api.done({ score, stars: firstTry >= list.length - 2 ? 3 : firstTry >= list.length / 2 ? 2 : 1, rows: [[o.doneRow, list.length], ['✅ Right on the first try', `${firstTry} of ${list.length}`]],
        hint: `Get ${list.length - 2} or more right on the first try for ★★★` });
      return;
    }
    ask();
  }
  ask();
  return {
    tick(dt) { t += dt; if (move > 0) { move += dt; if (move > 1) next(); } if (!done) draw(d => o.render(d, list[i], Math.min(1, move), t)); },
    key(k) { const n = '1234'.indexOf(k); if (n >= 0 && n < o.bins.length) pick(n); },
    bot() { if (move > 0) { this.tick(1.05); return; } if (!done) pick(list[i].bin); },
  };
}

function matterGame(api) {
  const BINS = [{ name: 'Solid', icon: '🧱', col: '#ffd8b8' }, { name: 'Liquid', icon: '💧', col: '#cfe6ff' }, { name: 'Gas', icon: '💨', col: '#e6dcff' }];

    I('🥛', 'milk', 1, 'Milk pours and takes the shape of the glass.'), I('🍯', 'honey', 1, 'Honey is a slow, thick liquid, but it still pours.'), I('🌧️', 'raindrops', 1, 'Rain is liquid water.'), I('🧃', 'juice (poured out)', 1, 'Juice flows and takes the shape of its cup.'),
